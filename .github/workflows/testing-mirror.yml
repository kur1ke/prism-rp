name: PRISM Testing Mirror
on:
  push:
    branches: [testing]
  pull_request:
    branches: [testing]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prism-testing-mirror
  cancel-in-progress: false
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: node tests/run.js
      - name: Check chat navigation, persistence and imported URL safety
        run: node tests/critical-integrity.js
      - name: Check coherent backup snapshot and failed export
        run: node tests/backup-snapshot.js
      - name: Check complete selected character fields and budget
        run: node tests/card-fields.js
      - name: Check complete permanent custom fields and overflow
        run: node tests/always-custom-fields.js
      - name: Check exact Core duplicates without rewriting stored text
        run: node tests/core-duplicates.js
      - name: Check removed background field and lore preservation
        run: node tests/no-background.js
      - name: Check Observer provider window and full request budget
        run: node tests/observer-budget.js
      - name: Check complete Observer text and citation coverage
        run: node tests/observer-full-source.js
      - name: Check assistant budget and mutation-free preflight
        run: node tests/assist-budget.js
      - name: Check imported values at HTML boundaries
        run: node tests/render-import-safety.js
      - name: Check StateTracker photographed outfit continuity
        run: node tests/state-photo-continuity.js
      - name: Check Messenger temporal freshness and completed activities
        run: node tests/state-temporal-freshness.js
      - name: Check Messenger return gap chronology
        run: node tests/messenger-return-gap.js
      - name: Check automatic Memory concurrency and deletion
        run: node tests/memory-autonomy.js
      - name: Check independent Memory episodes from the same source
        run: node tests/memory-episodes.js
      - name: Check Memory timeout, late results and FIFO recovery
        run: node tests/memory-timeout.js
      - name: Check Memory JSON through the Perchance transport
        run: node tests/memory-perchance-json.js
      - name: Check unified state, source ownership and extraction modes
        run: node tests/unified-state.js
      - name: Check test loader and isolated database
        run: node tests/test-mirror.js
      - name: Build Perchance and web bundles
        run: node build.js
      - name: Update testing bundles on GitHub
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if ! git diff --cached --quiet; then
            git commit -m "chore(testing): refresh mirror bundles [skip ci]"
            git push origin HEAD:testing
          fi
