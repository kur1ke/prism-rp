<!-- Prism RP TEST — изолированное зеркало. Рабочий генератор не изменять. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<div id="prism-boot" style="font:15px system-ui,sans-serif;padding:32px;color:#d7c7f4;background:#15131d;min-height:100vh;box-sizing:border-box">Загружаю TEST-сборку PRISM…</div>
<div id="prism-testing-badge" aria-label="Тестовая версия PRISM" style="position:fixed;right:12px;bottom:12px;z-index:2147483000;pointer-events:none;font:600 12px system-ui,sans-serif;background:#5d2569;color:#fff;padding:7px 11px;border:1px solid #e2a5e3;border-radius:8px;box-shadow:0 1px 7px #0008">PRISM TEST · загрузка…</div>
<script>
(function () {
  "use strict";
  window.__PRP_TEST_MIRROR = true;
  window.PRISM_RP_CHANNEL = "testing";
  var api = "https://api.github.com/repos/kur1ke/prism-rp/branches/testing";
  var cdn = "https://cdn.jsdelivr.net/gh/kur1ke/prism-rp@";
  var suffix = "/dist/web/prism-app.js";
  var badge = document.getElementById("prism-testing-badge");
  var boot = document.getElementById("prism-boot");
  function status(t) { if (badge) badge.textContent = "PRISM TEST · " + t; }
  function error(t) { if (boot) boot.textContent = "Тестовая версия не загрузилась: " + t + ". Рабочая версия не затронута."; status("ошибка загрузки"); }
  function load(ref, warning) {
    if (!/^[a-f0-9]{40}$/.test(ref) && ref !== "testing") { error("неверный SHA"); return; }
    status(warning || ref.slice(0, 7));
    window.PRISM_RP_TEST_REVISION = ref;
    var script = document.createElement("script");
    script.src = cdn + encodeURIComponent(ref) + suffix;
    script.onerror = function () { error("недоступен GitHub CDN (" + ref.slice(0, 7) + ")"); };
    script.onload = function () {
      if (!window.PRP || !window.PRISM_RP_VERSION) error("приложение не инициализировалось");
      else status((warning ? "кэш ветки · " : "") + ref.slice(0, 7));
    };
    document.head.appendChild(script);
  }
  fetch(api, { cache: "no-store", headers: { "Accept": "application/vnd.github+json" } })
    .then(function (res) { if (!res.ok) throw new Error("GitHub API " + res.status); return res.json(); })
    .then(function (data) { var sha = data && data.commit && data.commit.sha; if (!/^[a-f0-9]{40}$/.test(sha || "")) throw new Error("неверный ответ GitHub"); load(sha); })
    .catch(function () {
      // Ветка testing без фиксации SHA может кэшироваться в CDN.
      load("testing", "возможно кэшированная ветка");
    });
})();
</script>
