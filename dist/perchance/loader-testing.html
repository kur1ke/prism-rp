<!-- Prism RP TEST — изолированное зеркало. Рабочий генератор не изменять. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<div id="prism-boot" style="font:15px system-ui,sans-serif;padding:32px;color:#d7c7f4;background:#15131d;min-height:100vh;box-sizing:border-box">Загружаю TEST-сборку PRISM…</div>
<div id="prism-testing-badge" aria-label="Тестовая версия PRISM" style="position:fixed;right:12px;bottom:12px;z-index:2147483000;pointer-events:none;font:600 12px system-ui,sans-serif;background:#5d2569;color:#fff;padding:7px 11px;border:1px solid #e2a5e3;border-radius:8px;box-shadow:0 1px 7px #0008">PRISM TEST · загрузка…</div>
<script>
(function () {
  "use strict";
  window.__PRP_TEST_MIRROR = true;
  window.PRISM_RP_CHANNEL = "testing";
  var api = "https://api.github.com/repos/kur1ke/prism-rp/branches/testing";
  var cdn = "https://cdn.jsdelivr.net/gh/kur1ke/prism-rp@";
  var raw = "https://raw.githubusercontent.com/kur1ke/prism-rp/";
  var suffix = "/dist/web/prism-app.js";
  // Last verified testing distribution commit. Immutable CDN ref for API outages.
  // Must not point to a bundle with an older IndexedDB schema than the test
  // database: otherwise an API outage can launch an obsolete app and produce
  // IndexedDB VersionError. Keep this version aligned with js/core/store.js;
  // tests/test-mirror.js enforces the declared schema contract.
  // Published testing commit c92f1c6 includes build 13aff84c (IndexedDB v8).
  var safeRevision = "c92f1c685a237c989047f327f9cedac1d9f750e2";
  var safeDbVersion = 8;
  var badge = document.getElementById("prism-testing-badge");
  var boot = document.getElementById("prism-boot");
  function status(t) { if (badge) badge.textContent = "PRISM TEST · " + t; }
  function error(t) { if (boot) boot.textContent = "Тестовая версия не загрузилась: " + t + ". Рабочая версия не затронута."; status("ошибка загрузки"); }
  function load(ref, warning) {
    if (!/^[a-f0-9]{40}$/.test(ref)) { error("неверный SHA"); return; }
    window.PRISM_RP_TEST_REVISION = ref;
    // Never fall back to @testing: jsDelivr can cache branch aliases for hours.
    // The same immutable ref is used by both sources.
    var urls = [cdn + encodeURIComponent(ref) + suffix, raw + encodeURIComponent(ref) + suffix];
    function attempt(index) {
      status(index ? "резервный источник · " + ref.slice(0, 7) : (warning || ref.slice(0, 7)));
      var script = document.createElement("script");
      script.src = urls[index];
      script.onerror = function () {
        if (index + 1 < urls.length) attempt(index + 1);
        else error("оба источника недоступны (" + ref.slice(0, 7) + ")");
      };
      script.onload = function () {
        if (!window.PRP || !window.PRISM_RP_VERSION) error("приложение не инициализировалось");
        else {
          // Embedded at build time by GitHub Actions: this is the source commit
          // used to generate the bundle, not necessarily the bot's later dist commit.
          var builtFrom = window.PRISM_RP_BUILD_SHA || "";
          if (warning) {
            var marker = /^[a-f0-9]{40}$/.test(builtFrom) ? " · сборка " + builtFrom.slice(0, 7) : " · SHA сборки отсутствует";
            status("testing · закреплено " + ref.slice(0, 7) + marker + " · DB v" + safeDbVersion + " · API недоступен");
          } else {
            status((index ? "резерв · " : "") + ref.slice(0, 7));
          }
        }
      };
      document.head.appendChild(script);
    }
    attempt(0);
  }
  fetch(api, { cache: "no-store", headers: { "Accept": "application/vnd.github+json" } })
    .then(function (res) { if (!res.ok) throw new Error("GitHub API " + res.status); return res.json(); })
    .then(function (data) { var sha = data && data.commit && data.commit.sha; if (!/^[a-f0-9]{40}$/.test(sha || "")) throw new Error("неверный ответ GitHub"); load(sha); })
    .catch(function () { load(safeRevision, "GitHub API недоступен"); });
})();
</script>
