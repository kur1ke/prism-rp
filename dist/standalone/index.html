        const skipped = [chkChats.rejected ? `чатов с другим режимом: ${chkChats.rejected}` : "", refs ? `записей без своего владельца или с повтором id: ${refs}` : "", chk.rejected ? `записей мира чата: ${chk.rejected}` : "", chkEnv.rejected ? `записей среды переписки: ${chkEnv.rejected}` : ""].filter(Boolean).join(", ");
        ui.toast(skipped ? `Бэкап загружен. Некоторые записи пропущены при восстановлении — ${skipped}.` : "Бэкап загружен.", !!skipped);
        return true;
      }
      if (t.dataset.imgcfg !== undefined) { collectImgForm(); await save(); return true; }
      if (t.dataset.imgCheck) { collectImgForm(); S.settings.images[t.dataset.imgCheck] = t.checked; ui.refreshAfterSettings(); await save(); return true; }
      if (t.dataset.imgSel) { collectImgForm(); S.settings.images[t.dataset.imgSel] = t.value; ui.refreshAfterSettings(); await save(); return true; }
      if (t.dataset.sampler) { S.settings.sampler[t.dataset.sampler] = t.value === "" ? null : +t.value; S.settings.samplerPreset = "custom"; await save(); ui.refreshAfterSettings(); return true; }
      if (t.dataset.setText) { S.settings[t.dataset.setText] = t.value; await save(); return true; }
      if (t.dataset.setNum) { S.settings[t.dataset.setNum] = +t.value; await save(); ui.refreshAfterSettings(); return true; }
      if (t.dataset.setRange) { S.settings[t.dataset.setRange] = +t.value; ui.applyLook(); await save(); return true; }
      if (t.dataset.set) { S.settings[t.dataset.set] = t.checked; await save(); ui.refreshAfterSettings(); if (S.drawerOpen) ui.renderDrawer(); return true; }
      return false;
    }
    function input(t) {
      if (t.dataset.setRange) { const o = $("#fs-out"); if (o) o.textContent = t.value; document.documentElement.style.setProperty("--prose-fs", t.value + "px"); }
    }

    return { actions, change, input };
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/ui/controllers/images.js */
/* Prism RP — контроллер картинок в чате: нарисовать, перерисовать, закрепить seed, скачать, удалить, просмотр. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const V = PRP.views;

  PRP.controllers = PRP.controllers || {};
  PRP.controllers.images = function (ctx) {
    const { S, ui, svc } = ctx;
    const findImg = (t) => svc.images.find(t.dataset.mid, t.dataset.sw, t.dataset.img);
    const newSeed = () => Math.floor(Math.random() * 1e9);
    function copyLegacy(value) {
      const field = document.createElement("textarea");
      field.value = value;
      field.setAttribute("readonly", "");
      field.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
      document.body.appendChild(field);
      try {
        field.select();
        if (!document.execCommand || !document.execCommand("copy")) throw new Error("Буфер обмена недоступен в этом браузере");
      } finally { field.remove(); }
    }

    const actions = {
      draw: (t) => svc.images.drawFromMessage(t.dataset.id),
      "img-regen": (t) => { const { msg, sw, im } = findImg(t); if (im) svc.images.draw(msg, sw, null, im, { seed: newSeed() }); },
      "img-pin": async (t) => {
        const { im } = findImg(t);
        if (!im || im.seed == null) { ui.toast("У этой картинки нет seed.", true); return; }
        const cd = await svc.images.pinSeed(im.seed);
        ui.toast(`Seed ${im.seed} закреплён за ${cd.name}.`);
      },
      "img-info": (t) => {
        const { im } = findImg(t);
        if (im) ui.openPop(V.imageInfo(im, !!S.settings.developerMode, { mid: t.dataset.mid, sw: t.dataset.sw, img: t.dataset.img }), t);
      },
      "img-copy-prompt": async (t) => {
        const { im } = findImg(t);
        if (!im) return;
        const value = V.imageCopyText(im, !!S.settings.developerMode);
        const clipboard = typeof navigator !== "undefined" && navigator.clipboard;
        if (clipboard && clipboard.writeText) {
          try { await clipboard.writeText(value); }
          catch (_) { copyLegacy(value); }
        } else copyLegacy(value);
        ui.toast("Промпт скопирован");
      },
      "img-dl": (t) => {
        const { im } = findImg(t);
        const url = im && S.imgUrls[im.id];
        if (url) fetch(url).then((r) => r.blob()).then((b) => ctx.files.download(`${ctx.card().name} ${im.seed != null ? im.seed : im.id}.png`, b));
      },
      "img-del": async (t) => {
        const { msg, sw, im } = findImg(t);
        if (!im) return;
        await svc.images.remove(msg, sw, im);
        ui.renderFeed();
      },
      "img-view": (t) => { const { im } = findImg(t); if (im) { S.modal = { kind: "image", im, mid: t.dataset.mid, sw: t.dataset.sw }; ui.renderModal(); } },
      "img-modal-regen": () => {
        const { mid, sw, im } = S.modal;
        const msg = S.messages.find((x) => x.id === mid);
        S.modal = null; ui.renderModal();
        svc.images.draw(msg, msg.swipes[+sw], null, im, { seed: newSeed() });
      },
    };

    return { actions };
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/ui/controllers/assist.js */
/* Prism RP — контроллер ассистента: разговоры, контекст (персонаж и чат), копирование, другой ответ, правка. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const V = PRP.views;

  PRP.controllers = PRP.controllers || {};
  PRP.controllers.assist = function (ctx) {
    const { S, ui, svc, nav } = ctx;
    const { $ } = ui;
    const saveConv = async () => { await svc.assist.save(); ui.rememberUi(); };
    const copy = async (text) => { await ctx.files.copyText(text); ui.toast("Скопировано."); };

    const actions = {
      assist: () => nav.openAssist(S.assist && S.assist.messages.length ? S.assist.id : null),
      "assist-new": () => { ui.closePop(); if (S.assist && !S.assist.messages.length) { $("#input") && $("#input").focus(); return; } nav.openAssist(null, S.assist ? { cardId: S.assist.ctx.cardId, chatId: S.assist.ctx.chatId } : null); },
      "assist-open": (t) => { ui.closePop(); nav.openAssist(t.dataset.id); },
      "assist-list": (t) => ui.openPop(V.assistListPop(ui.vm()), t),
      "assist-ctx": (t) => ui.openPop(V.assistCtxPop(ui.vm()), t),
      "assist-pick-card": async (t) => {
        const a = S.assist; a.ctx.cardId = t.dataset.id || null; a.ctx.chatId = null;
        if (a.messages.length) await saveConv();
        ui.renderStage();
        const anchor = $("[data-act=assist-ctx]");
        if (a.ctx.cardId && anchor) ui.openPop(V.assistCtxPop(ui.vm()), anchor); else ui.closePop();
      },
      "assist-pick-chat": async (t) => {
        const a = S.assist; a.ctx.chatId = t.dataset.id || null;
        if (a.messages.length) await saveConv();
        ui.closePop(); ui.renderStage();
      },
      "assist-about-chat": () => { ui.closePop(); nav.openAssist(null, { cardId: S.cardId, chatId: S.chatId }); },
      "assist-starter": (t) => { if (S.gen) return; svc.assist.send(t.dataset.q); },
      "assist-copy": (t) => { const m = S.assist.messages.find((x) => x.id === t.dataset.id); if (m) copy(m.text); },
      "copy-code": (t) => { const c = t.parentElement.querySelector("code"); if (c) copy(c.textContent); },
      "assist-regen": async (t) => { if (S.gen) return; await svc.assist.cutFrom(t.dataset.id); await svc.assist.generate(); },
      "assist-edit": async (t) => {
        if (S.gen) return;
        const removed = await svc.assist.cutFrom(t.dataset.id);
        ui.renderStage();
        const i = $("#input"); if (i && removed) { i.value = removed[0].text; ui.autoGrow(i); i.focus(); }
      },
      "assist-msg-del": async (t) => { if (S.gen) return; await svc.assist.cutFrom(t.dataset.id); ui.renderStage(); },
      "assist-del": async () => {
        const a = S.assist;
        if (!a || S.gen || !confirm(`Удалить разговор «${a.title}»?`)) return;
        await svc.assist.remove(a);
        nav.openAssist(null);
        ui.toast("Разговор удалён.");
      },
    };

    return { actions };
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/ui/controllers/world.js */
/* Prism RP — контроллер мира: библиотека паков мира и раздел «Мир» (линза) в редакторе персонажа.
   Обработчики тонкие: форма → черновик → сервис world → перерисовка. Правила — в world/*. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});

  const split = (v) => String(v || "").split(",").map((s) => s.trim()).filter(Boolean);
  const clone = (x) => JSON.parse(JSON.stringify(x));

  /* Поля раздела «Мир» редактора персонажа → черновик линзы (modal.lens). Только перенос значений формы. */
  function collectLens(modal, $$) {
    const l = modal && modal.lens;
    if (!l || !$$("[data-lens],[data-lens-disable],[data-lens-ovr],[data-lens-add]").length) return l;
    $$("[data-lens]").forEach((el) => {
      const k = el.dataset.lens;
      l[k] = k === "timelineVariant" ? el.value.trim() : split(el.value);
    });
    const boxes = $$("[data-lens-disable]");
    if (boxes.length) {
      const shown = new Set(boxes.map((el) => el.dataset.lensDisable));
      // Ссылки на факты, которых в паке нет, сохраняются как есть (их показывают отдельно).
      l.disabledFactIds = (l.disabledFactIds || []).filter((id) => !shown.has(id)).concat(boxes.filter((el) => el.checked).map((el) => el.dataset.lensDisable));
    }
    $$("[data-lens-ovr]").forEach((el) => { const o = l.overrides[+el.dataset.lensOvr]; if (o) o.text = el.value; });
    $$("[data-lens-add]").forEach((el) => {
      const f = l.additions[+el.dataset.lensAdd];
      if (!f) return;
      f[el.dataset.k] = el.dataset.k === "text" ? el.value : split(el.value);
    });
    return l;
  }
  PRP.lensForm = { collect: collectLens };

  PRP.controllers = PRP.controllers || {};
  PRP.controllers.world = function (ctx) {
    const { S, ui, svc, nav } = ctx;
    const { $, $$ } = ui;
    const W = () => svc.world;

    // Поля библиотеки → черновик пака (S.worldDraft).
    function collectPack() {
      const d = S.worldDraft;
      if (!d) return d;
      $$("[data-wp]").forEach((el) => { d[el.dataset.wp] = el.value; });
      $$("[data-wf]").forEach((el) => {
        const f = d.facts[+el.dataset.wf];
        if (!f) return;
        const k = el.dataset.k;
        if (k === "enabled") f.enabled = el.checked;
        else if (k === "text" || k === "timeline" || k === "variant") f[k] = el.value;
        else f[k] = split(el.value);
      });
      return d;
    }
    const lensModal = () => S.modal && S.modal.kind === "card" ? S.modal : null;
    const rerenderModal = () => { S.modal.keepScroll = true; ui.renderModal(); };

    const actions = {
      world: () => nav.openWorld(),
      "world-new": () => { S.worldDraft = W().newPack(); ui.renderStage(); setTimeout(() => { const n = $("#wp-name"); if (n) n.select(); }, 30); },
      "world-open": (t) => { const p = W().packById(t.dataset.id); S.worldDraft = p ? clone(p) : null; ui.renderStage(); },
      "world-fact-add": () => { const d = collectPack(); d.facts.push(W().newFact()); ui.renderStage(); },
      "world-fact-del": (t) => { const d = collectPack(); d.facts.splice(+t.dataset.i, 1); ui.renderStage(); },
      "world-save": async () => {
        const r = await W().savePack(collectPack());
        if (r.error) return ui.toast(r.error, true);
        S.worldDraft = clone(r.pack);
        ui.renderStage();
        ui.toast("Мир сохранён.");
      },
      "world-export": () => {
        const d = S.worldDraft;
        const e = d && W().exportPack(d.id);
        if (!e) return ui.toast("Сначала сохраните мир.", true);
        ctx.files.download(e.name, e.text, "application/json");
      },
      "world-delete": async () => {
        const d = S.worldDraft;
        if (!d) return;
        if (!W().packById(d.id)) { S.worldDraft = null; return ui.renderStage(); }
        if (!confirm(`Удалить мир «${d.name}»? Это нельзя отменить.`)) return;
        const r = await W().deletePack(d.id);
        if (r.blocked) {
          const names = r.blocked.map((ref) => (S.cards.find((c) => c.id === ref.cardId) || { name: "персонаж " + ref.cardId }).name);
          return ui.toast(`Мир используют персонажи: ${names.join(", ")}. Сначала снимите связь с миром в их карточках (раздел «Мир»).`, true);
        }
        S.worldDraft = null;
        ui.renderStage();
        ui.toast("Мир удалён.");
      },
      "world-import": () => $("#file-world").click(),

      // Линза в редакторе персонажа.
      "lens-override-add": (t) => {
        const m = lensModal(); if (!m) return;
        collectLens(m, $$);
        const f = (W().packById(m.lens.packId) || { facts: [] }).facts.find((x) => x.id === t.dataset.fid);
        m.lens.overrides.push(W().newOverride(t.dataset.fid, f ? f.text : ""));
        rerenderModal();
      },
      "lens-override-del": (t) => { const m = lensModal(); if (!m) return; collectLens(m, $$); m.lens.overrides.splice(+t.dataset.i, 1); rerenderModal(); },
      "lens-disabled-del": (t) => { const m = lensModal(); if (!m) return; collectLens(m, $$); m.lens.disabledFactIds = m.lens.disabledFactIds.filter((id) => id !== t.dataset.fid); rerenderModal(); },
      "lens-add": () => { const m = lensModal(); if (!m) return; collectLens(m, $$); m.lens.additions.push(W().newFact("wa")); rerenderModal(); },
      "lens-add-del": (t) => { const m = lensModal(); if (!m) return; collectLens(m, $$); m.lens.additions.splice(+t.dataset.i, 1); rerenderModal(); },
      "lens-clear": () => {
        const m = lensModal(); if (!m) return;
        if (m.lens && (m.lens.overrides.length || m.lens.additions.length || m.lens.disabledFactIds.length) && !confirm("Снять связь с миром? Замены, выключения и факты этого персонажа будут удалены при сохранении карточки.")) return;
        m.lens = null;
        rerenderModal();
      },
    };

    async function change(t) {
      if (t.id === "file-world" && t.files[0]) {
        const file = t.files[0];
        t.value = "";
        const r = await W().importPack(await ctx.files.readFile(file, "text"));
        if (r.error) { ui.toast(`${file.name}: ${r.error}`, true); return true; }
        S.worldDraft = clone(r.pack);
        nav.openWorld(true);
        ui.toast(`Мир «${r.pack.name}» импортирован.`);
        return true;
      }
      const m = lensModal();
      if (m && t.matches && t.matches("[data-lens-pack]")) {
        collectLens(m, $$);
        const packId = t.value;
        if (!packId) m.lens = null;
        else if (!m.lens) m.lens = W().newLens(m.draft.id, packId);
        else if (m.lens.packId !== packId) {
          const tied = m.lens.overrides.length || m.lens.disabledFactIds.length;
          if (tied && !confirm("Замены и выключения относятся к фактам прежнего мира и будут сброшены. Факты самого персонажа останутся. Продолжить?")) { t.value = m.lens.packId; return true; }
          m.lens = Object.assign(W().newLens(m.draft.id, packId), { id: m.lens.id, additions: m.lens.additions, focusEntities: m.lens.focusEntities, focusTopics: m.lens.focusTopics, relevanceHints: m.lens.relevanceHints, timelineVariant: m.lens.timelineVariant, createdAt: m.lens.createdAt });
        }
        rerenderModal();
        return true;
      }
      if (m && t.matches && t.matches("[data-lens-disable]")) { collectLens(m, $$); rerenderModal(); return true; }
      return false;
    }

    return { actions, change };
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/ui/controllers/messenger.js */
/* Prism RP — контроллер переписки: создание переписки (настройка времени) и явные правки во вкладке «Среда».
   Только чтение форм и вызовы сервиса переписки; правила — в messenger/*. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const MT = PRP.messengerTime;

  PRP.controllers = PRP.controllers || {};
  PRP.controllers.messenger = function (ctx) {
    const { S, ui, svc, nav } = ctx;
    const { $ } = ui;
    const csv = (v) => String(v || "").split(",").map((x) => x.trim()).filter(Boolean);
    const radio = (name) => { const r = document.querySelector(`input[name=${name}]:checked`); return r ? r.value : ""; };
    async function after(msg) {
      svc.prism.refresh();
      ui.renderDrawer(); ui.renderHead(); ui.renderFeed();
      if (msg) ui.toast(msg);
    }
    // Ответ сервиса: ошибка — показать и ничего не перерисовывать как успех.
    const failed = (r) => { if (r && r.error) { ui.toast(r.error, true); return true; } return false; };

    const actions = {
      "time-open": () => { S.modal = { kind: "messenger-time" }; ui.renderModal(); },
      // Однократная явная повторная попытка при ошибке интерпретатора;
      // никакого заполнения среды или изменения канона вручную.
      "state-retry": async () => {
        if (S.gen || !svc.state || svc.state.pending(S.chatId)) return;
        const path = svc.chat.path(), last = path[path.length - 1];
        if (!last) return;
        const job = svc.state.track(last, ctx.processingProvider ? ctx.processingProvider() : ctx.provider(), { force: true });
        ui.renderDrawer();
        let result;
        try { result = await job; }
        finally { ui.renderDrawer(); }
        if (result && result.status === "error") ui.toast("Не удалось извлечь состояние: проверьте подробности анализа.", true);
      },
      "ms-create": async () => {
        if (!S.modal || S.modal.kind !== "new-messenger" || S.modal.creating) return;
        const tz = $("#ms-tz").value.trim(), mode = radio("ms-mode") || "live";
        const manualNow = mode === "manual" ? MT.toIso(MT.fromLocal($("#ms-manual").value, tz)) : null;
        const setup = { timeZone: tz, timeMode: mode, manualNow };
        const err = svc.messenger.checkSetup(setup);
        if (err) { ui.toast(err, true); return; }
        // Keep the modal visible while the new chat and its hidden initial
        // state are prepared. One active request = one click, not a toast loop.
        if (!S.modal || S.modal.kind !== "new-messenger" || S.modal.creating) return;
        const cardId = S.modal.cardId;
        const pending = Object.assign({}, S.modal, { creating: true });
        S.modal = pending;
        ui.renderModal();
        try {
          await nav.newChat("messenger", cardId, setup);
        } finally {
          if (S.modal === pending) { S.modal = null; ui.renderModal(); }
        }
      },
      "env-edit": () => { S.envEdit = { scope: svc.chat.path().length ? "branch" : "" }; ui.renderDrawer(); },
      "env-cancel": () => { S.envEdit = null; ui.renderDrawer(); },
      "env-save": async () => {
        const scope = radio("env-scope");
        if (!scope) { ui.toast("Выберите, где действует изменение: в этой ветке или во всей переписке.", true); return; }
        const patch = {};
        const clear = new Set([...document.querySelectorAll("[data-env-clear]:checked")].map((x) => x.dataset.envClear));
        for (const k of ["location", "activity", "visualPose", "visualHair"]) { const v = $("#env-" + k).value.trim(); if (clear.has(k)) patch[k] = null; else if (v) patch[k] = v; }
        for (const k of ["nearby", "ongoing", "visualWear"]) { const v = csv($("#env-" + k).value); if (clear.has(k)) patch[k] = null; else if (v.length) patch[k] = v; }
        const av = $("#env-availability").value; if (av) patch.availability = av;
        // Штатные изменения происходят автоматически. Только явно вызванное
        // исправление принадлежит пользователю и записывается в активную ветку.
        const r = svc.state && scope === "branch" && svc.chat.path().length
          ? await svc.state.correct(patch) : await svc.messenger.commitEvent({ scope, patch });
        if (failed(r)) return;
        S.envEdit = null;
        await after("Положение сохранено.");
      },
      "env-time-save": async () => {
        const tz = $("#env-tz").value.trim(), mode = radio("env-mode") || "live";
        const t = { timeZone: tz, timeMode: mode };
        const mi = $("#env-manual");
        if (mode === "manual" && mi && mi.value) t.manualNow = MT.toIso(MT.fromLocal(mi.value, tz));
        if (failed(await svc.messenger.setTime(t))) return;
        await after("Время переписки сохранено.");
        if (S.modal && S.modal.kind === "messenger-time") ui.renderModal();
      },
      "env-advance": async (t) => { if (failed(await svc.messenger.advance(+t.dataset.min))) return; await after(); if (S.modal && S.modal.kind === "messenger-time") ui.renderModal(); },
      "env-mk-add": async () => {
        const scope = radio("env-mk-scope");
        if (!scope) { ui.toast("Выберите, где действует договорённость.", true); return; }
        const r = await svc.messenger.addMarker({ kind: $("#env-mk-kind").value, text: $("#env-mk-text").value, scope });
        if (failed(r)) return;
        await after("Договорённость отмечена.");
      },
      "env-mk-status": async (t) => {
        const r = await svc.messenger.markerStatus(t.dataset.id, t.dataset.status, svc.chat.path().length ? "branch" : "chat");
        if (failed(r)) return;
        await after();
      },
    };

    // Ручное время в окне новой переписки: при выборе «задаю сам» подставить текущее местное время пояса.
    function change(t) {
      if (t.name === "ms-mode" && t.value === "manual" && !$("#ms-manual").value) {
        const tz = $("#ms-tz").value.trim();
        if (MT.validTimeZone(tz)) $("#ms-manual").value = MT.toLocalInput(ctx.clock(), tz);
        return true;
      }
      return false;
    }

    return { actions, change };
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/ui/app.js */
/* Prism RP — корень приложения (composition root).
   Здесь: состояние сессии, сборка контекста зависимостей, навигация, загрузка,
   разбор событий DOM по контроллерам, запуск. Правил предметной области здесь нет:
     события  → контроллеры (js/ui/controllers/*) — тонкие обработчики
              → сервисы (chat, generation, prism, experience, cards, images, assist)
              → чистые модули (prism/*, chat/tree, cards/ccard, images/*, assist/assist)
              → хранилище (core/store) и транспорт моделей (providers/*)
     перерисовка — через порт интерфейса (js/ui/shell.js).
   Платформонезависимо: на Perchance добавляется провайдер ai-text-plugin, везде доступны
   OpenAI-совместимые API. Данные — в IndexedDB текущего сайта, переезд — через бэкап JSON. */
(function () {
  "use strict";
  const PRP = window.PRP;
  const { util: U, store: DB, settings: ST, perchance: PC, imgBackends: IB, imgCompile: ICP } = PRP;

  /* ── Состояние сессии ────────────────────────────────────────────────
     Данные: settings, cards, chats, messages (текущего чата), experience (персонажа), worldOverlay (мир текущего чата),
     messengerEnv (среда текущей переписки), assistList.
     Навигация: view, cardId, chatId, assist (открытый разговор).
     Генерация (временное): gen, drawing (id картинок в работе).
     Интерфейс: drawerOpen, tab, find, homeQuery, modal, editProviderId, pop, editingMsg, expDraft.
     Кэш: lastPrism (последняя сборка), imgUrls (картинки чата), imgLists (списки A1111), legacyExperience. */
  const S = {
    settings: null, cards: [], chats: [],
    view: "home", cardId: null, chatId: null, lastSelectedChatId: null, messages: [], experience: [],
    gen: null, tracking: false, turn: null, perf: [], lastPrism: null, editingMsg: null, expDraft: null,
    drawerOpen: false, tab: "scene", find: null, homeQuery: "",
    modal: null, editProviderId: null, pop: null,
    imgUrls: {}, imgLists: {}, drawing: new Set(),
    assist: null, assistList: [],
    worldPacks: [], worldLenses: [], worldDraft: null,
    worldOverlay: null, worldEdit: null, // наложение мира текущего чата; черновик действия во вкладке «Мир чата»
    messengerEnv: null, envEdit: null, // среда текущей переписки (у сцены — null); черновик правки во вкладке «Среда»
  };

  /* ── Контекст зависимостей ───────────────────────────────────────────
     Передаётся явно в сервисы и контроллеры. Сервисы не трогают DOM: перерисовку
     просят через ctx.ui; контроллеры читают DOM и вызывают сервисы. */
  const ctx = {
    S, DB,
    files: PRP.files,
    env: { perchanceImages: () => IB.available("perchance") },
    // Часы для живого времени переписки (в тестах подменяются). Таймеров нет: время читается только при действии.
    clock: () => Date.now(),
    card: () => S.cards.find((c) => c.id === S.cardId) || null,
    chat: () => S.chats.find((c) => c.id === S.chatId) || null,
    persona: () => ST.persona(S.settings),
    providers: () => ST.providerList(S.settings, PC.available()),
    provider: () => ST.activeProvider(S.settings, ctx.providers()),
    processingProvider: () => ST.processingProvider(S.settings, ctx.providers()),
    contextTokens: () => ST.contextTokens(S.settings, ctx.provider(), () => PC.meta()),
    saveSettings: () => DB.setSetting("app", S.settings),
    // PERF-01: длительности этапов хода — только в памяти (S.perf), показ в Debug → «Тайминги».
    perf: PRP.perfLog.create(S.perf, { activeChatId: () => S.chatId }),
    svc: {},
    nav: {},
  };
  ctx.ui = PRP.shell.create(ctx);
  ctx.svc.chat = PRP.chatService.create(ctx);
  ctx.svc.exp = PRP.experienceService.create(ctx);
  ctx.svc.prism = PRP.prismService.create(ctx);
  ctx.svc.images = PRP.imageService.create(ctx);
  ctx.svc.state = PRP.stateService.create(ctx);
  ctx.svc.gen = PRP.generationService.create(ctx);
  ctx.svc.cards = PRP.cardService.create(ctx);
  ctx.svc.assist = PRP.assistService.create(ctx);
  ctx.svc.world = PRP.worldService.create(ctx);
  ctx.svc.worldChat = PRP.worldOverlayService.create(ctx);
  ctx.svc.messenger = PRP.messengerService.create(ctx);
  const { ui, svc } = ctx;
  const { $ } = ui;

  /* ── Загрузка ─────────────────────────────────────────────────────── */
  async function loadAll() {
    S.worldOverlay = null; S.worldEdit = null; S.messengerEnv = null; S.envEdit = null;
    const saved = await DB.getSetting("app", null);
    S.settings = ST.merge(saved, { perchanceImages: IB.available("perchance") });
    S.imgLists = (await DB.getSetting("imgLists", {})) || {};
    ICP.setStore({ load: () => DB.getSetting("imgPromptCache", {}), save: (o) => DB.setSetting("imgPromptCache", o) });
    S.cards = (await DB.all("cards")).map(PRP.cardModel.upgradeStored).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    S.chats = await DB.all("chats");
    S.assistList = await svc.assist.loadAll();
    await svc.world.loadAll();
    await svc.exp.migrate();
    const saveUi = (await DB.getSetting("ui", {})) || {};
    S.drawerOpen = !!saveUi.drawerOpen && !ui.narrow();
    S.lastSelectedChatId = S.chats.some((c) => c.id === saveUi.chatId) ? saveUi.chatId : null;
    if (saveUi.chatId && (!saveUi.view || saveUi.view === "chat" || saveUi.view === "home") && S.chats.some((c) => c.id === saveUi.chatId)) await openChat(saveUi.chatId, true);
    else if (saveUi.view === "assist") openAssist(saveUi.assistId, null, true);
    else if (saveUi.view === "characters") goCharacters();
  }

  /* ── Навигация ───────────────────────────────────────────────────── */
  async function openChat(chatId, quiet) {
    const c = S.chats.find((x) => x.id === chatId);
    if (!c) return;
    // Timings describe one opened chat, not the whole app. Keep the array
    // identity so the recorder and Debug view keep using the same log.
    PRP.perfLog.resetOnChatChange(S.perf, S.chatId, chatId);
    S.chatId = chatId;
    S.lastSelectedChatId = chatId;
    S.cardId = c.cardId;
    S.view = "chat";
    S.messages = await svc.chat.loadMessages(chatId);
    S.experience = await svc.exp.loadForCard(c.cardId);
    await svc.worldChat.load(chatId);
    await svc.messenger.load(chatId);
    await svc.images.loadForChat(chatId);
    S.editingMsg = null; S.expDraft = null; S.worldEdit = null; S.envEdit = null; S.find = null;
    svc.prism.refresh();
    ui.rememberUi();
    if (!quiet) { ui.renderAll(); ui.scrollBottom(); }
    $("#rail").classList.remove("open");
    ui.syncScrim();
  }
  async function goHome() {
    // «Главная» is the selected dialogue, not a duplicate catalog.
    // If no dialogue is selected, show a dedicated welcome screen.
    const activeId = S.chatId || S.lastSelectedChatId;
    if (activeId && S.chats.some((c) => c.id === activeId)) {
      if (S.view === "chat" && S.chatId === activeId) return;
      return openChat(activeId);
    }
    S.view = "home";
    S.find = null;
    ui.rememberUi();
    $("#rail").classList.remove("open");
    ui.renderAll();
  }
  function goCharacters() {
    S.view = "characters";
    S.find = null;
    ui.rememberUi();
    $("#rail").classList.remove("open");
    ui.renderAll();
  }
  /* Новый чат. Режим выбирается здесь и потом не меняется. Для переписки — явная настройка времени (setup:
     { timeZone, timeMode, manualNow }); она проверяется до создания чата. */
  async function newChat(mode, cardId, setup) {
    if (mode === "messenger") {
      const err = svc.messenger.checkSetup(setup || { timeZone: PRP.messengerTime.systemTimeZone(), timeMode: "live" });
      if (err) { ui.toast(err, true); return null; }
    }
    const id = await svc.chat.createChat(mode, cardId);
    if (id && mode === "messenger") {
      const chosenSetup = setup || { timeZone: PRP.messengerTime.systemTimeZone(), timeMode: "live" };
      await svc.messenger.createFor(id, chosenSetup);
      // The first hidden request belongs to the same RP provider as this
      // character. Await it before exposing the chat; it never creates a
      // message or changes an existing conversation.
      if (svc.state && typeof svc.state.initializeOutfit === "function") {
        const init = await svc.state.initializeOutfit(ctx.provider(), chosenSetup);
        if (S.chatId === id && init && !["ok", "skipped", "already-known", "stale"].includes(init.status)) {
          const reasons = {
            timeout: "истекло время ожидания RP-модели",
            "plugin-unavailable": "Perchance ai-text-plugin недоступен",
            "provider-rejected": "RP Provider отклонил запрос",
            "provider-error": "RP Provider не ответил",
            unavailable: "RP Provider не настроен",
            overflow: "служебный запрос превышает бюджет контекста",
            storage: "не удалось сохранить результат",
          };
          const detail = reasons[init.reason] || (init.reason && init.reason.length <= 160 ? init.reason : "ответ модели не прошёл проверку");
          ui.toast("Переписка создана. Начальную одежду определить не удалось: " + detail + ". Подробности — в Debug.", true);
        }
      }
    }
    // Another new-chat/navigation action may have replaced this request while
    // the initial RP model was thinking. Do not steal focus back to an old chat.
    if (id && S.chatId === id) await openChat(id);
    return id;
  }
  async function openCard(cardId) {
    const latest = svc.chat.latestForCard(cardId);
    if (latest) return openChat(latest.id);
    return newChat("rp", cardId);
  }
  function openAssist(id, base, quiet) {
    if (S.gen) { ui.toast("Дождитесь окончания ответа или остановите его.", true); return; }
    svc.assist.pick(id, base);
    S.view = "assist";
    S.find = null;
    S.drawerOpen = S.drawerOpen && !ui.narrow();
    ui.rememberUi();
    $("#rail").classList.remove("open");
    if (!quiet) { ui.renderAll(); ui.scrollBottom(); setTimeout(() => { const i = $("#input"); if (i && !ui.narrow()) i.focus(); }, 30); }
  }
  // Библиотека миров. keepDraft — оставить открытым текущий черновик пака (например, после импорта).
  function openWorld(keepDraft) {
    if (!keepDraft) S.worldDraft = null;
    S.view = "world";
    S.find = null;
    ui.rememberUi();
    $("#rail").classList.remove("open");
    ui.renderAll();
  }
  Object.assign(ctx.nav, { loadAll, openChat, goHome, goCharacters, newChat, openCard, openAssist, openWorld });

  /* ── Контроллеры и разбор событий ─────────────────────────────────── */
  const C = PRP.controllers;
  const controllers = [C.chat, C.drawer, C.cards, C.settings, C.images, C.assist, C.world, C.messenger].map((make) => make(ctx));
  const ACTS = Object.assign({
    home: goHome,
    characters: goCharacters,
    "open-chat": (t) => openChat(t.dataset.id),
    rail: () => { $("#rail").classList.toggle("open"); ui.syncScrim(); },
    "reload-page": () => location.reload(),
    "modal-bg": (t, e) => { if (e.target === t && !(S.modal && S.modal.creating)) { S.modal = null; ui.renderModal(); } },
    "modal-close": () => { if (S.modal && S.modal.creating) return; S.modal = null; ui.renderModal(); },
  }, ...controllers.map((c) => c.actions));
  const chatCtl = controllers[0];

  // Поповеры закрываются кликом мимо, кроме кнопок, которые их открывают.
  const POP_ANCHORS = "[data-act=model-pop],[data-act=chat-menu],[data-act=assist-ctx],[data-act=assist-list]";
  async function onClick(e) {
    if (S.pop && !e.target.closest(".pop") && !e.target.closest(POP_ANCHORS)) ui.closePop();
    const t = e.target.closest("[data-act]");
    if (!t || t.disabled) return;
    const fn = ACTS[t.dataset.act];
    if (!fn) return;
    if (t.dataset.act === "modal-bg" && e.target !== t) return;
    try { await fn(t, e); } catch (err) { console.error(err); ui.toast(err.message || String(err), true); }
  }
  async function onChange(e) {
    const t = e.target;
    try {
      for (const c of controllers) if (c.change && (await c.change(t))) return;
    } catch (err) { console.error(err); ui.toast(err.message || String(err), true); }
  }
  function onInput(e) {
    const t = e.target;
    if (t.id === "home-q") {
      S.homeQuery = t.value;
      const pos = t.selectionStart;
      ui.renderStage();
      const n = $("#home-q"); n.focus(); n.setSelectionRange(pos, pos);
    }
    for (const c of controllers) if (c.input) c.input(t);
  }
  function onKey(e) {
    const t = e.target;
    for (const c of controllers) if (c.key && c.key(e, t)) return;
    if (chatCtl.shortcut(e)) return;
    if (e.key === "Escape") {
      if (S.pop) return ui.closePop();
      if (S.modal) { if (S.modal.creating) return; S.modal = null; return ui.renderModal(); }
      if (S.editingMsg) { S.editingMsg = null; return ui.renderFeed(); }
      if (S.find) return ACTS["find-close"]();
      if (S.drawerOpen && ui.narrow()) return ACTS["drawer-close"]();
    }
    if ((e.key === "Enter" || e.key === " ") && t.getAttribute && t.getAttribute("role") === "button" && t.dataset.act) { e.preventDefault(); t.click(); }
  }
  function bind() {
    document.addEventListener("click", onClick);
    document.addEventListener("change", onChange);
    document.addEventListener("input", onInput);
    document.addEventListener("keydown", onKey);
    $("#scrim").addEventListener("click", () => {
      $("#rail").classList.remove("open");
      if (S.drawerOpen && ui.narrow()) { S.drawerOpen = false; ui.renderDrawer(); ui.renderFeed(); }
      ui.syncScrim();
    });
    window.addEventListener("resize", () => { ui.syncScrim(); if (S.pop) ui.closePop(); });
  }

  async function init() {
    bind();
    try {
      await loadAll();
      if (!ctx.providers().some((p) => p.id === S.settings.activeProvider)) S.settings.activeProvider = (ctx.providers()[0] || {}).id || "";
      ui.renderAll();
      ui.scrollBottom();
    } catch (e) {
      console.error(e);
      S.settings = S.settings || U.clone(ST.DEFAULTS);
      ui.renderAll();
      // База не открылась (занята другой вкладкой, не ответила или ошибка браузера): постоянное сообщение
      // вместо пустого экрана. Данные не трогаются; помогает закрыть другие вкладки и обновить страницу.
      if (e && /^DB_/.test(e.code || "")) $("#stage").innerHTML = PRP.views.storageError(e);
      else ui.toast("Не удалось открыть хранилище браузера: " + e.message, true);
    }
  }
  // Другая вкладка обновляет базу — это соединение уже закрыто; работать дальше можно только после обновления страницы.
  DB.onVersionChange = () => ui.toast("Prism RP открыт в другой вкладке с более новой версией. Обновите эту страницу, чтобы продолжить.", true);

  PRP.app = { S, ctx, generate: (...a) => svc.gen.generate(...a), refreshPrism: () => svc.prism.refresh() };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
