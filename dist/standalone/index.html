    c.lore = Array.isArray(card.lore) ? card.lore : [];
    c.tags = Array.isArray(card.tags) ? card.tags : [];
    c.customFields = normalizeCustomFields(card.customFields);
    c.directives = card.directives || {
      system: directive(card.systemPrompt || "", "authored"),
      postHistory: directive(card.postHistory || "", "authored"),

    return c;
  }

  const CONTENT_FIELDS = ["description", "appearance", "personality", "background", "scenario", "firstMes", "mesExample"];
  function hasContent(card) {
    return CONTENT_FIELDS.some((k) => String(card[k] || "").trim()) || (card.altGreetings || []).some((g) => String(g || "").trim()) || (card.customFields || []).some((f) => f && String(f.text || "").trim());

  PRP.cardModel = { SCHEMA, blank, directive, importedDirective, normalizeCustomFields, activeText, hasDisabledText, upgradeStored, hasContent, CONTENT_FIELDS };
  if (typeof module !== "undefined" && module.exports) module.exports = PRP.cardModel;
})(typeof window !== "undefined" ? window : globalThis);

<script>/* js/cards/ccard.js */
/* Prism RP — файл карточки Character Card: чтение карточки из PNG (tEXt/iTXt «chara» и «ccv3»)
   и экспорт канонической карточки обратно в JSON / PNG (V2 и V3).
   Разбор форматов при импорте — в cards/formats/* (определение формата и адаптеры). */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});

  /* ── base64 ⇄ UTF-8 ─────────────────────────────────────────────────── */
  function b64ToUtf8(b64) {
    const bin = atob(String(b64).replace(/\s+/g, ""));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }
  function utf8ToB64(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }

  /* ── PNG ────────────────────────────────────────────────────────────── */
  const SIG = [137, 80, 78, 71, 13, 10, 26, 10];
  let CRC_TABLE = null;
  function crc32(bytes) {
    if (!CRC_TABLE) {
      CRC_TABLE = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        CRC_TABLE[n] = c >>> 0;
      }
    }
    let crc = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
    return (crc ^ 0xffffffff) >>> 0;
  }

  function readChunks(u8) {
    for (let i = 0; i < 8; i++) if (u8[i] !== SIG[i]) throw new Error("Файл не является PNG");
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const chunks = [];
    let p = 8;
    while (p + 8 <= u8.length) {
      const len = dv.getUint32(p);
      const type = String.fromCharCode(u8[p + 4], u8[p + 5], u8[p + 6], u8[p + 7]);
      const data = u8.subarray(p + 8, p + 8 + len);
      chunks.push({ type, data });
      p += 12 + len;
      if (type === "IEND") break;
    }
    return chunks;
  }

  function latin1(bytes) {
    let s = "";
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return s;
  }

  function textChunks(chunks) {
    const out = {};
    for (const c of chunks) {
      if (c.type === "tEXt") {
        const z = c.data.indexOf(0);
        if (z > 0) out[latin1(c.data.subarray(0, z)).toLowerCase()] = latin1(c.data.subarray(z + 1));
      } else if (c.type === "iTXt") {
        const z = c.data.indexOf(0);
        if (z <= 0) continue;
        const key = latin1(c.data.subarray(0, z)).toLowerCase();
        const comp = c.data[z + 1];
        if (comp) continue; // сжатый iTXt в карточках не встречается
        let q = z + 3;
        q = c.data.indexOf(0, q) + 1; // language
        q = c.data.indexOf(0, q) + 1; // translated keyword

  }

  function cardJsonFromPng(u8) {
    const t = textChunks(readChunks(u8));

    const txt = /^\s*\{/.test(raw) ? raw : b64ToUtf8(raw);

    dv.setUint32(0, data.length);
    for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
    out.set(data, 8);
    dv.setUint32(8 + data.length, crc32(out.subarray(4, 8 + data.length)));
    return out;
  }

    const k = new TextEncoder().encode(key);
    const v = new TextEncoder().encode(value); // value — base64, т. е. ASCII
    const data = new Uint8Array(k.length + 1 + v.length);

      }

        parts.push(textChunk("ccv3", utf8ToB64(JSON.stringify(toSpec(card, "v3")))));

      parts.push(makeChunk(c.type, c.data));
    }

     • Внешность и прошлое, которых нет в стандарте, складываются в description абзацами;
       раздельные поля Prism едут в extensions.prism_rp.fields (для обратного импорта в Prism).
     • В system_prompt / post_history_instructions попадают только ВКЛЮЧЁННЫЕ указания.
       Выключенные (например, непроверенные импортированные) хранятся в
       extensions.prism_rp.disabledDirectives — только для сохранности: при импорте это поле
       хранится в source.preserved и указанием не становится.
       Порядок для disabledDirectives (детерминированный):
         1) берётся сохранённое source.preserved.disabledDirectives (как было в файле);
         2) поверх — текущие выключенные непустые указания карточки (текущее побеждает по тому же ключу);
         3) включённые указания идут только в system_prompt / post_history_instructions;
            сохранённое значение по тому же ключу при этом остаётся в расширении как есть
            (это лишь хранение: при импорте и во время игры оно не читается).

    const description = [card.description, card.appearance ? "Внешность:\n" + card.appearance : "", card.background ? "Прошлое:\n" + card.background : ""]
      .map((x) => String(x || "").trim()).filter(Boolean).join("\n\n");
    const data = Object.assign(base, {
      name: card.name,
      description,
      personality: card.personality || "",
      scenario: card.scenario || "",
      first_mes: card.firstMes || "",
      mes_example: card.mesExample || "",
      creator_notes: card.creatorNotes || "",
      system_prompt: CM.activeText(card, "system"),
      post_history_instructions: CM.activeText(card, "postHistory"),
      alternate_greetings: card.altGreetings || [],
      tags: card.tags || [],
      creator: card.creator || "",
      character_version: card.version || "",
      extensions: base.extensions || {},
    });
    if (card.lore && card.lore.length) {
      data.character_book = Object.assign({}, oldBook, {
        extensions: oldBook.extensions || {},
        entries: card.lore.map((e, i) => {
          const raw = e.raw && typeof e.raw === "object" && (card.source && /^ccv/.test(card.source.format)) ? JSON.parse(JSON.stringify(e.raw)) : {};
          return Object.assign(raw, {
            keys: e.keys || [],
            secondary_keys: e.secondary_keys || [],
            selective: !!e.selective,
            content: e.content || "",
            extensions: raw.extensions || {},
            enabled: e.enabled !== false,
            insertion_order: e.insertion_order != null ? Number(e.insertion_order) || 0 : i,
            case_sensitive: !!e.case_sensitive,
            constant: !!e.constant,
            position: e.position === "before_char" ? "before_char" : "after_char",
            name: e.comment || "",
            comment: e.comment || "",
            id: i,
            ...(v3 ? { use_regex: !!raw.use_regex } : {}),
          });
        }),
      });
    } else data.character_book = Object.assign({}, oldBook, { entries: [], extensions: oldBook.extensions || {} });
    // Пространство Prism в extensions: картинки, раздельные поля, выключенные указания.
    const ext = Object.assign({}, data.extensions);
    const pr = Object.assign({}, ext.prism_rp);
    delete pr.image; delete pr.fields; delete pr.disabledDirectives; delete pr.prismCore; delete pr.customFields;
    // Stable export shape: all editable image slots exist even when empty.
    const imageDefaults = { trigger: "", aliases: "", styleTrigger: "", negative: "", seed: "", look: "", wardrobe: "", nsfw: "", loras: [], loraAdvanced: { enabled: false, rules: "" } };
    pr.image = Object.assign(imageDefaults, card.image ? JSON.parse(JSON.stringify(card.image)) : {});
    if (!Array.isArray(pr.image.loras)) pr.image.loras = [];
    pr.image.loraAdvanced = Object.assign({ enabled: false, rules: "" }, pr.image.loraAdvanced && typeof pr.image.loraAdvanced === "object" && !Array.isArray(pr.image.loraAdvanced) ? pr.image.loraAdvanced : {});
    // Ядро Prism — только данные в своём расширении (никогда не в system_prompt): при импорте оно непроверенное.
    const core = PRP.cardContext && PRP.cardContext.normCore(card.prismCore);
    pr.prismCore = core ? { schema: core.schema, identity: core.identity, traits: core.traits, voice: core.voice, durableContext: core.durableContext } : null;
    // Always include the Prism-specific slots, including empty fields.
    pr.fields = { description: card.description || "", appearance: card.appearance || "", background: card.background || "" };

    const dis = kept && typeof kept === "object" && !Array.isArray(kept) ? JSON.parse(JSON.stringify(kept)) : {};

<script>/* js/cards/formats/common.js */
/* Prism RP — общее для адаптеров форматов карточек: реестр адаптеров и мелкие помощники.
   Адаптер — чистая функция (json, detection) → { draft, notes } в каноническую модель (cards/model.js).
   Особенности каждого формата живут только в своём файле cards/formats/<формат>.js. */
(function (root) {
  "use strict";

  const adapters = {};

  const clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
  const str = (v) => (typeof v === "string" ? v : v == null ? "" : typeof v === "number" ? String(v) : "");
  const strList = (v) => (Array.isArray(v) ? v : v == null || v === "" ? [] : [v]).map((x) => str(x).trim()).filter(Boolean);
  const isObj = (v) => !!v && typeof v === "object" && !Array.isArray(v);

  // Ключи объекта, которые адаптер не разобрал: путь вида "data.profile.age".
  function unmapped(obj, known, prefix) {
    if (!isObj(obj)) return [];
    return Object.keys(obj).filter((k) => !known.includes(k)).map((k) => (prefix ? prefix + "." : "") + k);
  }

  // Promote plain, unrecognised character facts to *disabled* custom data. Preserve
  // technical/instruction-shaped and structured values only in imported source.
  // Shape-based inference is deliberately conservative; no LLM or execution.
  const TECHNICAL_KEY = /(?:system|prompt|instruction|directive|override|script|code|config|setting|metadata|^meta|password|api.?key|access.?key|secret.?key|private.?key|token|uuid|^id$|^source$|^assets?$|^image|^lora|^model|^spec|^version|^extension|^regex|^depth|^timestamp|^created|^updated|^tool|^plugin|^format|^url$|^uri$|^file|^path|^schema|^state|^log|^debug|^hash|^signature|creator|author|sampling|seed|temperature)/i;
  const LABELS = { occupation: "Профессия", profession: "Профессия", hobbies: "Увлечения", hobby: "Увлечения", fears: "Страхи", likes: "Нравится", dislikes: "Не нравится", skills: "Навыки", secrets: "Секреты", relationships: "Отношения", goals: "Цели", habits: "Привычки", preferences: "Предпочтения", nickname: "Прозвище" };
  function customFromUnknown(obj, known, prefix, format) {
    if (!isObj(obj)) return [];
    return Object.keys(obj).filter((key) => !known.includes(key) && !TECHNICAL_KEY.test(key)).flatMap((key) => {
      const raw = obj[key];
      let value = "";
      if (typeof raw === "string") value = raw;
      else if (typeof raw === "number" && Number.isFinite(raw)) value = String(raw);
      else if (Array.isArray(raw) && raw.length && raw.every((v) => typeof v === "string" || typeof v === "number" && Number.isFinite(v))) value = raw.join(", ");
      else return [];
      if (!value.trim() || value.length > 12000 || key.length > 100) return [];
      return [{
        id: "imported-" + prefix.replace(/[^a-z0-9]/gi, "-") + "-" + key.replace(/[^a-z0-9]/gi, "-"),
        label: LABELS[key.toLowerCase()] || key.replace(/[_-]+/g, " "),
        text: value,
        mode: "relevant",
        enabled: false,
        origin: { format, path: (prefix ? prefix + "." : "") + key, imported: true },
      }];
    });
  }

  // Запись лорбука в каноническом виде. raw — исходная запись (для экспорта и происхождения).
  function loreEntry(e, i, extra) {
    const x = isObj(e) ? e : { content: str(e) };
    return Object.assign({
      keys: strList(x.keys != null ? x.keys : x.key),
      secondary_keys: strList(x.secondary_keys),
      selective: !!x.selective,
      content: str(x.content != null ? x.content : x.text),
      enabled: x.enabled !== false && x.disable !== true,
      constant: !!x.constant,
      case_sensitive: !!x.case_sensitive,
      insertion_order: x.insertion_order != null ? Number(x.insertion_order) || 0 : x.priority != null ? Number(x.priority) || 0 : x.order != null ? Number(x.order) || 0 : i,
      position: x.position === "before_char" ? "before_char" : "after_char",
      comment: str(x.comment || x.name || x.title),
      raw: clone(x),
    }, extra || {});
  }

  // Заметка адаптера: уровень (error | warning | info), код и текст для экрана проверки.
  const note = (level, code, message, extra) => Object.assign({ level, code, message }, extra || {});

  PRP.cardFormats = Object.assign(PRP.cardFormats || {}, { adapters, register, helpers: { clone, str, strList, isObj, unmapped, customFromUnknown, loreEntry, note } });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/cards/formats/detect.js */
/* Prism RP — определение формата карточки по содержимому (не по имени файла).
   → { format: "ccv1" | "ccv2" | "ccv3" | "urv2" | "unknown", version, confidence: "high" | "medium" | "none",
       sourceType: "json" | "png", reason } */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const { isObj } = PRP.cardFormats.helpers;

  const V1_CONTENT = ["description", "personality", "scenario", "first_mes", "mes_example", "char_persona", "world_scenario", "char_greeting", "example_dialogue"];

  function detect(json, sourceType) {
    const base = { sourceType: sourceType || "json" };
    const out = (format, version, confidence, reason) => Object.assign({ format, version, confidence, reason }, base);
    if (!isObj(json)) return out("unknown", "", "none", Array.isArray(json) ? "в файле массив, а не карточка" : "в файле не объект JSON");

    // URV v2: type + version + data.
    if (json.type === "urv-char") {
      if (json.version === 2 && isObj(json.data)) return out("urv2", "2", "high", "type: urv-char, version: 2");
      return out("unknown", String(json.version || ""), "none", `URV-карточка версии ${json.version == null ? "?" : json.version} не поддерживается (нужна версия 2 с полем data)`);
    }

    // Character Card V2 / V3: spec + data.
    if (json.spec === "chara_card_v3" || json.spec === "chara_card_v2") {
      const v3 = json.spec === "chara_card_v3";
      if (!isObj(json.data)) return out("unknown", "", "none", `указан spec ${json.spec}, но нет объекта data`);
      return out(v3 ? "ccv3" : "ccv2", String(json.spec_version || (v3 ? "3.0" : "2.0")), "high", `spec: ${json.spec}`);
    }
    if (json.spec) return out("unknown", "", "none", `неизвестный spec: ${String(json.spec).slice(0, 40)}`);

    // Character Card V1 (TavernAI / Pygmalion): поля в корне — имя и хотя бы одно поле содержания.
    const hasName = typeof json.name === "string" || typeof json.char_name === "string";
    if (hasName && V1_CONTENT.some((k) => typeof json[k] === "string")) return out("ccv1", "1", "medium", "поля V1 в корне (имя и описание/приветствие)");

    const keys = Object.keys(json).slice(0, 8).join(", ");
    return out("unknown", "", "none", keys ? `не похоже ни на один известный формат (ключи: ${keys})` : "пустой объект");
  }

  // Адаптация по результату определения. Неизвестный формат не адаптируется никогда.
  function adapt(json, detection) {
    const fn = PRP.cardFormats.adapters[detection.format];
    if (!fn) return null;
    return fn(json, detection);
  }

  PRP.cardFormats.detect = detect;
  PRP.cardFormats.adapt = adapt;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/cards/formats/cc-v1.js */
/* Prism RP — адаптер Character Card V1: поля в корне (TavernAI: name, description, personality,
   scenario, first_mes, mes_example; Pygmalion: char_name, char_persona, world_scenario,
   char_greeting, example_dialogue). Неразобранные ключи корня хранятся в исходнике. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const F = PRP.cardFormats, CM = PRP.cardModel;
  const { clone, str, strList, unmapped, customFromUnknown, note } = F.helpers;

  const KNOWN = ["name", "char_name", "description", "char_persona", "personality", "scenario", "world_scenario", "first_mes", "char_greeting",
    "mes_example", "example_dialogue", "creator_notes", "tags", "creator", "character_version", "metadata"];

  F.register("ccv1", (json, detection) => {
    const notes = [];
    const d = CM.blank();
    const pick = (a, b) => (str(json[a]).trim() ? str(json[a]) : str(json[b]));
    d.name = pick("name", "char_name").trim();
    d.description = pick("description", "char_persona");
    d.personality = str(json.personality);
    d.scenario = pick("scenario", "world_scenario");
    d.firstMes = pick("first_mes", "char_greeting");
    d.mesExample = pick("mes_example", "example_dialogue");
    d.creatorNotes = str(json.creator_notes);
    d.tags = strList(json.tags);
    d.creator = str(json.creator);
    d.version = str(json.character_version);
    if (json.char_name || json.char_persona || json.char_greeting) notes.push(note("info", "pygmalion", "Поля в стиле Pygmalion (char_name, char_persona, …) разобраны как V1."));
    d.customFields = customFromUnknown(json, KNOWN, "", "ccv1");
    if (d.customFields.length) notes.push(note("info", "custom-mapped", `${d.customFields.length} дополнительных полей перенесены в пользовательские (выключены).`));
    const un = unmapped(json, KNOWN, "");
    if (un.length) notes.push(note("info", "unmapped", `Поля сохранены, но не используются: ${un.join(", ")}.`));
    d.source = { format: "ccv1", version: detection.version, sourceType: detection.sourceType, adapter: "cc-v1", importedAt: Date.now(), raw: clone(json), unmapped: un, compiled: [], preserved: {} };
    return { draft: d, notes };
  });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/cards/formats/cc-v2.js */
/* Prism RP — адаптер Character Card V2 (spec: chara_card_v2). Разбор поля data используется и для V3.
   system_prompt и post_history_instructions становятся импортированными указаниями — выключенными.
   Расширения (extensions) хранятся в исходнике; из них читается только наше prism_rp
   (настройки картинок и раздельные поля Prism), ничего из расширений не становится указанием. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const F = PRP.cardFormats, CM = PRP.cardModel;
  const { clone, str, strList, isObj, unmapped, customFromUnknown, loreEntry, note } = F.helpers;

  const KNOWN = ["name", "description", "personality", "scenario", "first_mes", "mes_example", "creator_notes", "system_prompt", "post_history_instructions",
    "alternate_greetings", "tags", "creator", "character_version", "character_book", "extensions"];

  // Recognise only the explicit paragraphs emitted by our compatibility export.
  // Do not guess appearance from prose in a foreign card.
  function splitCompatDescription(value) {
    const text = str(value);
    const out = { description: [], appearance: [], background: [] };
    let found = false;
    for (const p of text.split(/\n\s*\n/)) {
      const match = p.match(/^(Внешность|Прошлое):\s*\n([\s\S]*)$/);
      if (match) {
        const key = match[1] === "Внешность" ? "appearance" : "background";
        out[key].push(match[2]); found = true;
      } else if (p.trim()) out.description.push(p);
    }
    return found ? { description: out.description.join("\n\n"), appearance: out.appearance.join("\n\n"), background: out.background.join("\n\n") } : null;
  }

  // data (V2/V3) → черновик; notes дополняются. known — разобранные ключи (V3 добавляет свои).
  function mapData(data, detection, json, known) {
    const notes = [];
    const d = CM.blank();
    const ext = isObj(data.extensions) ? data.extensions : {};
    const prism = isObj(ext.prism_rp) ? ext.prism_rp : {};
    d.name = str(data.name).trim();
    // Раздельные поля Prism (наш экспорт складывает внешность и прошлое в description для других приложений).
    // Поля берутся раздельно, только если description не правили после экспорта (совпадает со сборкой из них).
    const pf = isObj(prism.fields) ? prism.fields : null;
    const composed = pf && [pf.description, pf.appearance ? "Внешность:\n" + pf.appearance : "", pf.background ? "Прошлое:\n" + pf.background : ""]
      .map((x) => str(x).trim()).filter(Boolean).join("\n\n");
    if (pf && composed === str(data.description).trim()) {
      d.description = str(pf.description);
      d.appearance = str(pf.appearance);
      d.background = str(pf.background);
    } else {
      const split = splitCompatDescription(data.description);
      if (split) {
        d.description = split.description;
        d.appearance = split.appearance;
        d.background = split.background;
        notes.push(note("info", "compat-paragraphs", "Раздельные внешность и прошлое восстановлены из явных секций стандартного description."));
      } else {
        d.description = str(data.description);
        if (pf) notes.push(note("warning", "prism-fields-stale", "Стандартное описание изменено: раздельные поля не совпадают. Данные сохранены в исходнике — проверьте соответствие."));
      }
    }
    d.personality = str(data.personality);
    d.scenario = str(data.scenario);
    d.firstMes = str(data.first_mes);
    d.altGreetings = strList(data.alternate_greetings);
    d.mesExample = str(data.mes_example);
    d.creatorNotes = str(data.creator_notes);
    d.tags = strList(data.tags);
    d.creator = str(data.creator);
    d.version = str(data.character_version);
    const book = isObj(data.character_book) ? data.character_book : null;
    d.lore = book && Array.isArray(book.entries) ? book.entries.map((e, i) => loreEntry(e, i, { source: "character_book" })) : [];
    if (isObj(prism.image)) { d.image = clone(prism.image); if (isObj(d.image.loraAdvanced)) d.image.loraAdvanced.enabled = false; }
    // Import cannot enable new model-facing custom data without local user approval.
    d.customFields = CM.normalizeCustomFields(prism.customFields, true);
    // Source fields often survive in CCv3's standard data alongside Prism's
    // own custom-field extension. One origin path must not produce two entries.
    for (const f of customFromUnknown(data, known, "data", detection.format)) {
      if (!d.customFields.some((existing) => existing.origin && existing.origin.path === f.origin.path)) d.customFields.push(f);
    }
    if (d.customFields.length) notes.push(note("info", "prism-custom-fields", "Пользовательские поля сохранены, но передача модели выключена до явного включения."));
    // Ядро Prism из нашего расширения — данные, а не указание; приходит непроверенным и не используется,
    // пока пользователь не сохранит его в редакторе (до этого Prism собирает запасное ядро из полей).
    if (isObj(prism.prismCore)) {
      const pc = prism.prismCore;
      const list = (v) => (Array.isArray(v) ? v.map((x) => str(x).trim()).filter(Boolean) : []);
      const core = { schema: 1, identity: str(pc.identity).trim(), traits: list(pc.traits), voice: list(pc.voice), durableContext: list(pc.durableContext), source: "imported", reviewed: false };
      if (core.identity || core.traits.length || core.voice.length || core.durableContext.length) {
        d.prismCore = core;
        notes.push(note("info", "prism-core", "Ядро Prism из карточки перенесено как данные, непроверенным: оно начнёт использоваться после сохранения в редакторе."));
      }
    }

    // Указания автора: только из стандартных полей, импортированные и выключенные.
    // Пустое стандартное поле = указания нет. Расширения (в т. ч. prism_rp.disabledDirectives) указаниями не становятся.
    d.directives.system = CM.importedDirective(str(data.system_prompt));
    d.directives.postHistory = CM.importedDirective(str(data.post_history_instructions));
    const dis = isObj(prism.disabledDirectives) ? clone(prism.disabledDirectives) : null;
    if (dis) notes.push(note("info", "prism-disabled-directives", "Выключенные указания из прошлого экспорта Prism (extensions.prism_rp.disabledDirectives) сохранены в исходнике и не восстанавливаются."));

    // Расширения других приложений: хранятся, не выполняются.
    const otherExt = Object.keys(ext).filter((k) => k !== "prism_rp");
    if (otherExt.includes("depth_prompt")) notes.push(note("warning", "ext-depth-prompt", "Заметка персонажа SillyTavern (extensions.depth_prompt) сохранена, но не используется: это указание, а не часть характера."));
    if (otherExt.length) notes.push(note("info", "ext-preserved", `Расширения других приложений сохранены без изменений: ${otherExt.join(", ")}.`));
    if (isObj(prism.image)) notes.push(note("info", "prism-image", "Настройки картинок Prism (триггер, LoRA, гардероб) перенесены из карточки."));

    const un = unmapped(data, known, "data");
    if (un.length) notes.push(note("info", "unmapped", `Поля сохранены, но не используются: ${un.join(", ")}.`));
    d.source = {
      format: detection.format, version: detection.version, sourceType: detection.sourceType, adapter: "cc-" + detection.format.slice(2),
      importedAt: Date.now(), raw: clone(json), unmapped: un, compiled: [], preserved: dis ? { disabledDirectives: dis } : {},
    };
    return { draft: d, notes };
  }

  F.register("ccv2", (json, detection) => mapData(json.data, detection, json, KNOWN));
  F.ccData = { mapData, KNOWN };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/cards/formats/cc-v3.js */
/* Prism RP — адаптер Character Card V3 (spec: chara_card_v3). Поля data как у V2,
   плюс поля V3, которых нет в модели Prism: они хранятся в исходнике и показываются на проверке. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const F = PRP.cardFormats;
  const { note } = F.helpers;

  const V3_ONLY = ["nickname", "group_only_greetings", "assets", "creator_notes_multilingual", "source", "creation_date", "modification_date"];

  F.register("ccv3", (json, detection) => {
    const res = F.ccData.mapData(json.data, detection, json, F.ccData.KNOWN.concat(V3_ONLY));
    // V3 nickname is additional character data; other V3-only keys are metadata/assets.
    for (const field of F.helpers.customFromUnknown(json.data, F.ccData.KNOWN, "data", "ccv3")) {
      if (field.origin.path === "data.nickname" && !res.draft.customFields.some((f) => f.origin && f.origin.path === field.origin.path)) res.draft.customFields.push(field);
    }
    const present = V3_ONLY.filter((k) => json.data[k] != null && !(Array.isArray(json.data[k]) && !json.data[k].length));
    if (present.length) {
      res.notes.push(note("info", "v3-preserved", `Поля V3 сохранены, но пока не используются: ${present.join(", ")}.`));
      res.draft.source.unmapped = res.draft.source.unmapped.concat(present.map((k) => "data." + k));
    }
    return res;
  });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/cards/formats/urv-v2.js */
/* Prism RP — адаптер URV v2 (type: "urv-char", version: 2).
   Профиль раскладывается по полям Prism. Заметка (systemNote) и напоминание (reminderMessage)
   становятся импортированными указаниями — выключенными. Собранный data.systemPrompt, повторяющий
   разложенные поля, только хранится и показывается на проверке: он не включается никогда.
   userOverride и неизвестные поля хранятся и показываются, но во время работы не используются. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const F = PRP.cardFormats, CM = PRP.cardModel;
  const { clone, str, isObj, unmapped, customFromUnknown, loreEntry, note } = F.helpers;

  const DATA_KNOWN = ["id", "name", "description", "profile", "firstMessage", "reminderMessage", "userOverride", "lorebook", "exampleDialogue", "systemPrompt",
    "imageTrigger", "outfitTags", "imageStyleTrigger", "nsfwTags", "imageLoras"];
  const PROFILE_KNOWN = ["name", "age", "gender", "appearance", "personality", "background", "scenario", "systemNote"];

  const text = (v) => (typeof v === "string" ? v : isObj(v) ? str(v.text != null ? v.text : v.content != null ? v.content : v.message) : str(v));
  const norm = (s) => String(s || "").toLowerCase().replace(/\s+/g, " ").trim();

  // Пример диалога URV → блок формата mes_example. → строка или null, если форма не распознана.
  function exampleBlock(ex) {
    const line = (who, t) => (String(t || "").trim() ? `${who}: ${String(t).trim()}` : "");
    if (typeof ex === "string") return ex.trim() ? "<START>\n" + ex.trim() : "";
    if (Array.isArray(ex)) {
      if (ex.every((x) => typeof x === "string")) return ["<START>", line("{{user}}", ex[0]), line("{{char}}", ex[1])].concat(ex.slice(2).map((t, i) => line(i % 2 ? "{{char}}" : "{{user}}", t))).filter(Boolean).join("\n");
      if (ex.every((x) => isObj(x) && x.role)) return ["<START>"].concat(ex.map((x) => line(/^(user|human)$/i.test(x.role) ? "{{user}}" : "{{char}}", text(x)))).filter(Boolean).join("\n");
      return null;
    }
    if (isObj(ex)) {
      const u = ex.user != null ? ex.user : ex.input != null ? ex.input : ex.question;
      const c = ex.char != null ? ex.char : ex.character != null ? ex.character : ex.assistant != null ? ex.assistant : ex.output != null ? ex.output : ex.answer;
      if (u != null || c != null) return ["<START>", line("{{user}}", text(u)), line("{{char}}", text(c))].filter(Boolean).join("\n");
      if (ex.text != null || ex.content != null) return "<START>\n" + text(ex).trim();
    }
    return null;
  }

  // Лорбук URV: объект-карта или массив. Ключ карты — ключевое слово, если запись своих ключей не задаёт
  // и ключ не похож на служебный id.
  function loreFromUrv(lb, notes) {
    const out = [];
    const looksLikeId = (k) => /^\d+$/.test(k) || /^[0-9a-f-]{16,}$/i.test(k) || /^(entry|lore)[-_]?\d+$/i.test(k);
    if (Array.isArray(lb)) lb.forEach((e, i) => out.push(loreEntry(e, i, { source: "urv.lorebook" })));
    else if (isObj(lb)) Object.keys(lb).forEach((k, i) => {
      const v = lb[k];
      const e = loreEntry(typeof v === "string" ? { content: v } : v, i, { source: "urv.lorebook", sourceKey: k });
      if (!e.keys.length && !looksLikeId(k)) e.keys = [k];
      if (!e.comment) e.comment = looksLikeId(k) ? "" : k;
      out.push(e);
    });
    else if (lb != null) notes.push(note("warning", "lore-shape", "Лорбук в незнакомом виде: сохранён в исходнике, но не разобран."));
    const empty = out.filter((e) => !e.content.trim()).length;
    if (empty) notes.push(note("warning", "lore-empty", `Записей лорбука без текста: ${empty}. Они перенесены, но в модель не попадут.`));
    return out;
  }

  // Карта «название → теги» в строки формата Prism «название: теги».
  function mapLines(v) {
    if (typeof v === "string") return v;
    if (Array.isArray(v) && v.every((x) => typeof x === "string")) return v.join("\n");
    if (isObj(v) && Object.values(v).every((x) => typeof x === "string" || (Array.isArray(x) && x.every((y) => typeof y === "string")))) {
      return Object.keys(v).map((k) => `${k}: ${Array.isArray(v[k]) ? v[k].join(", ") : v[k]}`).join("\n");
    }
    return null;
  }
  function loras(v) {
    const list = Array.isArray(v) ? v : typeof v === "string" ? v.split(/[,\n]/) : null;
    if (!list) return null;
    const out = [];
    for (const x of list) {
      if (isObj(x) && str(x.name).trim()) out.push({ name: str(x.name).trim(), weight: x.weight != null ? Number(x.weight) || 1 : 1 });
      else if (typeof x === "string" && x.trim()) {
        const m = x.trim().match(/^<?(?:lora:)?([^:>]+)(?::([\d.]+))?>?$/i);
        if (!m) return null;
        out.push({ name: m[1].trim(), weight: m[2] ? Number(m[2]) : 1 });
      } else if (x != null && !(typeof x === "string")) return null;
    }
    return out;
  }

  /* Собранный systemPrompt: повторяет ли он разложенные поля?
     Берутся начала (до 60 символов) непустых полей длиной от 20 символов и ищутся в тексте промпта. */
  function compiledCheck(prompt, fields) {
    const p = norm(prompt);
    const probes = Object.keys(fields).filter((k) => norm(fields[k]).length >= 20);
    const hits = probes.filter((k) => p.includes(norm(fields[k]).slice(0, 60)));
    const compiled = hits.length >= 2 || (hits.length === 1 && probes.length === 1);
    return { compiled, hits, probes };
  }

  F.register("urv2", (json, detection) => {
    const notes = [];
    const data = json.data, prof = isObj(data.profile) ? data.profile : {};
    const d = CM.blank();
    d.name = (str(prof.name).trim() || str(data.name).trim());
    const facts = [prof.age != null && str(prof.age).trim() ? `Возраст: ${str(prof.age).trim()}` : "", prof.gender != null && str(prof.gender).trim() ? `Пол: ${str(prof.gender).trim()}` : ""].filter(Boolean).join(" · ");
    d.description = [facts, str(data.description).trim()].filter(Boolean).join("\n\n");
    if (facts) notes.push(note("info", "profile-facts", "Возраст и пол из профиля добавлены в начало описания."));
    d.appearance = str(prof.appearance);
    d.personality = str(prof.personality);
    d.background = str(prof.background);
    d.scenario = str(prof.scenario);

    // Первые сообщения: первое — основное, остальные — альтернативные приветствия.
    const fm = Array.isArray(data.firstMessage) ? data.firstMessage : data.firstMessage != null ? [data.firstMessage] : [];
    const greetings = fm.map(text).map((s) => s.trim()).filter(Boolean);
    d.firstMes = greetings[0] || "";
    d.altGreetings = greetings.slice(1);
    if (greetings.length > 1) notes.push(note("warning", "multi-first", `Первых сообщений: ${greetings.length}. Первое стало основным, остальные — альтернативными приветствиями.`));

    // Примеры диалогов.
    const exs = Array.isArray(data.exampleDialogue) ? data.exampleDialogue : data.exampleDialogue != null ? [data.exampleDialogue] : [];
    const blocks = exs.map(exampleBlock);
    const bad = blocks.filter((b) => b === null).length;
    d.mesExample = blocks.filter(Boolean).join("\n");
    if (bad) notes.push(note("warning", "examples-shape", `Примеров диалога в незнакомом виде: ${bad}. Они сохранены в исходнике, но не перенесены.`));

    d.lore = loreFromUrv(data.lorebook, notes);

    // Указания: заметка и напоминание — импортированные, выключенные.
    d.directives.system = CM.importedDirective(str(prof.systemNote));
    d.directives.postHistory = CM.importedDirective(str(data.reminderMessage));

    const source = {
      format: "urv2", version: "2", sourceType: detection.sourceType, adapter: "urv-v2", importedAt: Date.now(), raw: clone(json),
      unmapped: [], compiled: [], preserved: {},
    };

    // Собранный systemPrompt.
    const sp = str(data.systemPrompt);
    if (sp.trim()) {
      const chk = compiledCheck(sp, { appearance: d.appearance, personality: d.personality, background: d.background, scenario: d.scenario, systemNote: str(prof.systemNote) });
      if (chk.compiled) {
        source.compiled.push({ field: "data.systemPrompt", text: sp, matched: chk.hits });
        notes.push(note("warning", "compiled-prompt", "Собранный промпт источника (data.systemPrompt) сохранён, но не включён: те же поля импортированы по отдельности."));
      } else if (!d.directives.system.text.trim()) {
        d.directives.system = CM.importedDirective(sp);
        notes.push(note("warning", "system-prompt-candidate", "data.systemPrompt не похож на собранный дубль полей: предложен как указание автора, выключен."));
      } else {
        source.preserved.systemPrompt = sp;
        notes.push(note("warning", "system-prompt-preserved", "data.systemPrompt сохранён, но не включён: место указания занято заметкой профиля (systemNote)."));
      }
    }

    // userOverride: хранится и показывается, во время работы не используется.
    if (data.userOverride != null && (typeof data.userOverride !== "string" || data.userOverride.trim())) {
      source.preserved.userOverride = clone(data.userOverride);
      notes.push(note("warning", "user-override", "userOverride (переопределение собеседника из URV) сохранён, но не применяется."));
    }
    if (data.id != null) source.preserved.id = clone(data.id);

    // Картинки: переносится только то, что отображается однозначно.
    const im = {};
    const keep = (k, why) => { source.preserved[k] = clone(data[k]); notes.push(note("warning", "image-preserved", `${k} сохранён, но не перенесён: ${why}.`)); };
    if (str(data.imageTrigger).trim()) im.trigger = str(data.imageTrigger).trim();
    if (str(data.imageStyleTrigger).trim()) im.styleTrigger = str(data.imageStyleTrigger).trim();
    if (data.outfitTags != null) { const v = mapLines(data.outfitTags); if (v == null) keep("outfitTags", "незнакомый вид"); else if (v.trim()) im.wardrobe = v; }
    if (data.nsfwTags != null) { const v = mapLines(data.nsfwTags); if (v == null) keep("nsfwTags", "незнакомый вид"); else if (v.trim()) im.nsfw = v; }
    if (data.imageLoras != null) { const v = loras(data.imageLoras); if (v) im.loras = v; else keep("imageLoras", "незнакомый вид"); }
    if (Object.keys(im).length) { d.image = im; notes.push(note("info", "image-mapped", "Настройки картинок перенесены: " + Object.keys(im).join(", ") + ".")); }

    d.customFields = customFromUnknown(data, DATA_KNOWN, "data", "urv2")
      .concat(customFromUnknown(prof, PROFILE_KNOWN, "data.profile", "urv2"));
    if (d.customFields.length) notes.push(note("info", "custom-mapped", `${d.customFields.length} дополнительных полей перенесены в пользовательские (выключены).`));
    source.unmapped = unmapped(data, DATA_KNOWN, "data").concat(unmapped(prof, PROFILE_KNOWN, "data.profile"));
    if (source.unmapped.length) notes.push(note("info", "unmapped", `Поля сохранены, но не используются: ${source.unmapped.join(", ")}.`));
    d.source = source;
    return { draft: d, notes };
  });

  F.urv = { compiledCheck, exampleBlock };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/cards/validate.js */
/* Prism RP — проверка черновика карточки перед сохранением.
   Уровни: error — сохранить нельзя; warning — можно после проверки; info — сведения о переносе.
   Чистый модуль. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const CM = PRP.cardModel;

  const note = (level, code, message) => ({ level, code, message });

  function validate(d) {
    const out = [];
    if (!d) return [note("error", "no-draft", "Карточку не удалось разобрать.")];
    if (!String(d.name || "").trim()) out.push(note("error", "no-name", "У персонажа нет имени: поле имени в файле пустое или отсутствует."));
    if (!CM.hasContent(d)) out.push(note("error", "empty-card", "В карточке нет ни описания, ни личности, ни сценария, ни приветствия — сохранять нечего."));
    const dir = (which, label) => {
      const x = d.directives && d.directives[which];
      if (x && x.origin === "imported" && String(x.text || "").trim()) {
        out.push(note("warning", "directive-" + which, `${label} из файла сохранено, но выключено. Включите его, только если доверяете тексту.`));
      }
    };
    dir("system", "Указание автора (системное)");
    dir("postHistory", "Указание автора после истории");
    const lore = d.lore || [];
    if (lore.length) out.push(note("info", "lore", `Записей лорбука: ${lore.length}. Это справочные сведения персонажа, не указания.`));
    return out;
  }

  const hasErrors = (issues) => issues.some((x) => x.level === "error");

  PRP.cardValidate = { validate, hasErrors };
  if (typeof module !== "undefined" && module.exports) module.exports = PRP.cardValidate;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/cards/import.js */
/* Prism RP — конвейер импорта карточки (чистый):
     байты/текст → JSON (или PNG-чанк chara/ccv3) → определение формата → адаптер
     → канонический черновик → проверка.
   Ничего не сохраняет: результат показывается на экране проверки, сохранение — только после подтверждения.
   Неизвестный или битый файл даёт ошибку, а не пустую карточку. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const CC = PRP.ccard, F = PRP.cardFormats, VAL = PRP.cardValidate;

  const err = (code, message) => ({ level: "error", code, message });

  /* → { ok, fileName, detection, draft | null, issues: [{level, code, message}] } */
  function fromObject(json, sourceType, fileName) {
    const detection = F.detect(json, sourceType);
    if (detection.format === "unknown") {
      return { ok: false, fileName, detection, draft: null, issues: [err("unknown-format", "Формат не распознан: " + detection.reason + ".")] };
    }
    let res;
    try { res = F.adapt(json, detection); }
    catch (e) { return { ok: false, fileName, detection, draft: null, issues: [err("malformed", "Карточку не удалось разобрать: " + (e.message || e) + ".")] }; }
    const issues = res.notes.concat(VAL.validate(res.draft));
    // Ошибки — первыми, затем предупреждения, затем сведения.
    const rank = { error: 0, warning: 1, info: 2 };
    issues.sort((a, b) => rank[a.level] - rank[b.level]);
    return { ok: !VAL.hasErrors(issues), fileName, detection, draft: res.draft, issues };
  }

  function fromJsonText(text, fileName) {
    let json;
    try { json = JSON.parse(text); }
    catch (e) { return { ok: false, fileName, detection: { format: "unknown", version: "", confidence: "none", sourceType: "json", reason: "не JSON" }, draft: null, issues: [err("invalid-json", "Файл не является корректным JSON: " + e.message)] }; }
    return fromObject(json, "json", fileName);
  }

  function fromPngBytes(u8, fileName) {
    const det0 = { format: "unknown", version: "", confidence: "none", sourceType: "png", reason: "" };
    let json;
    try { json = CC.cardJsonFromPng(u8); }
    catch (e) { return { ok: false, fileName, detection: Object.assign(det0, { reason: e.message }), draft: null, issues: [err("png", e.message)] }; }
    return fromObject(json, "png", fileName);
  }

  PRP.cardImport = { fromObject, fromJsonText, fromPngBytes };
  if (typeof module !== "undefined" && module.exports) module.exports = PRP.cardImport;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/world/model.js */
/* Prism RP — общий пак мира (Shared World Pack) и факт мира (World Fact). Чистый модуль.

   Пак — переиспользуемое знание о мире или фандоме, общее для многих карточек.
   Факт мира — декларативное утверждение о мире («Тацуки живёт в Каракуре»). Это НЕ указание модели,
   НЕ черта характера, НЕ опыт, НЕ сценарий и НЕ состояние сцены.
   Метаданные (entities, topics, locations, timeline, variant) — для будущего отбора (FOUNDATION-W2).
   provenance — откуда факт; только сведения для человека, во время работы не исполняется.
   Режим (сцена / переписка) миру не принадлежит: полей, зависящих от режима, здесь нет.
   Без DOM, хранилища, сети и S. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});

  const SCHEMA = 1;
  const FORMAT = "prismrp-world-pack"; // собственный формат экспорта паков PrismRP

  const isObj = (v) => v != null && typeof v === "object" && !Array.isArray(v);
  const str = (v) => (v == null ? "" : String(v));
  const strList = (v) => (Array.isArray(v) ? v.map((x) => str(x).trim()).filter(Boolean) : []);
  const uid = (p) => p + "_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

  function provenance(p) {
    const o = isObj(p) ? p : {};
    const out = { kind: o.kind === "imported" ? "imported" : "manual" };
    if (o.sourceFormat) out.sourceFormat = str(o.sourceFormat);
    if (o.sourceId) out.sourceId = str(o.sourceId);
    if (o.note) out.note = str(o.note);
    return out;
  }

  // Факт мира в каноническом виде. Пустой id получает новый; существующий не меняется никогда.
  function fact(f, idPrefix) {
    const o = isObj(f) ? f : {};
    return {
      id: str(o.id).trim() || uid(idPrefix || "wf"),
      text: str(o.text),
      entities: strList(o.entities),
      topics: strList(o.topics),
      locations: strList(o.locations),
      timeline: str(o.timeline).trim(),
      variant: str(o.variant).trim(),
      enabled: o.enabled !== false,
      provenance: provenance(o.provenance),
    };
  }

  function blank(name) {
    const now = Date.now();
    return { id: uid("wp"), schema: SCHEMA, name: str(name), description: "", facts: [], source: { kind: "manual" }, createdAt: now, updatedAt: now };
  }

  // Приведение пака к каноническому виду (без исправления смысловых ошибок: повторы id остаются и видны в проверке).
  function normalize(p) {
    const o = isObj(p) ? p : {};
    return {
      id: str(o.id).trim(),
      schema: SCHEMA,
      name: str(o.name),
      description: str(o.description),
      facts: Array.isArray(o.facts) ? o.facts.map((f) => fact(f)) : [],
      source: isObj(o.source) ? Object.assign({ kind: o.source.kind === "imported" ? "imported" : "manual" },
        o.source.format ? { format: str(o.source.format) } : {}, o.source.importedAt ? { importedAt: o.source.importedAt } : {}) : { kind: "manual" },
      createdAt: o.createdAt || Date.now(),
      updatedAt: o.updatedAt || Date.now(),
    };
  }

  const issueOf = (level, code, message) => ({ level, code, message });

  /* Экспорт: канонический JSON пака. Линзы персонажей в экспорт пака не входят. */
  function exportPack(p) {
    return { app: "prism-rp", format: FORMAT, schema: SCHEMA, exportedAt: new Date().toISOString(), pack: normalize(p) };
  }

  /* Импорт: текст → проверенный пак или ошибки. Ничего не сохраняет и ничего не исполняет.
     Принимается только собственный формат PrismRP; чужие форматы лорбуков не поддерживаются.
     Новый id пака выдаётся всегда (чтобы не затереть существующий); id фактов сохраняются —
     на них ссылаются переопределения. → { ok, pack | null, issues } */
  function importPackText(text) {
    let json;
    try { json = JSON.parse(text); }
    catch (e) { return { ok: false, pack: null, issues: [issueOf("error", "invalid-json", "Файл не является корректным JSON: " + e.message)] }; }
    if (!isObj(json) || json.app !== "prism-rp" || json.format !== FORMAT) {
      return { ok: false, pack: null, issues: [issueOf("error", "unknown-format", "Это не пак мира PrismRP (нужны app: \"prism-rp\" и format: \"" + FORMAT + "\").")] };
    }
    if (json.schema !== SCHEMA) return { ok: false, pack: null, issues: [issueOf("error", "schema", `Версия пака ${json.schema} не поддерживается.`)] };
    const raw = json.pack;
    const V = PRP.worldValidate; // граница проверки — world/validate.js (загружается после модели)
    const issues = V.validatePack(raw);
    if (V.hasErrors(issues)) return { ok: false, pack: null, issues };
    const pack = normalize(raw);
    const now = Date.now();
    pack.id = uid("wp");
    pack.source = { kind: "imported", format: FORMAT, importedAt: now };
    pack.createdAt = now; pack.updatedAt = now;
    return { ok: true, pack, issues };
  }

  PRP.worldModel = { SCHEMA, FORMAT, uid, fact, provenance, blank, normalize, exportPack, importPackText, strList, isObj, str };
  if (typeof module !== "undefined" && module.exports) module.exports = PRP.worldModel;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/world/lens.js */
/* Prism RP — линза персонажа (Character Lens). Чистый модуль.

   Линза — то, что отличается или важно для одной карточки поверх ОДНОГО общего пака мира:
     • focusEntities / focusTopics / relevanceHints — на чём сосредоточиться (для отбора в W2);
     • timelineVariant — какая ветка канона или AU у этого персонажа (метаданные для W2);
     • disabledFactIds — факты пака, которые для этого персонажа не действуют (явно по id);
     • overrides — замена конкретного факта пака по его id (targetFactId);
     • additions — факты мира, нужные только этому персонажу.
   Линза никогда не меняет сам пак и не содержит его копию. Связь с карточкой — по cardId
   (одна линза на карточку), с паком — по packId. Без DOM, хранилища, сети и S. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const WM = PRP.worldModel;

  const SCHEMA = 1;
  const isObj = (v) => v != null && typeof v === "object" && !Array.isArray(v);
  const str = (v) => (v == null ? "" : String(v));

  /* Переопределение факта пака. Поля метаданных различают «не задано» и «задано пустым»:
     отсутствует или null → наследуется у целевого факта; задано (в том числе [] или "") → заменяет,
     то есть пустой список очищает метаданные. Никаких проверок на «истинность». */
  function override(o) {
    const x = isObj(o) ? o : {};
    const out = { id: str(x.id).trim() || WM.uid("wo"), targetFactId: str(x.targetFactId).trim(), text: str(x.text) };
    for (const k of ["entities", "topics", "locations"]) if (Array.isArray(x[k])) out[k] = WM.strList(x[k]);
    for (const k of ["timeline", "variant"]) if (x[k] != null) out[k] = str(x[k]).trim();
    if (x.note) out.note = str(x.note);
    return out;
  }

  function blank(cardId, packId) {
    const now = Date.now();
    return {
      id: WM.uid("wl"), schema: SCHEMA, cardId: str(cardId), packId: str(packId),
      focusEntities: [], focusTopics: [], relevanceHints: [], timelineVariant: "",
      disabledFactIds: [], overrides: [], additions: [], createdAt: now, updatedAt: now,
    };
  }

  function normalize(l) {
    const o = isObj(l) ? l : {};
    return {
      id: str(o.id).trim(), schema: SCHEMA, cardId: str(o.cardId).trim(), packId: str(o.packId).trim(),
      focusEntities: WM.strList(o.focusEntities), focusTopics: WM.strList(o.focusTopics), relevanceHints: WM.strList(o.relevanceHints),
      timelineVariant: str(o.timelineVariant).trim(),
      disabledFactIds: WM.strList(o.disabledFactIds),
      overrides: Array.isArray(o.overrides) ? o.overrides.map(override) : [],
      additions: Array.isArray(o.additions) ? o.additions.map((f) => WM.fact(f, "wa")) : [],
      createdAt: o.createdAt || Date.now(), updatedAt: o.updatedAt || Date.now(),
    };
  }

  PRP.worldLens = { SCHEMA, blank, normalize, override };
  if (typeof module !== "undefined" && module.exports) module.exports = PRP.worldLens;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/world/validate.js */
/* Prism RP — граница проверки мира (чистый модуль): паки мира и линзы персонажей.

   Уровни: error — сохранять нельзя; warning — можно, но человек должен это видеть.
   Ошибки (блокируют):
     • повтор id фактов пака; повтор id добавленных фактов линзы;
     • несколько переопределений одного targetFactId;
     • id добавленного факта линзы совпадает с id факта пака (иначе в мире было бы два факта с одним id);
     • линза ссылается на пак, которого нет (pack-missing; наличие пака проверяет сервис — здесь только вид ошибки);
     • битые обязательные объекты и id (нет id, не объект, не список);
     • вторая линза для того же персонажа (одна линза на карточку).
   Предупреждения:
     • переопределение ссылается на факт, которого в паке нет;
     • выключение ссылается на факт, которого в паке нет.
   Ссылки на несуществующие факты никогда не исправляются угадыванием (ни по тексту, ни по похожему id).
   Проверка не меняет входные данные. Без DOM, хранилища, сети и S. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});

  const isObj = (v) => v != null && typeof v === "object" && !Array.isArray(v);
  const str = (v) => (v == null ? "" : String(v));
  const issue = (level, code, message, ref) => Object.assign({ level, code, message }, ref != null ? { ref: String(ref) } : {});
  const hasErrors = (issues) => (issues || []).some((x) => x.level === "error");
  const META_LISTS = ["entities", "topics", "locations"];

  // Список фактов (пака или добавлений линзы): объекты, непустые и неповторяющиеся id.
  function checkFacts(list, label, dupCode, out) {
    const seen = new Set();
    list.forEach((f, i) => {
      const n = `${label} №${i + 1}`;
      if (!isObj(f)) { out.push(issue("error", "fact-malformed", `${n} не является объектом.`, i)); return; }
      const id = str(f.id).trim();
      if (!id) out.push(issue("error", "fact-no-id", `У факта (${n}) нет id.`, i));
      else if (seen.has(id)) out.push(issue("error", dupCode, `Повторяется id факта: ${id}.`, id));
      else seen.add(id);
      if (f.text != null && typeof f.text !== "string") out.push(issue("error", "fact-text", `Текст факта ${id || n} не строка.`, id || i));
      else if (!str(f.text).trim()) out.push(issue("warning", "fact-empty", `Факт ${id || n} без текста.`, id || i));
      for (const k of META_LISTS) if (f[k] != null && !Array.isArray(f[k])) out.push(issue("error", "fact-meta", `Поле ${k} факта ${id || n} должно быть списком.`, id || i));
      if (f.provenance != null && !isObj(f.provenance)) out.push(issue("error", "fact-provenance", `Источник факта ${id || n} должен быть объектом.`, id || i));
    });
    return seen;
  }

  function validatePack(p) {
    const out = [];
    if (!isObj(p)) return [issue("error", "not-object", "Пак мира должен быть объектом.")];
    if (!str(p.id).trim()) out.push(issue("error", "no-id", "У пака нет id."));
    if (!str(p.name).trim()) out.push(issue("error", "no-name", "У пака нет названия."));
    if (p.facts != null && !Array.isArray(p.facts)) { out.push(issue("error", "facts-not-array", "Поле facts должно быть списком.")); return out; }
    checkFacts(p.facts || [], "Факт", "fact-duplicate-id", out);
    return out;
  }

  /* Линза. pack — необязательно: с ним проверяются ссылки на факты (это предупреждения). */
  function validateLens(l, pack) {
    const out = [];
    if (!isObj(l)) return [issue("error", "not-object", "Линза должна быть объектом.")];
    if (!str(l.id).trim()) out.push(issue("error", "no-id", "У линзы нет id."));
    if (!str(l.cardId).trim()) out.push(issue("error", "no-card", "Линза не привязана к персонажу."));
    if (!str(l.packId).trim()) out.push(issue("error", "no-pack", "Линза не привязана к паку мира."));
    for (const k of ["disabledFactIds", "overrides", "additions", "focusEntities", "focusTopics", "relevanceHints"]) {
      if (l[k] != null && !Array.isArray(l[k])) out.push(issue("error", "not-array", `Поле ${k} должно быть списком.`, k));
    }
    const overrides = Array.isArray(l.overrides) ? l.overrides : [];
    const targets = new Set(), ovIds = new Set();
    overrides.forEach((o, i) => {
      if (!isObj(o)) { out.push(issue("error", "override-malformed", `Переопределение №${i + 1} не является объектом.`, i)); return; }
      const id = str(o.id).trim();
      if (!id) out.push(issue("error", "override-no-id", `У переопределения №${i + 1} нет id.`, i));
      else if (ovIds.has(id)) out.push(issue("error", "override-duplicate-id", `Повторяется id переопределения: ${id}.`, id));
      else ovIds.add(id);
      const t = str(o.targetFactId).trim();
      if (!t) out.push(issue("error", "override-no-target", `У переопределения №${i + 1} нет целевого факта.`, id || i));
      else if (targets.has(t)) out.push(issue("error", "override-duplicate-target", `Факт ${t} переопределён больше одного раза — неясно, какой вариант действует.`, t));
      else targets.add(t);
      for (const k of META_LISTS) if (o[k] != null && !Array.isArray(o[k])) out.push(issue("error", "override-meta", `Поле ${k} переопределения ${id || i + 1} должно быть списком.`, id || i));
    });
    const addIds = checkFacts(Array.isArray(l.additions) ? l.additions : [], "Добавленный факт", "addition-duplicate-id", out);
    if (isObj(pack)) {
      const ids = new Set((pack.facts || []).filter(isObj).map((f) => str(f.id)));
      if (str(l.packId) && str(pack.id) && str(l.packId) !== str(pack.id)) out.push(issue("error", "pack-mismatch", "Линза относится к другому паку."));
      for (const t of targets) if (!ids.has(t)) out.push(issue("warning", "override-target-missing", `Переопределяемого факта ${t} нет в паке; ссылка сохранена и не применяется.`, t));
      for (const d of Array.isArray(l.disabledFactIds) ? l.disabledFactIds : []) if (!ids.has(str(d))) out.push(issue("warning", "disabled-target-missing", `Выключаемого факта ${d} нет в паке; ссылка сохранена и не применяется.`, d));
      // id не переименовывается и не подбирается автоматически: пользователь должен сам пересоздать добавленный факт.
      for (const a of addIds) if (ids.has(a)) out.push(issue("error", "addition-id-collides", `id добавленного факта ${a} совпадает с фактом пака — у факта мира id должен быть единственным. Удалите этот факт персонажа и добавьте заново.`, a));
    }
    return out;
  }

  // Линза ссылается на несуществующий пак: блокирующая ошибка. Существование проверяет вызывающий (world/service),
  // этот модуль хранилище не читает.
  const packMissing = (packId) => issue("error", "pack-missing", `Пак мира ${packId || "(не указан)"} не найден: линзу можно привязать только к существующему паку.`, packId || "");

  /* Одна линза на персонажа: lens нельзя сохранить, если у того же cardId уже есть линза с другим id.
     existing — уже сохранённые линзы этого персонажа (или все). */
  function validateOneLensPerCard(lens, existing) {
    const other = (existing || []).find((x) => x && x.cardId === lens.cardId && x.id !== lens.id);
    return other ? [issue("error", "lens-exists", "У этого персонажа уже есть линза мира: измените её, а не создавайте вторую.", other.id)] : [];
  }

  PRP.worldValidate = { validatePack, validateLens, validateOneLensPerCard, packMissing, hasErrors };
  if (typeof module !== "undefined" && module.exports) module.exports = PRP.worldValidate;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/world/resolve.js */
/* Prism RP — разрешение статического мира: пак + линза → действующие факты. Чистый модуль.

   Порядок власти W1: линза (переопределения, добавления, выключения) > общий пак.
   (Наложение мира на конкретный чат — следующий этап, FOUNDATION-W2; здесь его нет.)

   Порядок (зафиксирован):
     1. факты пака с enabled: false исключаются;
     2. факты из disabledFactIds линзы исключаются — выключение сильнее переопределения;
     3. к оставшимся фактам пака применяются переопределения (по targetFactId);
     4. добавляются факты линзы.
   Порядок фактов пака сохраняется, добавления идут после них.
   Идентичность: факт, полученный переопределением, сохраняет id факта пака (targetFactId);
   откуда значение — видно по origin: "override" и overrideId. Правка текста переопределения id не меняет.
   У добавлений линзы — свои постоянные id. Поля метаданных переопределения: не задано или null —
   наследуется у факта пака; задано (в том числе [] или "") — заменяет.
   Также:
     • ссылки на несуществующие факты и повторы id — предупреждения в отчёте; совпадение по тексту
       не ищется никогда;
     • при повторе id в паке действует первый факт (детерминированно), остальные — в предупреждениях;
     • входные пак и линза не изменяются.
   В результат попадают только канонические поля пака и линзы: исходники карточек, их расширения,
   опыт, сцена, сценарий и указания автора сюда не читаются. provenance переносится только для показа.
   Результат — для просмотра (W1). В контекст модели он не подаётся. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});

  const copy = (x) => JSON.parse(JSON.stringify(x));
  const META = ["entities", "topics", "locations", "timeline", "variant"];

  /* → { facts: [{ id, text, entities, topics, locations, timeline, variant, provenance, origin, overrideId?, note? }],
         excluded: [{ id, text, reason: "pack-disabled" | "lens-disabled" }],
         report: { packId, lensId, timelineVariant, packFacts, effective, disabled, packDisabled, overridden, additions, warnings } } */
  function resolve(pack, lens) {
    const warnings = [];
    const warn = (code, message, ref) => warnings.push({ level: "warning", code, message, ref });
    const p = pack ? copy(pack) : { id: "", facts: [] };
    const l = lens ? copy(lens) : null;
    if (l && l.packId && p.id && l.packId !== p.id) warn("pack-mismatch", "Линза относится к другому паку — её изменения не применены.", l.packId);
    const useLens = l && (!l.packId || !p.id || l.packId === p.id);

    // Факты пака: первый из повторяющихся id действует, остальные — предупреждение.
    const packFacts = [];
    const byId = new Map();
    for (const f of p.facts || []) {
      if (!f || typeof f !== "object" || !f.id) { warn("fact-malformed", "Факт пака без id пропущен.", ""); continue; }
      if (byId.has(f.id)) { warn("fact-duplicate-id", `Повторяется id факта ${f.id}: действует первый.`, f.id); continue; }
      byId.set(f.id, f);
      packFacts.push(f);
    }

    const disabledIds = new Set(useLens ? l.disabledFactIds || [] : []);
    for (const id of disabledIds) if (!byId.has(id)) warn("disabled-target-missing", `Выключаемого факта ${id} нет в паке — ссылка оставлена как есть.`, id);
    const overrides = new Map();
    for (const o of useLens ? l.overrides || [] : []) {
      if (!o || !o.targetFactId) { warn("override-no-target", "Переопределение без целевого факта пропущено.", o && o.id); continue; }
      if (overrides.has(o.targetFactId)) { warn("override-duplicate-target", `Факт ${o.targetFactId} переопределён повторно: действует первое переопределение.`, o.targetFactId); continue; }
      if (!byId.has(o.targetFactId)) { warn("override-target-missing", `Переопределяемого факта ${o.targetFactId} нет в паке — ссылка оставлена как есть.`, o.targetFactId); continue; }
      overrides.set(o.targetFactId, o);
    }

    const facts = [], excluded = [];
    const overridden = [], packDisabled = [], disabled = [];
    for (const f of packFacts) {
      if (f.enabled === false) { excluded.push({ id: f.id, text: f.text, reason: "pack-disabled" }); packDisabled.push(f.id); continue; }
      if (disabledIds.has(f.id)) {
        excluded.push(Object.assign({ id: f.id, text: f.text, reason: "lens-disabled" }, overrides.has(f.id) ? { overrideIgnored: overrides.get(f.id).id } : {}));
        disabled.push(f.id);
        continue;
      }
      const o = overrides.get(f.id);
      const base = { id: f.id, text: f.text, entities: f.entities || [], topics: f.topics || [], locations: f.locations || [], timeline: f.timeline || "", variant: f.variant || "", provenance: f.provenance || { kind: "manual" } };
      if (o) {
        const eff = Object.assign(base, { text: o.text, origin: "override", targetFactId: f.id, overrideId: o.id, originalText: f.text });
        for (const k of META) if (o[k] !== undefined && o[k] !== null) eff[k] = o[k]; // [] и "" — явное очищение
        if (o.note) eff.note = o.note;
        facts.push(eff);
        overridden.push({ targetFactId: f.id, overrideId: o.id });
      } else facts.push(Object.assign(base, { origin: "pack" }));
    }
    const seenAdd = new Set();
    let additions = 0;
    for (const a of useLens ? l.additions || [] : []) {
      if (!a || !a.id) { warn("addition-malformed", "Добавленный факт без id пропущен.", ""); continue; }
      if (seenAdd.has(a.id)) { warn("addition-duplicate-id", `Повторяется id добавленного факта ${a.id}: действует первый.`, a.id); continue; }
      seenAdd.add(a.id);
      // Защита от битых сохранённых данных (проверка такое сохранить не даёт): добавление с id факта пака
      // в мир не попадает, чтобы id действующих фактов оставались единственными; видно в excluded и warnings.
      if (byId.has(a.id)) {
        warn("addition-id-collides", `id добавленного факта ${a.id} совпадает с фактом пака: добавление не применено.`, a.id);
        excluded.push({ id: a.id, text: a.text, reason: "addition-id-collides" });
        continue;
      }
      if (a.enabled === false) { excluded.push({ id: a.id, text: a.text, reason: "lens-addition-disabled" }); continue; }
      facts.push({ id: a.id, text: a.text, entities: a.entities || [], topics: a.topics || [], locations: a.locations || [], timeline: a.timeline || "", variant: a.variant || "", provenance: a.provenance || { kind: "manual" }, origin: "lens" });
      additions++;
    }
    return {
      facts, excluded,
      report: {
        packId: p.id || "", lensId: useLens ? l.id || "" : "", timelineVariant: useLens ? l.timelineVariant || "" : "",
        focusEntities: useLens ? l.focusEntities || [] : [], focusTopics: useLens ? l.focusTopics || [] : [], relevanceHints: useLens ? l.relevanceHints || [] : [],
        packFacts: packFacts.length, effective: facts.length, disabled, packDisabled, overridden, additions, warnings,
      },
    };
  }

  PRP.worldResolve = { resolve };
  if (typeof module !== "undefined" && module.exports) module.exports = PRP.worldResolve;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/world/overlay.js */
/* Prism RP — наложение мира на чат (Chat World Overlay). Чистый модуль.

   Одна запись на чат: { schema, chatId, timeline, variant, entries, createdAt, updatedAt }.
   Хранятся только события наложения, а не собранный мир: действующий мир каждый раз
   собирается заново (world/canon) из пака, линзы и этих событий.

   Событие (entry) — только добавляется; старые события не переписываются:
     • assert   — новый факт чата; получает свой постоянный id факта (fact.id), цели нет;
     • override — заменяет действующее значение известного факта по его id (targetFactId);
                  получившийся факт сохраняет id цели, у события — свой id;
     • retract  — убирает известный факт (targetFactId) из мира с этого места.
   Область (scope):
     • "branch" — привязано к активной ветке (provenance: сообщения ветки и их варианты, chat/branch.anchorOf);
     • "chat"   — на весь чат, только по явному выбору; provenance = null, без подставных сообщений.
   Отсутствие привязки никогда не превращается в «на весь чат».
   Таймлайн и вариант чата (timeline, variant) — явные селекторы отбора фактов; пусто — не выбран.
   Ничего не угадывается: ни цель по тексту, ни привязка по похожим сообщениям.
   Без DOM, хранилища, сети и S. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});

  const SCHEMA = 1;
  const OPS = ["assert", "override", "retract"];
  const SCOPES = ["chat", "branch"];
  const META_LISTS = ["entities", "topics", "locations"];
  const META_STR = ["timeline", "variant"];

  const isObj = (v) => v != null && typeof v === "object" && !Array.isArray(v);
  const str = (v) => (v == null ? "" : String(v));
  const strList = (v) => (Array.isArray(v) ? v.map((x) => str(x).trim()).filter(Boolean) : []);
  const uid = (p) => p + "_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const clone = (x) => (x == null ? x : JSON.parse(JSON.stringify(x)));
  // Селекторы и метки таймлайна/варианта сравниваются только точно, после нормализации регистра и пробелов.
  const normSel = (v) => str(v).trim().replace(/\s+/g, " ").toLowerCase();

  function blank(chatId) {
    const now = Date.now();
    return { schema: SCHEMA, chatId: str(chatId), timeline: "", variant: "", entries: [], createdAt: now, updatedAt: now };
  }

  /* Канонический вид записи. События копируются как есть: битые остаются видимыми в отчёте
     и безопасно исключаются при разрешении, но не «чинятся» молча. */
  function normalize(o, chatId) {
    const x = isObj(o) ? o : {};
    return {
      schema: SCHEMA,
      chatId: str(x.chatId || chatId),
      timeline: str(x.timeline).trim(),
      variant: str(x.variant).trim(),
      entries: Array.isArray(x.entries) ? clone(x.entries) : [],
      createdAt: x.createdAt || Date.now(),
      updatedAt: x.updatedAt || Date.now(),
    };
  }

  /* Значение факта в событии. assert — полный факт со своим id. override — текст и только заданные метаданные:
     не задано/null — наследуется у цели, задано (в том числе [] или "") — заменяет (как замены линзы, W1). */
  function factPayload(op, f) {
    const o = isObj(f) ? f : {};
    if (op === "assert") {
      return { id: str(o.id).trim() || uid("wc"), text: str(o.text), entities: strList(o.entities), topics: strList(o.topics),
        locations: strList(o.locations), timeline: str(o.timeline).trim(), variant: str(o.variant).trim() };
    }
    const out = { text: str(o.text) };
    for (const k of META_LISTS) if (Array.isArray(o[k])) out[k] = strList(o[k]);
    for (const k of META_STR) if (o[k] != null) out[k] = str(o[k]).trim();
    return out;
  }

  /* Новое событие из черновика. anchor — привязка ветки (chat/branch.anchorOf) или null.
     Область не подменяется: "branch" без привязки остаётся "branch" без привязки и не пройдёт проверку. */
  function makeEntry(d) {
    const x = isObj(d) ? d : {};
    const op = str(x.op);
    const scope = str(x.scope);
    const a = isObj(x.anchor) ? x.anchor : null;
    return {
      id: str(x.id).trim() || uid("we"),
      op,
      targetFactId: op === "assert" ? null : str(x.targetFactId).trim(),
      fact: op === "retract" ? null : factPayload(op, x.fact),
      scope,
      provenance: scope === "branch" && a ? { anchorId: str(a.anchorId), messageIds: strList(a.messageIds), swipes: Object.assign({}, a.swipes || {}) } : null,
      note: str(x.note).trim(),
      createdAt: Number(x.createdAt) || Date.now(),
    };
  }

  const issue = (level, code, message, ref) => Object.assign({ level, code, message }, ref != null ? { ref: String(ref) } : {});
  const hasErrors = (xs) => (xs || []).some((x) => x.level === "error");

  /* Проверка одного события (форма). → [issue] */
  function validateEntry(e) {
    const out = [];
    if (!isObj(e)) return [issue("error", "entry-malformed", "Событие мира не является объектом.")];
    const id = str(e.id).trim();
    if (!id) out.push(issue("error", "entry-no-id", "У события мира нет id."));
    if (!OPS.includes(e.op)) out.push(issue("error", "entry-op", `Неизвестное действие: ${str(e.op) || "(пусто)"}.`, id));
    if (!SCOPES.includes(e.scope)) out.push(issue("error", "entry-scope", `Неизвестная область: ${str(e.scope) || "(пусто)"}.`, id));
    if (e.op === "assert") {
      if (e.targetFactId) out.push(issue("error", "assert-target", "Новый факт не может ссылаться на другой факт.", id));
      if (!isObj(e.fact) || !str(e.fact.id).trim()) out.push(issue("error", "assert-no-fact-id", "У нового факта нет id.", id));
    }
    if (e.op === "override" || e.op === "retract") {
      if (!str(e.targetFactId).trim()) out.push(issue("error", "entry-no-target", "Не указан факт, к которому относится действие.", id));
    }
    if (e.op === "assert" || e.op === "override") {
      if (!isObj(e.fact)) out.push(issue("error", "entry-no-fact", "Нет значения факта.", id));
      else {
        if (typeof e.fact.text !== "string" || !e.fact.text.trim()) out.push(issue("error", "entry-empty-text", "Факт без текста.", id));
        for (const k of META_LISTS) if (e.fact[k] != null && !Array.isArray(e.fact[k])) out.push(issue("error", "entry-meta", `Поле ${k} должно быть списком.`, id));
      }
    }
    if (e.op === "retract" && e.fact != null) out.push(issue("error", "retract-fact", "Убирание факта не несёт значения.", id));
    if (e.scope === "branch") {
      const p = e.provenance;
      if (!isObj(p) || !Array.isArray(p.messageIds) || !p.messageIds.length || (p.swipes != null && !isObj(p.swipes)))
        out.push(issue("error", "branch-no-provenance", "Нельзя привязать к ветке: у чата ещё нет сообщений или привязка повреждена. Выберите «весь чат» явно или напишите первое сообщение.", id));
    }
    if (e.scope === "chat" && e.provenance != null) out.push(issue("error", "chat-provenance", "Событие на весь чат не привязывается к сообщениям.", id));
    return out;
  }

  /* Проверка нового события перед сохранением: форма + цель известна (без угадывания) + id нового факта свободен.
     known: { ids: Set — id известных фактов (действующих и убранных на этой ветке) } */
  function validateNew(e, known) {
    const out = validateEntry(e);
    const ids = (known && known.ids) || new Set();
    if ((e.op === "override" || e.op === "retract") && str(e.targetFactId).trim() && !ids.has(e.targetFactId))
      out.push(issue("error", "target-unknown", `Факта ${e.targetFactId} нет в мире этого чата на этой ветке.`, e.targetFactId));
    if (e.op === "assert" && isObj(e.fact) && ids.has(e.fact.id))
      out.push(issue("error", "assert-id-collides", `id ${e.fact.id} уже занят другим фактом.`, e.fact.id));
    return out;
  }

  /* Проверка записи наложения (например, при восстановлении бэкапа). Ошибки — только для самой записи
     (без chatId её нельзя сохранить); битые события — предупреждения: они хранятся и исключаются при разрешении. */
  function validateOverlay(o) {
    if (!isObj(o)) return [issue("error", "overlay-malformed", "Наложение мира не является объектом.")];
    const out = [];
    if (!str(o.chatId).trim()) out.push(issue("error", "overlay-no-chat", "Наложение мира не привязано к чату."));
    if (o.entries != null && !Array.isArray(o.entries)) out.push(issue("error", "overlay-entries", "Поле entries должно быть списком."));
    (Array.isArray(o.entries) ? o.entries : []).forEach((e, i) => {
      for (const x of validateEntry(e)) out.push(issue("warning", x.code, `Событие №${i + 1}: ${x.message}`, x.ref));
    });
    return out;
  }

  PRP.worldOverlay = { SCHEMA, OPS, SCOPES, blank, normalize, makeEntry, factPayload, validateEntry, validateNew, validateOverlay, hasErrors, normSel };
  if (typeof module !== "undefined" && module.exports) module.exports = PRP.worldOverlay;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/world/canon.js */
/* Prism RP — канон мира чата: пак + линза + наложение чата + активная ветка → действующие факты. Чистый модуль.

   Власть (разрешение противоречий), от сильного к слабому:
     наложение активной ветки > наложение на весь чат > линза персонажа > общий пак.
   Слой W1 (пак → выключения линзы → замены линзы → добавления линзы) не меняется: на вход приходит
   готовый результат world/resolve. Поверх него:
     1. события «на весь чат» — базовый слой наложения, по порядку (createdAt, затем id);
     2. события видимой ветки — в порядке повествования: по глубине привязки на активной ветке
        (chat/branch.depthOf), при равенстве — createdAt, затем id. Время записи само порядок ветки не задаёт.
   Внутри слоя более позднее событие для той же цели побеждает; retract убирает цель;
   override убранного факта явно возвращает его (цель известна по id, reestablished: true).
   Видимость события ветки — то же правило, что у опыта (chat/branch.visibleOnPath): соседние ветки
   и другие варианты ответа хранятся, но не действуют; вернулись — мир собирается так же.
   Цели только по id; по тексту и похожим id ничего не подбирается. Битые события — в отчёте, в мир не входят.
   Отбор по таймлайну и варианту (filterSelectors) — отдельный шаг после разрешения власти.
   Входные данные не изменяются. Без DOM, хранилища, сети и S. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const BR = PRP.branch || (typeof require !== "undefined" ? require("../chat/branch.js") : null);
  const OV = PRP.worldOverlay || (typeof require !== "undefined" ? require("./overlay.js") : null);

  const clone = (x) => JSON.parse(JSON.stringify(x));
  const W1_ORIGIN = { pack: "pack", override: "lens-override", lens: "lens-addition" };
  const META_LISTS = ["entities", "topics", "locations"];
  const META_STR = ["timeline", "variant"];

  function fromBase(f) {
    const out = { id: f.id, text: f.text, entities: f.entities || [], topics: f.topics || [], locations: f.locations || [],
      timeline: f.timeline || "", variant: f.variant || "", origin: W1_ORIGIN[f.origin] || f.origin || "pack" };
    if (f.origin === "override") { out.targetFactId = f.id; out.lensOverrideId = f.overrideId; }
    if (f.provenance) out.provenance = f.provenance;
    return out;
  }

  /* base — результат world/resolve (или null — у персонажа нет мира); overlay — запись наложения этого чата (или null);
     c: { chatId, path: [{ id, swipeIdx }] }.
     → { facts, excluded, events, warnings, known: [id] } */
  function resolveChat(base, overlay, c) {
    const cx = c || {};
    const warnings = [];
    const warn = (code, message, ref) => warnings.push({ level: "warning", code, message, ref: ref == null ? "" : String(ref) });
    const order = [], cur = new Map(), retracted = new Map();
    for (const f of (base && base.facts) || []) {
      if (!f || !f.id || cur.has(f.id)) continue; // world/resolve уже даёт единственные id
      order.push(f.id); cur.set(f.id, fromBase(f));
    }
    const known = new Set(order);
    const excluded = ((base && base.excluded) || []).map((x) => Object.assign({ layer: "w1" }, x));
    for (const w of (base && base.report && base.report.warnings) || []) warnings.push(Object.assign({ layer: "w1" }, w));

    const ov = overlay ? clone(overlay) : null;
    const entries = ov && Array.isArray(ov.entries) ? ov.entries : [];
    const otherChat = ov && cx.chatId && ov.chatId && ov.chatId !== cx.chatId;
    if (otherChat) warn("overlay-other-chat", "Наложение относится к другому чату — не применено.", ov.chatId);

    const rows = [];
    const chatEv = [], branchEv = [];
    entries.forEach((e, i) => {
      const row = { index: i, id: e && e.id, op: e && e.op, scope: e && e.scope, targetFactId: e && e.targetFactId || null,
        factId: e && e.op === "assert" && e.fact ? e.fact.id : null, text: e && e.fact ? e.fact.text : "", createdAt: e && e.createdAt,
        provenance: e && e.provenance || null, active: false, applied: false, code: "", reason: "" };
      rows.push(row);
      if (otherChat) { row.code = "other-chat"; row.reason = "другой чат"; return; }
      const errs = OV.validateEntry(e).filter((x) => x.level === "error");
      if (errs.length) {
        row.code = errs.some((x) => x.code === "branch-no-provenance") ? "malformed-provenance" : "malformed";
        row.reason = errs.map((x) => x.message).join(" ");
        warn(row.code === "malformed-provenance" ? "entry-malformed-provenance" : "entry-malformed", `Событие мира ${row.id || "№" + (i + 1)} повреждено и не применяется: ${row.reason}`, row.id || i);
        return;
      }
      if (e.scope === "chat") { row.active = true; row.code = "chat"; row.reason = "на весь чат"; chatEv.push({ e, row }); return; }
      const v = BR.visibleOnPath(e.provenance, cx.path);
      row.code = v.code; row.reason = v.reason;
      if (!v.visible) return; // соседняя ветка или другой вариант: хранится, не действует
      row.active = true;
      row.depth = BR.depthOf(e.provenance, cx.path);
      branchEv.push({ e, row });
    });
    const byTime = (a, b) => ((a.e.createdAt || 0) - (b.e.createdAt || 0)) || String(a.e.id).localeCompare(String(b.e.id));
    chatEv.sort(byTime);
    branchEv.sort((a, b) => (a.row.depth - b.row.depth) || byTime(a, b));

    function apply({ e, row }) {
      const origin = e.scope === "chat" ? "chat-overlay" : "branch-overlay";
      if (e.op === "assert") {
        const id = e.fact.id;
