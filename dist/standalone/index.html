            const origin = field.origin;
            return `
            <div class="lore">
              <div class="row"><div class="field" style="flex:1">
                <label>Название поля</label><input data-custom="${i}" data-k="label" value="${esc(field.label || "")}" placeholder="Например: Речь, привычки, особые способности">
              </div><button type="button" class="btn btn-sm btn-ghost" data-act="custom-del" data-i="${i}" title="Удалить поле">Удалить</button></div>
              <div class="field"><label>Содержание</label><textarea data-custom="${i}" data-k="text" rows="3">${esc(field.text || "")}</textarea></div>
              <div class="row wrap">
                <label class="check"><input type="checkbox" data-custom="${i}" data-k="enabled" ${field.enabled ? "checked" : ""}><span>Передавать модели</span></label>
                <label class="check"><input type="checkbox" data-custom-more="${esc(field.id)}" ${detailOpen ? "checked" : ""}><span>Подробнее</span></label>
              </div>
              <div class="custom-field-extra" ${detailOpen ? "" : "hidden"}>
                <div class="field"><label for="cf-custom-mode-${i}">Когда передавать</label>
                  <select id="cf-custom-mode-${i}" data-custom="${i}" data-k="mode">
                    <option value="relevant" ${field.mode !== "always" ? "selected" : ""}>Когда относится к разговору</option>
                    <option value="always" ${field.mode === "always" ? "selected" : ""}>На каждом ходе, если позволяет бюджет</option>
                  </select></div>
                <p class="hint">Происхождение: ${origin && origin.imported ? `импортировано из ${esc(origin.format || "другого формата")}; исходное поле <code>${esc(origin.path || "неизвестно")}</code>.` : "создано пользователем."}</p>
              </div>
            </div>`;
          }).join("")}
          <button type="button" class="btn btn-sm" data-act="custom-add">+ Добавить поле</button>
        </details>`;
    } else if (section === "greet") {
      const alts = d.altGreetings || [];
      body = `${f("cf-first", "Первое сообщение", "first_mes", d.firstMes, 7, "С него начинается новый чат. В конце можно добавить строку [scene: …] с начальным местом и одеждой.")}
        <div class="block-title" style="margin-top:18px">${lab("Альтернативные приветствия", "alternate_greetings")}</div>
        <p class="hint" style="margin-top:0">В новом чате их можно листать стрелками под первым сообщением.</p>
        ${alts.map((g, i) => `<div class="field alt-greet"><label for="cf-alt-${i}">Приветствие ${i + 2}<button class="icon-btn" data-act="alt-del" data-i="${i}" title="Убрать">${icon("x")}</button></label><textarea id="cf-alt-${i}" rows="5" data-alt="${i}">${esc(g)}</textarea></div>`).join("")}
        <button class="btn btn-sm" data-act="alt-add">${icon("plus")}Добавить приветствие</button>`;
    } else if (section === "prompts") {
      body = `${f("cf-ex", "Примеры диалогов", "mes_example", d.mesExample, 8, "Как персонаж говорит. Каждый пример начинается с &lt;START&gt;, реплики — {{user}}: и {{char}}:", "<START>\n{{user}}: Привет.\n{{char}}: …")}
        <div class="block-title" style="margin-top:18px">Указания автора</div>
        <p class="hint" style="margin-top:0">Отдельный уровень власти: в модель уходят, только когда включены. Указания из импортированного файла приходят выключенными — включите их, если доверяете тексту.</p>
        ${dirField("system", "Системное указание", "system_prompt", 4, "Идёт отдельным разделом «указания автора» в начале контекста.")}
        ${dirField("postHistory", "Указание после истории", "post_history_instructions", 3, "Идёт в конец контекста, ближе всего к ответу. Общий выключатель — в настройках.")}`;
    } else if (section === "lore") {
      const posSel = (i, v) => `<select data-lore="${i}" data-k="position"><option value="before_char" ${v === "before_char" ? "selected" : ""}>Перед описанием персонажа</option><option value="after_char" ${v !== "before_char" ? "selected" : ""}>После описания персонажа</option></select>`;
      body = `<p class="lead">${lab("Лорбук персонажа", "character_book")}<br>Сведения о мире подмешиваются в контекст, когда в последних сообщениях звучат ключевые слова.</p>
        ${(d.lore || []).map((e, i) => `<div class="lore">
          <div class="row"><div class="field" style="flex:2"><label>${lab("Название", "comment")}</label><input data-lore="${i}" data-k="comment" value="${esc(e.comment || "")}" placeholder="Кафе «Луна»"></div>
            <div class="field" style="flex:1;max-width:170px"><label>${lab("Порядок", "insertion_order")}</label><input type="number" data-lore="${i}" data-k="insertion_order" value="${esc(String(e.insertion_order != null ? e.insertion_order : i))}"></div></div>
          <div class="field"><label>${lab("Ключевые слова", "keys")}</label><input data-lore="${i}" data-k="keys" value="${esc((e.keys || []).join(", "))}" placeholder="кафе, Луна"></div>
          ${e.selective ? `<div class="field"><label>${lab("Дополнительные ключи", "secondary_keys")}</label><input data-lore="${i}" data-k="secondary_keys" value="${esc((e.secondary_keys || []).join(", "))}" placeholder="вечер, свидание"><span class="help">Запись сработает, только если звучит и основной, и хотя бы один дополнительный ключ.</span></div>` : ""}
          <div class="field"><label>${lab("Содержание", "content")}</label><textarea data-lore="${i}" data-k="content" rows="3">${esc(e.content || "")}</textarea></div>
          <div class="field"><label>${lab("Позиция", "position")}</label>${posSel(i, e.position)}</div>
          <div class="checks"><label class="check"><input type="checkbox" data-lore="${i}" data-k="enabled" ${e.enabled !== false ? "checked" : ""}><span>Включено</span></label>
          <label class="check"><input type="checkbox" data-lore="${i}" data-k="constant" ${e.constant ? "checked" : ""}><span>Постоянная — всегда в контексте</span></label>
          <label class="check"><input type="checkbox" data-lore="${i}" data-k="selective" ${e.selective ? "checked" : ""}><span>Выборочная — нужны доп. ключи</span></label>
          <label class="check"><input type="checkbox" data-lore="${i}" data-k="case_sensitive" ${e.case_sensitive ? "checked" : ""}><span>С учётом регистра</span></label></div>
          <div class="row" style="justify-content:flex-end"><button class="btn btn-sm btn-ghost" data-act="lore-del" data-i="${i}">${icon("trash")}Удалить запись</button></div></div>`).join("") || `<p class="empty-note">Лорбук пуст.</p>`}
        <button class="btn btn-sm" data-act="lore-add">${icon("plus")}Добавить запись</button>`;
    } else if (section === "world") {
      body = PRP.views.lensSection(m, d);
    } else if (section === "images") {
      const im = d.image || {};
      const fi = (k, label, rows, help, ph) => `<div class="field"><label>${label}</label>${rows ? `<textarea data-ci="${k}" rows="${rows}" placeholder="${esc(ph || "")}">${esc(im[k] || "")}</textarea>` : `<input data-ci="${k}" value="${esc(im[k] != null ? im[k] : "")}" placeholder="${esc(ph || "")}">`}${help ? `<span class="help">${help}</span>` : ""}</div>`;
      const adv = im.loraAdvanced || {};
      body = `<p class="lead">Изображения: настройки для генератора, отдельно от RP-внешности персонажа.</p>
        <div class="image-settings-grid"><details class="card-disclosure" id="image-base-panel" ${state.imageBaseOpen !== false ? "open" : ""}><summary>Базовая генерация</summary>
          ${fi("look", "Внешность — теги", 3, "base: — всегда; «ключ: теги» — если ключ присутствует в сцене.", "base: brown eyes, long orange hair")}
          ${fi("wardrobe", "Гардероб", 5, "Наряды по ключам из текущей сцены, без автоматической смены одежды.", "худи | hoodie: grey hoodie")}
          ${fi("styleTrigger", "Стилевые теги", 1, "Применяются, только если сцена их упоминает.")}
          ${fi("negative", "Негатив персонажа", 1, "", "short hair")}
          ${fi("seed", "Закреплённый seed", 0, "Пусто — случайный.")}
          ${fi("nsfw", "Модификаторы по ключам сцены", 3, "Не запускаются автоматически по одежде.", "ключ: соответствующие теги")}
        </details>
        <details class="card-disclosure" id="image-lora-panel" ${state.imageLoraOpen ? "open" : ""}><summary>LoRA</summary>
          ${fi("trigger", "Основной триггер LoRA", 2, "Точное ключевое слово автора. Старые карточки с несколькими тегами остаются совместимыми.", "lilithx")}
          <div class="field"><label>Подключённые LoRA</label>${loraRows("card-lora", im.loras || [])}<span class="help">Имя файла и вес; поддерживается Forge/A1111.</span>
          <datalist id="dl-loras">${((m.imgLists || {}).loras || []).map((x) => `<option value="${esc(x)}">`).join("")}</datalist></div>
          ${fi("aliases", "Другие имена в сценах", 0, "Варианты упоминания персонажа.", "orihime, hime")}
          <label class="check"><input type="checkbox" data-lora-advanced="enabled" ${adv.enabled ? "checked" : ""}><span>Продвинутый режим — использовать дополнительные правила LoRA</span></label>
          <details class="card-disclosure lora-advanced-panel" ${adv.enabled ? "open" : ""}><summary>Расширенные параметры LoRA</summary>
            <p class="hint">Дополнительные правила активны только с галочкой. Они не заменяют основной триггер. Формат «ключ сцены: теги».</p>
            <textarea data-lora-advanced="rules" rows="5" placeholder="уши | ears: black cat ears&#10;хвост | tail: fluffy black cat tail">${esc(adv.rules || "")}</textarea>
          </details>
        </details></div>`;
    } else {
      body = `${f("cf-creator", "Создатель", "creator", d.creator, 0, "", "ваш ник")}
        ${f("cf-version", "Версия персонажа", "character_version", d.version, 0, "", "1.0")}
        ${f("cf-notes", "Заметки создателя", "creator_notes", d.creatorNotes, 4, "Для людей, не для модели: как играть, рекомендованные настройки. В контекст не идут.")}
        ${sourceBlock(d.source)}
        <div class="block-title" style="margin-top:24px">Файл карточки</div><p class="hint">Экспорт в Character Card V2/V3 — открывается в SillyTavern, RisuAI, Chub и других. Поля, которых нет в редакторе, сохраняются как были. Настройки изображений и LoRA едут внутри карточки (extensions.prism_rp).</p>
        <div class="row"><button class="btn" data-act="card-png">${icon("download")}PNG с портретом</button><button class="btn" data-act="card-json">${icon("download")}JSON</button></div>
        ${d.id ? `<div class="block-title" style="margin-top:28px">Удаление</div><p class="hint">Удалит персонажа вместе со всеми чатами и опытом.</p>
        <button class="btn btn-danger" data-act="card-del">${icon("trash")}Удалить ${esc(d.name)}</button>` : ""}`;
    }
    return `<div class="modal-wrap" data-act="modal-bg"><div class="modal card-modal" role="dialog" aria-modal="true" aria-label="Персонаж">
      <div class="modal-head"><h2>${esc(d.name || "Новый персонаж")}</h2>
        <button class="btn btn-primary btn-sm" data-act="card-save">${icon("check")}Сохранить</button>
        <button class="icon-btn" data-act="modal-close" title="Закрыть без сохранения">${icon("x")}</button></div>
      <nav class="modal-nav">${nav.map(([id, n, ic]) => `<button class="rail-item ${section === id ? "active" : ""}" data-act="card-section" data-section="${id}">${icon(ic)}${n}</button>`).join("")}</nav>
      <div class="modal-body">${body}</div></div></div>`;
  }
  /* Ядро для Prism: что модель получает о персонаже на каждом ходе. Явное ядро правится здесь;
     без него показывается запасное, собранное из полей (без модели). Остальное из карточки подаётся по ходу разговора. */
  function coreBlock(d) {
    const CC = PRP.cardContext;
    const ex = CC.normCore(d.prismCore);
    const fb = CC.core(Object.assign({}, d, { prismCore: null }));
    const state = !ex ? "Запасное — собрано из описания и личности" : ex.source === "imported" && !ex.reviewed ? "Из файла, не проверено — пока используется запасное" : "Задано явно";
    const lines = (a) => esc((a || []).join("\n"));
    const ta = (id, label, val, rows, ph, help) => `<div class="field"><label for="${id}">${label}</label><textarea id="${id}" rows="${rows}" data-core="${id}" placeholder="${esc(ph)}">${val}</textarea>${help ? `<span class="help">${help}</span>` : ""}</div>`;
    const preview = !ex || !ex.reviewed ? `<div class="core-preview"><span class="label">Сейчас Prism использует</span>
        <p class="hint"><b>Описание:</b> ${esc(fb.identity || "—")}</p><p class="hint"><b>Личность:</b> ${esc(fb.personality || "—")}</p>
        ${fb.truncated.length ? `<p class="hint">Сокращено: ${fb.truncated.map((x) => `${x.field === "description" ? "описание" : "личность"} ${x.kept} из ${x.total} симв.${x.cut === "word" || x.cut === "hard" ? " (первое предложение слишком длинное — обрезано, «…»)" : ""}`).join(", ")}. Остальное подаётся, когда относится к разговору.</p>` : ""}</div>` : "";
    return `<div class="block core-block" id="prism-core"><div class="block-title" style="margin-top:22px">Ядро для Prism <span class="tag" id="core-state">${esc(state)}</span></div>
      <p class="hint">Коротко о том, кто это: подаётся модели на каждом ходе. Прошлое, внешность и подробности описания подаются, только когда относятся к разговору. Поля карточки не меняются; модель ядро не пишет.</p>
      ${preview}
      ${ta("core-identity", "Кто это", esc(ex ? ex.identity : ""), 3, "Студентка второго курса, живёт одна в Каракуре…")}
      ${ta("core-traits", "Черты", ex ? lines(ex.traits) : "", 3, "по одной на строку", "По одной на строку.")}
      ${ta("core-voice", "Манера речи", ex ? lines(ex.voice) : "", 2, "по одной на строку")}
      ${ta("core-durable", "Устойчивое", ex ? lines(ex.durableContext) : "", 2, "постоянные обстоятельства, по одному на строку")}
      ${ex && ex.source === "imported" && !ex.reviewed ? `<label class="check"><input type="checkbox" data-core-reviewed><span>Проверено — использовать это ядро</span></label>` : ""}
      <div class="row wrap"><button class="btn btn-sm" data-act="core-derive">Собрать из карточки</button>
        ${ex ? `<button class="btn btn-sm btn-ghost" data-act="core-clear">Сбросить — собирать автоматически</button>` : ""}</div></div>`;
  }
  // Откуда карточка: формат исходника и то, что сохранено без использования. Только показ.
  function sourceBlock(s) {
    if (!s) return "";
    const FORMAT = { ccv1: "Character Card V1", ccv2: "Character Card V2", ccv3: "Character Card V3", urv2: "URV v2" };
    const pres = Object.keys(s.preserved || {}), comp = (s.compiled || []).length, unm = (s.unmapped || []).length;
    return `<div class="block-title" style="margin-top:24px">Исходник</div>
      <p class="hint">Импортировано из ${esc(FORMAT[s.format] || s.format || "файла")}${s.sourceType ? ` (${esc(String(s.sourceType).toUpperCase())})` : ""}${s.importedAt ? `, ${esc(new Date(s.importedAt).toLocaleString())}` : ""}.
      Исходный файл хранится целиком и во время игры не читается.${comp ? " Собранный промпт источника сохранён и не включается." : ""}
      ${pres.length ? `<br>Сохранено без использования: ${pres.map((k) => `<span class="spec-key">${esc(k)}</span>`).join(" ")}.` : ""}
      ${unm ? `<br>Неизвестные поля: ${s.unmapped.map((k) => `<span class="spec-key">${esc(k)}</span>`).join(" ")}.` : ""}</p>`;
  }
  Object.assign((PRP.views = PRP.views || {}), { cardModal });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/ui/views/import-review.js */
/* Prism RP — экран проверки импорта карточек.
   Показывает, что распознано и куда легло, что сохранено без использования, предупреждения и ошибки.
   Импортированные указания автора показаны отдельно, с флажками «включить» — по умолчанию сняты.
   Ничего не сохраняется, пока пользователь не нажмёт «Импортировать». */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const R = PRP.render;
  const { esc, icon } = R;

  const FORMAT = { ccv1: "Character Card V1", ccv2: "Character Card V2", ccv3: "Character Card V3", urv2: "URV v2", unknown: "не распознан" };
  const LEVEL = { error: "Ошибка", warning: "Внимание", info: "Сведения" };
  const DIR = { system: "Указание автора (системное)", postHistory: "Указание автора после истории" };

  function fieldList(d) {
    const has = (v) => !!String(v || "").trim();
    const alts = (d.altGreetings || []).length;
    const rows = [
      ["Описание", has(d.description)], ["Внешность", has(d.appearance)], ["Личность", has(d.personality)], ["Прошлое", has(d.background)],
      ["Сценарий", has(d.scenario)],
      ["Первое сообщение" + (alts ? ` + ${alts} альтернативн.` : ""), has(d.firstMes)],
      ["Примеры диалога", has(d.mesExample)],
      [`Лорбук: ${(d.lore || []).length}`, (d.lore || []).length > 0],
      ["Настройки картинок", !!(d.image && Object.keys(d.image).length)],
    ];
    return `<ul class="imp-fields">${rows.map(([n, ok]) => `<li class="${ok ? "on" : ""}">${ok ? "✓" : "—"} ${esc(n)}</li>`).join("")}</ul>`;
  }

  function directives(d, i, choice) {
    const out = [];
    for (const k of ["system", "postHistory"]) {
      const x = d.directives && d.directives[k];
      if (!x || x.origin !== "imported" || !String(x.text || "").trim()) continue;
      out.push(`<div class="imp-dir">
        <label class="check"><input type="checkbox" data-imp-dir="${i}" data-k="${k}" ${choice && choice[k] ? "checked" : ""}>
          <span><b>${DIR[k]}</b> — импортировано, выключено. Включите, только если доверяете тексту.</span></label>
        <details><summary>Текст (${x.text.length} симв.)</summary><pre class="code">${esc(x.text)}</pre></details></div>`);
    }
    return out.length ? `<div class="block-title">Указания автора</div>${out.join("")}` : "";
  }

  function sourceInfo(d) {
    const s = d.source || {};
    const parts = [];
    for (const c of s.compiled || []) {
      parts.push(`<div class="imp-note warn"><b>Собранный промпт (${esc(c.field)})</b> — дубль разложенных полей, сохранён и <b>не будет включён</b>.
        <details><summary>Показать (${c.text.length} симв.)</summary><pre class="code">${esc(c.text)}</pre></details></div>`);
    }
    const pres = Object.keys(s.preserved || {});
    if (pres.length) {
      parts.push(`<div class="imp-note">Сохранено, но не используется: ${pres.map((k) => `<span class="spec-key">${esc(k)}</span>`).join(" ")}
        <details><summary>Показать</summary><pre class="code">${esc(JSON.stringify(s.preserved, null, 2))}</pre></details></div>`);
    }
    if ((s.unmapped || []).length) parts.push(`<div class="imp-note">Неизвестные поля (хранятся в исходнике): ${s.unmapped.map((k) => `<span class="spec-key">${esc(k)}</span>`).join(" ")}</div>`);
    return parts.join("");
  }

  function item(r, i, choice) {
    const det = r.detection || {};
    const fmt = `${FORMAT[det.format] || det.format}${det.sourceType ? ` · ${det.sourceType.toUpperCase()}` : ""}`;
    const issues = (r.issues || []).filter((x) => r.ok ? x.code !== "directive-system" && x.code !== "directive-postHistory" : true);
    const list = issues.length ? `<ul class="imp-issues">${issues.map((x) => `<li class="${x.level}"><b>${LEVEL[x.level]}:</b> ${esc(x.message)}</li>`).join("")}</ul>` : "";
    if (!r.ok) {
      return `<section class="imp-item bad" data-imp-item="${i}"><h3>${icon("x")} ${esc(r.fileName || "файл")}</h3>
        <p class="hint">Формат: ${esc(fmt)}. Карточка не будет добавлена.</p>${list}</section>`;
    }
    const d = r.draft;
    return `<section class="imp-item" data-imp-item="${i}"><h3>${esc(d.name)}</h3>
      <p class="hint">${esc(r.fileName || "")} · формат: ${esc(fmt)}</p>
      ${fieldList(d)}${directives(d, i, choice)}${sourceInfo(d)}${list}</section>`;
  }

  function importReview(m, modal) {
    const items = modal.items || [];
    const n = items.filter((r) => r.ok).length;
    return `<div class="modal-wrap" data-act="modal-bg"><div class="modal narrow imp-modal" role="dialog" aria-modal="true" aria-label="Проверка импорта">
      <div class="modal-head"><h2>Проверка импорта</h2>
        <button class="icon-btn" data-act="import-cancel" title="Отмена">${icon("x")}</button></div>
      <div class="modal-body"><p class="lead">Проверьте, что распознано. Пока вы не нажмёте «Импортировать», ничего не сохраняется.</p>
        ${items.map((r, i) => item(r, i, (modal.choices || [])[i])).join("")}
        <div class="modal-foot"><button class="btn" data-act="import-cancel">Отмена</button>
          <button class="btn btn-primary" data-act="import-confirm" ${n ? "" : "disabled"}>${icon("check")}Импортировать${items.length > 1 ? ` (${n})` : ""}</button></div></div></div></div>`;
  }

  Object.assign((PRP.views = PRP.views || {}), { importReview });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/ui/views/world.js */
/* Prism RP — экраны мира: библиотека общих паков мира и раздел «Мир» в редакторе персонажа
   (линза персонажа и превью «Мир персонажа»). Только разметка: правила разрешения — в world/resolve,
   данные для превью готовит world/service. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const R = PRP.render;
  const { esc, icon } = R;

  const list = (a) => esc((a || []).join(", "));
  const PROV = (p) => (p && p.kind === "imported" ? `импорт${p.sourceFormat ? " · " + esc(p.sourceFormat) : ""}` : "вручную");

  /* ── Библиотека миров ─────────────────────────────────────────────── */
  function worldLibrary(m) {
    const packs = m.worldPacks || [];
    const d = m.worldDraft;
    const users = (id) => (m.worldLenses || []).filter((l) => l.packId === id).map((l) => (m.cards.find((c) => c.id === l.cardId) || {}).name).filter(Boolean);
    return `<div class="home"><div class="home-inner">
      <div class="home-top"><div><h1>Миры</h1>
        <p class="sub">Общие паки мира: знания о мире или фандоме, которые разделяют разные персонажи. Что у конкретного персонажа иначе — задаётся в его карточке, в разделе «Мир».</p></div>
        <div class="home-tools"><button class="btn" data-act="world-import">${icon("upload")}Импорт пака</button>
          <button class="btn btn-primary" data-act="world-new">${icon("plus")}Новый мир</button></div></div>
      <div class="world-layout">
        <div class="world-list">${packs.length ? packs.map((p) => {
          const u = users(p.id);
          return `<button class="world-item ${d && d.id === p.id ? "on" : ""}" data-act="world-open" data-id="${p.id}">
            <b>${esc(p.name || "Без названия")}</b><small>${p.facts.length} ${R.plural(p.facts.length, "факт", "факта", "фактов")}${u.length ? ` · персонажей: ${u.length}` : ""}</small></button>`;
        }).join("") : `<p class="empty-note">Паков мира пока нет.</p>`}</div>
        <div class="world-editor">${d ? packEditor(d, users(d.id)) : `<p class="hint">Выберите мир слева или создайте новый. Факт мира — утверждение о мире («Университет находится в Каракуре»), а не указание модели и не черта характера.</p>`}</div>
      </div></div></div>`;
  }

  function packEditor(d, users) {
    return `<div class="field"><label for="wp-name">Название</label><input id="wp-name" data-wp="name" value="${esc(d.name)}"></div>
      <div class="field"><label for="wp-desc">Описание</label><textarea id="wp-desc" data-wp="description" rows="2">${esc(d.description)}</textarea></div>
      <div class="block-title" style="margin-top:14px">Факты мира <small>${d.facts.length}</small></div>
      <p class="hint" style="margin-top:0">Декларативные утверждения о мире. Метки (персонажи, темы, места, хронология, вариант) пригодятся для отбора фактов на следующих этапах.</p>
      ${d.facts.map((f, i) => `<div class="lore world-fact ${f.enabled === false ? "off" : ""}" data-wf-row="${i}">
        <div class="field"><label>Факт <span class="spec-key">${esc(f.id)}</span></label><textarea data-wf="${i}" data-k="text" rows="2" placeholder="Тацуки живёт в Каракуре.">${esc(f.text)}</textarea></div>
        <div class="row wrap">
          <div class="field"><label>Персонажи, сущности</label><input data-wf="${i}" data-k="entities" value="${list(f.entities)}" placeholder="Тацуки, Орихимэ"></div>
          <div class="field"><label>Темы</label><input data-wf="${i}" data-k="topics" value="${list(f.topics)}" placeholder="дом, семья"></div>
          <div class="field"><label>Места</label><input data-wf="${i}" data-k="locations" value="${list(f.locations)}" placeholder="Каракура"></div></div>
        <div class="row wrap">
          <div class="field"><label>Хронология</label><input data-wf="${i}" data-k="timeline" value="${esc(f.timeline)}" placeholder="канон"></div>
          <div class="field"><label>Вариант</label><input data-wf="${i}" data-k="variant" value="${esc(f.variant)}" placeholder="основной"></div></div>
        <div class="row" style="justify-content:space-between"><label class="check"><input type="checkbox" data-wf="${i}" data-k="enabled" ${f.enabled !== false ? "checked" : ""}><span>Действует</span></label>
          <span class="hint" style="margin:0">Источник: ${PROV(f.provenance)}</span>
          <button class="btn btn-sm btn-ghost" data-act="world-fact-del" data-i="${i}">${icon("trash")}Удалить</button></div>
      </div>`).join("")}
      <button class="btn btn-sm" data-act="world-fact-add">${icon("plus")}Добавить факт</button>
      <div class="row" style="margin-top:20px;flex-wrap:wrap">
        <button class="btn btn-primary" data-act="world-save">${icon("check")}Сохранить мир</button>
        <button class="btn" data-act="world-export">${icon("download")}Экспорт JSON</button>
        <span class="spacer"></span>
        <button class="btn btn-danger" data-act="world-delete">${icon("trash")}Удалить мир</button></div>
      ${users.length ? `<p class="hint" style="margin-top:8px">Этот мир используют: ${esc(users.join(", "))}. Удалить его можно, только когда ни один персонаж на него не ссылается.</p>` : ""}`;
  }

  /* ── Раздел «Мир» в редакторе персонажа ───────────────────────────── */
  function lensSection(m, d) {
    if (!d.id) return `<p class="lead">Мир персонажа</p><p class="hint">Сначала сохраните персонажа — затем можно привязать его к общему паку мира.</p>`;
    const packs = m.worldPacks || [];
    const lens = m.modal && m.modal.lens;
    const pv = m.lensPreview;
    const sel = `<div class="field"><label for="lens-pack">Общий пак мира</label><select id="lens-pack" data-lens-pack>
      <option value="">— без мира —</option>${packs.map((p) => `<option value="${p.id}" ${lens && lens.packId === p.id ? "selected" : ""}>${esc(p.name || "Без названия")}</option>`).join("")}</select>
      <span class="help">Пак общий для многих персонажей; здесь хранится только то, что у ${esc(d.name || "персонажа")} иначе. Сам пак отсюда не меняется.${packs.length ? "" : " Паков пока нет — создайте их в разделе «Миры»."}</span></div>`;
    if (!lens || !lens.packId) return `<p class="lead">Мир персонажа</p>${sel}`;
    if (!pv || !pv.pack) return `<p class="lead">Мир персонажа</p>${sel}<p class="err">${icon("alert")}<span>Пак мира не найден.</span></p>`;
    const pack = pv.pack;
    const ovrByTarget = new Map((lens.overrides || []).map((o, i) => [o.targetFactId, { o, i }]));
    const factIds = new Set(pack.facts.map((f) => f.id));
    const dangling = (lens.overrides || []).map((o, i) => ({ o, i })).filter((x) => !factIds.has(x.o.targetFactId));
    const danglingDis = (lens.disabledFactIds || []).filter((id) => !factIds.has(id));
    return `<p class="lead">Мир персонажа</p>${sel}
      <div class="row wrap">
        <div class="field"><label>В фокусе: персонажи, сущности</label><input data-lens="focusEntities" value="${list(lens.focusEntities)}"></div>
        <div class="field"><label>В фокусе: темы</label><input data-lens="focusTopics" value="${list(lens.focusTopics)}"></div></div>
      <div class="row wrap">
        <div class="field"><label>Подсказки о важном</label><input data-lens="relevanceHints" value="${list(lens.relevanceHints)}" placeholder="соседи, университет"></div>
        <div class="field"><label>Хронология / вариант персонажа</label><input data-lens="timelineVariant" value="${esc(lens.timelineVariant)}" placeholder="university-au"></div></div>
      <div class="block-title" style="margin-top:14px">Факты пака «${esc(pack.name)}»</div>
      <p class="hint" style="margin-top:0">Для этого персонажа факт можно выключить или заменить своим текстом. Пак и другие персонажи это не затрагивает.</p>
      ${pack.facts.map((f) => {
        const ov = ovrByTarget.get(f.id);
        const off = (lens.disabledFactIds || []).includes(f.id);
        return `<div class="lore lens-fact ${off ? "off" : ""}">
          <div class="lf-text">${esc(f.text) || "<i>без текста</i>"} <span class="spec-key">${esc(f.id)}</span>${f.enabled === false ? ` <span class="tag">выключен в паке</span>` : ""}</div>
          <div class="row" style="flex-wrap:wrap">
            <label class="check"><input type="checkbox" data-lens-disable="${esc(f.id)}" ${off ? "checked" : ""}><span>Не действует для персонажа</span></label>
            ${ov ? "" : `<button class="btn btn-sm" data-act="lens-override-add" data-fid="${esc(f.id)}">${icon("edit")}Заменить для персонажа</button>`}</div>
          ${ov ? `<div class="field"><label>Для персонажа вместо этого</label><textarea data-lens-ovr="${ov.i}" rows="2">${esc(ov.o.text)}</textarea>
            <button class="btn btn-sm btn-ghost" data-act="lens-override-del" data-i="${ov.i}">${icon("x")}Убрать замену</button></div>` : ""}
        </div>`;
      }).join("") || `<p class="empty-note">В паке нет фактов.</p>`}
      ${dangling.length || danglingDis.length ? `<div class="block err-block">${icon("alert")}<div><b>Ссылки на факты, которых в паке нет.</b> Они сохранены как есть и не применяются; подходящий факт не подбирается по тексту.
        <ul>${dangling.map((x) => `<li>Замена факта <span class="spec-key">${esc(x.o.targetFactId)}</span>: «${esc(x.o.text)}» <button class="btn btn-sm btn-ghost" data-act="lens-override-del" data-i="${x.i}">Убрать</button></li>`).join("")}
        ${danglingDis.map((id) => `<li>Выключение факта <span class="spec-key">${esc(id)}</span> <button class="btn btn-sm btn-ghost" data-act="lens-disabled-del" data-fid="${esc(id)}">Убрать</button></li>`).join("")}</ul></div></div>` : ""}
      <div class="block-title" style="margin-top:14px">Факты только этого персонажа</div>
      ${(lens.additions || []).map((f, i) => `<div class="lore">
        <div class="field"><label>Факт <span class="spec-key">${esc(f.id)}</span></label><textarea data-lens-add="${i}" data-k="text" rows="2" placeholder="Живёт напротив {{user}}.">${esc(f.text)}</textarea></div>
        <div class="row wrap"><div class="field"><label>Персонажи, сущности</label><input data-lens-add="${i}" data-k="entities" value="${list(f.entities)}"></div>
          <div class="field"><label>Темы</label><input data-lens-add="${i}" data-k="topics" value="${list(f.topics)}"></div>
          <div class="field"><label>Места</label><input data-lens-add="${i}" data-k="locations" value="${list(f.locations)}"></div></div>
        <div class="row" style="justify-content:flex-end"><button class="btn btn-sm btn-ghost" data-act="lens-add-del" data-i="${i}">${icon("trash")}Удалить</button></div></div>`).join("")}
      <button class="btn btn-sm" data-act="lens-add">${icon("plus")}Добавить факт персонажа</button>
      ${effective(pv)}
      <div class="row" style="margin-top:16px"><button class="btn btn-ghost btn-sm" data-act="lens-clear">${icon("x")}Снять связь с миром</button></div>`;
  }

  // Превью «Мир персонажа»: что получится из пака и линзы. Только просмотр — в модель это не уходит.
  function effective(pv) {
    const ORIGIN = { pack: ["пак", ""], override: ["заменено для персонажа", "ovr"], lens: ["только у персонажа", "own"] };
    const WHY = { "pack-disabled": "выключен в паке", "lens-disabled": "не действует для персонажа", "lens-addition-disabled": "выключен", "addition-id-collides": "id совпадает с фактом пака" };
    const r = pv.report;
    const warns = (r.warnings || []).concat((pv.lensIssues || []).filter((x) => x.level === "error"));
    return `<div class="block-title" style="margin-top:22px">Мир персонажа <small>${r.effective} из ${r.packFacts} фактов пака${r.additions ? ` + ${r.additions} своих` : ""}</small></div>
      <p class="hint" style="margin-top:0">Итог: пак с учётом линзы. Только для просмотра — в контекст модели мир пока не подаётся.</p>
      <ul class="eff-world">${pv.facts.map((f) => `<li class="${ORIGIN[f.origin][1]}"><span class="tag">${ORIGIN[f.origin][0]}</span> ${esc(f.text)}${f.origin === "override" ? ` <s>${esc(f.originalText)}</s>` : ""}</li>`).join("")}
        ${pv.excluded.map((x) => `<li class="off"><span class="tag">${WHY[x.reason] || x.reason}</span> <s>${esc(x.text)}</s></li>`).join("")}</ul>
      ${warns.length ? `<ul class="imp-issues">${warns.map((w) => `<li class="${w.level}"><b>${w.level === "error" ? "Ошибка" : "Внимание"}:</b> ${esc(w.message)}</li>`).join("")}</ul>` : ""}`;
  }

  Object.assign((PRP.views = PRP.views || {}), { worldLibrary, lensSection });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/ui/views/messenger.js */
/* Prism RP — разметка переписки: окно новой переписки (настройка времени) и вкладка «Среда» панели чата.
   Только разметка: правила среды, времени и состояния переписки — в messenger/*. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const R = PRP.render, MT = PRP.messengerTime;
  const { esc, icon } = R;

  const ZONES = ["Europe/Moscow", "Europe/Kaliningrad", "Europe/Samara", "Asia/Yekaterinburg", "Asia/Novosibirsk", "Asia/Krasnoyarsk", "Asia/Irkutsk",
    "Asia/Vladivostok", "Asia/Tokyo", "Asia/Seoul", "Asia/Shanghai", "Europe/London", "Europe/Berlin", "Europe/Kyiv", "America/New_York", "America/Los_Angeles", "UTC"];
  const AVAIL = [["available", "свободен(а)"], ["busy", "занят(а)"], ["away", "не на связи"], ["unknown", "неизвестно"]];
  const availWord = (a) => (AVAIL.find((x) => x[0] === a) || AVAIL[3])[1];
  const zoneList = () => `<datalist id="tz-list">${ZONES.map((z) => `<option value="${z}">`).join("")}</datalist>`;

  // Окно новой переписки: режим выбран (переписка), задаётся только время.
  function newMessengerModal(m, modal) {
    const targetCard = ((m.cards || []).find((c) => c.id === modal.cardId)) || m.card;
    const tz = modal.timeZone || MT.systemTimeZone();
    const manual = modal.timeMode === "manual";
    if (modal.creating) return `<div class="modal-wrap"><div class="modal narrow ms-new" role="dialog" aria-modal="true"
      aria-label="Создание переписки" aria-busy="true">
      <div class="modal-head"><h2>Создаём переписку${targetCard ? " с " + esc(targetCard.name) : ""}</h2></div>
      <div class="modal-body"><div class="block" role="status" aria-live="polite">
        <p class="lead"><span class="ms-create-spin" aria-hidden="true"></span>Определяем начальное состояние персонажа…</p>
        <p class="hint">Выполняется один скрытый запрос к RP-модели. Сообщение в чат не добавляется.</p>
        <p class="hint">Окно закроется, когда переписка будет готова.</p>
      </div><div class="modal-foot"><button class="btn btn-primary" disabled aria-disabled="true">Создаём…</button></div></div>
    </div></div>`;
    return `<div class="modal-wrap" data-act="modal-bg"><div class="modal narrow ms-new" role="dialog" aria-modal="true" aria-label="Новая переписка">
      <div class="modal-head"><h2>Новая переписка${targetCard ? " с " + esc(targetCard.name) : ""}</h2>
        <button class="icon-btn" data-act="modal-close" title="Отмена">${icon("x")}</button></div>
      <div class="modal-body"><p class="lead">Переписка — отдельный мир: режим потом не меняется. Сцену с этим персонажем можно начать отдельно.</p>
        <div class="field"><label>Часовой пояс переписки</label><input id="ms-tz" list="tz-list" value="${esc(tz)}">${zoneList()}</div>
        <div class="field"><label>Время</label>
          <label class="check"><input type="radio" name="ms-mode" value="live" ${manual ? "" : "checked"}><span>Текущее<small>Сообщения получают текущее время; время между сообщениями — настоящее.</small></span></label>
          <label class="check"><input type="radio" name="ms-mode" value="manual" ${manual ? "checked" : ""}><span>Задаю сам(а)<small>Время стоит, пока вы его не сдвинете.</small></span></label></div>
        <div class="field"><label>Начальные дата и время (для «задаю сам»)</label><input id="ms-manual" type="datetime-local" value="${esc(modal.manualLocal || "")}"></div>
        <div class="modal-foot"><button class="btn" data-act="modal-close">Отмена</button>
          <button class="btn btn-primary" data-act="ms-create">${icon("bubble")}Начать переписку</button></div></div></div></div>`;
  }

  const OPS_LINE = (p) => Object.keys(p || {}).map((k) => {
    const v = p[k];
    const name = { location: "где", activity: "чем занят(а)", nearby: "рядом", ongoing: "происходит", availability: "доступность", visualWear: "одежда", visualPose: "поза", visualHair: "причёска" }[k] || k;
    if (v == null || (Array.isArray(v) && !v.length)) return name + ": очищено";
    return name + ": " + (k === "availability" ? availWord(v) : Array.isArray(v) ? v.join(", ") : v);
  }).join(" · ");

  // Вкладка «Среда» (только у переписки).
  function envTab(m) {
    const v = m.messengerView;
    if (!v) return `<p class="empty-note">Откройте переписку.</p>`;
    const env = v.env, w = v.world, c = v.conversation, tz = env.timeZone;
    const d = m.envEdit;
    const scopeRadios = (name, cur) => `<label class="check"><input type="radio" name="${name}" value="branch" ${cur === "branch" ? "checked" : ""} ${v.canBranch ? "" : "disabled"}><span>В этой ветке${v.canBranch ? "" : "<small>Пока нет сообщений — привязать не к чему.</small>"}</span></label>
      <label class="check"><input type="radio" name="${name}" value="chat" ${cur === "chat" ? "checked" : ""}><span>Во всей переписке</span></label>`;
    const fld = (k, label, val, ph) => `<div class="field"><label>${label}</label><input id="env-${k}" value="${esc(val)}" placeholder="${esc(ph)}">
      <label class="check sm"><input type="checkbox" data-env-clear="${k}"><span>очистить</span></label></div>`;
    const form = d ? `<div class="block env-edit"><div class="block-title">Изменить положение</div>
        <p class="hint">Пустое поле — не менять. «Очистить» — сделать неизвестным.</p>
        ${fld("location", "Где", "", w.location || "")}${fld("activity", "Чем занят(а)", "", w.activity || "")}
        ${fld("nearby", "Рядом (через запятую)", "", (w.nearby || []).join(", "))}${fld("ongoing", "Происходит (через запятую)", "", (w.ongoing || []).join(", "))}
        <div class="block-title" style="margin-top:16px">Внешний вид для изображений</div>
        <p class="hint">Только исправление неверно определённого факта. Повседневное состояние отслеживается автоматически; изображения его не переписывают.</p>
        ${fld("visualWear", "Одежда (через запятую)", "", (w.visualWear || []).join(", "))}${fld("visualPose", "Поза", "", w.visualPose || "")}${fld("visualHair", "Причёска", "", w.visualHair || "")}
        <div class="field"><label>Доступность</label><select id="env-availability"><option value="">не менять</option>${AVAIL.map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select></div>
        <div class="field"><label>Где действует</label>${scopeRadios("env-scope", d.scope)}</div>
        <div class="row"><button class="btn btn-primary btn-sm" data-act="env-save">Сохранить</button><button class="btn btn-sm btn-ghost" data-act="env-cancel">Отмена</button></div></div>` : "";
    const evs = v.events.slice().reverse().map((e) => {
      const ev = (env.events || []).find((x) => x.id === e.id) || {};
      return `<li class="${e.active ? "" : "off"}"><div>${esc(OPS_LINE(ev.patch))}</div>
        <div class="mt"><span class="tag">${e.scope === "chat" ? "вся переписка" : "ветка"}</span>${ev.effectiveAt ? `<span class="tag">${esc(MT.format(MT.toMs(ev.effectiveAt), tz))}</span>` : ""}<span class="tag">${e.active ? "действует" : esc(e.reason || "не действует")}</span></div></li>`;
    }).join("");
    const rows = (items) => items.filter(([,value]) => value != null && value !== "" && value !== "unknown").map(([label,value]) => `<dt>${esc(label)}</dt><dd>${esc(value)}</dd>`).join("");
    const position = rows([["Где", w.location], ["Чем занят(а)", w.activity],
      ["Рядом", (w.nearby || []).join(", ")], ["Происходит", (w.ongoing || []).join(", ")],
      ["Доступность", w.availability && w.availability !== "unknown" ? availWord(w.availability) : ""]]);
    const appearance = rows([["Одежда", (w.visualWear || []).join(", ")], ["Поза", w.visualPose], ["Причёска", w.visualHair]]);
    return `<div class="block"><div class="block-title">Положение ${esc(m.card.name)}</div>
        ${position ? `<dl class="kv env-world">${position}</dl>` : '<p class="empty-note">Пока нет сведений о положении.</p>'}
        ${appearance ? `<div class="block-title" style="margin-top:20px">Внешний вид</div><dl class="kv env-world">${appearance}</dl>` : ""}
        ${d ? "" : `<button class="btn btn-sm btn-ghost" style="margin-top:14px" data-act="env-edit">${icon("edit")}Исправить состояние</button>`}</div>
      ${form}
`;
  }

  // Отдельное окно управления временем переписки: не перегружает «Среду».
  function messengerTimeModal(m) {
    const v = m.messengerView;
    if (!v) return "";
    const env = v.env, tz = env.timeZone;
    return `<div class="modal-wrap" data-act="modal-bg"><div class="modal narrow" role="dialog" aria-modal="true" aria-label="Время переписки">
      <div class="modal-head"><h2>Время переписки</h2><button class="icon-btn" data-act="modal-close" title="Закрыть">${icon("x")}</button></div>
      <div class="modal-body">
              <div class="block"><div class="block-title">Текущее время</div>
                <dl class="kv"><dt>Сейчас</dt><dd id="env-now">${v.now != null ? esc(MT.format(v.now, tz)) : "не задано"}</dd>
                  </dl>
                <div class="field"><label>Часовой пояс</label><input id="env-tz" list="tz-list" value="${esc(tz)}">${zoneList()}</div>
                <div class="field"><label>Время</label>
                  <label class="check"><input type="radio" name="env-mode" value="live" ${env.timeMode === "live" ? "checked" : ""}><span>Текущее</span></label>
                  <label class="check"><input type="radio" name="env-mode" value="manual" ${env.timeMode === "manual" ? "checked" : ""}><span>Задаю сам(а)</span></label></div>
                ${env.timeMode === "manual" ? `<div class="field"><label>Сейчас в переписке</label><input id="env-manual" type="datetime-local" value="${esc(MT.toLocalInput(MT.toMs(env.manualNow), tz))}"></div>
                  <div class="quick">${[[15, "+15 мин"], [60, "+1 час"], [180, "+3 часа"], [1440, "+1 день"]].map(([n, l]) => `<button class="btn btn-sm btn-ghost" data-act="env-advance" data-min="${n}">${icon("clock")}${l}</button>`).join("")}</div>` : ""}
                <button class="btn btn-sm" data-act="env-time-save">Применить</button>
                <p class="hint">Метки времени уже отправленных сообщений не меняются.</p></div>
      </div></div></div>`;
  }

  // Строка статуса в шапке переписки — из среды (не из сцены RP).
  function messengerStatus(world) {
    if (!world) return "";
    return [world.availability && world.availability !== "unknown" ? availWord(world.availability) : "", world.location, world.activity].filter(Boolean).join(" · ");
  }

  Object.assign((PRP.views = PRP.views || {}), { newMessengerModal, messengerTimeModal, envTab, messengerStatus });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/ui/views/assist.js */
/* Prism RP — экран ассистента (разговор с моделью вне игры) и его поповеры. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const R = PRP.render, SC = PRP.scene, TR = PRP.tree, OA = PRP.openai;
  const { esc, icon } = R;
  const { SAMPLER_PRESETS, THEMES, WEATHER, loraRows } = PRP.viewKit;

  /* ── Ассистент: разговор с моделью вне игры ───────────────────────── */
  function assist(m) {
    const a = m.assist;
    const AS = PRP.assist;
    const cd = m.assistCard, ch = m.assistChat;
    const ctxLabel = cd ? `${esc(cd.name)}${ch ? " + чат" : ""}` : "Без персонажа";
    const head = `<header class="chat-head assist-head">
      <button class="icon-btn only-narrow" data-act="rail" title="Меню">${icon("menu")}</button>
      <div class="assist-mark">${icon("assist")}</div>
      <div class="head-who"><div class="head-name">Ассистент</div><span class="head-scene">${esc(a.messages.length ? a.title : "Разговор с моделью вне игры")}</span></div>
      <div class="head-tools">
        <button class="pill" data-act="assist-ctx" title="Что ассистент видит: карточку персонажа и выдержку из чата">${cd ? R.avatar(cd, 18) : icon("card")}<span>${ctxLabel}</span></button>
        <button class="icon-btn" data-act="assist-list" title="Все разговоры">${icon("clock")}</button>
        <button class="icon-btn" data-act="assist-new" title="Новый разговор">${icon("plus")}</button>
        ${a.messages.length ? `<button class="icon-btn" data-act="assist-del" title="Удалить разговор">${icon("trash")}</button>` : ""}
      </div></header>`;
    const empty = !a.messages.length ? `<div class="assist-empty">
        <div class="assist-hero">${icon("assist")}</div>
        <h2>О чём поговорим?</h2>
        <p>Здесь модель — ваш помощник, а не персонаж. Спросите совета по карточке, сцене или настройкам. ${cd ? `Ассистент видит карточку ${esc(cd.name)}${ch ? " и выдержку из выбранного чата" : ""}.` : "Подключите персонажа кнопкой вверху — тогда ассистент увидит его карточку и, по желанию, чат."}</p>
        <div class="starters">${AS.starters(!!cd, !!ch).map((x) => `<button class="starter" data-act="assist-starter" data-q="${esc(x.q)}">${esc(x.t)}</button>`).join("")}</div>
      </div>` : "";
    const feed = a.messages.map((msg, i) => {
      const live = m.gen && m.gen.assist && m.gen.msgId === msg.id;
      const last = i === a.messages.length - 1;
      const text = live ? m.gen.raw : msg.text;
      const th = OA.splitThink(text || "");
      const reasoning = live ? (m.gen.reasoning || th.reasoning) : msg.reasoning;
      const body = msg.role === "user" ? `<div class="bubble-plain">${esc(msg.text).replace(/\n/g, "<br>")}</div>`
        : `${reasoning ? `<details class="think"><summary>${icon("think")}Рассуждение модели</summary><div>${esc(reasoning)}</div></details>` : ""}<div class="md ${live ? "cursor" : ""}" id="text-${msg.id}">${R.md(th.text)}</div>`;
      return `<article class="aturn ${msg.role} ${last ? "last" : ""}" data-mid="${msg.id}">
        ${body}
        ${msg.error ? `<div class="err">${icon("alert")}<span>${esc(msg.error)}</span></div>` : ""}
        ${live ? "" : `<div class="tools">
          <button class="tool" data-act="assist-copy" data-id="${msg.id}">${icon("copy")}Скопировать</button>
          ${msg.role === "assistant" && last ? `<button class="tool" data-act="assist-regen" data-id="${msg.id}">${icon("regen")}Другой ответ</button>` : ""}
          ${msg.role === "user" ? `<button class="tool" data-act="assist-edit" data-id="${msg.id}" title="Вернуть в поле ввода и переспросить">${icon("edit")}Изменить</button>` : ""}
          <button class="tool" data-act="assist-msg-del" data-id="${msg.id}" title="Удалить это и всё после">${icon("trash")}</button></div>`}
      </article>`;
    }).join("");
    const p = m.provider;
    const composer = `<div class="composer-wrap"><div class="composer">
      <textarea id="input" rows="1" placeholder="Спросите ассистента…" aria-label="Сообщение ассистенту"></textarea>
      <div class="composer-bar">
        <button class="pill" data-act="model-pop" title="Модель">${icon("cpu")}<span>${esc(p ? p.label : "Выбрать модель")}</span></button>
        <span class="spacer"></span>
        ${m.gen ? `<button class="send stop" data-act="stop" title="Остановить">${icon("stop")}</button>` : `<button class="send" data-act="send" title="Отправить (Enter)">${icon("send")}</button>`}
      </div></div></div>`;
    return `<section class="chat assist">${head}<div class="feed" id="feed"><div class="feed-inner" id="feed-inner">${empty}${feed}</div></div>${composer}</section>`;
  }

  function assistCtxPop(m) {
    const cd = m.assistCard;
    const chats = cd ? m.chats.filter((c) => c.cardId === cd.id).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, 12) : [];
    return `<div class="pop-title">Персонаж для разговора</div>
      <button class="pop-item ${!cd ? "on" : ""}" data-act="assist-pick-card" data-id="">${icon("x")}<span>Без персонажа</span></button>
      ${m.cards.map((c) => `<button class="pop-item ${cd && cd.id === c.id ? "on" : ""}" data-act="assist-pick-card" data-id="${c.id}">${R.avatar(c, 22)}<span>${esc(c.name)}</span></button>`).join("")}
      ${cd ? `<div class="pop-sep"></div><div class="pop-title">Показать ассистенту чат</div>
        <button class="pop-item ${!m.assistChat ? "on" : ""}" data-act="assist-pick-chat" data-id="">${icon("x")}<span>Не показывать</span></button>
        ${chats.map((c) => `<button class="pop-item ${m.assistChat && m.assistChat.id === c.id ? "on" : ""}" data-act="assist-pick-chat" data-id="${c.id}">${icon(c.mode === "messenger" ? "bubble" : "book")}<span><span>${esc(c.title || (c.mode === "messenger" ? "Переписка" : "Сцена"))}</span><small>${esc(R.ago(c.updatedAt))}${c.preview ? " · " + esc(c.preview.slice(0, 40)) : ""}</small></span></button>`).join("") || `<p class="hint" style="padding:4px 10px">У персонажа пока нет чатов.</p>`}` : ""}`;
  }

  function assistListPop(m) {
    const list = (m.assistList || []).slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    return `<div class="pop-title">Разговоры с ассистентом</div>
      <button class="pop-item" data-act="assist-new">${icon("plus")}<span>Новый разговор</span></button>
      ${list.length ? `<div class="pop-sep"></div>` : ""}
      ${list.map((a) => `<button class="pop-item ${m.assist && m.assist.id === a.id ? "on" : ""}" data-act="assist-open" data-id="${a.id}">${icon("assist")}<span><span>${esc(a.title)}</span><small>${esc(R.ago(a.updatedAt))} · ${a.messages.length} ${R.plural(a.messages.length, "сообщение", "сообщения", "сообщений")}</small></span></button>`).join("")}`;
  }

  Object.assign((PRP.views = PRP.views || {}), { assist, assistCtxPop, assistListPop });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/chat/service.js */
/* Prism RP — сервис чата (прикладной уровень).
   Жизненный цикл чата и его сообщений: загрузка, создание с приветствием, правка,
   варианты, удаление ветки и чата, ручные изменения сцены, сохранение.
   Алгоритмы дерева — в chat/tree.js, свёртка сцены — в prism/scene.js; здесь только
   их применение к текущему чату и сохранение через хранилище.
   Зависимости передаются в create(ctx): состояние сессии S, хранилище DB, геттеры. DOM не трогает. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const U = PRP.util, TR = PRP.tree, SC = PRP.scene;

  function create(ctx) {
    const { S, DB } = ctx;

    /* ── Путь и сцена активной ветки ───────────────────────────────────── */
    function path() {
      const c = ctx.chat();
      return c ? TR.path(TR.index(S.messages), c.leafId) : [];
    }
    /* Сцена RP активной ветки. У переписки сцены нет (FOUNDATION-H): пустое состояние — служебные строки
       [scene:] в переписке (в том числе старые, сохранённые до разделения режимов) сцену не создают
       и не попадают ни в Prism, ни в картинки, ни в ассистента. */
    function sceneState(p) {
      const c = ctx.chat();
      if (c && c.mode === "messenger") return SC.fold("", []);
      return SC.fold(c ? c.sceneInit : "", (p || path()).map((m) => ({ msgId: m.id, role: m.role, ops: TR.activeSwipe(m).sceneOps || [] })), {
        charName: ctx.card() && ctx.card().name, userName: ctx.persona() && ctx.persona().name,
      });
    }
    /* Служебная строка [scene:] из текста ответа: в сцене — операции сцены; в переписке — вырезается из текста,
       а операции хранятся в варианте только как неактивные (ignoredSceneOps, для совместимости и отладки). */
    function sceneFields(ops) {
      const c = ctx.chat();
      return c && c.mode === "messenger" ? { sceneOps: [], ignoredSceneOps: ops || [] } : { sceneOps: ops || [] };
    }
    // Путь в виде, который понимают модули Prism: [{id, swipeIdx}].
    function pathCtx(p) { return (p || path()).map((m) => ({ id: m.id, swipeIdx: m.swipeIdx || 0 })); }

    /* ── Сохранение ────────────────────────────────────────────────────── */
    async function putMsg(m) {
      await DB.put("messages", m);
      const i = S.messages.findIndex((x) => x.id === m.id);
      if (i >= 0) S.messages[i] = m; else S.messages.push(m);
    }
    async function putChat(c) {
      await DB.put("chats", c);
      const i = S.chats.findIndex((x) => x.id === c.id);
      if (i >= 0) S.chats[i] = c; else S.chats.push(c);
    }
    // Обновить превью чата по последнему сообщению активной ветки и сохранить.
    async function touch() {
      const c = ctx.chat();
      if (!c) return;
      const last = path().slice(-1)[0];
      const t = last ? TR.activeSwipe(last).text : "";
      c.preview = (last && last.role === "user" ? "Вы: " : "") + t.replace(/\s+/g, " ").slice(0, 90);
      await putChat(c);
    }
    /* Атомарная запись сообщения и состояния чата (leafId, превью) — ОДНОЙ транзакцией (DB.putAll).
       Память (S.messages, текущий чат) меняется только после успеха; при отказе не меняется ничего — ни в базе, ни в памяти.
       msg — полная новая версия сообщения (вызывающий передаёт копию; объект в памяти обновляется на месте).
       leafId — новый конец ветки (undefined — прежний). → сообщение в памяти. */
    async function commitMessage(msg, leafId) {
      const c = ctx.chat();
      const m = JSON.parse(JSON.stringify(msg));
      const next = JSON.parse(JSON.stringify(c));
      if (leafId !== undefined) next.leafId = leafId;
      const p = TR.path(TR.index(S.messages.filter((x) => x.id !== m.id).concat([m])), next.leafId);
      const last = p.slice(-1)[0];
      next.preview = (last && last.role === "user" ? "Вы: " : "") + (last ? TR.activeSwipe(last).text : "").replace(/\s+/g, " ").slice(0, 90);
      await DB.putAll([["messages", m], ["chats", next]]);
      const i = S.messages.findIndex((x) => x.id === m.id);
      if (i >= 0) { for (const k of Object.keys(S.messages[i])) if (!(k in m)) delete S.messages[i][k]; Object.assign(S.messages[i], m); }
      else S.messages.push(m);
      Object.assign(c, next);
      return i >= 0 ? S.messages[i] : m;
    }
    function newMsg(role, parentId, text) {
      const now = Date.now();
      return { id: U.uid("m"), chatId: S.chatId, parentId: parentId || null, role, swipes: [{ text: text || "", sceneOps: [], createdAt: now }], swipeIdx: 0, createdAt: now };
    }

    /* ── Жизненный цикл ────────────────────────────────────────────────── */
    function loadMessages(chatId) { return DB.byIndex("messages", "chatId", chatId); }

    /* Новый чат. Режим «Сцена»: первое сообщение карточки и альтернативные приветствия — авторское
       начало, варианты одного корневого сообщения (без вызова модели; [scene:] разбирается как обычно).
       Без первого сообщения чат создаётся пустым: ни заглушек, ни пустых узлов, leafId = null —
       начать может пользователь или, по явному действию, модель (generation/service, режим opening).
       Сценарий карточки в сцену не переносится. Делает чат текущим и возвращает его id. */
    // Режим задаётся только здесь и дальше не меняется: сцена остаётся сценой, переписка — перепиской.
    async function createChat(mode, cardId) {
      const cd = S.cards.find((x) => x.id === (cardId || S.cardId));
      if (!cd) return null;
      const c = { id: U.uid("chat"), cardId: cd.id, mode, title: mode === "messenger" ? "Переписка" : "Сцена", sceneInit: "", leafId: null, createdAt: Date.now() };
      S.chatId = c.id; S.cardId = cd.id; S.messages = [];
      if (mode === "rp" && (cd.firstMes || (cd.altGreetings || []).length)) {
        const vars = { char: cd.name, user: ctx.persona().name };
        const m = newMsg("assistant", null, "");
        m.opening = "authored";
        m.swipes = [cd.firstMes].concat(cd.altGreetings || []).filter(Boolean).map((g) => {
          const parsed = SC.parse(U.macros(g, vars));
          return { text: parsed.text, sceneOps: parsed.ops, createdAt: Date.now() };
        });
        await putMsg(m);
        c.leafId = m.id;
        c.preview = m.swipes[0].text.replace(/\s+/g, " ").slice(0, 90);
      }
      await putChat(c);
      return c.id;
    }
    function latestForCard(cardId) {
      return S.chats.filter((c) => c.cardId === cardId).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0] || null;
    }
    // Удалить чат целиком: сообщения, картинки, опыт, наложение мира и среду переписки этого чата. Состояние сбрасывается на «нет чата».
    async function deleteChat(c) {
      const ms = await DB.byIndex("messages", "chatId", c.id);
      await DB.delMany("experience", (await DB.byIndex("experience", "owner", c.cardId)).filter((x) => x.chatId === c.id).map((x) => x.id));
      await DB.delMany("messages", ms.map((m) => m.id));
      await DB.delMany("images", (await DB.byIndex("images", "chatId", c.id)).map((x) => x.id));
      await DB.del("worldOverlays", c.id);
      if (S.worldOverlay && S.worldOverlay.chatId === c.id) S.worldOverlay = null;
      await DB.del("messengerEnvironments", c.id);
      if (S.messengerEnv && S.messengerEnv.chatId === c.id) S.messengerEnv = null;
      await DB.del("chats", c.id);
      S.chats = S.chats.filter((x) => x.id !== c.id);
      S.chatId = null; S.messages = [];
    }

    /* ── Правки ветки ──────────────────────────────────────────────────── */
    // Удалить сообщение и всех его потомков; активной становится последняя оставшаяся ветка.
    async function deleteFrom(msgId) {
      const m = S.messages.find((x) => x.id === msgId);
      if (!m) return false;
      const ids = [msgId].concat(TR.descendants(S.messages, msgId));
      const imgIds = [];
      S.messages.filter((x) => ids.includes(x.id)).forEach((x) => x.swipes.forEach((sw) => (sw.images || []).forEach((im) => imgIds.push(im.id))));
      await DB.delMany("images", imgIds);
      await DB.delMany("messages", ids);
      S.messages = S.messages.filter((x) => !ids.includes(x.id));
      const c = ctx.chat();
      const lastRoot = TR.children(S.messages, null).slice(-1)[0];
      c.leafId = m.parentId ? TR.latestLeaf(S.messages, m.parentId) : lastRoot ? TR.latestLeaf(S.messages, lastRoot.id) : null;
      await touch();
      return true;
    }
    async function saveEdit(msgId, text) {
      const m = S.messages.find((x) => x.id === msgId);
      if (!m) return false;
      const sw = TR.activeSwipe(m);
      const parsed = SC.parse(text);
      sw.text = m.role === "assistant" ? parsed.text : text.trim();
      if (m.role === "assistant") {
        // Правка текста переопределяет модельные дельты, но ручные корректировки
        // принадлежат пользователю и продолжают действовать ПОСЛЕ них.
        const manual = (sw.sceneOps || []).filter((o) => o.manual);
        delete sw.ignoredSceneOps;
        Object.assign(sw, sceneFields(parsed.ops.concat(manual)));
      }
      // Извлечённые факты зависят от исходного текста этого свайпа.
      // Изменение текста делает их недействительными до нового анализа.
      delete sw.stateEvents; delete sw.stateStatus;
      await putMsg(m);
      await touch();
      return true;
    }
    /* Листать варианты ответа. → "regen", если надо сгенерировать новый вариант
       (листание вправо за последний вариант последнего ответа); true — переключено; false — ничего. */
    async function swipe(msgId, dir) {
      const m = S.messages.find((x) => x.id === msgId);
      if (!m) return false;
      const next = (m.swipeIdx || 0) + dir;
      if (next < 0) return false;
      const isLast = path().slice(-1)[0] === m;
      if (next >= m.swipes.length) return m.role === "assistant" && isLast ? "regen" : false;
      m.swipeIdx = next;
      await putMsg(m);
      await touch();
      return true;
    }
    /* Добавить пользовательский ответ в ветку: становится новым концом.
       swipeExtra — неизменяемые сведения варианта, например метка времени переписки { messengerAt } (её даёт messenger/service). */
    async function addUserMessage(text, swipeExtra) {
      const c = ctx.chat();
      const m = newMsg("user", c.leafId, text);
      if (swipeExtra) Object.assign(m.swipes[0], swipeExtra);
      await putMsg(m);
      c.leafId = m.id;
      await touch();
      return m;
    }

    /* ── Сцена из форм ─────────────────────────────────────────────────── */
    function op(subject, key, value) {
      return { subject: subject || undefined, key, value, raw: `${subject ? subject + "." : ""}${key}=${value}`, manual: true };
    }
    // Ручные изменения сцены пишутся в последнее сообщение ветки (или в начальную сцену пустого чата).
    async function applySceneOps(ops) {
      if (!ops.length) return false;
      const c = ctx.chat();
      if (!c || c.mode === "messenger") return false; // у переписки сцены нет
      // Ручное изменение не записывается, если оно не может подействовать
      // (например, +15 минут при ещё неизвестном времени суток).
      const preview = SC.apply(sceneState(), ops, { charName: ctx.card() && ctx.card().name, userName: ctx.persona() && ctx.persona().name });
      if (preview.ignored.length || preview.applied.length !== ops.length) return false;
      const leaf = path().slice(-1)[0];
      if (leaf) {
        const sw = TR.activeSwipe(leaf);
        sw.sceneOps = (sw.sceneOps || []).concat(ops);
        await putMsg(leaf);
      } else {
        c.sceneInit = [c.sceneInit, ops.map((o) => o.raw).join("; ")].filter(Boolean).join("; ");
        await putChat(c);
      }
      return true;
    }

    /* ── Бэкап ─────────────────────────────────────────────────────────── */
    /* Восстановление ДОБАВЛЕНИЕМ: локальный чат главнее входящего с тем же id в вопросе режима (режим фиксирован).
       Входящий чат с тем же id, но другим режимом отклоняется до записи вместе со всем, что к нему привязано
       (сообщения, картинки, опыт, наложение мира, среда переписки): иначе чужие сообщения попали бы в местный чат
       или режим переключился бы молча. При замене локальных чатов не остаётся — конфликтов нет.
       opts: { replace, existingChats: [{ id, mode }] } → { data, rejected, issues } */
    const CHAT_BOUND = [["messages", "chatId"], ["images", "chatId"], ["experience", "chatId"], ["worldOverlays", "chatId"], ["messengerEnvironments", "chatId"]];
    function checkBackupChats(data, opts) {
      const o = opts || {};
      if (!data || o.replace !== false || !Array.isArray(data.chats)) return { data, rejected: 0, issues: [] };
      const local = new Map((o.existingChats || []).filter((c) => c && c.id).map((c) => [String(c.id), c.mode || "rp"]));
      const conflict = new Set(), issues = [];
      for (const c of data.chats) {
        if (!c || !c.id || !local.has(String(c.id))) continue;
        const incoming = c.mode || "rp", here = local.get(String(c.id));
        if (incoming !== here) {
          conflict.add(String(c.id));
          issues.push({ level: "error", code: "chat-mode-conflict", message: `Чат в бэкапе — ${incoming === "messenger" ? "переписка" : "сцена"}, а здесь с тем же id — ${here === "messenger" ? "переписка" : "сцена"}: режим не меняется, чат из бэкапа не восстановлен.`, chatId: String(c.id) });
        }
      }
      if (!conflict.size) return { data, rejected: 0, issues };
      const out = Object.assign({}, data, { chats: data.chats.filter((c) => !(c && conflict.has(String(c.id)))) });
      for (const [store, key] of CHAT_BOUND) if (Array.isArray(data[store])) out[store] = data[store].filter((x) => !(x && conflict.has(String(x[key]))));
      return { data: out, rejected: conflict.size, issues };
    }

    /* ── Прочее ────────────────────────────────────────────────────────── */
    function exportText() {
      const c = ctx.chat(), cd = ctx.card();
      const lines = path().map((m) => `${m.role === "user" ? ctx.persona().name : cd.name}: ${TR.activeSwipe(m).text}`);
      return { name: `${cd.name} — ${c.title || "чат"}.txt`, text: lines.join("\n\n") };
    }

    return { path, sceneState, sceneFields, pathCtx, putMsg, putChat, touch, commitMessage, newMsg, loadMessages, createChat, latestForCard, deleteChat, deleteFrom, saveEdit, swipe, addUserMessage, op, applySceneOps, exportText, checkBackupChats };
  }

  PRP.chatService = { create };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/prism/experience-service.js */
/* Prism RP — сервис опыта (прикладной уровень).
   Загрузка опыта персонажа, однократная миграция старых записей, черновики,
   сохранение, удаление и ручная привязка к чату.
   Правила видимости, отбора и миграции — чистые функции prism/experience.js;
   здесь только их применение к текущему чату и работа с хранилищем. DOM не трогает. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const U = PRP.util, EX = PRP.experience, SC = PRP.scene;

  function create(ctx) {
    const { S, DB } = ctx;
    const chat = () => ctx.svc.chat;

    // Все записи персонажа (по владельцу); видимость в чате и ветке решает EX.visibility.
    function loadForCard(cardId) { return DB.byIndex("experience", "owner", cardId); }

    // Миграция: привязка к чату без догадок (EX.migrate). Идемпотентна; пишет только изменённые записи.
    async function migrate() {
      const all = await DB.all("experience");
      const need = all.filter((r) => !r.chatId && !(r.source && r.source.chatId) && r.source && (r.source.messageIds || []).length);
      const msgChat = new Map();
      for (const r of need) for (const id of r.source.messageIds) {
        if (msgChat.has(id)) continue;
        const msg = await DB.get("messages", id);
        msgChat.set(id, msg ? msg.chatId : null);
      }
      const res = EX.migrate(all, { messageChat: (id) => (msgChat.has(id) ? msgChat.get(id) : null) });
      const changed = res.records.filter((r) => res.changed.includes(r.id));
      if (changed.length) await DB.putMany("experience", changed);
      S.legacyExperience = res.legacy;
      return res;
    }

    // Что показывать во вкладке «Опыт»: видимое в этой ветке, скрытое в других ветках, непривязанное.
    function view(p) {
      const vctx = { chatId: S.chatId, path: chat().pathCtx(p) };
      const inChat = S.experience.filter((r) => r.chatId === S.chatId && !r.legacyUnscoped);
      const visible = inChat.filter((r) => EX.visibility(r, vctx).visible);
      return { visible, hiddenInChat: inChat.length - visible.length, legacy: S.experience.filter((r) => EX.scopeOf(r) === "legacy") };
    }
    function legacyCount() { return S.experience.filter((r) => EX.scopeOf(r) === "legacy").length; }

    // Пустой черновик ручной записи (на весь чат).
    function blankDraft() { return Object.assign(EX.blank(S.cardId, S.chatId), { about: ["user"] }); }
    // Черновик из сообщения: привязка к сообщению и его варианту, время сцены на тот момент.
    function draftFromMessage(msgId) {
      const p = chat().path();
      const idx = p.findIndex((m) => m.id === msgId);
      const st = chat().sceneState(p.slice(0, idx + 1));
      const d = EX.blank(S.cardId, S.chatId);
      d.about = ["user"];
      const msg = p[idx];
      d.source = { chatId: S.chatId, messageIds: [msgId], swipes: { [msgId]: (msg && msg.swipeIdx) || 0 }, sceneTime: st.clock.m != null || st.clock.min != null ? SC.formatClock(st.clock) : "" };
      return d;
    }

    // Сохранить черновик. → строка ошибки для пользователя или null.
    async function save(d) {
      d.event = d.event.trim();
      if (!d.event) return "Опишите, что произошло.";
      if (!d.id) d.id = U.uid("x");
      d.owner = S.cardId;
      // Новая запись всегда принадлежит текущему чату; непривязанные старые не трогаем.
      if (!d.chatId && !d.legacyUnscoped) { d.chatId = S.chatId; d.source = Object.assign({ messageIds: [] }, d.source, { chatId: S.chatId }); }
      await DB.put("experience", d);
      const i = S.experience.findIndex((x) => x.id === d.id);
      if (i >= 0) S.experience[i] = d; else S.experience.push(d);
      return null;
    }
    async function remove(id) {
      await DB.del("experience", id);
      S.experience = S.experience.filter((x) => x.id !== id);
    }
    // Ручная привязка непривязанной записи к текущему чату (EX.assignToChat).
    async function assign(id) {
      const r = S.experience.find((x) => x.id === id);
      if (!r) return false;
      const nr = EX.assignToChat(r, S.chatId);
      await DB.put("experience", nr);
      S.experience = S.experience.map((x) => (x.id === nr.id ? nr : x));
      S.legacyExperience = Math.max(0, (S.legacyExperience || 1) - 1);
      return true;
    }
    function find(id) { return S.experience.find((x) => x.id === id); }

    return { loadForCard, migrate, view, legacyCount, blankDraft, draftFromMessage, save, remove, assign, find };
  }

  PRP.experienceService = { create };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/prism/service.js */
/* Prism RP — сборка Prism для текущего чата (прикладной уровень).
   Связывает активную ветку, сцену, опыт и настройки с чистым сборщиком (prism/assembler.js):
   отбор опыта (EX.rank) и фактов мира (world/overlay-service: канон чата с учётом ветки → отбор по
   релевантности; только чтение) → сборка контекста (AS.build) → отчёт для вкладки Prism.
   Мир не зависит от режима: одни и те же факты получает и сцена, и переписка.
   Адаптер режима (prism/modes): сцена (rp) берёт текущее «сейчас» из сцены; переписка — из среды переписки
   (messenger/service: положение, состояние переписки, время; только чтение). Сцена RP в переписку не подаётся.
   Хранилище, сеть и DOM не трогает. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const TR = PRP.tree, EX = PRP.experience, AS = PRP.assembler, IC = PRP.imgCompose, ST = PRP.settings, SCN = PRP.scenario, SR = PRP.stateResolver;

  // Bring at most two latest selected-swipe visual directives back into the
  // text model history. These are shot references, NOT canonical scene updates.
  // They live inside history messages so normal context budgeting can evict them.
  function historyWithDraws(path, enabled) {
    const messages = Array.isArray(path) ? path : [];
    const chosen = [];
    if (enabled) for (let i = messages.length - 1; i >= 0 && chosen.length < 2; i--) {
      const m = messages[i];
      const sw = TR.activeSwipe(m);
      if (m.role === "assistant" && sw && Array.isArray(sw.draws) && sw.draws.length) {
        const prompt = String(sw.draws[0].prompt || "").trim();
        if (prompt) chosen.push(i);
      }
    }
    const selected = new Set(chosen);
    return messages.map((m, i) => {
      const sw = TR.activeSwipe(m);
      const base = String(sw.text || "");
      if (!selected.has(i)) return { role: m.role, text: base };
      const d = sw.draws[0];
      const prompt = String(d.prompt || "").replace(/\s+/g, " ").trim().slice(0, 700);
      const ratio = /^\d{1,2}:\d{1,2}$/.test(d.ratio || "") ? ", " + d.ratio : "";
      return { role: m.role, text: base + (base ? "\n" : "") + "[draw: " + prompt + ratio + "]" };
    }).filter((h) => h.text);
  }
  function create(ctx) {
    const { S } = ctx;
    const chat = () => ctx.svc.chat;

    /* path — ветка, которая уходит в модель как история; extraPost — дополнительное указание в конце

      // Messenger stays a reported view; RP retains scene and source provenance.
      const tracked = ctx.svc.state ? ctx.svc.state.context(path, { now: extra && extra.messengerNow }) : null;

        tracked, scene: messenger ? null : chat().sceneState(path),
        world: messenger ? messenger.world : null,

      if (messenger) messenger.world = projected.world;
      // В RP здесь видимое общее пространство; в переписке — заявленные персонажем обстоятельства,
      // используемые для поиска мира без утверждения, что пользователь их наблюдал.
      const here = messenger ? { loc: messenger.world.location || "", present: messenger.world.nearby || [] } : st;
      const history = historyWithDraws(path, allowDraw);
      const recent = history.slice(-4).map((h) => h.text).join("\n");
      const ex = EX.rank(S.experience, {
        chatId: c.id, path: chat().pathCtx(path), ownerId: cd.id, present: ["user"].concat(here.present),
        text: recent, names: [cd.name, ctx.persona().name].concat(here.present), limit: s.expLimit,
      });
      const wctx = ctx.svc.worldChat ? ctx.svc.worldChat.context(path, here) : { facts: [], report: null };
      const wearFacts = projected.wearFacts;
      const built = AS.build(Object.assign({
        mode: c.mode, card: cd, userName: ctx.persona().name, userDesc: ctx.persona().description,
        sceneState: messenger ? null : st, messenger, wearFacts, experiences: ex.ranked, worldFacts: wctx.facts, history, extraPost,
        contextTokens: ctx.contextTokens(), reserveTokens: s.sampler.max_tokens || 700,
        singleSystem: s.singleSystem, sceneProtocol: s.sceneProtocol, noPostHistory: !!s.noPostHistory,
        includeScenario: (scenario || SCN.forGeneration(path, { mode: "new" })).included,
      }, extra));
      built.report.imageDirectiveAllowed = allowDraw;
      built.report.imageDirectivePolicy = ST.modelDrawPolicy(s);
      built.report.expDebug = ex.debug;
      built.report.world = wctx.report;
      if (messenger) built.report.messengerState = messenger.report;
      built.report.experienceVisible = ex.visibleCount;
      built.report.legacyUnscoped = S.experience.filter((r) => EX.scopeOf(r) === "legacy").length;
      return built;
    }

    // Предпросмотр для следующего хода (вкладка Prism, счётчик контекста).
    function refresh() {

          card: cd, settings: cfg, backend: cfg.backend, persona: pers, wearNegative, hybrid });

        const finalAudit = ICP.auditFinal(fin.prompt, fin.negative, auditPlan, comp.wearItems, comp.offBodyTags, subjectScope);
        if (finalAudit.issues.length)
          throw new Error("Конфликт одежды в итоговом промпте: " + finalAudit.issues.join("; ").slice(0, 240));
        entry.stage = cfg.backend === "a1111" ? "Рисую на вашем сервере…" : "Рисую…";
        repaint();
        const seed = o.seed != null ? o.seed : (cd.image && String(cd.image.seed || "").trim() !== "" ? Number(cd.image.seed) : undefined);
        if (typeof ctx.perf === "function") ctx.perf("imagePrepareMs", Date.now() - prepT0, { msgId: origin.messageId, chatId: origin.chatId });
