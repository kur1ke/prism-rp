        // selected-path garment events/corrections change while compiling.
        // Shot-only equality is safe ONLY for authored images whose rendered
        // content did not consume tracked state.
        shotOnlyGate = drawAuthored && !canonicalWear;
        // A changed ancestor swipe or evidence during compilation invalidates
        // this image before a potentially expensive backend request.
        if (!(await sourceStillCurrent(DB, origin, shotOnlyGate)) ||
            !(await imageOriginStillCurrent(DB, origin, shotOnlyGate)))
          throw new Error("Исходная ветка или сообщение изменились во время подготовки изображения. Повторите рисование.");
        const res = await IB.generate(cfg, { prompt: fin.prompt, negative: fin.negative, ratio: entry.ratio, seed });
        imageData = { id: entry.id, chatId: origin.chatId, msgId: origin.messageId, dataUrl: res.dataUrl };
        const dims = res.info && res.info.width ? [res.info.width, res.info.height]
          : res.info && (res.info.resolution || res.info.size) ? String(res.info.resolution || res.info.size).split("x").map(Number) : null;
        finalPatch = { status: "done", prompt: fin.prompt, negative: fin.negative, seed: res.seed, backend: cfg.backend, info: res.info, compiledFrom: comp.compiled ? imageScene : "",
          promptSources: { draw: entry.draw, drawPromptMode: hybrid ? "hybrid" : intent ? "intent" : "tags", ...composed.provenance,
            compiled: !!comp.compiled, translatedText: comp.text,
            ...(drawAuthored ? { sourceDrawIndex: authoredIndex,
              historicalDrawState: !!historical } : {}),
            semanticAudit: { validated: !!finalAudit.validated, scope: finalAudit.scope, issues: finalAudit.issues },
            actorState: snap ? snap.character.fieldStatus : null,
            wearConstraints: { items: comp.wearItems || [], negative: wearNegative,
              globallyScoped: !!singleOwner, origin: origin.path.map((m) => [m.id, m.swipeIdx || 0]),
              plan: { actor: visualPlan.actor, known: !!(visualPlan.wear && visualPlan.wear.known),
                complete: !!(visualPlan.wear && visualPlan.wear.complete),
                absentFromBody: visualPlan.absentFromBody,
                offBodyVisible: visualPlan.offBodyVisible,
                negativeEligible: !!visualPlan.allowGlobalGarmentNegative } } } };
        if (dims) { finalPatch.w = dims[0]; finalPatch.h = dims[1]; }
      } catch (e) {
        finalPatch = { status: "error", error: e.message || String(e) };
      }
      try {
        const latest = await DB.get("messages", origin.messageId);
        const savedSwipe = latest && latest.chatId === origin.chatId && latest.swipes && latest.swipes[origin.swipeIdx];
        const savedImage = savedSwipe && (savedSwipe.images || []).find((im) => im.id === entry.id);
        // Do not attach an image built from obsolete ancestor physical facts.
        // A changed source state's events also invalidate it, even if its
        // visible text has not changed.
        const currentSource = latest && JSON.parse(JSON.stringify(latest));
        if (currentSource) currentSource.swipeIdx = origin.swipeIdx;
        const originValid = currentSource && (shotOnlyGate
          ? stateVersion(currentSource, origin.swipeIdx, true) === origin.sourceDrawVersion
          : stateVersion(currentSource, origin.swipeIdx) === origin.sourceStateVersion) &&
          await imageOriginStillCurrent(DB, origin, shotOnlyGate);
        if (finalPatch.status === "done" && !originValid) {
          finalPatch = { status: "error", error: "Исходное состояние ветки или свайпа изменилось. Повторите рисование." };
          imageData = null;
        }
        // Deleted/edited messages and images cannot be resurrected by a late callback.
        if (savedSwipe && savedSwipe.text === origin.sourceText && savedImage) {
          Object.assign(savedImage, finalPatch);
          delete savedImage.stage;
          if (finalPatch.status === "done") delete savedImage.error;
          const writes = [["messages", latest]];
          if (imageData) writes.push(["images", imageData]);
          await DB.putAll(writes);
          Object.assign(entry, finalPatch);
          delete entry.stage;
          if (finalPatch.status === "done") delete entry.error;
          if (ctx.chat() && ctx.chat().id === origin.chatId) {
            const live = S.messages.find((m) => m.id === origin.messageId && m.chatId === origin.chatId);
            const liveSwipe = live && live.swipes && live.swipes[origin.swipeIdx];
            const liveImage = liveSwipe && liveSwipe.text === origin.sourceText && (liveSwipe.images || []).find((im) => im.id === entry.id);
            if (liveImage) {
              Object.assign(liveImage, finalPatch);
              delete liveImage.stage;
              if (finalPatch.status === "done") delete liveImage.error;
            }
            if (imageData) S.imgUrls[entry.id] = imageData.dataUrl;
          }
        }
      } finally {
        S.drawing.delete(entry.id);
        repaint();
      }
    }

    // Нарисовать момент из сообщения: директива [draw:] модели или сам текст ответа.
    function drawFromMessage(msgId) {
      const msg = S.messages.find((x) => x.id === msgId);
      const sw = TR.activeSwipe(msg);
      const d = (sw.draws && sw.draws[sw.draws.length - 1]) || { prompt: sw.text.replace(/\s+/g, " ").slice(0, 700), ratio: "1:1", fromMessage: msg.role === "assistant" };
      return draw(msg, sw, d);
    }

    // Картинка по координатам из разметки: сообщение, номер варианта, id картинки.
    function find(mid, swIdx, imgId) {
      const msg = S.messages.find((x) => x.id === mid);
      if (!msg) return {};
      const sw = msg.swipes[+swIdx];
      const im = sw && (sw.images || []).find((x) => x.id === imgId);
      return { msg, sw, im };
    }
    async function remove(msg, sw, im) {
      sw.images = sw.images.filter((x) => x !== im);
      await DB.del("images", im.id); delete S.imgUrls[im.id];
      await chat().putMsg(msg);
    }
    async function pinSeed(seed) {
      const cd = ctx.card(); cd.image = Object.assign({}, cd.image, { seed: String(seed) });
      await DB.put("cards", cd);
      return cd;
    }

    // Списки с сервера A1111/Forge: модели, VAE, сэмплеры, апскейлеры, LoRA (+ планировщики, если есть).
    async function fetchLists() {
      const cfg = S.settings.images, out = { at: Date.now() };
      for (const w of ["models", "vaes", "samplers", "upscalers", "loras"]) out[w] = await IB.a1111List(cfg, w);
      try { out.schedulers = await IB.a1111List(cfg, "schedulers"); } catch (e) { out.schedulers = []; }
      S.imgLists = out; await DB.setSetting("imgLists", out);
      if (!cfg.model && out.models[0]) cfg.model = out.models[0];
      return out;
    }

    return { textGen, loadForChat, draw, drawFromMessage, find, remove, pinSeed, fetchLists };
  }

  PRP.imageService = { create, dialogueImageContext, shouldAppendDialogue, imageOrigin };
})(typeof window !== "undefined" ? window : globalThis);

<script>/* js/state/service.js */
/* Prism RP — UT-1: автоматическая интерпретация сообщения и получение общего State Snapshot.
   Никаких фоновых таймеров и независимой среды для разных режимов. Результат наблюдателя
   сохраняется внутри выбранного свайпа; смена чата/ветки/текста до ответа отменяет запись.
*/
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const TR = PRP.tree, TRACK = PRP.stateTracker, INT = PRP.stateInterpreter;
  const MAX_TEXT = 4500;
  function create(ctx) {
    const { S } = ctx;
    const chat = () => ctx.svc.chat;

    function snapshot(path, opts) {
      const c = ctx.chat(), cd = ctx.card();
      if (!c || !cd) return TRACK.empty({});

      if (legacy === undefined && c.mode === "messenger" && ctx.svc.messenger) {
        const world = ctx.svc.messenger.worldAt(p, extra.now);
        legacy = world && world.world;
      }
      return TRACK.fold({ mode: c.mode, sceneInit: c.sceneInit, path: p,
        charName: cd.name, userName: ctx.persona().name, legacyWorld: legacy, initialWear: c.initialWear });
    }

    function context(path, opts) {
      const state = snapshot(path, opts);
      return { state, character: TRACK.forCharacter(state), userView: TRACK.forUser(state, ctx.chat() && ctx.chat().mode) };
    }

    // InitialOutfit: invoked ONCE by new Messenger chat orchestration, after
    // environment setup and before presenting the empty chat. The RP provider
    // chooses the entire outfit. No hidden chat message, no parallel inventory.
    // A malformed/failed model response leaves wear UNKNOWN, never naked.
    const initializing = new Map();
    function initializeOutfit(provider, setup) {
      const c = ctx.chat(), card = ctx.card();
      if (!c || c.mode !== "messenger" || !card || c.cardId !== card.id || c.initialWear || chat().path().length ||
          (S.messages || []).length) return Promise.resolve({ status: "skipped" });
      if (snapshot([]).actors.char.wearState.known)
        return Promise.resolve({ status: "already-known" });
      if (!provider || !PRP.llm || typeof PRP.llm.simple !== "function")
        return Promise.resolve({ status: "unavailable" });
      if (initializing.has(c.id)) return initializing.get(c.id);
      const id = c.id, cardId = c.cardId;
      // Diagnostics are metadata on the new chat, never a second source
      // of outfit truth. Do not persist prompts, raw model outputs or secrets.
      async function failed(reason) {
        const current = ctx.chat();
        if (!current || current.id !== id || current.cardId !== cardId ||
            S.chatId !== id || S.cardId !== cardId || chat().path().length ||
            (S.messages || []).length || current.initialWear)
          return { status: "stale" };

          initialOutfitCheck: { status: "error", reason: String(reason).slice(0, 160) },
        });
        try { await ctx.DB.put("chats", next); Object.assign(current, next); }
        catch (_e) { /* Non-canonical diagnostics cannot block chat creation. */ }

      }

      const tokens = PRP.util && typeof PRP.util.estimateTokens === "function"
        ? PRP.util.estimateTokens(instruction) : Math.ceil(instruction.length / 3);
      if (tokens + 650 > (typeof ctx.contextTokens === "function" ? ctx.contextTokens() : 8192))
        return Promise.resolve({ status: "overflow" });
      const task = (async () => {
        let raw;
        try { raw = await simpleWithLimit(provider, instruction); }
        catch (e) {
          const message = String(e && e.message || e || "");
          return failed(/превышено время ожидания/i.test(message) ? "timeout"
            : /ai-text-plugin недоступен/i.test(message) ? "plugin-unavailable"
            : /\b(?:401|403|429)\b/.test(message) ? "provider-rejected"
            : "provider-error");
        }
        const parsed = INT.parseInitialOutfit(raw);
        if (parsed.error) return failed(parsed.error);
        const event = TRACK.normalize({
          actor: "char", field: "wear", action: parsed.worn.length ? "set" : "clear",
          ...(parsed.worn.length ? { value: parsed.worn } : {}),
          certainty: "reported", evidence: "",
        }, { role: "initial", mode: "messenger" });
        if (!event.event) return failed(event.error);
        // One origin event belongs to this exact new chat, never to a sibling
        // or to an already active conversation. A delayed response cannot
        // retroactively dress a character after the first message.
        const current = ctx.chat();
        if (!current || current.id !== id || current.cardId !== cardId ||
            S.chatId !== id || S.cardId !== cardId || !ctx.card() || ctx.card().id !== cardId ||
            current.initialWear || chat().path().length ||
            (S.messages || []).length || snapshot([]).actors.char.wearState.known)
          return { status: "stale" };

        const next = Object.assign({}, current, { initialWear: record });
        try { await ctx.DB.put("chats", next); }
        catch (_e) { return { status: "error", reason: "storage" }; }
        Object.assign(current, next);
        if (ctx.svc.prism && typeof ctx.svc.prism.refresh === "function") ctx.svc.prism.refresh();
        return { status: "ok", worn: parsed.worn.length };
      })().finally(() => { if (initializing.get(id) === task) initializing.delete(id); });
      initializing.set(id, task);
      return task;
    }

    // Bounded, read-only references: never copy another chat, a sibling swipe,
    // imported memory or a whole unbounded transcript into Observer.
    function observationContext(path, role) {
      const prior = Array.isArray(path) ? path : [];
      const state = snapshot(prior);
      const actor = role === "user" ? "user" : "char";
      return {
        recent: prior.slice(-5).map((m) => ({
          messageId: m.id, swipeIdx: m.swipeIdx || 0, role: m.role,
          text: String(TR.activeSwipe(m).text || "").slice(0, 500),
          ...(m.role === "assistant" && Array.isArray(TR.activeSwipe(m).draws) &&
            TR.activeSwipe(m).draws.length && TR.activeSwipe(m).draws[TR.activeSwipe(m).draws.length - 1].prompt
            ? { draw: String(TR.activeSwipe(m).draws[TR.activeSwipe(m).draws.length - 1].prompt).slice(0, 400) } : {}),
        })),
        references: TRACK.references(state, actor, ["remove", "adjust", "add"]),
      };
    }
    function pathFingerprint(path) {
      // Including text and state events protects a contextual interpretation
      // against a changed ancestor swipe, edited text, or corrected garment.
      return JSON.stringify((path || []).map((m) => [
        m.id, m.swipeIdx || 0, TR.activeSwipe(m).text,
        TR.activeSwipe(m).stateEvents, TR.activeSwipe(m).stateCorrections,
        TR.activeSwipe(m).sceneOps, TR.activeSwipe(m).draws,

    }

    /* Observe AFTER a committed text message, BEFORE continuing generation/drawing.
       If interpretation fails, no world fact is manufactured. A missing model leaves
       the normal chat functional. No model-output data can control another actor.
       Only same chat, same active swipe, same source text may be committed. */
    function updateUi() {
      // Раньше панель отрисовывалась ДО завершения служебного запроса и
      // продолжала показывать "неизвестно" даже после записи результата.
      if (ctx.svc.prism && typeof ctx.svc.prism.refresh === "function") ctx.svc.prism.refresh();
      if (ctx.ui) {
        if (typeof ctx.ui.renderHead === "function") ctx.ui.renderHead();
        if (S.drawerOpen && typeof ctx.ui.renderDrawer === "function") ctx.ui.renderDrawer();
      }
    }

    async function simpleWithLimit(provider, instruction) {
      // Служебный запрос не может бесконечно блокировать обычную переписку.
      // Таймаут не создаёт факты и не применяет запоздалый ответ.
      const maxMs = Math.max(300, Math.min(60000, Number(ctx.observerTimeoutMs) || 20000));
      let timer;
      try {
        return await Promise.race([
          PRP.llm.simple(provider, instruction, { maxTokens: 650 }),
          new Promise((_, reject) => { timer = setTimeout(() => reject(new Error("превышено время ожидания " + maxMs + " мс")), maxMs); }),
        ]);
      } finally { clearTimeout(timer); }
    }

    // PERF-02B: model-only analysis can start while an earlier message is still
    // being observed. It never writes state; observeMessage validates the active
    // chat, path, swipe and text before any persistent commit.
    async function analyse(options, provider) {
      let result = { valid: false, events: [], issues: ["Текстовая модель недоступна"] };
      if (provider) {
        try {
          const instruction = INT.instruction(options);
          const raw = await simpleWithLimit(provider, instruction);
          result = INT.parse(raw, options);
        } catch (e) {
          result = { valid: false, events: [], issues: ["Ошибка наблюдателя: " + String(e && e.message || e).slice(0, 200)] };
        }
      }
      return result;
    }
    function prepareUser(text, provider) {
      const c = ctx.chat(), source = String(text || "");
      if (!c || !source.trim() || !INT.mayChangeState(source)) return null;
      const options = { mode: c.mode, role: "user", text: source.slice(0, MAX_TEXT),
        speakerName: (ctx.persona() || {}).name, ...observationContext(chat().path(), "user") };
      // A cancelled or stale turn simply discards this promise; it never commits.
      return { chatId: c.id, providerId: provider && provider.id, options, promise: analyse(options, provider) };
    }

    async function observeMessage(msg, provider, opts) {
      const c = ctx.chat();
      if (!c || !msg || msg.chatId !== c.id || !["assistant", "user"].includes(msg.role)) return { skipped: "not-message" };
      const sw = TR.activeSwipe(msg), sourceText = String(sw.text || ""), swipeIdx = msg.swipeIdx || 0;
      // Only a current assistant-authored [draw:] is observational evidence;
      // manual image prompts, rewritten tags and backend pixels never feed canon.
      // Continue may append a newer shot within the same swipe. The latest
      // authored draw is the current observation; all source draws stay in
      // the original swipe for exact evidence/provenance replay.
      const lastDraw = msg.role === "assistant" && Array.isArray(sw.draws) && sw.draws.length
        ? sw.draws[sw.draws.length - 1] : null;
      const sourceDraw = lastDraw ? String(lastDraw.prompt || "") : "";
      if (!sourceText.trim() && !sourceDraw.trim()) return { skipped: "empty" };
      if (!sourceDraw && !INT.mayChangeState(sourceText)) return { skipped: "non-event-greeting" };
      if (sw.stateStatus && ["ok", "partial", "no-changes"].includes(sw.stateStatus.status) &&
          sw.stateStatus.sourceText === sourceText && (sw.stateStatus.sourceDraw || "") === sourceDraw &&
          !(opts && opts.force)) return { skipped: "already-processed" };

      const index = initialPath.indexOf(msg);
      if (index < 0) return { skipped: "off-path" };
      const originalKey = pathFingerprint(initialPath);
      const chatId = c.id;
      // VC-04: continued swipes contain several authored photographs. Preserve
      // ONLY previously interpreted, source-bound visual facts whose exact
      // prior draw still exists. The latest observer still interprets only
      // the newest photograph, and an old crop cannot become new authority.
      // Legacy stateEvents without a matching earlier stateStatus are never
      // promoted into historical events.
      const draws = msg.role === "assistant" && Array.isArray(sw.draws) ? sw.draws : [];
      const latestIndex = draws.length - 1;
      const priorStatus = sw.stateStatus;
      const archivedDrawEvents = [];
      let previousIndex = -1;
      if (latestIndex > 0 && priorStatus &&
          ["ok", "partial", "no-changes"].includes(priorStatus.status) &&
          typeof priorStatus.sourceText === "string" &&
          sourceText.startsWith(priorStatus.sourceText) &&
          typeof priorStatus.sourceDraw === "string") {
        const candidates = draws.slice(0, -1).map((d, i) =>
          d && String(d.prompt || "") === priorStatus.sourceDraw ? i : -1).filter(i => i >= 0);
        previousIndex = Number.isInteger(priorStatus.sourceDrawIndex)
          ? priorStatus.sourceDrawIndex
          : candidates.length === 1 ? candidates[0] : -1;
        if (previousIndex >= 0 && previousIndex < latestIndex &&
            draws[previousIndex] && String(draws[previousIndex].prompt || "") === priorStatus.sourceDraw) {
          for (const event of Array.isArray(sw.stateEvents) ? sw.stateEvents : []) {
            if (!event || event.evidenceType !== "draw" || event.certainty === "intent") continue;
            const drawIndex = event.drawIndex == null ? previousIndex : event.drawIndex;
            const exactDraw = draws[drawIndex];
            if (!Number.isInteger(drawIndex) || drawIndex < 0 || drawIndex > previousIndex ||
                !exactDraw || typeof exactDraw.prompt !== "string" ||
                !event.evidence || !exactDraw.prompt.includes(event.evidence)) continue;
            archivedDrawEvents.push({ ...event, drawIndex });
          }
        }
      }
      // Same-swipe photo history is valid local context for references, but
      // never an extra instruction or independently persisted inventory.
      // Build a bounded *read-only* intermediate snapshot using only the
      // exact previously verified photo events; do not pull future text or
      // later Scene directives back into that earlier moment.
      const contextual = observationContext(initialPath.slice(0, index), msg.role);
      if (previousIndex >= 0 && archivedDrawEvents.length) {
        const priorMessage = {
          id: msg.id, chatId: msg.chatId, parentId: msg.parentId,
          role: msg.role, swipeIdx: 0,
          swipes: [{
            text: priorStatus.sourceText,
            draws: draws.slice(0, previousIndex + 1),
            sceneOps: [], stateCorrections: [],
            stateEvents: archivedDrawEvents.slice(-32),
          }],
        };
        const localState = snapshot(initialPath.slice(0, index).concat([priorMessage]));
        contextual.references = TRACK.references(localState, "char", ["remove", "adjust", "add"]);
      }
      const options = { mode: c.mode, role: msg.role, text: sourceText.slice(0, MAX_TEXT),
        ...(sourceDraw ? { draw: sourceDraw.slice(0, 1600), draws: [{ prompt: sourceDraw }] } : {}),
        speakerName: msg.role === "assistant" ? (ctx.card() || {}).name : (ctx.persona() || {}).name,
        ...contextual };

      // match. Changed persona/mode/text cannot silently inherit stale events.
      const prepared = opts && opts.prepared;
      const sameInputs = prepared && prepared.chatId === msg.chatId &&
        prepared.providerId === (provider && provider.id) && prepared.options &&
        ["mode", "role", "text", "draw", "speakerName"].every((key) => prepared.options[key] === options[key]) &&
        JSON.stringify(prepared.options.recent) === JSON.stringify(options.recent);
      let result;
      if (sameInputs) {
        const early = await prepared.promise;
        const refsSame = JSON.stringify(prepared.options.references) === JSON.stringify(options.references);
        // PERF-02B: if the prior assistant's state finished meanwhile, reuse
        // an explicit, non-referential early result or even its error. Only
        // retry when newly available references could change an unresolved
        // interpretation, or a previously resolved reference became stale.
        const mayNeedReferences = early.valid && (early.events.some((e) => e.reference) ||
          early.issues.some((issue) => issue.startsWith("Неоднозначная ссылка:")));

      } else result = await analyse(options, provider);
      // Fallback never invents frame objects; semantic photo references
      // are determined only by the validated main Observer result.
      const fallback = INT.grounded(sourceText.slice(0, MAX_TEXT), options);
      // Grounded fallback intentionally reads only text. Image descriptions
      // are interpreted by the SAME Observer and independently verified
      // against their exact draw evidence on every StateTracker fold.
      const events = result.events.map((e) => e.evidenceType === "draw" && latestIndex > 0
        ? { ...e, drawIndex: latestIndex } : e);
      // Prior snapshots are evidence, not an unbounded event log. Bound the
      // archival slice, report truncation and never override a fresh event.
      const MAX_ARCHIVED_DRAW_EVENTS = 32;
      const retained = archivedDrawEvents.slice(-MAX_ARCHIVED_DRAW_EVENTS);
      events.push(...retained);

      // Compare common Russian inflections ('синяя куртка'/'синей куртке')
      // to avoid adding the same garment twice when model and fallback agree.
      const garmentKey = (value) => (String(value || "").toLowerCase().replace(/ё/g, "е")
        .match(/[\p{L}\p{N}]+/gu) || []).map((word) => word.length > 4
          ? word.replace(/(?:ого|ему|ому|ыми|ими|ая|яя|ый|ий|ой|ей|ие|ые|ую|юю|ых|их|ым|им|ом|ем|а|я|е|у|ю|ы|и)$/u, "")
          : word).join(" ");
      // Fallback is lexical Russian text extraction, not a bilingual item
      // identity resolver. A confirmed current visual removal/adjustment must
      // not be undone by an uncorrelated fallback "wear.add" derived from
      // caption words (e.g. шорты vs shorts). The primary Observer can still
      // report independently grounded compatible text facts; don't guess.
      const visualChange = result.events.some((e) => e.actor === "char" &&
        e.field === "wear" && e.evidenceType === "draw" &&
        (e.action === "remove" || e.action === "adjust"));
      for (const e of fallback) {
        if (events.length >= INT.MAX) break;
        if (visualChange && e.field === "wear") continue;
        const sameField = events.filter((x) => x.actor === e.actor && x.field === e.field && x.certainty !== "intent");
        if (e.field === "wear" && e.action === "add" && Array.isArray(e.value)) {
          // A model may return one garment (or an invalid second garment).
          // Preserve correctly grounded items missing from that partial list;
          // don't discard all of fallback just because a wear field exists.
          const known = sameField.flatMap((x) => Array.isArray(x.value) ? x.value : []).map(garmentKey);
          const missing = e.value.filter((item) => !known.includes(garmentKey(item)));
          if (missing.length) events.push(Object.assign({}, e, { value: missing }));
        } else if (!sameField.length) events.push(e);
      }
      // One message may assert clothing both in its caption and in the photo.
      // Apply text observations first; the intentional current photo is the
      // later visual observation of that same moment. Neither is a second
      // canonical store. Preserve relative ordering within each evidence kind.
      // Text is processed first as before; visual events follow the exact
      // photo order so the newest explicit observation wins only on its item.
      const drawOrder = (event) => event.evidenceType === "draw"
        ? (event.drawIndex == null ? latestIndex : event.drawIndex) : -1;
      events.sort((a, b) => drawOrder(a) - drawOrder(b));
      if (!ctx.chat() || ctx.chat().id !== chatId || (msg.swipeIdx || 0) !== swipeIdx ||
          String(TR.activeSwipe(msg).text || "") !== sourceText ||
          pathFingerprint(chat().path()) !== originalKey) {
        return { skipped: "stale-branch" };
      }
      const issues = result.issues.slice();
      if (archivedDrawEvents.length > MAX_ARCHIVED_DRAW_EVENTS)
        issues.push("Лимит архивных draw-событий: предыдущие факты требуют ручной проверки");
      const status = !result.valid ? events.length ? "partial" : "error" : issues.length ? "partial" : events.length ? "ok" : "no-changes";
      const stateStatus = { status, sourceText, sourceDraw, sourceDrawIndex: latestIndex,
        issues, at: Date.now(),
        method: fallback.length ? "model+grounded" : "model", eventCount: events.length,
        // Shot-local provenance, not wardrobe state. Same-swipe image use only.
        frameObjects: Array.isArray(result.frameObjects) ? result.frameObjects.slice(0, INT.MAX) : [] };
      const next = JSON.parse(JSON.stringify(msg));
      next.swipes[swipeIdx].stateEvents = events;
      next.swipes[swipeIdx].stateStatus = stateStatus;
      await ctx.DB.put("messages", next);
      sw.stateEvents = events;
      sw.stateStatus = stateStatus;
      updateUi();
      return { events, issues, status };
    }
    /* PERF-01: разбор сообщения как управляемая задача.
       • Одна задача на (чат, сообщение, свайп, текст): повторный вызов возвращает ту же.
       • Никогда не отклоняется: ошибка хранилища или наблюдателя → { error } (нет unhandled rejection).
       • Проверка актуальности — прежняя, внутри observeMessage; здесь не ослабляется.
       • S.tracking = есть незавершённые задачи (совместимость с панелью переписки).
       Ожидание ограничено таймаутом наблюдателя (simpleWithLimit) плюс запас в settle(). */
    const jobs = new Map();
    const now = () => (typeof performance !== "undefined" && performance.now ? performance.now() : Date.now());
    const jobKey = (msg) => [msg.chatId, msg.id, msg.swipeIdx || 0, String(TR.activeSwipe(msg).text || ""),
      msg.role === "assistant" ? JSON.stringify(TR.activeSwipe(msg).draws || []) : ""].join("\u0001");
    function sync() {
      S.tracking = jobs.size > 0;
      if (ctx.ui && typeof ctx.ui.renderComposer === "function") ctx.ui.renderComposer();
    }
    function track(msg, provider, opts) {
      if (!msg || !msg.swipes) return Promise.resolve({ skipped: "not-message" });
      const k = jobKey(msg), existing = jobs.get(k);
      if (existing && !(opts && opts.force)) return existing.promise;
      const job = { key: k, chatId: msg.chatId, msgId: msg.id, role: msg.role, startedAt: now() };
      job.promise = Promise.resolve()
        .then(() => observeMessage(msg, provider, opts))
        .catch((e) => ({ error: String(e && e.message || e).slice(0, 200) }))
        .then((r) => {
          const res = r || {};
          // Тайминг — только числа и роль; без текста сообщения.
          res.ms = Math.round(now() - job.startedAt);
          if (typeof ctx.perf === "function") ctx.perf(msg.role === "user" ? "userStateMs" : "assistantStateMs", res.ms, { msgId: msg.id, chatId: msg.chatId, outcome: res.status || res.skipped || (res.error ? "error" : "") });
          return res;
        })
        .finally(() => { if (jobs.get(k) === job) jobs.delete(k); sync(); });
      jobs.set(k, job);
      sync();
      return job.promise;
    }
    // Сколько разборов этого чата ещё не завершено.
    function pending(chatId) { let n = 0; for (const j of jobs.values()) if (!chatId || j.chatId === chatId) n++; return n; }
    /* Дождаться всех разборов чата (и тех, что добавятся за время ожидания). Ограничено: каждый разбор
       сам ограничен таймаутом наблюдателя; settle добавляет общий предел и сообщает, если он истёк. */
    async function settle(chatId, maxMs) {
      const limit = Math.max(500, Number(maxMs) || (Math.max(300, Math.min(60000, Number(ctx.observerTimeoutMs) || 20000)) + 5000));
      const t0 = now();
      let timer;
      const deadline = new Promise((r) => { timer = setTimeout(() => r("timeout"), limit); });
      try {
        for (;;) {
          const list = [...jobs.values()].filter((j) => j.chatId === chatId).map((j) => j.promise);
          if (!list.length) return { waitedMs: Math.round(now() - t0), timedOut: false };
          if ((await Promise.race([Promise.all(list), deadline])) === "timeout") return { waitedMs: Math.round(now() - t0), timedOut: true };
        }
      } finally { clearTimeout(timer); }
    }

    async function correct(patch) {
      const c = ctx.chat();
      const path = chat().path(), m = path[path.length - 1];
      if (!c || !m) return { error: "Для исправления в ветке необходимо хотя бы одно сообщение." };
      const choices = { location: "location", activity: "activity", visualWear: "wear", visualPose: "pose", visualHair: "hair", nearby: "nearby", ongoing: "ongoing", availability: "availability" };
      const changes = [], issues = [];
      for (const [key, val] of Object.entries(patch || {})) {
        const field = choices[key];
        if (!field) { issues.push("неизвестное поле: " + key); continue; }
        const empty = val == null || (Array.isArray(val) && !val.length) || val === "";
        const e = { actor: "char", field, action: empty ? "clear" : "set", value: val, certainty: "established", evidence: "" };
        const r = TRACK.normalize(e, { role: "manual", mode: c.mode });
        if (r.error) issues.push(r.error); else changes.push(r.event);
      }
      if (!changes.length || issues.length) return { error: issues.join("; ") || "Нет изменений." };
      const swIdx = m.swipeIdx || 0, sw = TR.activeSwipe(m);
      const next = JSON.parse(JSON.stringify(m));
      next.swipes[swIdx].stateCorrections = (next.swipes[swIdx].stateCorrections || []).concat(changes);
      await ctx.DB.put("messages", next);
      sw.stateCorrections = next.swipes[swIdx].stateCorrections;
      return { corrections: changes };
    }
    return { snapshot, context, initializeOutfit, prepareUser, observeMessage, track, pending, settle, correct };
  }
  PRP.stateService = { create };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/generation/service.js */
/* Prism RP — генерация ответа персонажа (прикладной уровень).
   Порядок хода: предварительная сборка Prism и проверка бюджета (до любых изменений дерева)
   → узел или вариант ответа → вызов модели через PRP.llm → разбор ответа ([scene:], [draw:],
   рассуждение) → сохранение → автокартинка.
   Режимы: "new" — новый ответ, "regen" — новый вариант, "continue" — дописать текущий вариант,
   "opening" — модель начинает сцену в пустом чате (см. opening ниже: дерево меняется только
   после успешного ответа).
   Сценарий карточки подаётся по правилу prism/scenario.js (граница первого ответа).
   Переписка: момент переписки выбирается при подготовке (живое время — часы, ручное — сохранённое) и вместе
   с положением персонажа записывается в вариант (messengerAt) ТОЛЬКО при успешном ответе. Ошибка, отмена,
   пустой ответ и переполнение время не записывают и не двигают. Legacy Environment генерация не меняет;
   UT-1 записывает проверенные автоматические события состояния в тот же вариант сообщения.
   Перерисовка — через порт ctx.ui (сервис не трогает DOM сам). */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const TR = PRP.tree, SC = PRP.scene, OA = PRP.openai, IC = PRP.imgCompose, ST = PRP.settings, LLM = PRP.llm, SCN = PRP.scenario;

  const CONTINUE = "Продолжи последнее сообщение {{char}} ровно с того места, где оно оборвалось. Не повторяй уже написанное и не начинай заново.";
  // Временное указание для начала сцены моделью. В историю не попадает; учитывается в бюджете как часть протокола.
  const OPENING = "Начни сцену: напиши первое сообщение {{char}}. Открой её естественно, вводя только то, что следует из карточки, " +
    "начальных обстоятельств и текущей сцены; обстоятельства — отправная точка, а не сценарий, который нужно разыграть. " +
    "Не пиши действий, мыслей, реплик и решений {{user}} и оставь {{user}} место ответить.";
  const OPENING_ID = "opening"; // id временного пузыря начала сцены в ленте (в дереве такого узла нет)
  const INITIATIVE_ID = "initiative"; // id временного пузыря проверки инициативы (в дереве такого узла нет до успешного ответа)
  const INI = PRP.messengerInitiative, U = PRP.util;
  // Ключ активного контекста: чат + сообщения пути и их выбранные варианты (сверка перед записью).
  const pathKey = (p) => (p || []).map((m) => m.id + ":" + (m.swipeIdx || 0)).join(">");
  /* PERF-01: ключ контекста ожидающего хода — путь, выбранные свайпы И текст каждого сообщения пути
     (отпечаток FNV-1a + длина). Правка любого сообщения истории, пока ход ждёт, — это другой контекст:
     реплика не отправляется, текст возвращается в поле ввода. */
  function fnv(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36); }
  const turnKey = (p) => (p || []).map((m) => { const t = String(TR.activeSwipe(m).text || ""); return m.id + ":" + (m.swipeIdx || 0) + ":" + t.length + ":" + fnv(t); }).join(">");

  const now = () => (typeof performance !== "undefined" && performance.now ? performance.now() : Date.now());

  function create(ctx) {
    const { S, ui } = ctx;
    const chat = () => ctx.svc.chat, prism = () => ctx.svc.prism, images = () => ctx.svc.images, state = () => ctx.svc.state;
    const perf = (metric, ms, meta) => { if (typeof ctx.perf === "function") ctx.perf(metric, ms, meta); };
    const renderComposer = () => { if (typeof ui.renderComposer === "function") ui.renderComposer(); else ui.renderFeed(); };

    /* PERF-01: обработка после ответа. Ответ уже записан и показан, замок генерации снят.
       Разбор ответа — задача сервиса состояния (track: дедуп, без отклонений, ограничена по времени);
       картинка — строго ПОСЛЕ разбора, как и раньше (её снимок состояния включает события ответа).
       Возвращается Promise, который никогда не отклоняется. */
    function afterReply(msg, prov, draw) {
      const st = state();
      /* Источник картинки фиксируется в момент ответа: этот вариант (объект свайпа), его номер и текст.
         Директива [draw:] принадлежит ИМЕННО этому варианту: если за время разбора выбран другой свайп,
         вариант изменён, изменился путь до него или сообщение ушло с активной ветки — авто-картинка не рисуется. */
      const sw = TR.activeSwipe(msg), swIdx = msg.swipeIdx || 0, text = String(sw.text || "");
      /* Якорь происхождения: весь активный путь ДО и включая это сообщение (id, выбранные свайпы, текст).
         Смена свайпа или правка ПРЕДКА не убирает сообщение с пути (путь строится по parentId), но меняет
         контекст, в котором был дан ответ, — тогда авто-картинка тоже пропускается. Потомки (ход из очереди)
         якорь не меняют. */
      const prefixKey = () => { const p = chat().path(), i = p.indexOf(msg); return i < 0 ? null : turnKey(p.slice(0, i + 1)); };
      const anchor = prefixKey();
      const observerProvider = ctx.processingProvider ? ctx.processingProvider() : prov;
      const analysed = st && msg && text.trim() ? st.track(msg, observerProvider) : Promise.resolve(null);
      return analysed.then((res) => {
        if (!draw) return null;
        const c = ctx.chat();
        const same = c && c.id === msg.chatId && (msg.swipeIdx || 0) === swIdx && msg.swipes[swIdx] === sw &&
          String(sw.text || "") === text && (sw.draws || []).some((d) => d === draw || (d && d.prompt === draw.prompt && d.ratio === draw.ratio)) &&
          anchor != null && prefixKey() === anchor && !(res && res.skipped === "stale-branch");
        if (!same) { perf("imageSkipped", 0, { msgId: msg.id, chatId: msg.chatId, outcome: res && res.skipped === "stale-branch" ? "analysis-stale" : "source-changed" }); return null; }
        if (!ST.imagesOn(S.settings, ctx.env.perchanceImages()) || !S.settings.images.autoDraw) return null;
        return images().draw(msg, sw, draw);
      }).catch((e) => { perf("postReplyError", 0, { msgId: msg && msg.id, chatId: msg && msg.chatId, outcome: String(e && e.message || e).slice(0, 120) }); return null; });
    }

    /* PERF-01: операция, которой нужно полное состояние чата, ждёт незавершённых разборов этого чата —
       видимо (S.turn, фаза "waiting-state") и ограниченно (state.settle). После ожидания контекст сверяется:
       тот же чат и тот же путь (сообщения + выбранные свайпы). Иначе операция не выполняется.
       → { turn } | { refused } */
    async function waitForState(kind, extra) {
      const c = ctx.chat(), st = state();
      const turn = Object.assign({ chatId: c.id, kind, key: turnKey(chat().path()), phase: "waiting-state", at: now() }, extra || {});
      S.turn = turn;
      renderComposer();
      // Отмена прерывает ожидание сразу: ход не висит до конца чужого разбора.
      const cancelled = new Promise((r) => { turn.onCancel = () => r({ waitedMs: Math.round(now() - turn.at), timedOut: false, cancelled: true }); });
      const w = st && st.pending(c.id) ? await Promise.race([st.settle(c.id), cancelled]) : { waitedMs: 0, timedOut: false };
      turn.waitedMs = w.waitedMs;
      if (w.timedOut) perf("stateWaitTimeout", w.waitedMs, { chatId: c.id });
      if (S.turn !== turn || turn.cancelled) return { refused: "cancelled", turn };
      if (S.chatId !== turn.chatId || !ctx.chat() || turnKey(chat().path()) !== turn.key) return { refused: "context-changed", turn };
      return { turn };
    }
    const releaseTurn = (turn) => { if (turn && S.turn === turn) { S.turn = null; renderComposer(); } };
    // Сервис среды — только для переписки.
    const messenger = () => { const c = ctx.chat(); return c && c.mode === "messenger" && ctx.svc.messenger ? ctx.svc.messenger : null; };

    async function generate(msgId, mode, opts) {
      const o = opts || {};
      if (S.gen) return;
      // Ход уже принят (ждёт разбора или идёт) — вторая операция не запускается; своя операция хода проходит.
      if (S.turn && S.turn !== o.turn && S.turn.chatId === S.chatId) return;
      const c = ctx.chat(), cd = ctx.card();
      const prov = ctx.provider();
      if (!c || !cd) return;
      // Незавершённый разбор предыдущих сообщений этого чата: сначала дождаться его (видимо, ограниченно).
      if (!o.turn && state() && state().pending(c.id)) {
        const w = await waitForState(mode || (msgId ? "regen" : "new"));
        if (w.refused) { releaseTurn(w.turn); if (w.refused === "context-changed") ui.toast("Пока шёл разбор предыдущего ответа, чат, ветка или текст истории изменились — действие отменено.", true); return; }
        let reply = null;
        try { reply = await generate(msgId, mode, { turn: w.turn }); return reply; }
        finally { releaseTurn(w.turn); ready(reply); }
      }
      if (!prov) { ui.toast("Модель не подключена. Откройте «Настройки → Модели».", true); ui.openSettings("models"); return; }
      mode = mode || (msgId ? "regen" : "new");
      // Другой вариант сообщения-инициативы — снова проверка инициативы (тот же смысл операции, та же логическая единица).
      if (mode === "regen" && c.mode === "messenger" && INI.isInitiative(S.messages.find((m) => m.id === msgId))) return initiative(msgId, { turn: o.turn });
      const full = chat().path();
      // Пустой чат: отвечать не на что — это начало сцены.
      if (mode === "opening" || (mode === "new" && !full.length)) return opening(prov);

      // Предварительная проверка: контекст собирается ДО любых изменений дерева сообщений.
      // Если он не помещается, запрос не уходит и история не получает ни узла, ни варианта.
      let path = full;
      if (mode === "regen") path = full.slice(0, full.findIndex((m) => m.id === msgId));
      const target0 = msgId ? S.messages.find((m) => m.id === msgId) : null;
      // Другой вариант первого сообщения персонажа (корень ветки) — это снова начало сцены.
      const rootOpening = mode === "regen" && target0 && !target0.parentId && target0.role === "assistant";
      const extraPost = mode === "continue" ? CONTINUE : rootOpening ? OPENING : "";
      const ms = messenger();
      const msNow = ms ? ms.now() : undefined; // момент переписки для этого хода (выбран при подготовке)
      const built = prism().build(path, extraPost, SCN.forGeneration(full, { mode, targetId: msgId }), Object.assign(rootOpening ? { allowSyntheticUser: false, operation: "opening" } : {}, ms ? { messengerNow: msNow } : {}));
      if (preflightFailed(built, prov)) return;
      if (rootOpening && openingBlocked(built, prov)) return;

      let target, prefix = "";
      if (mode === "regen") {
        target = S.messages.find((m) => m.id === msgId);
        target.swipes.push({ text: "", sceneOps: [], createdAt: Date.now() });
        target.swipeIdx = target.swipes.length - 1;
      } else if (mode === "continue") {
        target = S.messages.find((m) => m.id === msgId);
        prefix = TR.activeSwipe(target).text;
      } else {
        target = chat().newMsg("assistant", c.leafId, "");
        c.leafId = target.id;
        await chat().putChat(c);
      }
      await chat().putMsg(target);

      const sw = TR.activeSwipe(target);
      const ctrl = new AbortController();
      S.gen = { ctrl, msgId: target.id, raw: "", reasoning: "", prefix: prefix ? prefix + (/\s$/.test(prefix) ? "" : " ") : "" };
      ui.renderFeed();
      if (S.drawerOpen && S.tab === "prism") ui.renderDrawer();
      ui.scrollBottom();

      const onDelta = (d) => { S.gen.raw += d.text || ""; S.gen.reasoning += d.reasoning || ""; ui.paintStreaming(); };
      let raw = "", reasoning = "", error = null;
      const rpT0 = now();
      try {
        const res = await LLM.chat(prov, built.messages, {
          names: { char: cd.name, user: ctx.persona().name }, sampler: S.settings.sampler,
          signal: ctrl.signal, onDelta, continueFrom: prefix || null,
          outputFormat: ms ? "message-body" : null,
        });
        raw = res.text; reasoning = res.reasoning;
      } catch (e) {
        raw = e.partial != null ? e.partial : S.gen.raw;
        reasoning = S.gen.reasoning;
        if (e.name !== "AbortError") error = e.message || String(e);
      }
      perf("roleplayMs", Math.round(now() - rpT0), { msgId: target.id, chatId: c.id, outcome: error ? "error" : mode });
      const th = OA.splitThink(raw || "");
      const parsed = SC.parse(th.text);
      const dr = IC.parseDraws(parsed.text);
      // Даже если модель сама добавила [draw:] без разрешения, картинка не
      // создаётся. Служебный текст при этом всё равно удалён из ответа.
      if (!built.report.imageDirectiveAllowed) dr.draws = [];
      else dr.draws = dr.draws.slice(0, 1);
      // Переписка: [scene:] вырезается из текста, но сцену не пишет (chat/service.sceneFields — только неактивная копия).
      const sf = chat().sceneFields(parsed.ops);
      if (mode === "continue") {
        if (dr.text) sw.text = S.gen.prefix + dr.text;
        sw.sceneOps = (sw.sceneOps || []).concat(sf.sceneOps);
        if (sf.ignoredSceneOps && sf.ignoredSceneOps.length) sw.ignoredSceneOps = (sw.ignoredSceneOps || []).concat(sf.ignoredSceneOps);
        sw.draws = (sw.draws || []).concat(dr.draws);
      } else {
        sw.text = dr.text;
        sw.sceneOps = sf.sceneOps;
        if (sf.ignoredSceneOps && sf.ignoredSceneOps.length) sw.ignoredSceneOps = sf.ignoredSceneOps; else delete sw.ignoredSceneOps;
        sw.draws = dr.draws;
      }
      sw.reasoning = [sw.reasoning && mode === "continue" ? sw.reasoning : "", reasoning, th.reasoning].filter(Boolean).join("\n").trim();
      if (error) sw.error = error; else delete sw.error;
      /* Метка времени переписки — только у успешного ответа. «Продолжить» дописывает ту же единицу:
         прежняя метка не меняется, новая ставится, только если её не было. Ветка для положения — до этого сообщения. */
      if (ms && !error && !ctrl.signal.aborted && String(sw.text || "").trim() && !(mode === "continue" && sw.messengerAt)) {
        const snap = ms.snapshot(mode === "new" ? full : path, msNow);
        if (snap) sw.messengerAt = snap;
      }
      S.gen = null;
      await chat().putMsg(target);
      await chat().touch();
      prism().refresh();
      ui.renderFeed();
      ui.renderRail();
      if (S.drawerOpen) ui.renderDrawer();
      ui.scrollBottom();
      const shownAt = now();
      // Ответ сохранён и показан, замок снят: разбор и картинка идут отдельно и не держат переписку.
      const post = !error && sw.text ? afterReply(target, prov, dr.draws.length ? dr.draws[0] : null) : Promise.resolve(null);
      const reply = { msgId: target.id, chatId: c.id, shownAt, post };
      if (!o.turn) ready(reply); // без хода ничего больше не держит ввод
      return reply;
    }

    // Записать сборку для вкладки Prism; при переполнении — сообщить и вернуть true (запрос не уходит).
    function preflightFailed(built, prov) {
      S.lastPrism = Object.assign({ at: Date.now(), provider: prov.label }, built);
      if (!built.report.overflow) return false;
      ui.toast(`Контекст не помещается даже после всех сокращений (${built.report.used} из ${built.report.budget} токенов), запрос не отправлен. Увеличьте объём контекста в «Настройки → Генерация» или сократите сцену и карточку. Подробности — во вкладке Prism.`, true);
      if (S.drawerOpen) { S.tab = "prism"; ui.renderDrawer(); }
      ui.renderFeed();
      return true;
    }

    /* Начало сцены при «Одно системное сообщение». Реплику пользователя не подделываем никогда.
       Perchance получает текстовую инструкцию без шаблона чата — запрос только из system допустим.
       OpenAI-совместимый сервер со строгим шаблоном (Mistral, Gemma…) требует первый ход пользователя:
       без него шаблон бросает ошибку чередования или молча теряет system. Узнать шаблон заранее нельзя,
       поэтому для такого провайдера начало сцены отклоняется ДО вызова: ничего не меняется,
       пользователь может написать первым или выключить режим. → true, если отклонено. */
    function openingBlocked(built, prov) {
      if (!built.report.needsUserFirst || prov.kind === "perchance") return false;
      ui.toast("В режиме «Одно системное сообщение» модель со строгим шаблоном не может начать пустую сцену: шаблону нужен первый ход пользователя, а подделывать его Prism не будет. Напишите первым или выключите этот режим в «Настройки → Генерация».", true);
      ui.renderFeed();
      return true;
    }

    /* Начало сцены моделью (пустой чат, по явному действию пользователя).
       Транзакция: сборка Prism → проверка бюджета → вызов модели (поток — только во временном
       состоянии S.gen, в дереве узла нет) → разбор → ОДНА запись корневого сообщения → leafId → сохранение.
       Переполнение, ошибка, отмена или пустой ответ не меняют ни дерево, ни leafId: чат остаётся пустым,
       можно повторить. Фальшивой реплики пользователя нет: указание OPENING — временное, вне истории.
       → { ok, reason? } */
    async function opening(prov) {
      const c = ctx.chat(), cd = ctx.card();
      if (chat().path().length) return { ok: false, reason: "not-empty" };
      const ms = messenger();
      const msNow = ms ? ms.now() : undefined;
      const built = prism().build([], OPENING, SCN.forGeneration([], { mode: "opening" }), Object.assign({ allowSyntheticUser: false, operation: "opening" }, ms ? { messengerNow: msNow } : {}));
      if (preflightFailed(built, prov)) return { ok: false, reason: "overflow" };
      if (openingBlocked(built, prov)) return { ok: false, reason: "needs-user-first" };

      const ctrl = new AbortController();
      const chatId = c.id;
      S.gen = { ctrl, msgId: OPENING_ID, opening: true, raw: "", reasoning: "", prefix: "" };
      ui.renderFeed();
      if (S.drawerOpen && S.tab === "prism") ui.renderDrawer();
      ui.scrollBottom();

      const onDelta = (d) => { if (!S.gen) return; S.gen.raw += d.text || ""; S.gen.reasoning += d.reasoning || ""; ui.paintStreaming(); };
      let res = null, error = null;
      try {
        res = await LLM.chat(prov, built.messages, { names: { char: cd.name, user: ctx.persona().name }, sampler: S.settings.sampler, signal: ctrl.signal, onDelta });
      } catch (e) {
        if (e.name !== "AbortError") error = e.message || String(e);
      }
      const aborted = ctrl.signal.aborted;
      S.gen = null;
      let th = null, parsed = null, dr = null;
      if (!aborted && !error) {
        th = OA.splitThink((res && res.text) || "");
        parsed = SC.parse(th.text);
        dr = IC.parseDraws(parsed.text);
        if (!built.report.imageDirectiveAllowed) dr.draws = [];
        else dr.draws = dr.draws.slice(0, 1);
        if (!dr.text.trim()) error = "модель вернула пустой ответ";
      }
      if (aborted || error || S.chatId !== chatId) {
        if (error) ui.toast(`Не удалось начать сцену: ${error}. Можно попробовать ещё раз.`, true);
        prism().refresh();
        ui.renderFeed();
        if (S.drawerOpen) ui.renderDrawer();
        return { ok: false, reason: aborted ? "aborted" : error ? "error" : "chat-changed" };
      }

      const m = chat().newMsg("assistant", null, "");
      m.opening = "generated";
      m.swipes = [{ text: dr.text, ...chat().sceneFields(parsed.ops), draws: dr.draws, reasoning: [(res && res.reasoning) || "", th.reasoning].filter(Boolean).join("\n").trim(), createdAt: Date.now() }];
      if (ms) { const snap = ms.snapshot([], msNow); if (snap) m.swipes[0].messengerAt = snap; }
      await chat().putMsg(m);
      c.leafId = m.id;
      await chat().touch();
      prism().refresh();
      ui.renderFeed();
      ui.renderRail();
      if (S.drawerOpen) ui.renderDrawer();
      ui.scrollBottom();
      const shownAt = now();
      return { ok: true, msgId: m.id, chatId: c.id, shownAt, post: afterReply(m, prov, dr.draws.length ? dr.draws[0] : null) };
    }

    /* Проверка инициативы (FOUNDATION-D): только переписка и только по явному действию пользователя.
       Транзакция, как у начала сцены: допустимость → поводы → сборка Prism (с разделом поводов и временным указанием)
       → проверка бюджета → вызов модели (поток — только во временном S.gen, в дереве узла нет) → разбор →
       сверка контекста (тот же чат, тот же путь и варианты) → ОДНА запись: новое сообщение (или новый вариант
       сообщения-инициативы при regenId). Отказ [no-message], переполнение, ошибка, отмена, пустой или испорченный
       ответ, смена чата/ветки — ничего не записывают (ни сообщения, ни варианта, ни метки времени).
       Среда, договорённости, мир, опыт, сцена и карточка не меняются никогда.
       → { ok, outcome: "sent" | "declined" | "ineligible" | "overflow" | "error" | "aborted" | "empty" | "malformed" | "stale", code?, msgId? } */
    async function initiative(regenId, opts) {
      const o = opts || {};
      const c0 = ctx.chat();
      // Ход уже принят в этом чате — проверка не запускается; незавершённый разбор — сначала дождаться (видимо).
      if (c0 && !o.turn && S.turn && S.turn.chatId === c0.id) return { ok: false, outcome: "ineligible", code: "busy" };
      if (c0 && !o.turn && !S.gen && state() && state().pending(c0.id)) {
        const w = await waitForState("initiative");
        if (w.refused) { releaseTurn(w.turn); if (w.refused === "context-changed") ui.toast("Пока шёл разбор предыдущего ответа, чат или ветка изменились — проверка не запущена.", true); return { ok: false, outcome: "stale" }; }
        let r = null;
        try { r = await initiative(regenId, { turn: w.turn }); return r; }
        finally { releaseTurn(w.turn); ready(r); }
      }
      const c = ctx.chat(), cd = ctx.card(), prov = ctx.provider();
      const ms = messenger();
      const full = c ? chat().path() : [];
      const target = regenId ? S.messages.find((m) => m.id === regenId) : null;
      const regen = !!(target && INI.isInitiative(target));
      const done = (outcome, extra) => Object.assign({ ok: outcome === "sent", outcome }, extra || {});
      if (regenId && !regen) return done("ineligible", { code: "not-initiative" });
      // Другой вариант — только у сообщения на АКТИВНОЙ ветке; иначе контекст был бы неверным (indexOf = -1).
      if (regen && full.indexOf(target) < 0) return done("ineligible", { code: "not-on-path" });
      const path = regen ? full.slice(0, full.indexOf(target)) : full;
      const el = INI.eligibility({ mode: c && c.mode, hasCard: !!cd, generating: !!S.gen, path, provider: prov, singleSystem: !!S.settings.singleSystem, regen });
      if (!el.eligible) {
        if (el.code !== "busy") ui.toast(el.reason, el.code !== "already-initiated" && el.code !== "reply-pending");
        return done("ineligible", { code: el.code });
      }
      // Момент переписки — один раз, при подготовке (живое время — часы, ручное — сохранённое); после ответа не пересчитывается.
      const msNow = ms.now();
      const conv = ms.context(path, msNow).conversation;
      const reasons = INI.reasons(conv, msNow);
      const built = prism().build(path, INI.INSTRUCTION, SCN.forGeneration(path, { mode: "new" }),
        { allowSyntheticUser: false, messengerNow: msNow, initiative: { reasons } });
      if (preflightFailed(built, prov)) return done("overflow");

      const chatId = c.id, key = pathKey(full);
      const ctrl = new AbortController();
      S.gen = { ctrl, msgId: regen ? target.id : INITIATIVE_ID, initiative: true, raw: "", reasoning: "", prefix: "" };
      ui.renderFeed();
      if (S.drawerOpen && S.tab === "prism") ui.renderDrawer();
      ui.scrollBottom();

      const onDelta = (d) => { if (!S.gen) return; S.gen.raw += d.text || ""; S.gen.reasoning += d.reasoning || ""; ui.paintStreaming(); };
      const vars = { char: cd.name, user: ctx.persona().name };
      let res = null, error = null;
      try {
        res = await LLM.chat(prov, built.messages, { names: vars, sampler: S.settings.sampler, signal: ctrl.signal, onDelta, outputFormat: "message-body", closing: U.macros(INI.CLOSING, vars) });
      } catch (e) {
        if (e.name !== "AbortError") error = e.message || String(e);
      }
      const aborted = ctrl.signal.aborted;
      /* Замок генерации (S.gen) держится до конца записи: пока сообщение сохраняется и меняется leafId, повторная проверка
         и любая другая генерация отклоняются как «busy». Снимается в finally — и при ошибке хранилища тоже, только если он наш. */
      const lock = S.gen;
      const release = () => { if (S.gen === lock) S.gen = null; };
      const finish = (outcome, msg, isErr) => {
        release();
        if (msg) ui.toast(msg, !!isErr);
        prism().refresh();
        ui.renderFeed();
        if (S.drawerOpen) ui.renderDrawer();
        return done(outcome);
      };
      if (aborted) return finish("aborted");
      if (error) return finish("error", `Проверка инициативы не удалась: ${error}. Ничего не изменилось — можно попробовать ещё раз.`, true);
      const th = OA.splitThink((res && res.text) || "");
      const parsed = SC.parse(th.text);
      const dr = IC.parseDraws(parsed.text);
      if (!built.report.imageDirectiveAllowed) dr.draws = [];
      else dr.draws = dr.draws.slice(0, 1);
      const r = INI.parse(dr.text);
      // Ответ пришёл в другой контекст (чат, ветка или вариант сменились) — не дописываем не туда.
      if (S.chatId !== chatId || !ctx.chat() || pathKey(chat().path()) !== key) return finish("stale", "Пока шла проверка, чат или ветка изменились — ответ не сохранён.", true);
      if (r.kind === "decline") return finish("declined", "Персонаж решил пока не писать.");
      if (r.kind === "empty") return finish("empty", "Модель вернула пустой ответ — ничего не сохранено.", true);
      if (r.kind === "malformed") return finish("malformed", "Модель вернула служебный маркер вперемешку с текстом — ответ не сохранён, можно попробовать ещё раз.", true);

      const sw = { text: r.text, ...chat().sceneFields(parsed.ops), draws: dr.draws,
        reasoning: [(res && res.reasoning) || "", th.reasoning].filter(Boolean).join("\n").trim(), createdAt: Date.now(), initiative: INI.provenance(reasons) };
      const snap = ms.snapshot(path, msNow);
      if (snap) sw.messengerAt = snap;
      let msg;
      if (lock) lock.committing = true;
      try {
        /* Сообщение (или новый вариант) и чат (leafId, превью) — одной транзакцией (chat/service.commitMessage):
           либо записано всё, либо ничего; память меняется только после успеха. */
        if (regen) {
          const next = JSON.parse(JSON.stringify(target));
          next.swipes.push(sw);
          next.swipeIdx = next.swipes.length - 1;
          msg = await chat().commitMessage(next);
        } else {
          const next = chat().newMsg("assistant", c.leafId, "");
          next.swipes = [sw];
          msg = await chat().commitMessage(next, next.id);
        }
      } catch (e) {
        return finish("error", `Не удалось сохранить сообщение: ${e && (e.message || e.name) || "ошибка хранилища"}.`, true);
      } finally {
        release();
      }
      prism().refresh();
      ui.renderFeed();
      ui.renderRail();
      if (S.drawerOpen) ui.renderDrawer();
      ui.scrollBottom();
      return Object.assign(done("sent"), { msgId: msg.id, chatId: c.id, shownAt: now(), post: afterReply(msg, prov, dr.draws.length ? dr.draws[0] : null) });
    }

    /* PERF-01: отправка реплики пользователя как один ход.
       Реплика принимается сразу, даже пока разбирается предыдущий ответ: она держится в памяти (S.turn),
       узла в дереве нет. Ход привязан к чату и пути (сообщения + свайпы) на момент нажатия.
       Порядок: дождаться разборов этого чата → сверить чат и путь → записать реплику → разобрать её
       (следующей генерации нужны её события) → генерация. Отмена, смена чата/ветки/свайпа — реплика
       не пишется, текст возвращается в поле ввода своего чата (ui.restoreDraft). Двойное нажатие —
       одна реплика: пока ход этого чата не завершён, второй не принимается.
       extra: { messengerAt } — метка переписки, снятая в момент нажатия.
       → { outcome: "busy" | "sent" | "cancelled" | "context-changed" | "left-chat", msgId?, reply? } */
    async function send(text, extra) {
      const c = ctx.chat();
      const body = String(text || "").trim();
      if (!c || !body) return { outcome: "busy" };
      if (S.gen || (S.turn && S.turn.chatId === c.id)) return { outcome: "busy" };
      // Ход, ждущий в другом чате, отменяется: его текст вернётся в тот чат.
      if (S.turn) cancelTurn();
      const pressedAt = now();
      const st = state(), w0 = st && st.pending(c.id);
      // PERF-02B: only with a separately configured processing provider, overlap
      // the read-only user interpretation with an already-running assistant
      // observer. The user message is NOT inserted until the branch gate passes.
      // Provider and input are snapped at send time; stale/cancelled previews
      // have no persistent effect.
      const observerProvider = ctx.processingProvider ? ctx.processingProvider() : ctx.provider();
      const roleProvider = ctx.provider();
      const prepared = w0 && st && st.prepareUser && observerProvider && roleProvider &&
        observerProvider.id !== roleProvider.id ? st.prepareUser(body, observerProvider) : null;
      let turn;
      if (w0) {
        const w = await waitForState("send", { text: body, extra: extra || null, pressedAt });
        turn = w.turn;
        if (w.refused) {
          if (!turn.cancelled) restore(turn, w.refused === "context-changed" ? "Пока разбирался предыдущий ответ, чат, ветка или текст истории изменились — сообщение не отправлено, текст возвращён в поле ввода." : "");
          releaseTurn(turn);
          return { outcome: w.refused };
        }
      } else {
        turn = S.turn = { chatId: c.id, kind: "send", key: turnKey(chat().path()), text: body, extra: extra || null, pressedAt, phase: "user-state", at: pressedAt, waitedMs: 0 };
        renderComposer();
      }
      let reply = null;
      try {
        turn.phase = "user-state";
        renderComposer();
        const sent = await chat().addUserMessage(body, extra || null);
        ui.renderFeed();
        ui.scrollBottom();
        // Следующей генерации нужны события этой реплики и всего, что ещё разбирается в этом чате.
        if (st) { await st.track(sent, observerProvider, prepared ? { prepared } : undefined); await st.settle(c.id); }
        // Пользователь мог уйти в другой чат или ветку, пока разбиралась его реплика: она сохранена, ответ не запускается.
        if (S.chatId !== turn.chatId || !ctx.chat() || !chat().path().includes(sent)) return { outcome: "left-chat", msgId: sent.id };
        turn.phase = "generating";
        perf("sendToRoleplayMs", Math.round(now() - pressedAt), { chatId: c.id, msgId: sent.id, outcome: w0 ? "queued" : "direct" });
        reply = await generate(null, "new", { turn });
        return { outcome: "sent", msgId: sent.id, reply };
      } finally {
        releaseTurn(turn);
        ready(reply);
      }
    }
    // Ответ показан → переписка снова принимает ввод: сколько прошло (мс). Только число.
    function ready(reply) { if (reply && reply.shownAt != null) perf("readyAfterReplyMs", Math.round(now() - reply.shownAt), { msgId: reply.msgId, chatId: reply.chatId }); }
    function restore(turn, message) {
      if (typeof ui.restoreDraft === "function") ui.restoreDraft(turn.chatId, turn.text);
      if (message) ui.toast(message, true);
    }
    // Отменить ход, ожидающий разбора (кнопка «Отменить» у поля ввода или новый ход в другом чате).
    function cancelTurn() {
      const t = S.turn;
      if (!t || t.phase !== "waiting-state") return false;
      t.cancelled = true;
      if (typeof t.onCancel === "function") t.onCancel();
      if (t.kind === "send") restore(t);
      releaseTurn(t);
      return true;
    }

    function stop() { if (S.gen) S.gen.ctrl.abort(); }

    return { generate, initiative, send, cancelTurn, stop, OPENING, INITIATIVE_ID };
  }

  PRP.generationService = { create };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/cards/service.js */
/* Prism RP — карточки персонажей (прикладной уровень).
   Импорт в два шага: prepareImport читает файлы и прогоняет их через конвейер cards/import.js
   (формат → адаптер → канонический черновик → проверка) и НИЧЕГО не сохраняет; commitImport
   сохраняет только подтверждённые на экране проверки черновики. Импортированные указания автора
   включаются лишь по явному выбору пользователя.
   Также: сохранение черновика редактора, удаление с каскадом, экспорт JSON/PNG.
   Смысл форматов — в cards/formats/*, модель — в cards/model.js. Файловый ввод-вывод — PRP.files. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const U = PRP.util, CC = PRP.ccard, CM = PRP.cardModel, IMP = PRP.cardImport;

  function create(ctx) {
    const { S, DB } = ctx;
    const F = () => ctx.files;

    // Черновик для редактора: копия карточки или новая пустая.
    function draft(cd) { return U.clone(cd ? CM.upgradeStored(cd) : CM.blank()); }

    /* Шаг 1 импорта: файлы → результаты проверки, без сохранения.
       → [{ ok, fileName, detection, draft | null, issues, avatar }] */
    async function prepareImport(files) {
      const out = [];
      for (const file of files) {
        let r;
        try {
          const isJson = /\.json$/i.test(file.name) || file.type === "application/json";
          if (isJson) r = IMP.fromJsonText(await F().readFile(file, "text"), file.name);
          else {
            r = IMP.fromPngBytes(new Uint8Array(await F().readFile(file)), file.name);
            if (r.ok) r.avatar = await F().readFile(file, "dataurl");
          }
        } catch (e) {
          r = { ok: false, fileName: file.name, detection: { format: "unknown", version: "", sourceType: "", reason: "" }, draft: null, issues: [{ level: "error", code: "read", message: "Файл не удалось прочитать: " + (e.message || e) }] };
        }
        out.push(r);
      }
      return out;
    }

    /* Шаг 2 импорта: сохранить подтверждённые черновики.
       choices[i] = { system: bool, postHistory: bool } — явное включение импортированных указаний
       (по умолчанию выключены). Файлы с ошибками не сохраняются никогда. → [сохранённые карточки] */
    async function commitImport(items, choices) {
      const saved = [];
      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        if (!it || !it.ok || !it.draft) continue;
        const cd = U.clone(it.draft);
        const ch = (choices && choices[i]) || {};
        for (const k of ["system", "postHistory"]) {
          const dv = cd.directives[k];
          if (dv.origin === "imported" && ch[k] === true && dv.text.trim()) { dv.enabled = true; dv.reviewed = true; }
        }
        cd.id = U.uid("card");
        cd.avatar = it.avatar || null;
        cd.createdAt = cd.updatedAt = Date.now();
        await DB.put("cards", cd);
        S.cards.unshift(cd);
        saved.push(cd);
      }
      return saved;
    }

    // Сохранить черновик редактора. → { error } или { card, isNew }.
    async function save(d) {
      d.name = (d.name || "").trim();
      if (!d.name) return { error: "Дайте персонажу имя." };
      if (d.image && d.image.loras) d.image.loras = d.image.loras.filter((l) => l.name);
      d.customFields = CM.normalizeCustomFields(d.customFields);
      d.altGreetings = (d.altGreetings || []).map((g) => String(g || "").trim()).filter(Boolean);
      d.updatedAt = Date.now();
      const isNew = !d.id;
      if (isNew) { d.id = U.uid("card"); d.createdAt = Date.now(); }
      await DB.put("cards", d);
      const i = S.cards.findIndex((x) => x.id === d.id);
      if (i >= 0) S.cards[i] = d; else S.cards.unshift(d);
      return { card: d, isNew };
    }

    // Удалить персонажа вместе со всеми его чатами (с их сообщениями, картинками и наложением мира) и опытом.
    async function remove(cd) {
      for (const c of S.chats.filter((x) => x.cardId === cd.id)) {
        const ms = await DB.byIndex("messages", "chatId", c.id);
        await DB.delMany("messages", ms.map((m) => m.id));
        await DB.delMany("images", (await DB.byIndex("images", "chatId", c.id)).map((x) => x.id));
        await DB.del("worldOverlays", c.id); // наложение мира принадлежит чату и уходит вместе с ним
        await DB.del("messengerEnvironments", c.id); // как и среда переписки
        await DB.del("chats", c.id);
      }
      const xs = await DB.byIndex("experience", "owner", cd.id);
      await DB.delMany("experience", xs.map((x) => x.id));
      // Линза мира принадлежит персонажу и удаляется с ним; общий пак остаётся (world/service).
      if (ctx.svc && ctx.svc.world) await ctx.svc.world.removeForCard(cd.id);
      await DB.del("cards", cd.id);
      S.cards = S.cards.filter((c) => c.id !== cd.id);
      S.chats = S.chats.filter((c) => c.cardId !== cd.id);
      if (S.cardId === cd.id) { S.cardId = null; S.chatId = null; S.messages = []; S.view = "home"; }
    }

    function exportJson(d) {
      return { name: `${d.name || "персонаж"}.json`, text: JSON.stringify(CC.toSpec(d, "v3"), null, 2) };
    }
    async function exportPng(d) {
      return { name: `${d.name || "персонаж"}.png`, blob: new Blob([CC.embedInPng(await F().avatarPngBytes(d), d)], { type: "image/png" }) };
    }

    return { draft, prepareImport, commitImport, save, remove, exportJson, exportPng };
  }

  PRP.cardService = { create };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/world/service.js */
/* Prism RP — сервис мира (прикладной уровень): общие паки мира и линзы персонажей.
   Загрузка, сохранение с проверкой, правила удаления, импорт и экспорт паков, превью «Мир персонажа».
   Смысл — в чистых модулях world/model, world/lens, world/validate, world/resolve; хранилище — через ctx.DB.
   Сохраняется только то, что прошло проверку world/validate (ошибки блокируют, предупреждения возвращаются).
   Мир в контекст модели здесь НЕ подаётся (это FOUNDATION-W2). DOM не трогает. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const WM = PRP.worldModel, WL = PRP.worldLens, WR = PRP.worldResolve, WV = PRP.worldValidate;

  const PACKS = "worldPacks", LENSES = "worldLenses";
  const clone = (x) => JSON.parse(JSON.stringify(x));

  function create(ctx) {
    const { S, DB } = ctx;
    const upsert = (list, x) => { const i = list.findIndex((y) => y.id === x.id); if (i >= 0) list[i] = x; else list.push(x); };

    async function loadAll() {
      S.worldPacks = (await DB.all(PACKS)).map(WM.normalize).sort((a, b) => a.name.localeCompare(b.name));
      S.worldLenses = (await DB.all(LENSES)).map(WL.normalize);
    }
    const packById = (id) => (S.worldPacks || []).find((p) => p.id === id) || null;
    const lensForCard = (cardId) => (S.worldLenses || []).find((l) => l.cardId === cardId) || null;
    const lensesForPack = (packId) => (S.worldLenses || []).filter((l) => l.packId === packId);

    /* Паки. → { pack } или { error, issues } */
    function newPack(name) { return WM.blank(name || "Новый мир"); }
    const errorsText = (issues) => issues.filter((x) => x.level === "error").map((x) => x.message).join(" ");
    async function savePack(draft) {
      const issues = WV.validatePack(draft);
      if (WV.hasErrors(issues)) return { error: issues.filter((x) => x.level === "error").map((x) => x.message).join(" "), issues };
      const p = WM.normalize(draft);
      p.updatedAt = Date.now();
      await DB.put(PACKS, p);
      upsert((S.worldPacks = S.worldPacks || []), p);
      return { pack: p, issues };
    }
    /* Удаление пака запрещено, пока на него ссылаются линзы: иначе они осиротели бы молча.
       → { ok } или { blocked: [{ lensId, cardId }] } — имена персонажей для сообщения подставляет интерфейс. */
    async function deletePack(id) {
      const refs = (await DB.byIndex(LENSES, "packId", id)) || [];
      if (refs.length) return { blocked: refs.map((l) => ({ lensId: l.id, cardId: l.cardId })) };
      await DB.del(PACKS, id);
      S.worldPacks = (S.worldPacks || []).filter((p) => p.id !== id);
      return { ok: true };
    }
    function exportPack(id) {
      const p = packById(id);
      if (!p) return null;
      return { name: `${p.name || "мир"}.world.json`, text: JSON.stringify(WM.exportPack(p), null, 2) };
    }
    // Импорт: проверка до сохранения; битый или чужой файл — ошибка, ничего не сохраняется.
    async function importPack(text) {
      const r = WM.importPackText(text);
      if (!r.ok) return { error: errorsText(r.issues) || "Файл не принят.", issues: r.issues };
      return savePack(r.pack);
    }

    /* Линзы. Одна линза на персонажа; линза хранит только отличия от пака. */
    async function saveLens(draft) {
      // Линза — только к существующему паку: иначе отказ, без записи и без изменения состояния. Пак не создаётся.
      const pack = packById(draft && draft.packId);
      if (!pack) { const miss = [WV.packMissing(draft && draft.packId)]; return { error: errorsText(miss), issues: miss }; }
      // Проверяется черновик как есть (до приведения), чтобы битые записи не «чинились» молча.
      const issues = WV.validateLens(draft, pack);
      if (WV.hasErrors(issues)) return { error: errorsText(issues), issues };
      const l = WL.normalize(draft);
      // Одна линза на персонажа: вторая отклоняется (то же ограничение держит уникальный индекс cardId в базе).
      const one = WV.validateOneLensPerCard(l, await DB.byIndex(LENSES, "cardId", l.cardId));
      if (WV.hasErrors(one)) return { error: errorsText(one), issues: one };
      l.updatedAt = Date.now();
      await DB.put(LENSES, l);
      upsert((S.worldLenses = S.worldLenses || []), l);
      return { lens: l, issues };
    }
    async function deleteLens(id) {
      await DB.del(LENSES, id);
      S.worldLenses = (S.worldLenses || []).filter((l) => l.id !== id);
    }
    // Сохранение раздела «Мир» редактора персонажа: черновик линзы или null — снять связь с миром.
    async function saveLensForCard(cardId, draft) {
      const cur = lensForCard(cardId);
      if (!draft || !draft.packId) { if (cur) await deleteLens(cur.id); return { lens: null }; }
      // Редактор правит единственную линзу персонажа: если в этой правке связь снимали и ставили заново,
      // черновик получил новый id — запись остаётся той же (id существующей линзы), второй не появляется.
      return saveLens(Object.assign({}, draft, { cardId }, cur ? { id: cur.id, createdAt: cur.createdAt } : {}));
    }
    // Персонаж удалён — его линза тоже (она только его). Пак остаётся.
    async function removeForCard(cardId) {
      const ls = (await DB.byIndex(LENSES, "cardId", cardId)) || [];
      await DB.delMany(LENSES, ls.map((l) => l.id));
      S.worldLenses = (S.worldLenses || []).filter((l) => l.cardId !== cardId);
    }

    /* Превью «Мир персонажа» для редактора: только просмотр. → { pack, lensIssues, ...resolve() } | null */
    function preview(lensDraft) {
      if (!lensDraft || !lensDraft.packId) return null;
      const pack = packById(lensDraft.packId);
      if (!pack) return { pack: null, missingPack: lensDraft.packId, facts: [], excluded: [], report: { warnings: [{ level: "warning", code: "pack-missing", message: "Пак мира не найден." }] } };
      const lens = WL.normalize(lensDraft);
      return Object.assign({ pack, lensIssues: WV.validateLens(Object.assign({}, lensDraft, { id: lensDraft.id || "draft", cardId: lensDraft.cardId || "draft" }), pack) }, WR.resolve(pack, lens));
    }
    // Пустые заготовки для форм (идентификаторы выдаёт модель).
    const newFact = (prefix) => WM.fact({}, prefix || "wf");
    const newOverride = (targetFactId, text) => WL.override({ targetFactId, text });
    const newLens = (cardId, packId) => WL.blank(cardId, packId);
    function draftLens(cardId) {
      const cur = lensForCard(cardId);
      return cur ? clone(cur) : null;
    }

    return { loadAll, packById, lensForCard, lensesForPack, newPack, savePack, deletePack, exportPack, importPack,
      saveLens, deleteLens, saveLensForCard, removeForCard, preview, draftLens, newFact, newOverride, newLens };
  }

  PRP.worldService = { create };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/world/overlay-service.js */
/* Prism RP — сервис мира чата (прикладной уровень): наложение мира на чат, канон с учётом ветки,
   отбор фактов для Prism и явные действия пользователя.

   • Хранение: коллекция worldOverlays, одна запись на чат (ключ chatId). В S — только наложение текущего чата.
   • Канон: пак и линза персонажа чата (world/resolve) + наложение + активная ветка (world/canon),
     затем отбор по таймлайну/варианту чата и по релевантности (world/retrieve).
   • Для генерации всё только читается: context() ничего не пишет. Наложение меняется только
     явным действием пользователя (commit, setSelectors) — никогда из ответа модели, сцены, опыта или сценария.
   DOM не трогает; ветку и сцену берёт у сервиса чата, пак и линзу — у сервиса мира (W1). */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const OV = PRP.worldOverlay, WC = PRP.worldCanon, WRT = PRP.worldRetrieve, WR = PRP.worldResolve, BR = PRP.branch, TR = PRP.tree;

  const STORE = "worldOverlays";
  const clone = (x) => JSON.parse(JSON.stringify(x));

  function create(ctx) {
    const { S, DB } = ctx;
    const chat = () => ctx.svc.chat, world = () => ctx.svc.world;

    async function load(chatId) {
      const rec = chatId ? await DB.get(STORE, chatId) : null;
      S.worldOverlay = rec ? OV.normalize(rec, chatId) : chatId ? OV.blank(chatId) : null;
      return S.worldOverlay;
    }
    // Наложение текущего чата (только из S, без хранилища). Чужое наложение не возвращается никогда.
    function current() {
      const c = ctx.chat();
      if (!c) return null;
      return S.worldOverlay && S.worldOverlay.chatId === c.id ? S.worldOverlay : OV.blank(c.id);
    }

    // Слой W1 для персонажа чата: пак + линза. Нет линзы — нет пака; линза к пропавшему паку — предупреждение.
    function base() {
      const cd = ctx.card();
      const lens = cd && world() ? world().lensForCard(cd.id) : null;
      if (!lens) return { base: null, lens: null, pack: null };
      const pack = world().packById(lens.packId);
      if (!pack) return { base: { facts: [], excluded: [], report: { warnings: [{ level: "warning", code: "pack-missing", message: `Пак мира ${lens.packId} не найден.`, ref: lens.packId }] } }, lens, pack: null };
      return { base: WR.resolve(pack, lens), lens, pack };
    }

    /* Канон для ветки p (по умолчанию — активной): действующие факты, исключения, события, отбор по селекторам. */
    function canon(p) {
      const c = ctx.chat();
      const path = p || chat().path();
      const ov = current();
      const b = base();
      const r = WC.resolveChat(b.base, ov, { chatId: c ? c.id : null, path: chat().pathCtx(path) });
      const sel = WC.filterSelectors(r.facts, { timeline: ov ? ov.timeline : "", variant: ov ? ov.variant : "" });
