<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Prism RP — дизайн-система.
   Идея: свет, разложенный призмой. Спокойные сливово-чернильные поверхности;
   единственный яркий элемент — спектральная линия под шапкой чата, которая
   течёт, пока модель пишет. Интерфейс — Onest, ролевая проза — Literata. */

:root, [data-theme="dusk"] {
  --bg: #15131d;
  --surface: #1c1a27;
  --raised: #252233;
  --sunken: #110f18;
  --line: #322d45;
  --line-soft: #26223a;
  --text: #ece7f6;
  --text-2: #b9b2cf;
  --muted: #8d86a6;
  --accent: #b79cff;
  --accent-strong: #9c7bff;
  --accent-ink: #160f2b;
  --accent-wash: rgba(183, 156, 255, .12);
  --me: #4a3a8c;
  --me-ink: #f3efff;
  --them: #221f30;
  --ok: #6fd6a8;
  --warn: #f2c26b;
  --danger: #ff8a9a;
  --prose: #e9e4f2;
  --action: #a99fc4;
  --speech: #fff6e8;
  --shadow: 0 18px 50px rgba(5, 3, 12, .55);
  --spectrum: linear-gradient(90deg, #7fd1ff, #b79cff 30%, #ff9ec7 55%, #ffd08a 78%, #8ff0c3);
  color-scheme: dark;
}
[data-theme="dawn"] {
  --bg: #f1eef7;
  --surface: #ffffff;
  --raised: #f6f3fb;
  --sunken: #e8e3f2;
  --line: #ddd6ea;
  --line-soft: #ebe6f3;
  --text: #1e1a2b;
  --text-2: #4b4462;
  --muted: #7a7393;
  --accent: #6b4edb;
  --accent-strong: #5636c9;
  --accent-ink: #ffffff;
  --accent-wash: rgba(107, 78, 219, .09);
  --me: #6b4edb;
  --me-ink: #ffffff;
  --them: #ffffff;
  --ok: #1f9d6c;
  --warn: #b7791f;
  --danger: #d0384f;
  --prose: #231e33;
  --action: #6e6788;
  --speech: #1e1a2b;
  --shadow: 0 18px 50px rgba(60, 40, 120, .14);
  --spectrum: linear-gradient(90deg, #39a7e6, #6b4edb 30%, #e05596 55%, #e7a33c 78%, #2fb985);
  color-scheme: light;
}
[data-theme="paper"] {
  --bg: #efe8dc;
  --surface: #f8f3ea;
  --raised: #f2ebdf;
  --sunken: #e6dccc;
  --line: #d9ccb6;
  --line-soft: #e5dacb;
  --text: #2b2318;
  --text-2: #54473a;
  --muted: #85766a;
  --accent: #7a4d9e;
  --accent-strong: #653a8a;
  --accent-ink: #fbf6ff;
  --accent-wash: rgba(122, 77, 158, .1);
  --me: #7a4d9e;
  --me-ink: #fbf6ff;
  --them: #fbf7f0;
  --ok: #3f8a5c;
  --warn: #9c6a12;
  --danger: #b03a3a;
  --prose: #2b2318;
  --action: #7a6a5a;
  --speech: #1f1810;
  --shadow: 0 18px 50px rgba(80, 60, 30, .15);
  --spectrum: linear-gradient(90deg, #3d8fc2, #7a4d9e 30%, #c2507e 55%, #c98a2a 78%, #3f9a72);
  color-scheme: light;
}

:root {
  --ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --read: "Literata", Georgia, "Times New Roman", serif;
  --fs: 15px;
  --prose-fs: 17px;
  --r-s: 8px;
  --r-m: 12px;
  --r-l: 18px;
  --rail: 264px;
  --drawer: 384px;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: var(--fs)/1.5 var(--ui); -webkit-font-smoothing: antialiased; text-align: left; }
button, input, textarea, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent-wash); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ── Каркас ─────────────────────────────────────────────────────────── */
/* Perchance по умолчанию центрирует текст страницы — возвращаем обычное выравнивание. */
.app { text-align: left; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100dvh; overflow: hidden; }
/* Служебные контейнеры не участвуют в сетке: их содержимое позиционируется фиксированно. */
#pop-root, #modal-root { display: contents; }
.rail { background: var(--surface); border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; min-height: 0; }
.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }

.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; background: none; border: 0; cursor: pointer; text-align: left; }
.brand-glyph { width: 26px; height: 26px; flex: none; }
.rail-nav { padding: 0 10px; display: flex; flex-direction: column; gap: 2px; }
.rail-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-s); border: 0; background: none; cursor: pointer; color: var(--text-2); text-align: left; width: 100%; }
.rail-item:hover { background: var(--raised); color: var(--text); }
.rail-item.active { background: var(--accent-wash); color: var(--text); }
.rail-item svg { width: 18px; height: 18px; flex: none; }
.rail-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 6px; color: var(--muted); font-size: 13px; }
.rail-chats { flex: 1; overflow: auto; padding: 0 10px 10px; }
.rail-chat { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: var(--r-m); cursor: pointer; }
.rail-chat:hover { background: var(--raised); }
.rail-chat.active { background: var(--raised); box-shadow: inset 2px 0 0 var(--accent); }
.rail-chat .t1 { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-chat .t2 { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-chat .kind { color: var(--muted); }
.rail-chat .kind svg { width: 15px; height: 15px; }
.rail-foot { border-top: 1px solid var(--line-soft); padding: 10px; display: flex; gap: 6px; }

/* ── Кнопки и поля ──────────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--raised); padding: 8px 14px; border-radius: var(--r-m); cursor: pointer; white-space: nowrap; color: var(--text); font-weight: 500; line-height: 1.2; }
.btn:hover { border-color: var(--accent); }
.btn svg { width: 17px; height: 17px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--raised); border-color: transparent; color: var(--text); }
.btn-danger { background: transparent; border-color: color-mix(in srgb, var(--danger) 50%, transparent); color: var(--danger); }
.btn-sm { padding: 5px 10px; font-size: 13.5px; border-radius: var(--r-s); }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: var(--r-s); border: 0; background: none; color: var(--text-2); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--raised); color: var(--text); }
.icon-btn.on { color: var(--accent); background: var(--accent-wash); }
.icon-btn svg { width: 19px; height: 19px; }
.file-btn input { display: none; }

.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; min-width: 0; }
.field > label, .label { font-size: 13px; color: var(--text-2); font-weight: 500; display: inline-flex; align-items: center; gap: 4px 6px; flex-wrap: wrap; }
.label svg, .field > label svg { width: 15px; height: 15px; flex: none; }
.field .help { font-size: 12.5px; color: var(--muted); }
.input, .field input:not([type=checkbox]):not([type=range]), .field textarea, .field select {
  width: 100%; background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r-s); padding: 8px 10px; color: var(--text);
}
.field textarea { resize: vertical; min-height: 76px; line-height: 1.5; }
.input:focus, .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
.row { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.row > .btn { align-self: flex-end; }
.row > .field { flex: 1; min-width: 100px; }
.check { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; margin: 8px 0; cursor: pointer; text-align: left; }
.check > span { flex: 1; min-width: 0; }
.checks { display: flex; flex-wrap: wrap; gap: 0 18px; }
.checks .check { margin: 4px 0; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.check small { display: block; color: var(--muted); font-size: 12.5px; }

.seg { display: inline-flex; background: var(--sunken); border: 1px solid var(--line-soft); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 13px; border-radius: 999px; cursor: pointer; color: var(--text-2); font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.seg button svg { width: 15px; height: 15px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.25); }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 4px 3px 10px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line-soft); font-size: 13.5px; max-width: 100%; }
.chip > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { border: 0; background: none; color: var(--muted); cursor: pointer; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.chip button:hover { background: var(--line); color: var(--text); }
.chip button svg { width: 12px; height: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip-add { border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; min-width: 90px; width: 140px; font-size: 13.5px; color: var(--text); }
.chip-add:focus { outline: none; border-color: var(--accent); border-style: solid; }

/* ── Аватары ────────────────────────────────────────────────────────── */
.av { position: relative; flex: none; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-weight: 700; color: #fff; background: var(--raised); }
.av img { width: 100%; height: 100%; object-fit: cover; }
.av-34 { width: 34px; height: 34px; font-size: 14px; }
.av-40 { width: 40px; height: 40px; font-size: 16px; }
.av-48 { width: 48px; height: 48px; font-size: 19px; }
.av-me { background: var(--sunken); color: var(--accent); border: 1px solid var(--line); }

/* ── Главный экран ──────────────────────────────────────────────────── */
.home { flex: 1; overflow: auto; }
.home-inner { max-width: 1180px; margin: 0 auto; padding: 34px 32px 60px; }
.home-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.home h1 { font-size: 30px; line-height: 1.15; margin: 0; letter-spacing: -.02em; font-weight: 700; }
.home .sub { color: var(--text-2); margin: 6px 0 0; max-width: 60ch; }
.home-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 0 10px; height: 38px; min-width: 220px; }
.search svg { width: 17px; height: 17px; color: var(--muted); flex: none; }
.search input { border: 0; background: none; outline: none; width: 100%; height: 100%; }
.search:focus-within { border-color: var(--accent); }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 18px; }
.tile { position: relative; border-radius: var(--r-l); overflow: hidden; aspect-ratio: 3 / 4; background: var(--surface); border: 1px solid var(--line-soft); cursor: pointer; display: block; padding: 0; text-align: left; color: #fff; }
.tile:hover .tile-art { transform: scale(1.035); }
.tile-art { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.2,.7,.2,1); display: grid; place-items: center; font-size: 64px; font-weight: 700; color: rgba(255,255,255,.85); }
.tile-art img { width: 100%; height: 100%; object-fit: cover; }
.tile-shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(10, 6, 20, .88)); }
.tile-body { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px; }
.tile-name { font-weight: 700; font-size: 17px; line-height: 1.2; text-shadow: 0 1px 8px rgba(0,0,0,.4); }
.tile-tags { font-size: 12.5px; opacity: .78; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-count { position: absolute; top: 10px; right: 10px; background: rgba(10, 6, 20, .55); backdrop-filter: blur(6px); border-radius: 999px; font-size: 12px; padding: 2px 9px; }
.tile-new { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-2); border: 1.5px dashed var(--line); background: transparent; }
.tile-new:hover { border-color: var(--accent); color: var(--text); }
.tile-new svg { width: 30px; height: 30px; }
.tile-new label, .tile-new span { cursor: pointer; }

.welcome { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 8px 0 30px; }
.step { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-l); padding: 18px; }
.step h3 { margin: 6px 0 4px; font-size: 16px; }
.step p { margin: 0 0 12px; color: var(--text-2); font-size: 14px; }
.step .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-wash); color: var(--accent); font-weight: 700; font-size: 13px; }
.section-title { font-size: 15px; font-weight: 600; color: var(--text-2); margin: 30px 0 12px; }

/* ── Чат ────────────────────────────────────────────────────────────── */
.chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 18px; background: var(--surface); position: relative; min-height: 64px; }
.chat-head::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--spectrum); opacity: .35; background-size: 200% 100%; }
.app.generating .chat-head::after { opacity: 1; animation: flow 2.4s linear infinite; }
@keyframes flow { from { background-position: 0 0; } to { background-position: -200% 0; } }
.head-who { min-width: 0; flex: 1; }
.head-name { font-weight: 700; font-size: 16px; display: flex; gap: 10px; align-items: center; }
.head-name .rename { opacity: 0; }
.head-who:hover .rename { opacity: 1; }
.head-scene { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head-scene.live { color: var(--accent); }
.head-tools { display: flex; align-items: center; gap: 2px; }

.findbar { display: flex; gap: 8px; align-items: center; padding: 8px 18px; background: var(--surface); border-bottom: 1px solid var(--line-soft); }
.findbar .search { flex: 1; height: 34px; }
.findbar .count { color: var(--muted); font-size: 13px; min-width: 52px; text-align: right; }
mark { background: color-mix(in srgb, var(--warn) 40%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
mark.cur { background: var(--warn); color: #1b1300; }

.feed { flex: 1; overflow: auto; padding: 26px 22px 12px; scroll-behavior: smooth; }
.feed-inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

/* Сцена: проза */
.turn { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; }
.turn-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; }
.turn-name { font-weight: 650; font-size: 14.5px; }
.turn-time { color: var(--muted); font-size: 12px; }
.prose { font-family: var(--read); font-size: var(--prose-fs); line-height: 1.72; color: var(--prose); white-space: pre-wrap; overflow-wrap: anywhere; }
.prose em { color: var(--action); font-style: italic; }
.prose q { quotes: none; color: var(--speech); }
.prose strong { font-weight: 650; }
.turn.user .prose { font-family: var(--ui); font-size: 15.5px; line-height: 1.6; color: var(--text); }
.turn.user .bubble-plain { background: var(--raised); border: 1px solid var(--line-soft); border-radius: 4px var(--r-l) var(--r-l) var(--r-l); padding: 10px 14px; display: inline-block; max-width: 100%; }
.cursor::after { content: ""; display: inline-block; width: .5em; height: 1.05em; vertical-align: -0.15em; margin-left: 2px; background: var(--accent); animation: caret 1s steps(2) infinite; border-radius: 2px; }
@keyframes caret { 50% { opacity: 0; } }

.turn-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 8px; }
.delta { font-size: 12px; color: var(--text-2); background: var(--sunken); border: 1px solid var(--line-soft); padding: 1px 8px; border-radius: 999px; }
.tools { display: flex; align-items: center; gap: 2px; margin-top: 6px; opacity: 0; transition: opacity .15s; }
.turn:hover .tools, .turn:focus-within .tools, .turn.last .tools, .msg-row:hover .tools, .msg-row.last .tools { opacity: 1; }
.tool { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 12.5px; padding: 4px 7px; border-radius: 7px; }
.tool:hover { background: var(--raised); color: var(--text); }
.tool svg { width: 15px; height: 15px; }
.swipes { display: inline-flex; align-items: center; color: var(--muted); font-size: 12.5px; margin-right: 6px; }
.swipes .tool { padding: 4px; }
details.think { margin: 2px 0 8px; font-size: 13.5px; color: var(--muted); }
details.think summary { cursor: pointer; list-style: none; display: inline-flex; gap: 6px; align-items: center; }
details.think summary::-webkit-details-marker { display: none; }
details.think summary svg { width: 14px; height: 14px; }
details.think div { white-space: pre-wrap; margin-top: 6px; padding: 8px 12px; border-left: 2px solid var(--line); }
.err { color: var(--danger); font-size: 14px; margin-top: 6px; white-space: pre-wrap; display: flex; gap: 8px; align-items: flex-start; }
.err svg { width: 17px; height: 17px; flex: none; margin-top: 2px; }
.editor { width: 100%; min-height: 140px; background: var(--sunken); border: 1px solid var(--accent); border-radius: var(--r-m); padding: 12px; resize: vertical; font-family: var(--read); font-size: 16px; line-height: 1.6; }

/* Картинки */
.shots { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.shot { position: relative; margin: 0; width: min(100%, 440px); border-radius: var(--r-l); overflow: hidden; background: var(--sunken); border: 1px solid var(--line-soft); }
.shot img { display: block; width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.shot.wait { display: flex; flex-direction: column; }
.shot-wait { flex: 1; display: grid; place-items: center; color: var(--text-2); font-size: 14px; background:
  linear-gradient(110deg, transparent 30%, var(--accent-wash) 50%, transparent 70%) var(--sunken); background-size: 250% 100%; animation: shimmer 1.6s linear infinite; min-height: 120px; }
@keyframes shimmer { from { background-position: 150% 0; } to { background-position: -100% 0; } }
.shot-cap { font-size: 12px; color: var(--muted); padding: 8px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shot-tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; background: rgba(12, 8, 22, .62); backdrop-filter: blur(6px); border-radius: 10px; padding: 2px; opacity: 0; transition: opacity .15s; }
.shot:hover .shot-tools, .shot:focus-within .shot-tools { opacity: 1; }
.shot-tools .icon-btn { color: #f2eefc; width: 32px; height: 32px; }
.shot-tools .icon-btn:hover { background: rgba(255,255,255,.14); color: #fff; }
.shot.failed { width: auto; max-width: 440px; padding: 12px 14px; aspect-ratio: auto !important; }
.shots.in-bubble .shot { width: min(78%, 360px); }
.msg-row.them .shots.in-bubble { justify-content: flex-start; }
@media (hover: none) { .shot-tools { opacity: 1; } }
.lightbox { background: rgba(6, 4, 12, .88); }
.lb-fig { margin: 0; max-width: min(1200px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 10px; }
.lb-fig img { max-width: 100%; max-height: calc(100dvh - 120px); object-fit: contain; border-radius: var(--r-m); }
.lb-fig figcaption { display: flex; gap: 12px; align-items: center; justify-content: space-between; color: #d9d3ea; font-size: 13.5px; }
.lb-fig figcaption > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-tools { display: flex; gap: 6px; flex: none; }
.lb-tools .icon-btn { color: #f2eefc; }
.lora-rows { display: flex; flex-direction: column; gap: 6px; }
.lora-row { flex-wrap: nowrap; align-items: center; }
.prov.dim { opacity: .55; }

/* Мессенджер */
.app.messenger .feed { background:
  radial-gradient(circle at 15% 10%, var(--accent-wash), transparent 40%),
  radial-gradient(circle at 85% 90%, var(--accent-wash), transparent 45%); }
.app.messenger .feed-inner { max-width: 660px; gap: 2px; }
.daymark { align-self: center; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line-soft); padding: 2px 12px; border-radius: 999px; margin: 12px 0 8px; }
.msg-row { display: flex; flex-direction: column; margin-top: 8px; }
.msg-row.me { align-items: flex-end; }
.msg-row.them { align-items: flex-start; }
.bub { max-width: min(78%, 480px); padding: 8px 13px; border-radius: 20px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.42; margin-top: 3px; font-size: 15.5px; position: relative; }
.msg-row.me .bub { background: var(--me); color: var(--me-ink); }
.msg-row.them .bub { background: var(--them); border: 1px solid var(--line-soft); }
.msg-row.me .bub:last-of-type { border-bottom-right-radius: 6px; }
.msg-row.them .bub:last-of-type { border-bottom-left-radius: 6px; }
.stamp { font-size: 11px; color: var(--muted); margin: 3px 8px 0; }
.typing { display: inline-flex; gap: 4px; padding: 12px 15px !important; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: dot 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .18s; } .typing i:nth-child(3) { animation-delay: .36s; }
@keyframes dot { 0%, 70%, 100% { opacity: .25; transform: none; } 35% { opacity: 1; transform: translateY(-2px); } }
.status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); display: inline-block; }

/* Композер */
.composer-wrap { padding: 8px 18px 16px; }
.turn-status { max-width: 820px; margin: 0 auto 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--muted); padding: 6px 10px; border: 1px dashed var(--line); border-radius: var(--r-m); background: var(--surface); }
.turn-status.quiet { border-style: none; background: none; padding: 2px 10px; font-size: 12.5px; }
.turn-status .turn-text { color: var(--text, inherit); overflow-wrap: anywhere; min-width: 0; flex: 1 1 160px; }
.turn-status .btn { margin-left: auto; }
.turn-status .spin { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: turn-spin .9s linear infinite; flex: none; }
@keyframes turn-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .turn-status .spin { animation: none; } }
.composer { max-width: 820px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 8px 8px 8px 14px; box-shadow: var(--shadow); }
.app.messenger .composer { max-width: 660px; }
.composer:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
.composer textarea { width: 100%; border: 0; outline: none; background: none; resize: none; max-height: 240px; padding: 6px 0; line-height: 1.5; font-size: 15.5px; }
.composer-bar { display: flex; align-items: center; gap: 6px; }
.composer-bar .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-soft); background: var(--raised); border-radius: 999px; padding: 4px 11px 4px 9px; font-size: 13px; color: var(--text-2); cursor: pointer; max-width: 260px; }
.pill:hover { border-color: var(--accent); color: var(--text); }
.pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill svg { width: 15px; height: 15px; flex: none; }
/* Проверка инициативы (переписка): отдельное действие рядом с отправкой, не похожее на неё. */
.initiative-btn { border-style: dashed; color: var(--accent); flex: none; }
.initiative-btn:disabled { opacity: .45; cursor: default; }
.ini-tag { color: var(--accent); }
@media (max-width: 480px) { .composer-bar { flex-wrap: wrap; } .composer-bar .pill { max-width: 160px; } .composer-bar .initiative-btn { max-width: none; } }
.meter { width: 22px; height: 22px; flex: none; }
.meter circle { fill: none; stroke-width: 3; }
.meter .bg { stroke: var(--line); }
.meter .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dasharray .4s; }
.meter.hot .fg { stroke: var(--warn); }
.send { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.send:hover { background: var(--accent-strong); }
.send svg { width: 18px; height: 18px; }
.send.stop { background: var(--danger); color: #fff; }

/* Поповеры */
.pop { position: fixed; z-index: 60; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); box-shadow: var(--shadow); padding: 6px; min-width: 260px; max-width: min(360px, 94vw); max-height: 70vh; overflow: auto; }
.pop-title { font-size: 12.5px; color: var(--muted); padding: 8px 10px 4px; }
.pop-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: var(--r-s); cursor: pointer; color: var(--text); }
.pop-item:hover { background: var(--raised); }
.pop-item.on { background: var(--accent-wash); }
.pop-item small { display: block; color: var(--muted); font-size: 12.5px; }
.pop-item svg { width: 17px; height: 17px; flex: none; color: var(--muted); }
.pop-sep { height: 1px; background: var(--line-soft); margin: 6px 4px; }

/* ── Выдвижная панель ───────────────────────────────────────────────── */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: var(--drawer); max-width: 100vw; background: var(--surface); border-left: 1px solid var(--line); z-index: 40; display: flex; flex-direction: column; transform: translateX(102%); transition: transform .26s cubic-bezier(.2,.7,.2,1); box-shadow: var(--shadow); }
.drawer.open { transform: none; }
@media (min-width: 1280px) {
  .app.drawer-open { grid-template-columns: var(--rail) minmax(0, 1fr) var(--drawer); }
  .app.drawer-open .drawer { position: relative; transform: none; box-shadow: none; grid-column: 3; grid-row: 1; transition: none; }
}
.drawer-head { display: flex; align-items: center; gap: 4px; padding: 10px 8px 0 12px; border-bottom: 1px solid var(--line-soft); }
.drawer-tabs { display: flex; gap: 2px; flex: 1; overflow-x: auto; }
.dtab { border: 0; background: none; padding: 10px 10px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.dtab svg { width: 16px; height: 16px; }
.dtab.on { color: var(--text); border-bottom-color: var(--accent); }
.drawer-body { flex: 1; overflow: auto; padding: 18px; }
.block { margin-bottom: 22px; }
.block-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 650; font-size: 14.5px; margin-bottom: 10px; }
.block-title small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; line-height: 1.5; }
.panel { background: var(--raised); border: 1px solid var(--line-soft); border-radius: var(--r-m); padding: 14px; margin-bottom: 10px; }
.who { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.who b { font-size: 15px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.core-preview { border: 1px dashed var(--line); border-radius: var(--r-s); padding: 8px 12px; margin: 0 0 12px; }
.core-preview .hint { margin: 4px 0; overflow-wrap: anywhere; }
.core-block .tag { font-weight: 400; margin-left: 6px; }
.pick { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; }
.pick button { border: 0; background: var(--sunken); padding: 5px 9px; cursor: pointer; font-size: 13px; color: var(--text-2); border-right: 1px solid var(--line); }
.pick button:last-child { border-right: 0; }
.pick button.on { background: var(--accent); color: var(--accent-ink); }
.memo { background: var(--raised); border: 1px solid var(--line-soft); border-radius: var(--r-m); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; position: relative; }
.memo:hover { border-color: var(--line); }
.memo.off { opacity: .55; }
.memo .ev { font-size: 14.5px; }
.memo .in { font-size: 13px; color: var(--text-2); margin-top: 4px; font-style: italic; }
.memo .mt { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tag { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--sunken); color: var(--text-2); }
.tag.pos { color: var(--ok); }
.tag.neg { color: var(--danger); }
.memo-bar { position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.code { white-space: pre-wrap; font: 12.5px/1.55 ui-monospace, "SF Mono", Consolas, monospace; background: var(--sunken); border: 1px solid var(--line-soft); border-radius: var(--r-s); padding: 12px; overflow-wrap: anywhere; max-height: 60vh; overflow: auto; }
.code .role { color: var(--accent); font-weight: 700; }
.bar-meter { height: 8px; border-radius: 999px; background: var(--sunken); overflow: hidden; display: flex; margin: 8px 0 4px; }
.bar-meter i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--text-2); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; background: var(--c); vertical-align: 0; }

/* ── Модальные окна ─────────────────────────────────────────────────── */
.scrim { position: fixed; inset: 0; background: rgba(8, 5, 16, .55); z-index: 35; backdrop-filter: blur(2px); }
.modal-wrap { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 24px; background: rgba(8, 5, 16, .55); backdrop-filter: blur(3px); }
.modal { width: min(920px, 100%); max-height: min(780px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); box-shadow: var(--shadow); display: grid; grid-template-columns: 210px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.modal.narrow { width: min(560px, 100%); grid-template-columns: minmax(0, 1fr); }
.modal-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 16px 16px 14px 22px; border-bottom: 1px solid var(--line-soft); }
.modal-head h2 { margin: 0; font-size: 18px; flex: 1; letter-spacing: -.01em; }
.modal-nav { padding: 12px 10px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 2px; overflow: auto; }
.modal-body { overflow: auto; padding: 22px 26px 26px; }
.modal-body h3 { font-size: 16px; margin: 0 0 4px; }
.modal-body .lead { color: var(--text-2); margin: 0 0 18px; font-size: 14px; }
.ms-new .ms-create-spin { width: 16px; height: 16px; margin-right: 8px; display: inline-block; vertical-align: -3px;
  border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
  animation: turn-spin .9s linear infinite; }
@media (prefers-reduced-motion: reduce) { .ms-new .ms-create-spin { animation: none; } }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding-top: 10px; }
.prov { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line-soft); border-radius: var(--r-m); background: var(--raised); margin-bottom: 8px; cursor: pointer; }
.prov.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
.prov .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }
.prov.on .radio { border: 5px solid var(--accent); }
.prov .nm { font-weight: 600; }
.prov .ds { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
.preset { border: 1px solid var(--line-soft); background: var(--raised); border-radius: var(--r-m); padding: 10px 12px; cursor: pointer; text-align: left; }
.preset.on { border-color: var(--accent); background: var(--accent-wash); }
.preset b { display: block; font-size: 14px; }
.preset small { color: var(--muted); font-size: 12.5px; }
.themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.theme { border: 2px solid var(--line-soft); border-radius: var(--r-m); padding: 0; cursor: pointer; overflow: hidden; background: none; text-align: left; }
.theme.on { border-color: var(--accent); }
.theme .sw { height: 64px; display: flex; align-items: flex-end; padding: 8px; gap: 5px; }
.theme .sw i { display: block; height: 10px; border-radius: 3px; }
.theme .nm { padding: 8px 10px; font-size: 13.5px; font-weight: 600; background: var(--raised); }
.card-edit { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 22px; }
.portrait { width: 180px; aspect-ratio: 3 / 4; border-radius: var(--r-l); overflow: hidden; display: grid; place-items: center; font-size: 56px; font-weight: 700; color: #fff; position: relative; }
.portrait img { width: 100%; height: 100%; object-fit: cover; }
.portrait .chg { position: absolute; bottom: 8px; left: 8px; right: 8px; }
.lore { border: 1px solid var(--line-soft); border-radius: var(--r-m); padding: 12px; margin-bottom: 8px; background: var(--raised); }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--line); padding: 10px 16px; border-radius: var(--r-m); z-index: 90; max-width: min(560px, 92vw); box-shadow: var(--shadow); display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; }
.toast.err { border-color: var(--danger); }
.toast svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.toast.err svg { color: var(--danger); }
.toast:not(.err) svg { color: var(--ok); }

.empty-note { text-align: center; color: var(--muted); padding: 26px 10px; font-size: 14px; }
.only-narrow { display: none !important; }

/* ── Адаптив ────────────────────────────────────────────────────────── */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; left: 0; top: 0; bottom: 0; width: min(300px, 86vw); z-index: 45; transform: translateX(-102%); transition: transform .26s cubic-bezier(.2,.7,.2,1); box-shadow: var(--shadow); }
  .rail.open { transform: none; }
  .only-narrow { display: inline-grid !important; }
  /* Одна колонка: шапка, лента разделов и тело — три строки. Без третьей строки лента попадала в
     строку minmax(0, 1fr) высотой 0, а тело (неявная строка) начиналось сразу под шапкой и перекрывало ленту. */
  .modal { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
  .modal.narrow { grid-template-rows: auto minmax(0, 1fr); }
  .modal-nav { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line-soft); overflow-x: auto; padding: 8px; }
  .modal-nav .rail-item { width: auto; white-space: nowrap; }
  .card-edit { grid-template-columns: minmax(0, 1fr); }
  .portrait { width: 140px; }
}
@media (max-width: 600px) {
  .home-inner { padding: 20px 16px 40px; }
  .home h1 { font-size: 24px; }
  .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .feed { padding: 16px 12px 8px; }
  .turn { grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
  .turn .av { width: 30px; height: 30px; font-size: 13px; }
  .composer-wrap { padding: 6px 10px 10px; }
  .pill { max-width: 150px; }
  .modal-wrap { padding: 0; }
  .modal { max-height: 100%; height: 100%; border-radius: 0; }
  .drawer { width: 100vw; }
  .head-tools .wide { display: none; }
  :root { --prose-fs: 16px; }
}

/* Редактор карточки: ключ спецификации рядом с подписью */
.spec-key { font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); background: var(--raised); border: 1px solid var(--line-soft); border-radius: 5px; padding: 0 5px; font-weight: 400; }
.alt-greet > label { justify-content: space-between; display: flex; }
.alt-greet .icon-btn { width: 26px; height: 26px; }

/* Где редактировать персонажа: кнопка на плитке и шапка чата */
.tile-edit { position: absolute; top: 10px; left: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 999px; border: 0; cursor: pointer;
  background: rgba(10, 6, 20, .6); backdrop-filter: blur(6px); color: #fff; font: 500 12.5px var(--ui); opacity: .9; transition: opacity .15s, background .15s; z-index: 2; }
.tile-edit svg { width: 14px; height: 14px; }
.tile:hover .tile-edit, .tile:focus-within .tile-edit, .tile-edit:focus-visible { opacity: 1; }
.tile-edit:hover { background: var(--accent); }
@media (hover: none) { .tile-edit { opacity: 1; } .tile-edit span { display: none; } .tile-edit { padding: 6px; } }
.head-av { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 50%; line-height: 0; }
.head-av:hover { box-shadow: 0 0 0 2px var(--accent); }
.head-card { border: 0; padding: 0; background: none; font: inherit; color: inherit; cursor: pointer; text-align: left; }
.head-card:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

/* Ассистент — разговор с моделью вне игры */
.assist-mark { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-wash); color: var(--accent); flex: none; }
.assist-mark svg { width: 22px; height: 22px; }
.assist-head .pill .av { width: 18px; height: 18px; font-size: 10px; flex: none; }
.pop-item .av { flex: none; }
.av-18 { width: 18px; height: 18px; font-size: 10px; }
.av-22 { width: 22px; height: 22px; font-size: 11px; }
.assist-empty { text-align: center; padding: 6vh 8px 10px; max-width: 620px; margin: 0 auto; }
.assist-hero { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px; display: grid; place-items: center; background: var(--accent-wash); color: var(--accent); }
.assist-hero svg { width: 34px; height: 34px; }
.assist-empty h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.01em; }
.assist-empty p { color: var(--text-2); margin: 0 auto 20px; line-height: 1.55; }
.starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; text-align: left; }
.starter { border: 1px solid var(--line-soft); background: var(--surface); color: var(--text); border-radius: var(--r-m); padding: 12px 14px; cursor: pointer; font: inherit; font-size: 14px; text-align: left; line-height: 1.4; }
.starter:hover { border-color: var(--accent); background: var(--accent-wash); }
.aturn { display: flex; flex-direction: column; min-width: 0; }
.aturn.user { align-items: flex-end; }
.aturn.user .bubble-plain { background: var(--accent-wash); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); border-radius: var(--r-l) var(--r-l) 4px var(--r-l); padding: 10px 14px; max-width: min(640px, 92%); line-height: 1.55; overflow-wrap: anywhere; }
.aturn .tools { margin-top: 4px; }
.aturn:hover .tools, .aturn:focus-within .tools, .aturn.last .tools { opacity: 1; }
.md { font-size: 15.5px; line-height: 1.65; color: var(--text); overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 .75em; }
.md ul, .md ol { margin: 0 0 .75em; padding-left: 1.4em; }
.md li { margin: .2em 0; }
.md h3, .md h4, .md h5, .md h6 { margin: 1em 0 .4em; font-size: 1.05em; }
.md h3 { font-size: 1.15em; }
.md blockquote { margin: 0 0 .75em; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--text-2); }
.md code { font: .9em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--raised); border: 1px solid var(--line-soft); border-radius: 5px; padding: 0 4px; }
.md .mdcode { position: relative; margin: 0 0 .9em; }
.md pre { margin: 0; background: var(--raised); border: 1px solid var(--line-soft); border-radius: var(--r-m); padding: 12px 14px; overflow: auto; white-space: pre-wrap; }
.md pre code { background: none; border: 0; padding: 0; font-size: 13.5px; line-height: 1.55; }
.md .code-copy { position: absolute; top: 6px; right: 6px; opacity: .7; }
.md .code-copy:hover { opacity: 1; }
.md.cursor > :last-child::after, .md.cursor:empty::after { content: ""; display: inline-block; width: .5em; height: 1.05em; vertical-align: -0.15em; margin-left: 2px; background: var(--accent); animation: caret 1s steps(2) infinite; border-radius: 2px; }
.md.cursor::after { content: none; }
@media (max-width: 600px) { .assist-head .pill { max-width: 128px; } .assist-head .assist-mark { display: none; } }
.assist-head .head-who { overflow: hidden; }
.assist-head .head-scene { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Prism: переполнение, отбор опыта, непривязанные записи */
.err-block { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--danger); border-radius: var(--r-m); padding: 10px 12px; color: var(--text); background: color-mix(in srgb, var(--danger) 10%, transparent); font-size: 14px; }
.err-block svg { width: 18px; height: 18px; color: var(--danger); flex: none; margin-top: 2px; }
.exp-debug summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.exp-debug table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
.exp-debug th, .exp-debug td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.exp-debug th { color: var(--muted); font-weight: 500; }
.exp-debug tr.sel td:first-child { color: var(--text); font-weight: 600; }
.exp-debug td:not(:first-child) { white-space: nowrap; color: var(--text-2); }
.legacy-block { border-top: 1px dashed var(--line); padding-top: 12px; margin-top: 8px; }
.legacy-block .memo { cursor: default; }

/* ── Проверка импорта карточек ───────────────────────────────────────── */
.imp-modal { width: min(720px, 100%); }
.imp-item { border: 1px solid var(--line-soft); border-radius: var(--r-m); background: var(--raised); padding: 14px 16px; margin-bottom: 12px; }
.imp-item.bad { border-color: var(--danger); }
.imp-item h3 { display: flex; align-items: center; gap: 6px; }

.imp-fields { list-style: none; padding: 0; margin: 4px 0 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px 12px; font-size: 13.5px; color: var(--muted); }
.imp-fields li.on { color: var(--text); }
.imp-dir, .imp-note { border-left: 3px solid var(--line); padding: 4px 0 4px 10px; margin: 8px 0; font-size: 13.5px; }
.imp-dir { border-left-color: var(--warn); }
.imp-note.warn { border-left-color: var(--warn); }
.imp-item details summary { cursor: pointer; color: var(--text-2); font-size: 13px; margin-top: 4px; }
.imp-item .code { max-height: 220px; margin: 6px 0 0; }
.imp-issues { padding-left: 18px; margin: 10px 0 0; font-size: 13.5px; }

.imp-issues li.error b { color: var(--danger); }

.dir-badge { font-size: 11.5px; border-radius: 5px; padding: 0 6px; border: 1px solid var(--line-soft); color: var(--muted); font-weight: 500; }

.opening-start { max-width: 520px; margin: 48px auto 0; text-align: center; padding: 0 16px; }

.world-layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 22px; align-items: start; }

.row.wrap { flex-wrap: wrap; }

.world-fact.off, .lens-fact.off { opacity: .6; }

.eff-world { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }

/* ── База не открылась ───────────────────────────────────────────────── */
.storage-error { max-width: 620px; margin: 40px auto 0; padding: 24px; border: 1px solid var(--warn); border-radius: var(--r-l); background: var(--raised); }

/* Мир чата (FOUNDATION-W2) */
.wc-list { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }

.mode-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 13px; white-space: nowrap; }

.field .check input[type=radio], .field .check input[type=checkbox] { width: auto; flex: none; height: auto; padding: 0; }


/* Developer diagnostics: separate modal, not a permanent chat column. */
.modal.debug-modal { width: min(900px, 100%); grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }

/* Card editor: native disclosure controls keep optional settings out of the default view. */

.tile-last { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; color: rgba(255,255,255,.84); font-size: 11px; line-height: 1.25; }
.tile-last time, .tile-last .tile-last-none { font-weight: 600; font-size: 12px; color: #fff; }
.tile-actions { position: absolute; top: 42px; left: 9px; display: flex; gap: 5px; flex-wrap: wrap; max-width: calc(100% - 18px); z-index: 3; opacity: 0; transition: opacity .12s ease; }
.tile-actions .tile-action { font: 600 11px var(--ui); border-radius: 7px; padding: 5px 6px; border: 1px solid rgba(255,255,255,.2); color: #fff; background: rgba(10,6,20,.75); backdrop-filter: blur(5px); cursor: pointer; }

}

<!-- Порядок загрузки = порядок зависимостей (каждый модуль берёт зависимости из PRP при загрузке).
     1. ядро → 2. чистые модули предметной области и транспорт → 3. платформенные адаптеры и представления
     → 4. прикладные сервисы → 5. оболочка интерфейса и контроллеры → 6. корень приложения. -->
<script>/* js/core/util.js */
/* Prism RP — общие утилиты. Классические скрипты: всё в globalThis.PRP,
   чтобы приложение открывалось и с file://, и через локальный сервер,
   а чистые модули можно было проверять в Node. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});

  function uid(prefix) {
    const rnd = Math.random().toString(36).slice(2, 8);
    return (prefix ? prefix + "_" : "") + Date.now().toString(36) + rnd;
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // Подстановка {{char}} / {{user}} в полях карточки (стандарт CCv2/CCv3).
  function macros(text, vars) {
    return String(text || "")
      .replace(/\{\{\s*char\s*\}\}/gi, vars.char || "")
      .replace(/\{\{\s*user\s*\}\}/gi, vars.user || "")
      .replace(/<BOT>/g, vars.char || "")
      .replace(/<USER>/g, vars.user || "");
  }

  // Простая шина событий для связи модулей без прямых зависимостей.
  function createBus() {
    const map = new Map();
    return {
      on(evt, fn) {
        if (!map.has(evt)) map.set(evt, new Set());
        map.get(evt).add(fn);
        return () => map.get(evt).delete(fn);
      },
      emit(evt, data) {
        (map.get(evt) || []).forEach((fn) => {
          try { fn(data); } catch (e) { console.error("[bus]", evt, e); }
        });
      },
    };
  }

  function clone(o) {
    return o == null ? o : JSON.parse(JSON.stringify(o));
  }

  // Приблизительный счёт токенов: ~3.5 символа на токен для смешанного RU/EN текста.
  function estimateTokens(text) {
    if (!text) return 0;
    return Math.ceil(String(text).length / 3.5);
  }

  PRP.util = { uid, escapeHtml, macros, createBus, clone, estimateTokens };
  if (typeof module !== "undefined" && module.exports) module.exports = PRP.util;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/core/store.js */
/* Prism RP — хранилище в IndexedDB. Всё хранится локально в браузере;
   бэкап — один JSON со всеми коллекциями.

   Жизненный цикл соединения (без удаления и сброса данных):
     • открытое соединение уступает обновлению схемы: на versionchange (другая вкладка открывает
       более новую версию) оно сразу закрывается, а кэш соединения сбрасывается — старая вкладка
       не держит базу;
     • обновление, которое держит другая вкладка, завершается ошибкой с кодом DB_BLOCKED;
     • если открытие не ответило ни успехом, ни ошибкой, ни «занято» за OPEN_TIMEOUT_MS —
       ошибка DB_OPEN_TIMEOUT; прочие ошибки — DB_OPEN_FAILED;
     • неудачное открытие не кэшируется: следующая попытка открывает базу заново;
       соединение, открывшееся уже после отказа, сразу закрывается (лишних соединений нет). */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  // Тестовый загрузчик выбирает отдельную IndexedDB до подключения приложения.
  const DB_NAME = root.__PRP_TEST_MIRROR === true ? "prism-rp-testing" : "prism-rp";
  const DB_VERSION = 6;
  const STORES = ["cards", "chats", "messages", "experience", "settings", "images", "assist", "worldPacks", "worldLenses", "worldOverlays", "messengerEnvironments"];
  // Время ожидания открытия базы. Для тестов можно задать window.__PRP_DB_OPEN_TIMEOUT_MS до загрузки приложения.
  const OPEN_TIMEOUT_MS = 7000;
  let dbPromise = null;

  function dbError(code, message, cause) {
    const e = new Error(message);
    e.code = code;
    if (cause) e.cause = cause;
    return e;
  }
  const BUSY = "База Prism RP занята другой вкладкой. Закройте другие вкладки Prism RP и обновите эту страницу.";

  function open() {
    if (dbPromise) return dbPromise;
    const timeoutMs = Number(root.__PRP_DB_OPEN_TIMEOUT_MS) > 0 ? Number(root.__PRP_DB_OPEN_TIMEOUT_MS) : OPEN_TIMEOUT_MS;
    const p = new Promise((resolve, reject) => {
      let settled = false, timer = null;
      const finish = (fn, v) => { if (settled) return false; settled = true; clearTimeout(timer); fn(v); return true; };
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VERSION); }
      catch (e) { finish(reject, dbError("DB_OPEN_FAILED", "Не удалось открыть базу Prism RP: " + (e.message || e), e)); return; }
      timer = setTimeout(() => finish(reject, dbError("DB_OPEN_TIMEOUT", "Не удалось открыть базу Prism RP: браузер не ответил. " + BUSY)), timeoutMs);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains("cards")) db.createObjectStore("cards", { keyPath: "id" });
        if (!db.objectStoreNames.contains("chats")) db.createObjectStore("chats", { keyPath: "id" }).createIndex("cardId", "cardId");
        if (!db.objectStoreNames.contains("messages")) db.createObjectStore("messages", { keyPath: "id" }).createIndex("chatId", "chatId");
        if (!db.objectStoreNames.contains("experience")) db.createObjectStore("experience", { keyPath: "id" }).createIndex("owner", "owner");
        if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", { keyPath: "key" });
        // v2: картинки отдельно от сообщений, чтобы правка текста не переписывала мегабайты.
        if (!db.objectStoreNames.contains("images")) db.createObjectStore("images", { keyPath: "id" }).createIndex("chatId", "chatId");
        // v3: разговоры с ассистентом (вне ролевой игры), сообщения хранятся внутри разговора.
        if (!db.objectStoreNames.contains("assist")) db.createObjectStore("assist", { keyPath: "id" });
        // v4: общие паки мира и линзы персонажей (FOUNDATION-W1). Только добавление коллекций — старые данные не трогаются.
        if (!db.objectStoreNames.contains("worldPacks")) db.createObjectStore("worldPacks", { keyPath: "id" });
        if (!db.objectStoreNames.contains("worldLenses")) {
          const l = db.createObjectStore("worldLenses", { keyPath: "id" });
          // Одна линза на персонажа — ограничение схемы, а не договорённость: вторую запись с тем же cardId база отклонит.
          l.createIndex("cardId", "cardId", { unique: true });
          l.createIndex("packId", "packId");
        }
        // v5: наложение мира на чат (FOUNDATION-W2), одна запись на чат. Только добавление коллекции — данные W1 и прочие не трогаются.
        if (!db.objectStoreNames.contains("worldOverlays")) db.createObjectStore("worldOverlays", { keyPath: "chatId" });
        // v6: среда переписки (FOUNDATION-C), одна запись на чат-переписку. Только добавление коллекции.
        if (!db.objectStoreNames.contains("messengerEnvironments")) db.createObjectStore("messengerEnvironments", { keyPath: "chatId" });
      };
      req.onsuccess = () => {
        const db = req.result;
        // Старая вкладка уступает обновлению схемы в другой вкладке: закрыть соединение и забыть кэш.
        db.onversionchange = () => {
          db.close();
          if (dbPromise === p) dbPromise = null;
          if (typeof api.onVersionChange === "function") { try { api.onVersionChange(); } catch (e) { /* только уведомление */ } }
        };
        // Открылось уже после отказа (DB_BLOCKED / DB_OPEN_TIMEOUT) — не оставлять лишнее соединение.
        if (!finish(resolve, db)) db.close();
      };
      req.onerror = () => finish(reject, dbError("DB_OPEN_FAILED", "Не удалось открыть базу Prism RP: " + ((req.error && req.error.message) || "ошибка браузера"), req.error));
      req.onblocked = () => finish(reject, dbError("DB_BLOCKED", BUSY));
    });
    dbPromise = p;
    // Отказ не кэшируется: следующая попытка (например, после закрытия другой вкладки) откроет базу заново.
    p.catch(() => { if (dbPromise === p) dbPromise = null; });
    return p;
  }

  function wrap(req) {
    return new Promise((ok, fail) => { req.onsuccess = () => ok(req.result); req.onerror = () => fail(req.error); });
  }

  async function tx(store, mode, fn) {
    const db = await open();
    return new Promise((ok, fail) => {
      const t = db.transaction(store, mode);
      let result;
      Promise.resolve(fn(t.objectStore(store))).then((r) => { result = r; }, fail);
      t.oncomplete = () => ok(result);
      t.onerror = () => fail(t.error);
      t.onabort = () => fail(t.error || new Error("Транзакция прервана"));
    });
  }

  const api = {
    // Уведомление для интерфейса: соединение закрыто, потому что другая вкладка обновляет базу.
    onVersionChange: null,
    get: (store, id) => tx(store, "readonly", (s) => wrap(s.get(id))),
    all: (store) => tx(store, "readonly", (s) => wrap(s.getAll())),
    byIndex: (store, index, value) => tx(store, "readonly", (s) => wrap(s.index(index).getAll(value))),
    put: (store, obj) => {
      if (store !== "settings") obj.updatedAt = Date.now();
      return tx(store, "readwrite", (s) => wrap(s.put(obj))).then(() => obj);
    },
    putMany: (store, list) => tx(store, "readwrite", (s) => Promise.all(list.map((o) => wrap(s.put(o))))),
    /* Несколько записей в РАЗНЫЕ коллекции одной транзакцией: всё или ничего (FOUNDATION-D: сообщение + чат).
       entries: [[store, obj], …]. Запросы ставятся синхронно; успех — по oncomplete; ошибка запроса или исключение
       при постановке — abort, ни одна запись не остаётся. updatedAt — как у put (кроме настроек). */
    async putAll(entries) {
      const list = (entries || []).filter((e) => e && e[0] && e[1]);
      if (!list.length) return;
      const db = await open();
      const names = [...new Set(list.map((e) => e[0]))];
      return new Promise((ok, fail) => {
        let t;
        try { t = db.transaction(names, "readwrite"); } catch (e) { fail(e); return; }
        let failure = null;
        t.oncomplete = () => ok();
        t.onerror = () => { if (!failure) failure = t.error; };
        t.onabort = () => fail(failure || t.error || new Error("Запись прервана — ничего не сохранено"));
        try {
          for (const [st, obj] of list) {
            if (st !== "settings") obj.updatedAt = Date.now();
            const req = t.objectStore(st).put(obj);
            req.onerror = () => { failure = failure || req.error; };
          }
        } catch (e) { failure = e; try { t.abort(); } catch (_) { /* уже прервана */ } }
      });
    },
    del: (store, id) => tx(store, "readwrite", (s) => wrap(s.delete(id))),
    delMany: (store, ids) => tx(store, "readwrite", (s) => Promise.all(ids.map((id) => wrap(s.delete(id))))),

    async getSetting(key, fallback) {
      const r = await api.get("settings", key);
      return r ? r.value : fallback;
    },
    setSetting: (key, value) => api.put("settings", { key, value }),

    async exportAll(opts) {
      const out = { app: "prism-rp", version: 6, exportedAt: new Date().toISOString() };
      for (const s of STORES) if (!(opts && opts.noImages && s === "images")) out[s] = await api.all(s);
      return out;
    },
    /* Восстановление (данные уже проверены ДО вызова: chat.checkBackupChats → core/backup.check →
       worldChat.checkBackup → messenger.checkBackup). ОДНА транзакция readwrite на ВСЕ известные коллекции:
         replace=true  — ЗАМЕНА всего набора данных Prism RP: clear() каждой коллекции и put() каждой записи бэкапа;
                         коллекции нет в бэкапе — после замены она пустая (настройки — значения по умолчанию после перезагрузки);
         replace=false — добавление: только put() записей бэкапа (поверх существующих с тем же ключом).
       Все запросы ставятся в очередь синхронно, пока транзакция активна (без await между ними — иначе она
       завершилась бы раньше времени). Успех — только по oncomplete всей транзакции. Ошибка любого запроса,
       исключение при постановке в очередь или прерывание — abort: ни одна коллекция не меняется (старые данные целы),
       промис отклоняется. Сама база не удаляется; открытие базы — тот же open() с DB_BLOCKED / таймаутом / versionchange. */
    async importAll(data, replace) {
      if (!data || data.app !== "prism-rp") throw new Error("Это не бэкап Prism RP");
      const db = await open();
      return new Promise((ok, fail) => {
        let t;
        try { t = db.transaction(STORES, "readwrite"); }
        catch (e) { fail(e); return; }
        let failure = null;
        t.oncomplete = () => ok();
        t.onerror = (ev) => { if (!failure) failure = t.error || (ev && ev.target && ev.target.error) || new Error("Ошибка записи бэкапа"); };
        t.onabort = () => fail(failure || t.error || new Error("Восстановление прервано — данные не изменены"));
        try {
          for (const s of STORES) {
            const st = t.objectStore(s);
            if (replace) st.clear();
            const list = Array.isArray(data[s]) ? data[s] : [];
            for (const o of list) {
              const req = st.put(o);
              // Ошибку не гасим (без preventDefault): IndexedDB прерывает всю транзакцию, затем onabort → reject.
              req.onerror = () => { failure = failure || req.error; };
            }
          }
        } catch (e) {
          failure = e;
          try { t.abort(); } catch (_) { /* уже прервана */ }
        }
      });
    },
    STORES: STORES.slice(),
  };

  PRP.store = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/core/backup.js */
/* Prism RP — ссылочная целостность бэкапа перед восстановлением (FOUNDATION-H). Чистый модуль.

   Проверка идёт ДО записи; ничего не переназначается и не угадывается. Отклоняются:
     • повторы id внутри одной коллекции бэкапа — все записи с этим id (нет «побеждает последняя»);
     • чат без своего персонажа (chat.cardId);
     • сообщение и картинка без своего чата;
     • опыт без своего персонажа (owner); опыт, привязанный к чату (chatId), — без этого чата;
       старый опыт без чата (legacy) проверяется только по персонажу;
     • линза без своего персонажа или пака; две линзы одного персонажа (в бэкапе или вместе с уже существующей).
   Что считается существующим: при замене — только то, что есть в бэкапе (остальное будет удалено);
   при добавлении — бэкап и то, что уже есть здесь (existing).
   Мир чата и среда переписки проверяются своими сервисами по уже проверенному списку чатов
   (world/overlay-service.checkBackup, messenger/service.checkBackup); режимы чатов — chat/service.checkBackupChats.
   Без DOM, хранилища, сети и S.

   data — объект бэкапа; opts: { replace, existing: { cards: [id], chats: [id], packs: [id], lenses: [{ id, cardId }] } }
   → { data (отфильтрованная копия), rejected: { store: число }, issues: [{ level, code, message, store, id }] } */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});

  const ID_STORES = ["cards", "chats", "messages", "experience", "images", "assist", "worldPacks", "worldLenses"];
  const isObj = (v) => v != null && typeof v === "object" && !Array.isArray(v);
  const sid = (v) => (v == null ? "" : String(v));

  function check(data, opts) {
    const o = opts || {};
    const replace = o.replace !== false;
    const ex = o.existing || {};
    if (!isObj(data)) return { data, rejected: {}, issues: [] };
    const out = Object.assign({}, data);
    const issues = [], rejected = {};
    const reject = (store, id, code, message) => { rejected[store] = (rejected[store] || 0) + 1; issues.push({ level: "error", code, message, store, id: sid(id) }); };

    // 1. Повторы id и битые записи.
    for (const st of ID_STORES.concat(["settings"])) {
      if (!Array.isArray(data[st])) continue;
      const key = st === "settings" ? "key" : "id";
      const count = new Map();
      for (const r of data[st]) if (isObj(r) && sid(r[key])) count.set(sid(r[key]), (count.get(sid(r[key])) || 0) + 1);
      out[st] = data[st].filter((r) => {
        if (!isObj(r) || !sid(r[key])) { reject(st, "", "record-malformed", "Запись без id не восстановлена."); return false; }
        if (count.get(sid(r[key])) > 1) { reject(st, r[key], "duplicate-id", "В бэкапе несколько записей с одним id — ни одна не восстановлена."); return false; }
        return true;
      });
    }
    const ids = (st, extra) => new Set((Array.isArray(out[st]) ? out[st].map((r) => sid(r.id)) : []).concat(replace ? [] : (extra || []).map(sid)));

    // 2. Персонажи и паки → линзы и чаты.
    const cards = ids("cards", ex.cards), packs = ids("worldPacks", ex.packs);
    if (Array.isArray(out.worldLenses)) {
      const perCard = new Map();
      for (const l of out.worldLenses) perCard.set(sid(l.cardId), (perCard.get(sid(l.cardId)) || 0) + 1);
      const localLens = new Map(replace ? [] : (ex.lenses || []).map((l) => [sid(l.cardId), sid(l.id)]));
      out.worldLenses = out.worldLenses.filter((l) => {
        if (!cards.has(sid(l.cardId))) { reject("worldLenses", l.id, "lens-orphan-card", "Линза относится к персонажу, которого нет."); return false; }
        if (!packs.has(sid(l.packId))) { reject("worldLenses", l.id, "lens-orphan-pack", "Линза относится к паку мира, которого нет."); return false; }
        if (perCard.get(sid(l.cardId)) > 1) { reject("worldLenses", l.id, "lens-duplicate-card", "В бэкапе несколько линз одного персонажа — ни одна не восстановлена."); return false; }
        if (localLens.has(sid(l.cardId)) && localLens.get(sid(l.cardId)) !== sid(l.id)) { reject("worldLenses", l.id, "lens-duplicate-card", "У этого персонажа здесь уже есть другая линза — линза из бэкапа не восстановлена."); return false; }
        return true;
      });
    }
    if (Array.isArray(out.chats)) out.chats = out.chats.filter((c) => {
      if (!cards.has(sid(c.cardId))) { reject("chats", c.id, "chat-orphan-card", "Чат относится к персонажу, которого нет."); return false; }
      return true;
    });

    // 3. Чаты → сообщения, картинки, опыт.
    const chats = ids("chats", ex.chats);
    const byChat = (st, code, what) => {
      if (!Array.isArray(out[st])) return;
      out[st] = out[st].filter((r) => {
        if (!chats.has(sid(r.chatId))) { reject(st, r.id, code, `${what} относится к чату, которого нет.`); return false; }
        return true;
      });
    };
    byChat("messages", "message-orphan-chat", "Сообщение");
    byChat("images", "image-orphan-chat", "Картинка");
    if (Array.isArray(out.experience)) out.experience = out.experience.filter((r) => {
      if (!cards.has(sid(r.owner))) { reject("experience", r.id, "experience-orphan-card", "Запись опыта относится к персонажу, которого нет."); return false; }
      if (r.chatId != null && r.chatId !== "" && !chats.has(sid(r.chatId))) { reject("experience", r.id, "experience-orphan-chat", "Запись опыта относится к чату, которого нет."); return false; }
      return true;
    });
    return { data: out, rejected, issues };
  }

  const total = (rejected) => Object.values(rejected || {}).reduce((a, b) => a + b, 0);

  PRP.backup = { check, total, ID_STORES };
  if (typeof module !== "undefined" && module.exports) module.exports = PRP.backup;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/core/settings.js */
/* Prism RP — настройки: значения по умолчанию и чистые вычисления над ними.
   Не читает DOM, хранилище и сеть: на вход — объект настроек, на выход — значения.
   Сохранение настроек делает приложение (app.js) через хранилище. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});

  const DEFAULTS = {
    activeProvider: "perchance",
    processingProvider: "", // empty = inherit RP provider (legacy behavior)
    providers: [],
    samplerPreset: "balanced",
    sampler: { temperature: 0.9, top_p: 0.95, min_p: 0.05, top_k: 0, repetition_penalty: 1.05, max_tokens: 700 },
    contextTokens: 8192,
    autoContext: true,
    singleSystem: false,
    sceneProtocol: true,
    developerMode: false,
    noPostHistory: false,
    expLimit: 8,
    worldLimit: 8, // фактов мира за ход (наибольшее число; входят только релевантные)
    theme: "dusk",
    proseSize: 17,
    persona: { name: "Пользователь", description: "" },
    images: {
      enabled: true, backend: "perchance", url: "", key: "", model: "", vae: "", sampler: "", scheduler: "",
      steps: 28, cfg: 5.5, seed: "", sizeMode: "auto", fixedSize: "1024x1024", maxSide: 1216,
      hires: false, hiresScale: 1.5, hiresUpscaler: "R-ESRGAN 4x+ Anime6B", hiresDenoise: 0.4, hiresSteps: 0,
      fixedPrompt: "", promptMode: "append", negative: "", format: "tags", translate: true,
      drawPromptMode: "tags", modelDraws: true, modelDrawPolicy: "contextual", autoDraw: true, extra: "",
    },
  };

  const clone = (o) => JSON.parse(JSON.stringify(o));

  // Сохранённые настройки поверх значений по умолчанию (вложенные группы — тоже поверх).
  // perchanceImages: доступна ли генерация картинок Perchance (для первого запуска вне Perchance).
  function merge(saved, opts) {
    const s = Object.assign(clone(DEFAULTS), saved || {});
    s.sampler = Object.assign({}, DEFAULTS.sampler, s.sampler || {});
    s.persona = Object.assign({}, DEFAULTS.persona, s.persona || {});
    s.images = Object.assign({}, DEFAULTS.images, s.images || {});
    // Старые настройки сохраняют выбранное пользователем поведение.
    // По умолчанию модель получает инструмент [draw:] и сама выбирает уместный момент.
    if (saved && saved.images && !Object.prototype.hasOwnProperty.call(saved.images, "modelDrawPolicy")) {
      s.images.modelDrawPolicy = saved.images.modelDraws === false ? "off" : "contextual";
    }
    if (!saved && opts && opts.perchanceImages === false) s.images.backend = "a1111";
    return s;
  }

  function persona(s) { return (s && s.persona) || DEFAULTS.persona; }

  // Список текстовых моделей: бесплатная Perchance (если доступна) + свои API.
  function providerList(s, perchanceAvailable) {
    const list = [];
    if (perchanceAvailable) list.push({ id: "perchance", name: "Perchance", kind: "perchance", label: "Perchance" });
    for (const p of s.providers) list.push(Object.assign({ kind: "openai", label: p.model ? `${p.name} · ${p.model}` : p.name }, p));
    return list;
  }
  function activeProvider(s, list) {
    return list.find((p) => p.id === s.activeProvider) || list[0] || null;
  }
  // Processing Provider is independently selectable; empty or unavailable ID inherits RP.
  // Never choose an unrelated provider by list position when a saved ID is missing.
  function processingProvider(s, list) {
    const id = s && s.processingProvider;
    return (id && list.find((p) => p.id === id)) || activeProvider(s, list);
  }
  // Объём контекста: для Perchance — из метаданных плагина, если включено; иначе из настроек.
  // perchanceMeta — объект или функция (вызывается, только если метаданные нужны).
  function contextTokens(s, provider, perchanceMeta) {
    if (s.autoContext && provider && provider.kind === "perchance") {
      const m = typeof perchanceMeta === "function" ? perchanceMeta() : perchanceMeta;
      if (m && m.idealMaxContextTokens) return m.idealMaxContextTokens;
    }
    return s.contextTokens || 8192;
  }
  function imagesOn(s, perchanceImagesAvailable) {
    const ic = s.images;
    return ic.enabled && (ic.backend !== "perchance" || perchanceImagesAvailable);
  }
  const DRAW_POLICIES = ["off", "on-request", "contextual"];
  function modelDrawPolicy(s) {
    const c = s && s.images || DEFAULTS.images;
    if (DRAW_POLICIES.includes(c.modelDrawPolicy)) return c.modelDrawPolicy;
    return c.modelDraws === false ? "off" : "contextual"; // legacy settings
  }
  // Явная просьба прислать/создать изображение, а не простое упоминание фото.
  // Это безопасный минимальный шлюз; сложные контекстные просьбы можно
  // удовлетворить ручной кнопкой «Нарисовать» или режимом «По ситуации».
  function pictureRequested(text) {
    const s = String(text || "").toLowerCase().replace(/ё/g, "е");
    if (/(?:^|[^\p{L}\p{N}])(?:не\s+(?:покажи|пришли|скинь|кинь|отправь|рисуй|нарисуй|делай|генерируй|сгенерируй|присылай|показывай|send|show|draw|generate)|не\s+хочу[^.!?]{0,70}(?:фото|селфи|картинк|photo|picture))/iu.test(s)) return false;
    const noun = /(?:фото(?:графи[юяией])?|селфи|картинк[ауеиой]?|изображени[ея]|портрет|рисунок|фотку|photo|picture|image|selfie|portrait|pic)/i;
    const verb = /(?:пришли|скинь|кинь|отправь|покажи|нарисуй|нарисовать|сгенерируй|сделай|сфотографируй|сфоткай|создай|прислать|скинуть|отправить|показать|сгенерировать|send|show|draw|generate|make|create)/i;
    if (/(?:покажи|show)\s+(?:мне\s+)?(?:как\s+ты\s+выглядишь|себя)/i.test(s)) return true;
    // «А можешь прислать мне фотографию?» — да; «фото было красивым» — нет.
    return verb.test(s) && noun.test(s) && (s.search(noun) >= s.search(verb)) && s.search(noun) - s.search(verb) < 85;
  }
  function modelDrawAllowed(s, path) {
    const mode = modelDrawPolicy(s);
    if (mode === "off") return false;
    if (mode === "contextual") return true;
    const last = Array.isArray(path) && path[path.length - 1];
    return !!last && last.role === "user" && pictureRequested(last.text);
  }
  function qualityPinned(s) {
    const ic = s.images;
    return ic.promptMode !== "off" && !!String(ic.fixedPrompt || "").trim();
  }

  PRP.settings = { DEFAULTS, merge, persona, providerList, activeProvider, processingProvider, contextTokens, imagesOn, qualityPinned, modelDrawPolicy, modelDrawAllowed, pictureRequested };
  if (typeof module !== "undefined" && module.exports) module.exports = PRP.settings;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/core/perf.js */
/* Prism RP — PERF-01: журнал длительностей этапов хода (только в памяти, только числа).
   Метрики: userStateMs, roleplayMs, assistantStateMs, imagePrepareMs, readyAfterReplyMs,
   sendToRoleplayMs, stateWaitTimeout, postReplyError. Никаких текстов сообщений, ключей,
   данных карточки и памяти: запись — имя метрики, число, id сообщения/чата и короткий исход.
   Не сохраняется в IndexedDB и не попадает в бэкап. Показ — Debug → «Тайминги» (режим разработчика). */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const MAX = 80;
  const clean = (v, n) => (v == null ? "" : String(v).replace(/[^\w:.\-а-яё ]/gi, "").slice(0, n));

  // list — массив, в который пишутся записи (S.perf); возвращается функция записи.
  function create(list, opts) {
    const activeChatId = opts && opts.activeChatId;
    return function record(metric, ms, meta) {
      const m = meta || {};
      // Delayed observer/image callbacks from another chat must not pollute
      // the active chat's diagnostic medians after a navigation reset.
      if (typeof activeChatId === "function" && (!m.chatId || m.chatId !== activeChatId())) return;
      list.push({ metric: clean(metric, 40), ms: Math.max(0, Math.round(Number(ms) || 0)), at: Date.now(),
        msgId: clean(m.msgId, 40), chatId: clean(m.chatId, 40), outcome: clean(m.outcome, 40) });
      while (list.length > MAX) list.shift();
    };
  }

  // Clear in place: all existing logger/view references retain the same list.
  function reset(list) { list.length = 0; }
  function resetOnChatChange(list, previousId, nextId) { if (previousId !== nextId) reset(list); }

  // Сводка: по каждой метрике — число замеров, последнее и медиана.
  function summary(list) {
    const by = {};
    for (const r of list || []) (by[r.metric] = by[r.metric] || []).push(r.ms);
    return Object.keys(by).map((metric) => {
      const a = by[metric], s = a.slice().sort((x, y) => x - y);
      return { metric, count: a.length, last: a[a.length - 1], median: s[Math.floor(s.length / 2)] };
    });
  }

  PRP.perfLog = { create, reset, resetOnChatChange, summary, MAX };
  if (typeof module !== "undefined" && module.exports) module.exports = PRP.perfLog;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/chat/branch.js */
/* Prism RP — правило активной ветки для привязанных к ветке записей. Чистый модуль.

   Одно определение «видно в этой ветке» для всего, что привязано к сообщениям чата:
   опыт персонажа (prism/experience) и наложение мира на чат (world/canon).

   source: { messageIds: [id], swipes: { id: индекс варианта } }
   path:   активная ветка [{ id, swipeIdx }] от корня к листу.

   Запись видна, только если ВСЕ её сообщения лежат на активной ветке и у каждого сообщения,
   для которого записан вариант, сейчас выбран тот же вариант. Скрытая запись не удаляется:
   вернулись в ветку или к тому варианту — она снова видна. Ничего не угадывается.
   Без DOM, хранилища, сети и S. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});

  const isObj = (v) => v != null && typeof v === "object" && !Array.isArray(v);

  /* → { visible, code: "on-branch" | "other-branch" | "other-swipe", reason } */
  function visibleOnPath(source, path) {
    const src = source || {};
    const onPath = new Map((path || []).map((p) => [p.id, p.swipeIdx || 0]));
    const sw = isObj(src.swipes) ? src.swipes : {};
    for (const id of src.messageIds || []) {
      if (!onPath.has(id)) return { visible: false, code: "other-branch", reason: "другая ветка" };
      if (sw[id] != null && onPath.get(id) !== sw[id]) return { visible: false, code: "other-swipe", reason: "другой вариант ответа" };
    }
    return { visible: true, code: "on-branch", reason: "в этой ветке" };
  }

<script>/* js/cards/model.js */
/* Prism RP — каноническая модель карточки персонажа (CardDraft / сохранённая карточка).
   Один формат для всех источников (CC V1/V2/V3, URV v2, созданные в редакторе).
   Смысл полей разведён:
     • личность (постоянная основа): description, appearance, personality, background;
     • начало мира: scenario; авторское начало: firstMes, altGreetings;
     • манера: mesExample; справочные сведения: lore (не указания);
     • указания автора: directives.system / directives.postHistory — отдельный уровень власти,
       у каждого явный флаг enabled; импортированные приходят выключенными;
     • метаданные: creator, creatorNotes, tags, version; картинки: image;
     • prismCore — необязательное ядро для Prism (prism/card-context): компактное представление, а не источник истины;
       видно и правится в редакторе; нет ядра (null) — Prism собирает запасное из полей. Схему карточки не меняет;
     • source — исходник и сведения импорта, ТОЛЬКО хранение: во время работы не читается.
   Чистый модуль: без DOM, хранилища и сети. */

  "use strict";
  const PRP = (root.PRP = root.PRP || {});

  const SCHEMA = 2;

  // Указание автора. Созданное в редакторе включено (отправляется, если в нём есть текст);
  // импортированное — выключено и не проверено, пока пользователь не включит его сам.
  function directive(text, origin) {
    const o = origin === "imported" ? "imported" : "authored";
    return { text: String(text || ""), origin: o, enabled: o === "authored", reviewed: o === "authored" };
  }

  }

  // Imported fields are preserved but must be enabled explicitly in the editor.

      id: String(f.id || "custom-" + (i + 1)),
      label: String(f.label || ""),
      text: String(f.text || ""),
      mode: f.mode === "always" ? "always" : "relevant",
      enabled: !imported && f.enabled === true,
      ...(f.origin && typeof f.origin === "object" && !Array.isArray(f.origin) ? {
        origin: {
          format: String(f.origin.format || ""),
          path: String(f.origin.path || ""),
          imported: f.origin.imported === true,
        }
      } : {}),
    }));
  }

  function blank() {
    const now = Date.now();
    return {
      id: null, schema: SCHEMA,
      name: "",
      description: "", appearance: "", personality: "", background: "",
      scenario: "",
      firstMes: "", altGreetings: [],
      mesExample: "",
      lore: [], customFields: [],
      directives: { system: directive("", "authored"), postHistory: directive("", "authored") },
      creator: "", creatorNotes: "", tags: [], version: "",
      image: undefined,
      prismCore: null,
      avatar: null,
      source: null,
      createdAt: now, updatedAt: now,

  }

  // Текст указания, который реально уходит в модель: только включённое и непустое.
  // Никаких запасных путей: source, extensions и прочее хранимое сюда не попадает.
  function activeText(card, which) {
    const d = card && card.directives && card.directives[which];
    return d && d.enabled && String(d.text || "").trim() ? String(d.text) : "";
  }
  // Есть ли у указания текст, который сейчас выключен (для отчёта и предупреждений).
  function hasDisabledText(card, which) {

  /* Приведение карточки, сохранённой в 0.5.0 и раньше (поля systemPrompt / postHistory / raw / spec).
     Старые указания были видны в редакторе и уходили в модель — поэтому они становятся
     авторскими включёнными, поведение не меняется. Исходник переезжает в source. */

    c.schema = SCHEMA;
    c.appearance = card.appearance || "";
    c.background = card.background || "";
