      return Object.assign(r, { eligible: sel.eligible, filtered: sel.filtered, overlay: ov, lens: b.lens, pack: b.pack });
    }

    /* Для Prism (только чтение). → { facts: отобранные в порядке релевантности, report } */
    function context(p, scene) {
      const c = ctx.chat(), cd = ctx.card();
      if (!c || !cd) return { facts: [], report: null };
      const path = p || chat().path();
      const k = canon(path);
      const history = path.map((m) => TR.activeSwipe(m).text).filter(Boolean);
      const st = scene || chat().sceneState(path);
      const lens = k.lens || {};
      const r = WRT.retrieve(k.eligible, {
        text: history.slice(-4).join("\n"), sceneLoc: st.loc || "", present: st.present || [],
        skipNames: [cd.name, ctx.persona().name], focusEntities: lens.focusEntities, focusTopics: lens.focusTopics,
        relevanceHints: lens.relevanceHints, limit: S.settings && S.settings.worldLimit != null ? S.settings.worldLimit : WRT.DEFAULT_LIMIT,
      });
      return {
        facts: r.ranked,
        report: {
          effective: k.facts.length, eligible: k.eligible.length, relevant: r.relevantCount, selected: r.ranked.length,
          filtered: k.filtered, excluded: k.excluded, inactiveEvents: k.events.filter((e) => !e.active).length,
          rows: r.rows, warnings: k.warnings, timeline: k.overlay ? k.overlay.timeline : "", variant: k.overlay ? k.overlay.variant : "",
        },
      };
    }

    /* Явное действие пользователя: черновик → проверка → привязка (ветка/чат) → сохранение.
       draft: { op, targetFactId?, fact?, scope: "branch" | "chat", note? }. Ветку без сообщений не к чему привязать —
       сохранение отклоняется, область сама на «весь чат» не меняется. → { entry } | { error, issues } */
    async function commit(draft) {
      const c = ctx.chat();
      if (!c) return { error: "Откройте чат." };
      const path = chat().path();
      const anchor = draft && draft.scope === "branch" ? BR.anchorOf(chat().pathCtx(path)) : null;
      const entry = OV.makeEntry(Object.assign({}, draft, { anchor }));
      const k = canon(path);
      const issues = OV.validateNew(entry, { ids: new Set(k.known) });
      if (OV.hasErrors(issues)) return { error: issues.filter((x) => x.level === "error").map((x) => x.message).join(" "), issues };
      const next = clone(current());
      next.entries.push(entry);
      await DB.put(STORE, next);
      S.worldOverlay = next;
      return { entry, issues };
    }
    // Явный выбор таймлайна и варианта чата (селекторы отбора). Пак и линза не меняются.
    async function setSelectors(sel) {
      const c = ctx.chat();
      if (!c) return null;
      const next = clone(current());
      next.timeline = String((sel && sel.timeline) || "").trim();
      next.variant = String((sel && sel.variant) || "").trim();
      await DB.put(STORE, next);
      S.worldOverlay = next;
      return next;
    }
    // Чат удалён — его наложение тоже (каждый чат — свой мир). Пак и линза не трогаются.
    async function removeForChat(chatId) {
      await DB.del(STORE, chatId);
      if (S.worldOverlay && S.worldOverlay.chatId === chatId) S.worldOverlay = null;
    }
    /* Восстановление бэкапа: проверка ДО записи. Запись мира чата принимается, только если:
         • сама запись проходит проверку (OV.validateOverlay: объект, есть chatId, entries — список);
         • её чат существует там, куда восстанавливаем:
             замена (replace: true, по умолчанию) — только чаты из самого бэкапа (data.chats);
             добавление (replace: false) — чаты из бэкапа ∪ уже существующие (existingChatIds);
         • в бэкапе это единственная запись для этого чата. Если записей для одного chatId несколько —
           отбрасываются ВСЕ записи этого чата: какая из них верна, неизвестно, истории не сливаются.
       Ничего не переназначается и не подбирается: запись без своего чата не пишется.
       Битые события внутри принятой записи остаются (видны в отчёте и не применяются).
       opts: { replace, existingChatIds } — режим и id локальных чатов даёт вызывающий (DOM здесь нет).
       → { data, rejected, warnings, issues: [{ level, code, message, chatId? }] } */
    function checkBackup(data, opts) {
      if (!data || !Array.isArray(data[STORE])) return { data, rejected: 0, warnings: 0, issues: [] };
      const o = opts || {};
      const replace = o.replace !== false;
      const valid = new Set((Array.isArray(data.chats) ? data.chats : []).filter((c) => c && c.id).map((c) => String(c.id)));
      if (!replace) for (const id of o.existingChatIds || []) valid.add(String(id));
      const issues = [];
      let rejected = 0, warnings = 0;
      const perChat = new Map();
      for (const rec of data[STORE]) {
        const id = rec && typeof rec === "object" ? String(rec.chatId || "").trim() : "";
        if (id) perChat.set(id, (perChat.get(id) || 0) + 1);
      }
      const ok = [];
      for (const rec of data[STORE]) {
        const iss = OV.validateOverlay(rec);
        if (OV.hasErrors(iss)) { rejected++; issues.push(...iss.filter((x) => x.level === "error")); continue; }
        const chatId = String(rec.chatId).trim();
        if (perChat.get(chatId) > 1) {
          rejected++;
          issues.push({ level: "error", code: "overlay-duplicate-chat", message: "В бэкапе несколько записей мира для одного чата — ни одна не восстановлена.", chatId });
          continue;
        }
        if (!valid.has(chatId)) {
          rejected++;
          issues.push({ level: "error", code: "overlay-orphan-chat", message: "Запись мира относится к чату, которого нет" + (replace ? " в бэкапе." : " ни в бэкапе, ни здесь."), chatId });
          continue;
        }
        warnings += iss.length;
        issues.push(...iss.map((x) => Object.assign({ chatId }, x)));
        ok.push(OV.normalize(rec));
      }
      return { data: Object.assign({}, data, { [STORE]: ok }), rejected, warnings, issues };
    }

    // Для вкладки «Мир чата»: канон активной ветки, исключения и история событий.
    function view() {
      const c = ctx.chat();
      if (!c) return null;
      const path = chat().path();
      const k = canon(path);
      const filteredIds = new Set(k.filtered.map((x) => x.id));
      return { facts: k.facts, filtered: k.filtered, filteredIds, excluded: k.excluded, events: k.events, warnings: k.warnings,
        overlay: k.overlay, lens: k.lens, pack: k.pack, canBranch: path.length > 0 };
    }

    return { load, current, canon, context, commit, setSelectors, removeForChat, checkBackup, view, STORE };
  }

  PRP.worldOverlayService = { create };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/messenger/service.js */
/* Prism RP — сервис переписки (прикладной уровень): среда переписки текущего чата.

   • Хранение: коллекция messengerEnvironments, одна запись на чат-переписку (ключ chatId). У сцен (rp) записи нет.
     Старая переписка без записи открывается с пустой средой ТОЛЬКО В ПАМЯТИ (всё неизвестно, живое время,
     пояс браузера); запись появляется при явной правке среды.
   • «Сейчас» переписки: live — часы ctx.clock (в тестах подставные), manual — сохранённое время; само не идёт.
   • Для Prism всё только читается: context() и snapshot() ничего не пишут. Метку времени сообщения
     (messengerAt на варианте) записывают отправка пользователя и успешная генерация — вместе с самим сообщением.
   • Legacy Environment events и договорённости изменяются только явными действиями пользователя.
     НОВЫЙ UT-1: context() / view() читают общий State Tracker поверх legacy-среды;
     автоматические события хранятся В ВАРИАНТАХ СООБЩЕНИЙ, а не дублируются в Environment.
   DOM не трогает; ветку берёт у сервиса чата. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const MT = PRP.messengerTime, ENV = PRP.messengerEnv, CONV = PRP.messengerConversation, BR = PRP.branch, SR = PRP.stateResolver;

  const STORE = "messengerEnvironments";
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const isMessenger = (c) => !!c && c.mode === "messenger";

  function create(ctx) {
    const { S, DB } = ctx;
    const chat = () => ctx.svc.chat;
    const clock = () => (typeof ctx.clock === "function" ? ctx.clock() : Date.now());

    async function load(chatId) {
      const c = (S.chats || []).find((x) => x.id === chatId);
      if (!isMessenger(c)) { S.messengerEnv = null; return null; }
      const rec = await DB.get(STORE, chatId);
      S.messengerEnv = rec ? Object.assign(ENV.normalize(rec, chatId), { persisted: true }) : Object.assign(ENV.blank(chatId), { persisted: false });
      return S.messengerEnv;
    }
    // Среда текущего чата: только своя; у сцены — null. Без записи — пустая среда в памяти (ничего не придумано).
    function current() {
      const c = ctx.chat();
      if (!isMessenger(c)) return null;
      if (S.messengerEnv && S.messengerEnv.chatId === c.id) return S.messengerEnv;
      return Object.assign(ENV.blank(c.id), { persisted: false });
    }
    function now(env) { return MT.nowOf(env || current(), clock); }
    const pathCtx = (p) => chat().pathCtx(p);

    // Положение персонажа на ветке p в момент t (по умолчанию — сейчас).
    function worldAt(p, t) {
      const env = current();
      return ENV.resolveWorld(env, { path: pathCtx(p), now: t !== undefined ? t : now(env) });
    }

    /* Для Prism (только чтение): положение, состояние переписки, время. t — момент, выбранный при подготовке генерации. */
    function context(p, t) {
      const env = current();
      if (!env) return null;
      const path = p || chat().path();
      const at = t !== undefined ? t : now(env);
      const w = ENV.resolveWorld(env, { path: pathCtx(path), now: at });
      // Один трекер для обоих режимов. Старая среда является только
      // совместимым базовым слоем; сообщения дополняют/изменяют его автоматически.
      if (ctx.svc.state) {
        const tracked = ctx.svc.state.context(path, { now: at, legacyWorld: w.world });
        w.world = SR.world(w.world, tracked);
      }
      const conv = CONV.derive(path, { now: at, record: env });
      const open = conv.promises.concat(conv.plans).filter((m) => m.status === "open").sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      return {
        world: w.world, conversation: conv, plans: open,
        temporal: { now: at, timeZone: env.timeZone, timeMode: env.timeMode },
        report: { activeEvents: w.activeEvents.length, inactiveEvents: w.inactiveEvents.length, warnings: w.warnings.concat(conv.warnings) },
      };
    }
    /* Неизменяемая метка для нового сообщения: момент и положение персонажа на ветке перед ним.
       Мир (пак, линза, наложение) сюда не копируется. → { at, timeZone, world } | null (не переписка или время неизвестно) */
    function snapshot(p, t) {
      const env = current();
      if (!env) return null;
      const at = t !== undefined ? t : now(env);
      if (at == null) return null;
      return { at: MT.toIso(at), timeZone: env.timeZone, world: ENV.resolveWorld(env, { path: pathCtx(p), now: at }).world };
    }
    function stampForNew() { return snapshot(chat().path()); }

    async function persist(next) {
      const rec = clone(next); delete rec.persisted;
      await DB.put(STORE, rec);
      S.messengerEnv = Object.assign(ENV.normalize(rec, rec.chatId), { persisted: true });
      return S.messengerEnv;
    }
    /* Новая переписка: явная настройка времени при создании. → { env } | { error } */
    function checkSetup(setup) {
      const s = setup || {};
      if (!MT.validTimeZone(s.timeZone)) return "Неизвестный часовой пояс.";
      if (s.timeMode === "manual" && MT.toMs(s.manualNow) == null) return "Для ручного времени укажите дату и время.";
      return null;
    }
    async function createFor(chatId, setup) {
      const err = checkSetup(setup);
      if (err) return { error: err };
      return { env: await persist(ENV.blank(chatId, setup)) };
    }
    // Явная смена пояса, режима или ручного времени. Записанные метки сообщений не меняются.
    async function setTime(t) {
      const env = current();
      if (!env) return { error: "Это не переписка." };
      const x = t || {};
      const next = clone(env);
      if (x.timeZone !== undefined) { if (!MT.validTimeZone(x.timeZone)) return { error: "Неизвестный часовой пояс." }; next.timeZone = x.timeZone; }
      if (x.timeMode !== undefined) next.timeMode = x.timeMode === "manual" ? "manual" : "live";
      if (next.timeMode === "manual") {
        const ms = x.manualNow !== undefined ? MT.toMs(x.manualNow) : MT.toMs(next.manualNow) != null ? MT.toMs(next.manualNow) : clock();
        if (ms == null) return { error: "Укажите дату и время." };
        next.manualNow = MT.toIso(ms);
      } else next.manualNow = null;
      return { env: await persist(next) };
    }
    async function advance(minutes) {
      const env = current();
      if (!env || env.timeMode !== "manual") return { error: "Сдвигать время можно только в ручном режиме." };
      return setTime({ manualNow: MT.toIso(MT.toMs(env.manualNow) + minutes * 60000) });
    }

    // Явная правка положения: черновик → привязка → проверка → запись. Ветку без сообщений не к чему привязать.
    async function commitEvent(draft) {
      const env = current();
      if (!env) return { error: "Это не переписка." };
      const d = draft || {};
      const anchor = d.scope === "branch" ? BR.anchorOf(pathCtx(chat().path())) : null;
      const e = ENV.makeEvent(Object.assign({}, d, { anchor, effectiveAt: d.effectiveAt !== undefined ? d.effectiveAt : MT.toIso(now(env)) }));
      const issues = ENV.validateEvent(e);
      if (ENV.hasErrors(issues)) return { error: issues.filter((x) => x.level === "error").map((x) => x.message).join(" "), issues };
      const next = clone(env); next.events.push(e);
      await persist(next);
      return { event: e };
    }
    async function addMarker(d) {
      const env = current();
      if (!env) return { error: "Это не переписка." };
      const x = d || {};
      const anchor = x.scope === "branch" ? BR.anchorOf(pathCtx(chat().path())) : null;
      const e = CONV.makeMarkerEvent(Object.assign({}, x, { op: "add", anchor }));
      const issues = CONV.validateMarkerEvent(e);
      if (ENV.hasErrors(issues)) return { error: issues.filter((y) => y.level === "error").map((y) => y.message).join(" "), issues };
      const next = clone(env); next.conversationEvents.push(e);
      await persist(next);
      return { marker: e };
    }
    async function markerStatus(markerId, status, scope) {
      const env = current();
      if (!env) return { error: "Это не переписка." };
      const visible = CONV.resolveMarkers(env, { path: pathCtx(chat().path()) }).markers.some((m) => m.id === markerId);
      if (!visible) return { error: "Этой договорённости нет на этой ветке." };
      const anchor = scope === "branch" ? BR.anchorOf(pathCtx(chat().path())) : null;
      const e = CONV.makeMarkerEvent({ op: "status", markerId, status, scope, anchor });
      const issues = CONV.validateMarkerEvent(e);
      if (ENV.hasErrors(issues)) return { error: issues.filter((y) => y.level === "error").map((y) => y.message).join(" "), issues };
      const next = clone(env); next.conversationEvents.push(e);
      await persist(next);
      return { marker: e };
    }

    // Чат удалён — его среда тоже. Мир, пак, линза и наложение не трогаются.
    async function removeForChat(chatId) {
      await DB.del(STORE, chatId);
      if (S.messengerEnv && S.messengerEnv.chatId === chatId) S.messengerEnv = null;
    }

    /* Восстановление бэкапа: проверка ДО записи (та же дисциплина, что у мира чата).
       Запись принимается, только если: проходит проверку формы; её чат — ПЕРЕПИСКА там, куда восстанавливаем
       (замена — только чаты бэкапа; добавление — чаты бэкапа ∪ существующие); она единственная для своего чата.
       Запись для сцены — отклоняется; несколько записей одного чата — отклоняются все. Ничего не переназначается.
       При добавлении режим уже существующего чата берётся ЛОКАЛЬНЫЙ (он главнее входящего чата с тем же id).
       opts: { replace, existingChats: [{ id, mode }] } → { data, rejected, warnings, issues } */
    function checkBackup(data, opts) {
      if (!data || !Array.isArray(data[STORE])) return { data, rejected: 0, warnings: 0, issues: [] };
      const o = opts || {};
      const replace = o.replace !== false;
      const mode = new Map();
      for (const c of Array.isArray(data.chats) ? data.chats : []) if (c && c.id) mode.set(String(c.id), c.mode);
      if (!replace) for (const c of o.existingChats || []) if (c && c.id) mode.set(String(c.id), c.mode); // локальный режим главнее
      const per = new Map();
      for (const r of data[STORE]) { const id = r && typeof r === "object" ? String(r.chatId || "").trim() : ""; if (id) per.set(id, (per.get(id) || 0) + 1); }
      const issues = [], ok = [];
      let rejected = 0, warnings = 0;
      for (const r of data[STORE]) {
        const iss = ENV.validateRecord(r);
        if (ENV.hasErrors(iss)) { rejected++; issues.push(...iss.filter((x) => x.level === "error")); continue; }
        const chatId = String(r.chatId).trim();
        const reject = (code, message) => { rejected++; issues.push({ level: "error", code, message, chatId }); };
        if (per.get(chatId) > 1) { reject("env-duplicate-chat", "В бэкапе несколько записей среды для одного чата — ни одна не восстановлена."); continue; }
        if (!mode.has(chatId)) { reject("env-orphan-chat", "Среда относится к чату, которого нет" + (replace ? " в бэкапе." : " ни в бэкапе, ни здесь.")); continue; }
        if (mode.get(chatId) !== "messenger") { reject("env-not-messenger", "Среда переписки относится к сцене, а не к переписке."); continue; }
        warnings += iss.length;
        ok.push(ENV.normalize(r));
      }
      return { data: Object.assign({}, data, { [STORE]: ok }), rejected, warnings, issues };
    }

    // Для вкладки «Среда».
    function view() {
      const env = current();
      if (!env) return null;
      const path = chat().path();
      const t = now(env);
      const w = ENV.resolveWorld(env, { path: pathCtx(path), now: t });
      if (ctx.svc.state) {
        const tracked = ctx.svc.state.context(path, { now: t, legacyWorld: w.world });
        w.world = SR.world(w.world, tracked);
      }
      const conv = CONV.derive(path, { now: t, record: env });
      const last = path[path.length - 1];
      const stateStatus = last && last.swipes && last.swipes[last.swipeIdx || 0] && last.swipes[last.swipeIdx || 0].stateStatus || null;
      return { env, now: t, world: w.world, events: w.events, warnings: w.warnings.concat(conv.warnings),
        conversation: conv, canBranch: path.length > 0, stateStatus,
        statePending: !!(ctx.svc.state && ctx.svc.state.pending && ctx.chat() ? ctx.svc.state.pending(ctx.chat().id) : S.tracking) && !(stateStatus && last && stateStatus.sourceText === last.swipes[last.swipeIdx || 0].text) };
    }

    return { load, current, now, worldAt, context, snapshot, stampForNew, createFor, checkSetup, setTime, advance, commitEvent, addMarker, markerStatus, removeForChat, checkBackup, view, STORE };
  }

  PRP.messengerService = { create };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/assist/service.js */
/* Prism RP — ассистент (прикладной уровень): разговоры с моделью вне игры.
   Выбор и сохранение разговоров, контекст из карточки и выдержки чата, генерация через PRP.llm.
   Смысловые правила (инструкция, сборка контекста) — в assist/assist.js. Перерисовка — через ctx.ui. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const U = PRP.util, TR = PRP.tree, SC = PRP.scene, OA = PRP.openai, AST = PRP.assist, LLM = PRP.llm;

  function create(ctx) {
    const { S, DB, ui } = ctx;

    function loadAll() { return DB.all("assist"); }

    // Выбрать разговор: по id, оставить уже открытый пустой или начать новый (наследуя персонажа).
    function pick(id, base) {
      const found = id && S.assistList.find((a) => a.id === id);
      if (found) S.assist = found;
      else if (!base && S.assist && !S.assist.messages.length) { /* пустой разговор уже открыт */ }
      else {
        const b = base || (S.assist ? { cardId: S.assist.ctx.cardId, chatId: null } : (S.view === "chat" && S.cardId ? { cardId: S.cardId, chatId: null } : {}));
        S.assist = AST.blank(b);
      }
    }
    async function save() {
      const a = S.assist;
      await DB.put("assist", a);
      if (!S.assistList.includes(a)) S.assistList.push(a);
    }
    async function remove(a) {
      await DB.del("assist", a.id);
      S.assistList = S.assistList.filter((x) => x !== a);
      S.assist = null;
    }

    // Выдержка из ролевого чата для контекста ассистента: реплики активной ветки и строка сцены.
    async function chatLines(chatId) {
      const c = S.chats.find((x) => x.id === chatId);
      if (!c) return { lines: [], scene: "" };
      const msgs = await DB.byIndex("messages", "chatId", chatId);
      const path = TR.path(TR.index(msgs), c.leafId);
      const cd = S.cards.find((x) => x.id === c.cardId);
      const lines = path.map((m) => ({ name: m.role === "user" ? ctx.persona().name : (cd ? cd.name : "Персонаж"), text: TR.activeSwipe(m).text || "" })).filter((l) => l.text.trim());
      // Строка сцены — только у сцены RP: у переписки сцены нет (служебные [scene:] в ней не действуют).
      if (c.mode === "messenger") return { lines, scene: "" };
      const st = SC.fold(c.sceneInit, path.map((m) => ({ msgId: m.id, role: m.role, ops: TR.activeSwipe(m).sceneOps || [] })));
      return { lines, scene: SC.summaryLine(st) || "" };
    }

    async function send(text) {
      const a = S.assist;
      if (!a || S.gen) return;
      if (!a.messages.length) a.title = AST.title(text);
      a.messages.push({ id: U.uid("am"), role: "user", text, at: Date.now() });
      await save(); ui.rememberUi();
      await generate();
    }

    async function generate() {
      const a = S.assist;
      const prov = ctx.provider();
      if (!prov) { ui.toast("Модель не подключена. Откройте «Настройки → Модели».", true); ui.openSettings("models"); return; }
      const cd = a.ctx.cardId ? S.cards.find((c) => c.id === a.ctx.cardId) : null;
      const chatCtx = a.ctx.chatId ? await chatLines(a.ctx.chatId) : { lines: [], scene: "" };
      const target = { id: U.uid("am"), role: "assistant", text: "", at: Date.now() };
      const history = a.messages.map((x) => ({ role: x.role, text: x.text }));
      a.messages.push(target);
      const built = AST.build({
        system: (S.settings.assistSystem || "").trim() || AST.SYSTEM, card: cd, chatLines: chatCtx.lines, sceneLine: chatCtx.scene,
        userName: ctx.persona().name, history, contextTokens: ctx.contextTokens(), reserveTokens: 1500,
      });
      const ctrl = new AbortController();
      S.gen = { ctrl, msgId: target.id, raw: "", reasoning: "", assist: true };
      ui.renderStage();
      ui.scrollBottom();
      const onDelta = (d) => { if (!S.gen) return; S.gen.raw += d.text || ""; S.gen.reasoning += d.reasoning || ""; ui.paintAssist(); };
      let raw = "", reasoning = "", error = null;
      try {
        const sp = S.settings.sampler;
        const res = await LLM.chat(prov, built.messages, {
          names: { char: "Ассистент", user: ctx.persona().name },
          sampler: Object.assign({}, sp, { temperature: Math.min(sp.temperature || 0.7, 0.8), max_tokens: Math.max(sp.max_tokens || 0, 1500) }),
          signal: ctrl.signal, onDelta,
        });
        raw = res.text; reasoning = res.reasoning;
      } catch (e) {
        raw = e.partial != null ? e.partial : (S.gen ? S.gen.raw : "");
        reasoning = S.gen ? S.gen.reasoning : "";
        if (e.name !== "AbortError") error = e.message || String(e);
      }
      const th = OA.splitThink(raw || "");
      target.text = th.text.trim();
      target.reasoning = [reasoning, th.reasoning].filter(Boolean).join("\n").trim();
      if (error) target.error = error;
      S.gen = null;
      if (!target.text && !error) a.messages.pop();
      await save(); ui.rememberUi();
      if (S.view === "assist") { ui.renderStage(); ui.scrollBottom(); }
    }

    // Убрать сообщение и всё после него. → удалённые сообщения или null.
    async function cutFrom(id) {
      const a = S.assist;
      const i = a.messages.findIndex((x) => x.id === id);
      if (i < 0) return null;
      const removed = a.messages.splice(i);
      await save(); ui.rememberUi();
      return removed;
    }

    return { loadAll, pick, save, remove, chatLines, send, generate, cutFrom };
  }

  PRP.assistService = { create };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/ui/shell.js */
/* Prism RP — оболочка интерфейса: модель представления, отрисовка областей экрана,
   поповеры, поиск по чату, потоковая отрисовка ответа, уведомления.
   Это «порт интерфейса» (ctx.ui), через который сервисы просят перерисовку, не трогая DOM сами.
   Разметку строят представления (js/ui/views/*), здесь — только куда и когда её вставить. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const SC = PRP.scene, OA = PRP.openai, IB = PRP.imgBackends, IC = PRP.imgCompose, R = PRP.render, V = PRP.views;

  function create(ctx) {
    const { S } = ctx;
    const $ = (sel, el) => (el || document).querySelector(sel);
    const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
    const narrow = () => window.innerWidth < 1280;
    const svc = () => ctx.svc;

    /* ── Уведомления ───────────────────────────────────────────────────── */
    let toastTimer = null;
    function toast(text, isErr) {
      const el = $("#toast");
      el.innerHTML = R.icon(isErr ? "alert" : "check") + `<span>${R.esc(text)}</span>`;
      el.className = "toast" + (isErr ? " err" : "");
      el.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => (el.hidden = true), isErr ? 8000 : 2800);
    }

    /* ── Модель представления ──────────────────────────────────────────── */
    const isMs = () => { const c = ctx.chat(); return !!(c && c.mode === "messenger" && svc().messenger); };
    function vm() {
      const path = svc().chat.path();
      return {
        S, view: S.view, cards: S.cards, chats: S.chats, card: ctx.card(), chat: ctx.chat(), persona: ctx.persona(), path,
        scene: ctx.chat() ? svc().chat.sceneState(path) : SC.emptyState(), gen: S.gen, editingMsg: S.editingMsg,
        provider: ctx.provider(), providers: ctx.providers(), settings: S.settings,
        exps: S.experience, expView: svc().exp.view(path), expDraft: S.expDraft,
        // «Мир чата» собирает сервис мира чата (только чтение); считается, только когда вкладка открыта.
        worldChat: S.drawerOpen && S.tab === "world" && ctx.chat() && svc().worldChat ? svc().worldChat.view() : null, worldEdit: S.worldEdit,
        // Переписка: среда (только чтение) — для вкладки «Среда», статуса в шапке и времени сообщений в поясе переписки.
        messengerView: ((S.drawerOpen && (S.tab === "env" || S.tab === "scene")) || (S.modal && (S.modal.kind === "debug" || S.modal.kind === "messenger-time"))) && isMs() ? svc().messenger.view() : null, envEdit: S.envEdit,
        msWorld: isMs() ? (svc().messenger.context() || {}).world : null, msTz: isMs() ? (svc().messenger.current() || {}).timeZone : null, lastPrism: S.lastPrism, tab: S.tab, find: S.find,
        drawerOpen: S.drawerOpen, homeQuery: S.homeQuery, editProviderId: S.editProviderId,
        stats: `Персонажей: ${S.cards.length}, чатов: ${S.chats.length}.`,
        imgUrls: S.imgUrls, imgLists: S.imgLists, perchanceImages: IB.available("perchance"),
        origin: location.origin && location.origin !== "null" ? location.origin : "*",
        assist: S.assist, assistList: S.assistList,
        worldPacks: S.worldPacks, worldLenses: S.worldLenses, worldDraft: S.worldDraft, modal: S.modal,
        // Превью «Мир персонажа» готовит сервис мира; представление только показывает.
        lensPreview: S.modal && S.modal.kind === "card" && S.modal.section === "world" && S.modal.lens ? svc().world.preview(S.modal.lens) : null,
        assistCard: S.assist && S.assist.ctx.cardId ? S.cards.find((c) => c.id === S.assist.ctx.cardId) || null : null,
        assistChat: S.assist && S.assist.ctx.chatId ? S.chats.find((c) => c.id === S.assist.ctx.chatId) || null : null,
        // PERF-01: ход этого чата (ожидает разбора / пишет реплику / генерирует), идёт ли разбор, возвращённый текст.
        turn: S.turn && ctx.chat() && S.turn.chatId === ctx.chat().id ? S.turn : null,
        statePending: ctx.chat() && svc().state && svc().state.pending ? svc().state.pending(ctx.chat().id) > 0 : false,
        draft: ctx.chat() && S.sendDrafts ? S.sendDrafts[ctx.chat().id] || "" : "",
        perfSummary: S.settings && S.settings.developerMode && PRP.perfLog ? PRP.perfLog.summary(S.perf) : null, perfLog: S.perf || [],
      };
    }

    /* ── Отрисовка областей ────────────────────────────────────────────── */
    function applyLook() {
      document.documentElement.setAttribute("data-theme", S.settings.theme || "dusk");
      document.documentElement.style.setProperty("--prose-fs", (S.settings.proseSize || 17) + "px");
    }
    function autoGrow(t) { if (!t) return; t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 240) + "px"; }
    function renderRail() { $("#rail").innerHTML = V.rail(vm()); }
    /* PERF-01: текст поля ввода принадлежит своему чату (data-chat). При перерисовке в ДРУГОМ чате набранное
       не переносится туда, а сохраняется черновиком своего чата (S.sendDrafts) и вернётся при его открытии. */
    function takeInput() {
      const i = $("#input");
      if (!i) return null;
      return { v: i.value, s: i.selectionStart, f: document.activeElement === i, chat: i.dataset.chat || null };
    }
    function putInput(keep) {
      const i = $("#input");
      if (!i || !keep) return;
      const here = i.dataset.chat || null;
      if (keep.chat && here !== keep.chat) {
        if (keep.v.trim()) { S.sendDrafts = S.sendDrafts || {}; S.sendDrafts[keep.chat] = keep.v; }
        autoGrow(i);
        return;
      }
      i.value = keep.v || i.value; autoGrow(i);
      if (keep.f) { i.focus(); try { i.setSelectionRange(keep.s, keep.s); } catch (e) {} }
    }
    function renderStage() {
      const app = $("#app");
      const m = vm();
      const keep = takeInput();
      // Уход из поля ввода чата в любой другой вид (другой чат, ассистент, «Персонажи», мир, главная):
      // набранное сохраняется черновиком своего чата и вернётся при его открытии.
      if (keep && keep.chat && keep.v.trim() && !(S.view === "chat" && m.chat && m.chat.id === keep.chat)) {
        S.sendDrafts = S.sendDrafts || {}; S.sendDrafts[keep.chat] = keep.v;
      }
      const feedEl = $("#feed");
      const scroll = feedEl ? feedEl.scrollTop : null;
      if (S.view === "assist" && S.assist) {
        $("#stage").innerHTML = V.assist(m);
        app.classList.remove("messenger");
        if (keep && !keep.chat) {
          const i = $("#input"); i.value = keep.v; autoGrow(i);
          if (keep.f) { i.focus(); try { i.setSelectionRange(keep.s, keep.s); } catch (e) {} }
        }
        if (scroll != null && $("#feed")) $("#feed").scrollTop = scroll;
      } else if (S.view === "chat" && m.chat && m.card) {
        $("#stage").innerHTML = V.chat(m);
        app.classList.toggle("messenger", m.chat.mode === "messenger");
        // Поле ввода из того же чата сохраняется; из другого чата (или ассистента) сюда не переносится.
        if (keep && keep.chat) putInput(keep);
        else if (keep) {
          // Поле без чата (ассистент): прежнее поведение — набранное переносится, если в поле чата пусто.
          const i = $("#input"); i.value = i.value || keep.v; autoGrow(i);
          if (keep.f) { i.focus(); try { i.setSelectionRange(keep.s, keep.s); } catch (e) {} }
        }
        if (scroll != null) $("#feed").scrollTop = scroll;
        if (S.find) applyFind(false);
      } else if (S.view === "world") {
        app.classList.remove("messenger");
        $("#stage").innerHTML = V.worldLibrary(m);
      } else if (S.view === "characters") {
        app.classList.remove("messenger");
        $("#stage").innerHTML = V.characters(m);
      } else {
        app.classList.remove("messenger");
        $("#stage").innerHTML = V.home(m);
      }
      app.classList.toggle("generating", !!S.gen);
    }
    function renderFeed() {
      if (S.view === "assist") return renderStage();
      const inner = $("#feed-inner");
      if (!inner) return renderStage();
      inner.innerHTML = V.feed(vm());
      const head = $(".chat-head");
      if (head) head.outerHTML = V.chatHead(vm());
      const comp = $(".composer-wrap");
      if (comp) {
        const keep = takeInput();
        comp.outerHTML = V.composer(vm());
        putInput(keep);
      }
      $("#app").classList.toggle("generating", !!S.gen);
      if (S.find) applyFind(false);
    }
    function renderHead() { const head = $(".chat-head"); if (head) head.outerHTML = V.chatHead(vm()); }
    // PERF-01: только поле ввода (статус ожидающей отправки), с сохранением набранного текста и фокуса.
    function renderComposer() {
      if (S.view !== "chat") return;
      const comp = $(".composer-wrap");
      if (!comp) return;
      const keep = takeInput();
      comp.outerHTML = V.composer(vm());
      putInput(keep);
      $("#app").classList.toggle("generating", !!S.gen);
    }
    /* Текст не отправленного хода — обратно в поле ввода его чата. Если этот чат открыт — сразу в поле
       (перед уже набранным); иначе — в черновик, который покажется при открытии чата. */
    function restoreDraft(chatId, text) {
      if (!text) return;
      const i = $("#input");
      if (S.view === "chat" && S.chatId === chatId && i && i.dataset.chat === chatId) {
        i.value = i.value.trim() ? text + "\n" + i.value : text;
        autoGrow(i);
        return;
      }
      S.sendDrafts = S.sendDrafts || {};
      S.sendDrafts[chatId] = S.sendDrafts[chatId] ? text + "\n" + S.sendDrafts[chatId] : text;
    }
    function clearDraft(chatId) { if (S.sendDrafts) delete S.sendDrafts[chatId]; }
    function renderDrawer() {
      const d = $("#drawer");
      d.classList.toggle("open", S.drawerOpen && S.view === "chat");
      $("#app").classList.toggle("drawer-open", S.drawerOpen && S.view === "chat");
      const body = $("#drawer-body");
      const scroll = body ? body.scrollTop : 0;
      d.innerHTML = S.drawerOpen && S.view === "chat" ? V.drawer(vm()) : "";
      const nb = $("#drawer-body");
      if (nb) nb.scrollTop = scroll;
      syncScrim();
    }
    function renderModal() {
      const rootEl = $("#modal-root");
      if (!S.modal) { rootEl.innerHTML = ""; return; }
      const m = vm();
      const scroll = $(".modal-body") ? $(".modal-body").scrollTop : 0;
      if (S.modal.kind === "image") {
        const im = S.modal.im, url = S.imgUrls[im.id];
        rootEl.innerHTML = `<div class="modal-wrap lightbox" data-act="modal-bg"><figure class="lb-fig"><img src="${url}" alt="">
        <figcaption><span>${R.esc(im.draw || "")}</span><span class="lb-tools">
          <button class="btn btn-sm" data-act="img-modal-regen">${R.icon("regen")}Заново</button>
          <button class="btn btn-sm" data-act="img-dl" data-mid="${S.modal.mid}" data-sw="${S.modal.sw}" data-img="${im.id}">${R.icon("download")}Скачать</button>
          <button class="icon-btn" data-act="modal-close" title="Закрыть">${R.icon("x")}</button></span></figcaption></figure></div>`;
        return;
      }
      rootEl.innerHTML = S.modal.kind === "settings" ? V.settingsModal(m, S.modal.section)
        : S.modal.kind === "import" ? V.importReview(m, S.modal)
        : S.modal.kind === "new-messenger" ? V.newMessengerModal(m, S.modal)
        : S.modal.kind === "debug" ? V.debugModal(m, S.modal)
        : S.modal.kind === "messenger-time" ? V.messengerTimeModal(m)
        : V.cardModal(m, S.modal.draft, S.modal.section);
      if (S.modal.keepScroll && $(".modal-body")) $(".modal-body").scrollTop = scroll;
      // Узкий экран: лента разделов прокручивается по горизонтали и после перерисовки сбрасывается к началу —
      // вернуть в видимую часть активный раздел (на широком экране лента вертикальная, ничего не меняется).
      const act = $(".modal-nav .rail-item.active");
      if (act && act.parentElement.scrollWidth > act.parentElement.clientWidth) {
        const nav = act.parentElement;
        const a = act.getBoundingClientRect(), n = nav.getBoundingClientRect();
        nav.scrollLeft = Math.max(0, nav.scrollLeft + (a.left - n.left) - (nav.clientWidth - a.width) / 2);
      }
      S.modal.keepScroll = false;
    }
    function renderAll() { applyLook(); renderRail(); renderStage(); renderDrawer(); renderModal(); }
    function scrollBottom() { const el = $("#feed"); if (el) requestAnimationFrame(() => (el.scrollTop = el.scrollHeight)); }
    function syncScrim() {
      const railOpen = $("#rail").classList.contains("open");
      const drawerOverlay = S.drawerOpen && S.view === "chat" && narrow();
      $("#scrim").hidden = !(railOpen || drawerOverlay);
    }
    function openSettings(section) {
      closePop();
      S.modal = { kind: "settings", section: section || (S.modal && S.modal.kind === "settings" ? S.modal.section : "models") };
      renderModal();
    }
    // После смены настроек: пересобрать Prism и перерисовать то, что от них зависит.
    function refreshAfterSettings() {
      svc().prism.refresh();
      renderRail();
      if (S.view === "chat") { renderHead(); renderFeed(); } else renderStage();
      S.modal && (S.modal.keepScroll = true);
      renderModal();
    }

    /* ── Поповеры ──────────────────────────────────────────────────────── */
    function openPop(html, anchor) {
      const rootEl = $("#pop-root");
      rootEl.innerHTML = `<div class="pop" role="menu">${html}</div>`;
      const pop = rootEl.firstChild;
      const r = anchor.getBoundingClientRect();
      const h = pop.offsetHeight, w = pop.offsetWidth;
      let top = r.bottom + 6;
      if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
      let left = Math.min(Math.max(8, r.right - w), window.innerWidth - w - 8);
      if (r.left + w < window.innerWidth - 8 && anchor.closest(".composer")) left = Math.max(8, r.left);
      pop.style.top = top + "px";
      pop.style.left = left + "px";
      S.pop = anchor;
    }
    function closePop() { $("#pop-root").innerHTML = ""; S.pop = null; }

    /* ── Поиск по чату ─────────────────────────────────────────────────── */
    function applyFind(jump) {
      const feedEl = $("#feed-inner");
      const q = (S.find.q || "").trim().toLowerCase();
      const countEl = $("#find-count");
      if (!feedEl) return;
      if (!q) { if (countEl) countEl.textContent = ""; return; }
      const marks = [];
      $$(".prose, .bub", feedEl).forEach((rootEl) => {
        const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        for (const node of nodes) {
          const low = node.nodeValue.toLowerCase();
          let i = low.indexOf(q);
          if (i < 0) continue;
          const frag = document.createDocumentFragment();
          let pos = 0;
          while (i >= 0) {
            frag.appendChild(document.createTextNode(node.nodeValue.slice(pos, i)));
            const mk = document.createElement("mark");
            mk.textContent = node.nodeValue.slice(i, i + q.length);
            frag.appendChild(mk); marks.push(mk);
            pos = i + q.length;
            i = low.indexOf(q, pos);
          }
          frag.appendChild(document.createTextNode(node.nodeValue.slice(pos)));
          node.parentNode.replaceChild(frag, node);
        }
      });
      S.find.total = marks.length;
      if (S.find.idx >= marks.length) S.find.idx = 0;
      if (countEl) countEl.textContent = marks.length ? `${S.find.idx + 1} из ${marks.length}` : "нет";
      const cur = marks[S.find.idx];
      if (cur) { cur.classList.add("cur"); if (jump) cur.scrollIntoView({ block: "center", behavior: "smooth" }); }
    }
    function runFind(jump) { $("#feed-inner").innerHTML = V.feed(vm()); applyFind(jump); }

    /* ── Потоковая отрисовка ответа ────────────────────────────────────── */
    let paintQueued = false;
    function paintStreaming() {
      if (paintQueued) return;
      paintQueued = true;
      requestAnimationFrame(() => {
        paintQueued = false;
        if (!S.gen) return;
        const el = document.getElementById("text-" + S.gen.msgId);
        if (!el) return;
        const txt = IC.stripDrawsForDisplay(SC.stripForDisplay(OA.splitThink(S.gen.raw).text));
        if (ctx.chat().mode === "messenger") {
          el.innerHTML = R.bubbles(txt).map((p) => `<div class="bub">${R.esc(p)}</div>`).join("") + `<div class="bub typing"><i></i><i></i><i></i></div>`;
        } else el.innerHTML = R.rpText(S.gen.prefix + txt);
        const box = $("#feed");
        if (box && box.scrollHeight - box.scrollTop - box.clientHeight < 200) box.scrollTop = box.scrollHeight;
      });
    }
    let assistPaintQueued = false;
    function paintAssist() {
      if (assistPaintQueued) return;
      assistPaintQueued = true;
      requestAnimationFrame(() => {
        assistPaintQueued = false;
        if (!S.gen || !S.gen.assist) return;
        const el = document.getElementById("text-" + S.gen.msgId);
        if (!el) return;
        el.innerHTML = R.md(OA.splitThink(S.gen.raw).text);
        const box = $("#feed");
        if (box && box.scrollHeight - box.scrollTop - box.clientHeight < 200) box.scrollTop = box.scrollHeight;
      });
    }

    // Запомнить, что открыто, чтобы после перезагрузки вернуться туда же.
    function rememberUi() {
      ctx.DB.setSetting("ui", { chatId: S.view === "chat" ? S.chatId : null, drawerOpen: S.drawerOpen, view: S.view, assistId: S.view === "assist" && S.assist && S.assist.messages.length ? S.assist.id : null });
    }

    return {
      $, $$, narrow, toast, vm, applyLook, autoGrow,
      renderRail, renderStage, renderFeed, renderHead, renderComposer, restoreDraft, clearDraft, renderDrawer, renderModal, renderAll, scrollBottom, syncScrim,
      openSettings, refreshAfterSettings, openPop, closePop, applyFind, runFind, paintStreaming, paintAssist, rememberUi,
    };
  }

  PRP.shell = { create };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/ui/controllers/chat.js */
/* Prism RP — контроллер чата: отправка, генерация, варианты, правка, удаление, поиск, меню чата (режим меняется только созданием нового чата).
   Обработчики тонкие: прочитать ввод → вызвать сервис → перерисовать. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const V = PRP.views;

  PRP.controllers = PRP.controllers || {};
  PRP.controllers.chat = function (ctx) {
    const { S, ui, svc, nav } = ctx;
    const { $ } = ui;

    /* PERF-01: отправка принимается и во время разбора предыдущего ответа. Порядок хода (дождаться разбора,
       сверить чат и ветку, записать реплику, разобрать её, сгенерировать) — в сервисе генерации (gen.send). */
    async function sendUser() {
      const input = $("#input");
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;
      if (S.view === "assist") { if (S.gen) return; input.value = ""; ui.autoGrow(input); return svc.assist.send(text); }
      const c = ctx.chat();
      // Ход этого чата уже принят или идёт ответ: второе нажатие ничего не отправляет, текст остаётся в поле.
      if (!c || S.gen || (S.turn && S.turn.chatId === c.id)) return;
      input.value = "";
      ui.autoGrow(input);
      ui.clearDraft(c.id);
      // Переписка: метка времени и положения — на момент нажатия (её даёт сервис переписки).
      const stamp = c.mode === "messenger" ? svc.messenger.stampForNew() : null;
      await svc.gen.send(text, stamp ? { messengerAt: stamp } : null);
    }
    async function afterBranchChange() {
      svc.prism.refresh();
      ui.renderFeed();
      if (S.drawerOpen) ui.renderDrawer();
    }

    const actions = {
      send: sendUser,
      // Отменить отправку, ожидающую разбора предыдущего ответа: текст вернётся в поле ввода.
      "send-cancel": () => svc.gen.cancelTurn(),
      stop: () => svc.gen.stop(),
      // Модель начинает сцену — только по этой кнопке, никогда сама при открытии чата.
      opening: () => { if (!S.gen) return svc.gen.generate(null, "opening"); },
      // Проверка инициативы (только переписка, только по этой кнопке): правила и сообщения — в сервисе генерации.
      initiative: () => { if (!S.gen) return svc.gen.initiative(); },
      regen: (t) => svc.gen.generate(t.dataset.id, "regen"),
      continue: (t) => svc.gen.generate(t.dataset.id, "continue"),
      swipe: async (t) => {
        if (S.gen) return;
        const r = await svc.chat.swipe(t.dataset.id, +t.dataset.dir);
        if (r === "regen") return svc.gen.generate(t.dataset.id, "regen");
        if (r) await afterBranchChange();
      },
      edit: (t) => { S.editingMsg = t.dataset.id; ui.renderFeed(); const e = document.getElementById("edit-" + t.dataset.id); if (e) { e.focus(); e.style.height = Math.min(e.scrollHeight + 4, 520) + "px"; } },
      "save-edit": async (t) => {
        if (!S.messages.find((x) => x.id === t.dataset.id)) return;
        S.editingMsg = null;
        await svc.chat.saveEdit(t.dataset.id, document.getElementById("edit-" + t.dataset.id).value);
        const edited = S.messages.find((x) => x.id === t.dataset.id);
        // Разбор правки — управляемая задача (дедуп, без отклонений); ожидающая отправка дождётся его.
        if (svc.state && edited) await svc.state.track(edited, ctx.processingProvider ? ctx.processingProvider() : ctx.provider());
        await afterBranchChange();
      },
      "cancel-edit": () => { S.editingMsg = null; ui.renderFeed(); },
      delete: async (t) => {
        if (S.gen) return;
        if (!S.messages.find((x) => x.id === t.dataset.id) || !confirm("Удалить это сообщение и всё, что идёт после него в этой ветке?")) return;
        await svc.chat.deleteFrom(t.dataset.id);
        svc.prism.refresh();
        ui.renderFeed();
        ui.renderRail();
        if (S.drawerOpen) ui.renderDrawer();
      },
      find: () => { S.find = S.find ? null : { q: "", idx: 0 }; ui.renderStage(); const f = $("#find-q"); if (f) f.focus(); },
      "find-close": () => { S.find = null; ui.renderStage(); },
      "find-next": () => { if (!S.find.total) return; S.find.idx = (S.find.idx + 1) % S.find.total; ui.runFind(true); },
      "find-prev": () => { if (!S.find.total) return; S.find.idx = (S.find.idx - 1 + S.find.total) % S.find.total; ui.runFind(true); },
      "chat-menu": (t) => ui.openPop(V.chatMenu(ui.vm()), t),
      "model-pop": (t) => ui.openPop(V.modelPop(ui.vm()), t),
      // Режим выбирается только при создании. Переписке нужна настройка времени — сначала окно.
      "new-chat": (t) => {
        ui.closePop();
        if (t.dataset.mode === "messenger") { S.modal = { kind: "new-messenger", cardId: S.cardId, timeMode: "live" }; ui.renderModal(); return; }
        nav.newChat(t.dataset.mode);
      },
      "rename-chat": async () => {
        ui.closePop();
        const c = ctx.chat();
        const name = prompt("Название чата", c.title || "");
        if (name == null) return;
        c.title = name.trim() || c.title; await svc.chat.putChat(c); ui.renderStage(); ui.renderRail();
      },
      "export-chat": () => { ui.closePop(); const e = svc.chat.exportText(); ctx.files.download(e.name, e.text, "text/plain;charset=utf-8"); },
      "delete-chat": async () => {
        ui.closePop();
        const c = ctx.chat();
        if (!c || !confirm("Удалить этот чат? Вместе с ним удалится опыт персонажа, накопленный в этом мире.")) return;
        await svc.chat.deleteChat(c);
        nav.goHome();
      },
    };

    function input(t) {
      if (t.id === "input") { ui.autoGrow(t); if (S.chatId) ui.clearDraft(S.chatId); }
      if (t.id === "find-q") { S.find.q = t.value; S.find.idx = 0; ui.runFind(true); }
    }
    function key(e, t) {
      if (t.id === "input" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendUser(); return true; }
      if (t.id === "find-q" && e.key === "Enter") { e.preventDefault(); (e.shiftKey ? actions["find-prev"] : actions["find-next"])(); return true; }
      return false;
    }
    // Ctrl+F в чате — открыть поиск или перейти в его поле.
    function shortcut(e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f" && S.view === "chat") { e.preventDefault(); if (!S.find) actions.find(); else { const f = $("#find-q"); if (f) f.focus(); } return true; }
      return false;
    }

    return { actions, input, key, shortcut };
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/ui/controllers/drawer.js */
/* Prism RP — контроллер выдвижной панели: сцена (ручные правки), опыт (форма записи), мир чата (явные действия), Prism (предпросмотр). */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const SC = PRP.scene, U = PRP.util;

  PRP.controllers = PRP.controllers || {};
  PRP.controllers.drawer = function (ctx) {
    const { S, ui, svc } = ctx;
    const { $ } = ui;
    const op = (...a) => svc.chat.op(...a);

    // Copy only the currently open Debug section, not other tabs or hidden
    // application state. A legacy fallback is needed in embedded Perchance frames.
    function copyLegacy(value) {
      const field = document.createElement("textarea");
      field.value = value;
      field.setAttribute("readonly", "");
      field.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
      document.body.appendChild(field);
      try {
        field.select();
        if (!document.execCommand || !document.execCommand("copy")) throw new Error("Буфер обмена недоступен в этом браузере");
      } finally { field.remove(); }
    }

    // Ручные изменения сцены → в ветку; затем Prism, панель и шапка.
    async function applySceneOps(ops) {
      if (!(await svc.chat.applySceneOps(ops))) {
        ui.toast("Изменение сцены отклонено: проверьте значение. Сдвиг минут/часов возможен после установки времени суток.", true);
        return;
      }
      svc.prism.refresh();
      ui.renderDrawer();
      ui.renderHead();
    }

    // Форма записи опыта → черновик (S.expDraft).
    function collectExp() {
      const d = S.expDraft;
      if (!d || !$("#x-event")) return d;
      d.event = $("#x-event").value;
      d.interpretation = $("#x-interp").value;
      d.consequences = $("#x-cons").value;
      d.status = $("#x-status").value;
      const aboutUser = $("#x-about-user").checked;
      d.about = (d.about || []).filter((a) => a !== "user");
      if (aboutUser) d.about.unshift("user");
      return d;
    }

    // Форма «Мир чата» → черновик действия (S.worldEdit). Область — только явный выбор пользователя.
    const csv = (v) => String(v || "").split(",").map((x) => x.trim()).filter(Boolean);
    function collectWorld() {
      const d = S.worldEdit;
      if (!d) return d;
      const sc = document.querySelector("input[name=wc-scope]:checked");
      d.scope = sc ? sc.value : d.scope;
      if (d.op !== "retract" && $("#wc-text")) d.fact = Object.assign({}, d.fact, { text: $("#wc-text").value });
      if (d.op === "assert" && $("#wc-ent")) Object.assign(d.fact, { entities: csv($("#wc-ent").value), topics: csv($("#wc-top").value), locations: csv($("#wc-loc").value), timeline: $("#wc-tl").value, variant: $("#wc-vr").value });
      return d;
    }
    function worldDraft(op, id) {
      // По умолчанию — текущая ветка, если к ней есть привязка; иначе область не выбрана (пользователь выбирает «весь чат» сам).
      const scope = svc.chat.path().length ? "branch" : "";
      const f = id ? (svc.worldChat.view().facts.find((x) => x.id === id) || null) : null;
      S.worldEdit = { op, targetFactId: id || null, scope, fact: op === "override" ? { text: f ? f.text : "" } : op === "assert" ? { text: "" } : null };
      S.tab = "world"; S.drawerOpen = true;
      ui.renderDrawer();
      setTimeout(() => { const e = $("#wc-text"); if (e) e.focus(); }, 30);
    }

    const actions = {
      drawer: () => { S.drawerOpen = !S.drawerOpen; ui.rememberUi(); ui.renderDrawer(); ui.renderFeed(); },
      "drawer-close": () => { S.drawerOpen = false; ui.rememberUi(); ui.renderDrawer(); ui.renderFeed(); },
      tab: (t) => { collectExp(); collectWorld(); S.tab = t.dataset.tab; if (S.tab === "prism") svc.prism.refresh(); ui.renderDrawer(); },
      "debug-open": () => { svc.prism.refresh(); S.modal = { kind: "debug", section: "prism" }; ui.renderModal(); },
      "debug-section": (t) => { if (S.modal && S.modal.kind === "debug") { S.modal.section = t.dataset.section; ui.renderModal(); } },
      "debug-copy": async () => {
        if (!S.modal || S.modal.kind !== "debug") return;
        const body = $(".debug-modal .debug-body");
        if (!body) return;
        const title = { prism: "Prism", tracker: "Трекер", events: "События", images: "Изображения", errors: "Ошибки", timing: "Тайминги" }[S.modal.section || "prism"] || "Debug";
        const content = (body.innerText || body.textContent || "").trim();
        const value = "Debug — " + ((ctx.card() || {}).name || "чат") + " / " + title + "\n\n" + content;
        const clipboard = typeof navigator !== "undefined" && navigator.clipboard;
        if (clipboard && clipboard.writeText) {
          try { await clipboard.writeText(value); }
          catch (_) { copyLegacy(value); }
        } else copyLegacy(value);
        ui.toast("Раздел Debug скопирован.");
      },
      "open-prism": () => { svc.prism.refresh(); S.modal = { kind: "debug", section: "prism" }; ui.renderModal(); },
      "prism-preview": () => { svc.prism.refresh(); if (S.modal && S.modal.kind === "debug") ui.renderModal(); else ui.renderDrawer(); },
      // Сцена
      "sc-time-set": () => {
        const d = $("#sc-date").value.trim(), tm = $("#sc-time").value.trim();
        if (d && !/^\d{1,2}\.\d{1,2}(\.\d{2,4})?$/.test(d)) { ui.toast("Дата в виде 14.05 или 14.05.2026", true); return; }
        const v = [d, tm].filter(Boolean).join(" ");
        if (v) applySceneOps([op(null, "time", v)]);
      },
      "sc-shift": (t) => applySceneOps([op(null, "time", t.dataset.v)]),
      "sc-leave": (t) => applySceneOps([op(null, "leave", t.dataset.name)]),
      "sc-enter": (t) => applySceneOps([op(null, "enter", t.dataset.name)]),
      "sc-remove": (t) => applySceneOps([op(t.dataset.name, "remove", t.dataset.item)]),
      "scene-init-save": async () => {
        const c = ctx.chat(), value = $("#scene-init").value.trim();
        const ops = SC.parseBody(value);
        const check = SC.apply(SC.emptyState(), ops, { charName: ctx.card() && ctx.card().name, userName: ctx.persona() && ctx.persona().name });
        if (check.ignored.length) { ui.toast("Начальная сцена содержит недопустимые команды. Исправьте их перед сохранением.", true); return; }
        c.sceneInit = value; await svc.chat.putChat(c);
        svc.prism.refresh(); ui.renderDrawer(); ui.renderFeed(); ui.toast("Начальная сцена сохранена.");
      },
      // Опыт
      "to-exp": (t) => {
        S.expDraft = svc.exp.draftFromMessage(t.dataset.id);
        S.tab = "memory";
        S.drawerOpen = true;
        ui.renderDrawer();
        ui.renderFeed();
        setTimeout(() => { const e = $("#x-event"); if (e) e.focus(); }, 280);
      },
      "exp-new": () => { S.expDraft = svc.exp.blankDraft(); ui.renderDrawer(); },
      "exp-edit": (t) => { S.expDraft = U.clone(svc.exp.find(t.dataset.id)); ui.renderDrawer(); },
      "exp-cancel": () => { S.expDraft = null; ui.renderDrawer(); },
      "exp-save": async () => {
        const err = await svc.exp.save(collectExp());
        if (err) { ui.toast(err, true); return; }
        S.expDraft = null;
        svc.prism.refresh();
        ui.renderDrawer();
        ui.toast("Событие сохранено в опыт.");
      },
      "exp-del": async () => {
        if (!confirm("Удалить это событие из опыта?")) return;
        await svc.exp.remove(S.expDraft.id);
        S.expDraft = null; svc.prism.refresh(); ui.renderDrawer();
      },
      "exp-assign": async (t) => {
        if (!svc.exp.find(t.dataset.id) || !confirm("Привязать эту запись к текущему чату? Она станет частью этого мира и будет видна во всех его ветках.")) return;
        await svc.exp.assign(t.dataset.id);
        svc.prism.refresh(); ui.renderDrawer();
        ui.toast("Запись привязана к этому чату.");
      },
      // Мир чата: только явные действия; ничего не извлекается из текста ответов.
      "wc-new": () => worldDraft("assert"),
      "wc-override": (t) => worldDraft("override", t.dataset.id),
      "wc-retract": (t) => worldDraft("retract", t.dataset.id),
      "wc-cancel": () => { S.worldEdit = null; ui.renderDrawer(); },
      "wc-save": async () => {
        const d = collectWorld();
        if (!d.scope) { ui.toast("Выберите, где действует факт: в этой ветке или во всём чате.", true); return; }
        const r = await svc.worldChat.commit(d);
        if (r.error) { ui.toast(r.error, true); return; }
        S.worldEdit = null;
        svc.prism.refresh();
        ui.renderDrawer();
        ui.toast(d.op === "retract" ? "Факт убран из мира чата." : "Факт закреплён в мире чата.");
      },
      "wc-sel-save": async () => {
        await svc.worldChat.setSelectors({ timeline: $("#wc-timeline").value, variant: $("#wc-variant").value });
        svc.prism.refresh();
        ui.renderDrawer();
        ui.toast("Таймлайн и вариант чата сохранены.");
      },
      "x-val": (t) => { collectExp().valence = +t.dataset.v; ui.renderDrawer(); },
      "x-weight": (t) => { collectExp().weight = +t.dataset.v; ui.renderDrawer(); },
      "x-domain-del": (t) => { const d = collectExp(); d.domains = d.domains.filter((x) => x !== t.dataset.v); ui.renderDrawer(); },
    };

    function change(t) {
      if (t.dataset.scTop) { applySceneOps([op(null, t.dataset.scTop, t.value.trim() || "-")]); return true; }
      if (t.dataset.scField) { applySceneOps([op(t.dataset.name, t.dataset.scField, t.value.trim() || "-")]); return true; }
      return false;
    }
    function input() { /* полей с живым обновлением на панели сцены нет */ }
    function key(e, t) {
      if (e.key === "Enter" && t.classList && t.classList.contains("chip-add")) {
        e.preventDefault();
        const v = t.value.trim();
        if (!v) return true;
        if (t.dataset.scAdd) applySceneOps([op(t.dataset.scAdd, "add", v)]);
        else if (t.id === "sc-enter-new") applySceneOps([op(null, "enter", v)]);
        else if (t.id === "x-domain-add") { const d = collectExp(); v.split(",").map((s) => s.trim()).filter(Boolean).forEach((x) => { if (!d.domains.includes(x)) d.domains.push(x); }); ui.renderDrawer(); setTimeout(() => { const n = $("#x-domain-add"); if (n) n.focus(); }, 0); }
        return true;
      }
      if (e.key === "Enter" && t.tagName === "INPUT" && (t.dataset.scTop || t.dataset.scField)) { t.blur(); return true; }
      return false;
    }

    return { actions, change, input, key };
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/ui/controllers/cards.js */
/* Prism RP — контроллер карточек: импорт, редактор персонажа (форма → черновик), сохранение, экспорт, удаление. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});

  PRP.controllers = PRP.controllers || {};
  PRP.controllers.cards = function (ctx) {
    const { S, ui, svc, nav } = ctx;
    const { $, $$ } = ui;

    function openCardEditor(cd) {
      S.modal = { kind: "card", section: "main", draft: svc.cards.draft(cd), lens: cd && cd.id ? svc.world.draftLens(cd.id) : null };
      ui.renderModal();
      setTimeout(() => { const n = $("#cf-name"); if (n && !S.modal.draft.name) n.focus(); }, 30);
    }
    // Поля открытого раздела редактора → черновик (S.modal.draft).
    function collectCard() {
      const d = S.modal.draft;
      const map = { "cf-name": "name", "cf-desc": "description", "cf-pers": "personality", "cf-scen": "scenario", "cf-first": "firstMes", "cf-ex": "mesExample", "cf-app": "appearance", "cf-bg": "background", "cf-creator": "creator", "cf-version": "version", "cf-notes": "creatorNotes" };
      $$("[data-cf]").forEach((el) => {
        const id = el.dataset.cf;
        if (map[id]) d[map[id]] = el.value;
        else if (id === "cf-tags") d.tags = el.value.split(",").map((s) => s.trim()).filter(Boolean);
      });
      // Указания автора: текст и явный флаг «включено». Флаг меняет только сам пользователь.
      $$("[data-cf-dir]").forEach((el) => {
        const k = el.dataset.cfDir, x = d.directives[k];
        if (el.type === "checkbox") { x.enabled = el.checked; if (el.checked) x.reviewed = true; }
        else x.text = el.value;
      });
      if ($("[data-alt]") || S.modal.section === "greet") {
        d.altGreetings = (d.altGreetings || []).slice();
        $$("[data-alt]").forEach((el) => { d.altGreetings[+el.dataset.alt] = el.value; });
      }
      if ($("[data-ci]") || $("[data-card-lora-name]")) {
        d.image = Object.assign({}, d.image);
        $$("[data-ci]").forEach((el) => { d.image[el.dataset.ci] = el.value; });
        d.image.loras = $$("[data-card-lora-name]").map((el) => {
          const w = $(`[data-card-lora-w="${el.dataset.cardLoraName}"]`);
          return { name: el.value.trim(), weight: w && w.value !== "" ? Number(w.value) : 1 };
        });
      }
      $$("[data-lore]").forEach((el) => {
        const e = d.lore[+el.dataset.lore];
        if (!e) return;
        const k = el.dataset.k;
        if (k === "keys" || k === "secondary_keys") e[k] = el.value.split(",").map((s) => s.trim()).filter(Boolean);
        else if (k === "content" || k === "comment" || k === "position") e[k] = el.value;
        else if (k === "insertion_order") e[k] = el.value === "" ? 0 : Number(el.value) || 0;
        else e[k] = el.checked;
      });
      // Ядро для Prism: явное, только если в полях что-то есть. Ядро из файла используется только после отметки «Проверено».
      if ($("[data-core]")) {
        const lines = (id) => String(($(`#${id}`) || {}).value || "").split("\n").map((s) => s.trim()).filter(Boolean);
        const prev = d.prismCore || {};
        const imported = prev.source === "imported" && prev.reviewed === false;
        const rv = $("[data-core-reviewed]");
        const core = { schema: 1, identity: String(($("#core-identity") || {}).value || "").trim(), traits: lines("core-traits"), voice: lines("core-voice"), durableContext: lines("core-durable"),
          source: imported ? "imported" : prev.source === "derived" ? "derived" : "manual", reviewed: imported ? !!(rv && rv.checked) : true };
        d.prismCore = core.identity || core.traits.length || core.voice.length || core.durableContext.length ? core : null;
      }
      if (S.modal.section === "main") {
        d.customFields = (d.customFields || []).map((f) => Object.assign({}, f));
        $$("[data-custom]").forEach((el) => {
          const f = d.customFields[+el.dataset.custom];
          if (!f) return;
          const key = el.dataset.k;
          if (key === "enabled") f.enabled = el.checked;
          else if (["label", "text", "mode"].includes(key)) f[key] = el.value;
        });
        d.customFields = PRP.cardModel.normalizeCustomFields(d.customFields);
      }
      if (S.modal.section === "images") {
        const basePanel = $("#image-base-panel"), loraPanel = $("#image-lora-panel");
        S.modal.imageBaseOpen = basePanel ? basePanel.open : true;
        S.modal.imageLoraOpen = loraPanel ? loraPanel.open : false;
        d.image = Object.assign({}, d.image);
        d.image.loraAdvanced = Object.assign({ enabled: false, rules: "" }, d.image.loraAdvanced || {});
        $$("[data-lora-advanced]").forEach((el) => {
          if (el.dataset.loraAdvanced === "enabled") d.image.loraAdvanced.enabled = el.checked;
          if (el.dataset.loraAdvanced === "rules") d.image.loraAdvanced.rules = el.value;
        });
      }
      PRP.lensForm.collect(S.modal, $$);
      return d;
    }
    const keepScroll = () => { S.modal.keepScroll = true; ui.renderModal(); };

    const actions = {
      import: () => $("#file-card").click(),
      // Проверка импорта: флажки указаний читаются из формы, сохраняются только распознанные файлы.
      "import-confirm": async () => {
        const m = S.modal;
        if (!m || m.kind !== "import") return;
        const choices = m.items.map(() => ({}));
        $$("[data-imp-dir]").forEach((el) => { choices[+el.dataset.impDir][el.dataset.k] = el.checked; });
        const saved = await svc.cards.commitImport(m.items, choices);
        S.modal = null;
        S.view = "home";
        ui.renderAll();
        if (saved.length) ui.toast(saved.length === 1 ? `Добавлен(а): ${saved[0].name}` : `Добавлено персонажей: ${saved.length}`);
      },
      "import-cancel": () => { S.modal = null; ui.renderModal(); },
      "new-card": () => openCardEditor(null),
      "open-card": (t) => nav.openCard(t.dataset.id),
      "new-card-chat": async (t) => {
        // Each chat has an immutable mode. Messenger must first configure its time.
        const cardId = t.dataset.id;
        if (!S.cards.some((c) => c.id === cardId)) return ui.toast("Персонаж не найден.", true);
        if (t.dataset.mode === "messenger") {
          S.modal = { kind: "new-messenger", cardId, timeMode: "live" };
          ui.renderModal();
          return;
        }
        await nav.newChat("rp", cardId);
      },
      "edit-card": (t) => { ui.closePop(); const id = t.dataset.id; openCardEditor(id ? S.cards.find((x) => x.id === id) : ctx.card()); },
      "card-section": (t) => { collectCard(); S.modal.section = t.dataset.section; ui.renderModal(); },
      "card-save": async () => {
        const r = await svc.cards.save(collectCard());
        if (r.error) { ui.toast(r.error, true); S.modal.section = "main"; ui.renderModal(); return; }
        // Линза мира — отдельная запись, привязанная к персонажу; пак при этом не меняется.
        if (!r.isNew) {
          const lr = await svc.world.saveLensForCard(r.card.id, S.modal.lens);
          if (lr.error) { ui.toast("Мир персонажа не сохранён: " + lr.error, true); S.modal.section = "world"; ui.renderModal(); return; }
        }
        S.modal = null;
        ui.renderAll();
        ui.toast(r.isNew ? `${r.card.name} создан(а). Нажмите на портрет, чтобы начать.` : "Изменения сохранены.");
      },
      "avatar-pick": () => { collectCard(); $("#file-avatar").click(); },
      "lore-add": () => { const d = collectCard(); d.lore = (d.lore || []).concat([{ keys: [], secondary_keys: [], selective: false, content: "", comment: "", enabled: true, constant: false, case_sensitive: false, position: "after_char", insertion_order: (d.lore || []).length * 10 }]); keepScroll(); },
      "lore-del": (t) => { const d = collectCard(); d.lore.splice(+t.dataset.i, 1); keepScroll(); },
      // Ядро для Prism: собрать из полей карточки (детерминированно, без модели) или сбросить к запасному.
      "core-derive": () => { const d = collectCard(); d.prismCore = PRP.cardContext.deriveCore(d); keepScroll(); },
      "core-clear": () => { const d = collectCard(); d.prismCore = null; keepScroll(); },
      "alt-add": () => { const d = collectCard(); d.altGreetings = (d.altGreetings || []).concat([""]); keepScroll(); setTimeout(() => { const el = $(`[data-alt="${d.altGreetings.length - 1}"]`); if (el) el.focus(); }, 30); },
      "alt-del": (t) => { const d = collectCard(); d.altGreetings.splice(+t.dataset.i, 1); keepScroll(); },
      "custom-add": () => { const d = collectCard(); d.customFields = (d.customFields || []).concat([{ id: "custom-" + Date.now().toString(36), label: "", text: "", mode: "relevant", enabled: false }]); keepScroll(); },
      "custom-del": (t) => { const d = collectCard(); (d.customFields || []).splice(+t.dataset.i, 1); keepScroll(); },
      "card-lora-add": () => { const d = collectCard(); d.image = d.image || {}; d.image.loras = (d.image.loras || []).concat([{ name: "", weight: 0.8 }]); keepScroll(); },
      "card-lora-del": (t) => { const d = collectCard(); d.image.loras.splice(+t.dataset.i, 1); keepScroll(); },
      "card-json": () => { const e = svc.cards.exportJson(collectCard()); ctx.files.download(e.name, e.text, "application/json"); },
      "card-png": async () => { const e = await svc.cards.exportPng(collectCard()); ctx.files.download(e.name, e.blob); },
      "card-del": async () => {
        const cd = S.modal.draft;
        if (!confirm(`Удалить «${cd.name}» вместе со всеми чатами и опытом? Это нельзя отменить.`)) return;
        await svc.cards.remove(cd);
        S.modal = null;
        ui.renderAll();
        ui.toast(`${cd.name} удалён(а).`);
      },
    };

    async function change(t) {
      if (t.id === "file-card") {
        const files = [...t.files];
        t.value = "";
        if (!files.length) return true;
        const items = await svc.cards.prepareImport(files);
        S.modal = { kind: "import", items, choices: items.map(() => ({ system: false, postHistory: false })) };
        ui.renderModal();
        return true;
      }
      if (t.id === "file-avatar" && t.files[0]) { S.modal.draft.avatar = await ctx.files.readFile(t.files[0], "dataurl"); t.value = ""; ui.renderModal(); return true; }
      if (t.dataset.lore !== undefined && t.dataset.k === "selective" && S.modal && S.modal.kind === "card") { collectCard(); keepScroll(); return true; }
      if (t.dataset.customMore !== undefined && S.modal && S.modal.kind === "card") {
        const expanded = S.modal.expandedCustom = S.modal.expandedCustom || Object.create(null);
        expanded[t.dataset.customMore] = t.checked;
        const content = t.closest(".lore") && t.closest(".lore").querySelector(".custom-field-extra");
        if (content) content.hidden = !t.checked;
        return true;
      }
      if (t.dataset.loraAdvanced === "enabled" && S.modal && S.modal.kind === "card") {
        // Do not rebuild the editor: focus, scroll and the open LoRA panel must survive.
        collectCard();
        const group = t.closest("#image-lora-panel");
        const details = group && group.querySelector(".lora-advanced-panel");
        if (details) details.open = t.checked;
        return true;
      }
      return false;
    }

    return { actions, change };
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* js/ui/controllers/settings.js */
/* Prism RP — контроллер настроек: модели и провайдеры, генерация, изображения, персона, вид, бэкап. */
(function (root) {
  "use strict";
  const PRP = (root.PRP = root.PRP || {});
  const U = PRP.util, OA = PRP.openai, V = PRP.views;

  PRP.controllers = PRP.controllers || {};
  PRP.controllers.settings = function (ctx) {
    const { S, ui, svc, nav, DB } = ctx;
    const { $, $$ } = ui;
    const save = () => ctx.saveSettings();

    function editingProvider() { return S.settings.providers.find((p) => p.id === S.editProviderId); }
    function readProviderForm(p) {
      if (!$("#prov-name")) return;
      p.name = $("#prov-name").value.trim() || "API";
      p.baseUrl = $("#prov-url").value.trim();
      p.apiKey = $("#prov-key").value.trim();
      p.model = $("#prov-model").value.trim();
      p.extendedSamplers = $("#prov-ext").checked;
    }
    function collectImgForm() {
      const c = S.settings.images;
      $$("[data-imgcfg]").forEach((el) => {
        const k = el.dataset.imgcfg;
        c[k] = el.type === "number" ? (el.value === "" ? "" : Number(el.value)) : el.value.trim();
      });
      delete c.loras; // LoRA живут только в карточках персонажей
    }

    const actions = {
      settings: (t) => ui.openSettings(t.dataset.section),
      "cycle-theme": async () => {
        const ids = V.THEMES.map((t) => t.id);
        S.settings.theme = ids[(ids.indexOf(S.settings.theme) + 1) % ids.length];
        ui.applyLook(); await save();
        ui.toast("Тема: " + V.THEMES.find((t) => t.id === S.settings.theme).name);
      },
      theme: async (t) => { S.settings.theme = t.dataset.id; ui.applyLook(); await save(); S.modal.keepScroll = true; ui.renderModal(); },
      "pick-provider": async (t) => {
        if (t.closest("[data-act=prov-edit]")) return;
        S.settings.activeProvider = t.dataset.id; await save(); ui.closePop(); ui.refreshAfterSettings();
      },
      "pick-processing-provider": async (t) => {
        const id = t.dataset.id || "";
        if (id && !ctx.providers().some((p) => p.id === id)) return;
        S.settings.processingProvider = id;
        await save();
        S.modal.keepScroll = true;
        ui.refreshAfterSettings();
      },
      "pick-model": async (t) => {
        const p = S.settings.providers.find((x) => x.id === ctx.provider().id);
        p.model = t.dataset.model; await save(); ui.closePop(); ui.refreshAfterSettings();
      },
      "pick-preset": async (t) => {
        S.settings.samplerPreset = t.dataset.id;
        const pr = V.SAMPLER_PRESETS.find((x) => x.id === t.dataset.id);
        if (pr) Object.assign(S.settings.sampler, pr.v);
        await save(); ui.closePop(); ui.refreshAfterSettings();
      },
      // Провайдеры
      "prov-add": async (t) => {
        const pr = OA.PRESETS.find((x) => x.id === t.dataset.preset);
        const p = { id: U.uid("prov"), presetId: pr.id, name: pr.id === "custom" ? "Мой API" : pr.name, baseUrl: pr.baseUrl, apiKey: "", model: "", extendedSamplers: pr.extendedSamplers };
        S.settings.providers.push(p);
        S.settings.activeProvider = p.id;
        S.editProviderId = p.id;
        await save(); ui.refreshAfterSettings();
        setTimeout(() => { const el = $(pr.baseUrl ? (pr.local ? "#prov-model" : "#prov-key") : "#prov-url"); if (el) el.focus(); }, 30);
      },
      "prov-edit": (t, e) => { e.stopPropagation(); S.editProviderId = t.dataset.id; S.modal.keepScroll = true; ui.renderModal(); },
      "prov-close": () => { const p = editingProvider(); if (p) readProviderForm(p); save(); S.editProviderId = null; ui.refreshAfterSettings(); },
      "prov-save": async () => { readProviderForm(editingProvider()); await save(); ui.refreshAfterSettings(); ui.toast("Сохранено."); },
      "prov-del": async () => {
        const p = editingProvider();
        if (!confirm(`Удалить «${p.name}»?`)) return;
        S.settings.providers = S.settings.providers.filter((x) => x !== p);
        if (S.settings.activeProvider === p.id) S.settings.activeProvider = (ctx.providers()[0] || {}).id || "";
        if (S.settings.processingProvider === p.id) S.settings.processingProvider = "";
        S.editProviderId = null;
        await save(); ui.refreshAfterSettings();
      },
      "prov-models": async () => {
        const p = editingProvider(); readProviderForm(p);
        try { p.models = await OA.listModels(p); if (!p.model && p.models[0]) p.model = p.models[0]; await save(); ui.refreshAfterSettings(); ui.toast(`Найдено моделей: ${p.models.length}`); }
        catch (err) { ui.toast(err.message, true); }
      },
      "persona-save": async () => {
        S.settings.persona = { name: $("#p-name").value.trim() || "Пользователь", description: $("#p-desc").value,
          image: { view: $("#p-view").value, appearance: $("#p-appearance").value, povTags: $("#p-povtags").value.trim() } };
        await save(); ui.refreshAfterSettings(); ui.toast("Сохранено.");
      },
      // Изображения
      "img-backend": (t) => {
        // Сначала перерисовать (синхронно), потом сохранить: иначе ввод в новое поле во время сохранения теряется.
        collectImgForm(); S.settings.images.backend = t.dataset.id; S.modal.keepScroll = true; ui.renderModal(); save();
      },
      "img-lists": async () => {
        collectImgForm(); await save();
        try {
          const out = await svc.images.fetchLists();
          await save();
          ui.toast(`Сервер на связи: моделей ${out.models.length}, LoRA ${out.loras.length}.`);
        } catch (e) { ui.toast(e.message, true); }
        S.modal.keepScroll = true; ui.renderModal();
      },
      // Данные
      backup: async () => ctx.files.download(`prism-rp-бэкап-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(await DB.exportAll()), "application/json"),
      restore: () => $("#file-backup").click(),
    };

    async function change(t) {
      if (t.id === "file-backup" && t.files[0]) {
        let data;
        try { data = JSON.parse(await ctx.files.readFile(t.files[0], "text")); }
        catch (e) { t.value = ""; ui.toast("Бэкап не загружен: файл не читается как JSON. Данные не изменены.", true); return true; }
        if (!data || data.app !== "prism-rp") { t.value = ""; ui.toast("Бэкап не загружен: это не бэкап Prism RP. Данные не изменены.", true); return true; }
        const replace = confirm("Заменить ВСЕ данные Prism RP бэкапом?\n\nОК — заменить: всё, чего нет в бэкапе (персонажи, чаты, картинки, миры, настройки), будет удалено.\nОтмена — добавить к существующим.");
        // Проверка до записи. Контроллер даёт только id и режимы существующих записей; правила — в сервисах и core/backup.
        const local = replace ? [] : await DB.all("chats");
        const existingChats = local.map((c) => ({ id: c.id, mode: c.mode }));
        // Добавление: входящий чат с тем же id, но другим режимом — отклоняется вместе со своими записями (svc.chat.checkBackupChats).
        const chkChats = svc.chat.checkBackupChats(data, { replace, existingChats });
        // Ссылочная целостность: чат → персонаж, сообщения и картинки → чат, опыт → персонаж и чат, линза → персонаж и пак, повторы id.
        const existing = replace ? {} : { cards: (await DB.all("cards")).map((c) => c.id), chats: local.map((c) => c.id), packs: (await DB.all("worldPacks")).map((p) => p.id), lenses: (await DB.all("worldLenses")).map((l) => ({ id: l.id, cardId: l.cardId })) };
        const chkRefs = PRP.backup.check(chkChats.data, { replace, existing });
        const chk = svc.worldChat.checkBackup(chkRefs.data, { replace, existingChatIds: local.map((c) => c.id) });
        // Среда переписки — то же: только к переписке из бэкапа (замена) или из бэкапа и уже существующих (добавление).
        const chkEnv = svc.messenger.checkBackup(chk.data, { replace, existingChats });
        // Запись — одной транзакцией (core/store): при ошибке ничего не изменено, окно настроек остаётся открытым,
        // поле файла очищается, чтобы тот же файл можно было выбрать ещё раз.
        try {
          await DB.importAll(chkEnv.data, replace);
        } catch (e) {
          t.value = "";
          ui.toast(`Бэкап не загружен: ${(e && (e.message || e.name)) || "ошибка записи"}. Данные не изменены — можно попробовать ещё раз.`, true);
          return true;
        }
        t.value = "";
        S.modal = null; S.view = "home";
        await nav.loadAll(); ui.renderAll();
        const refs = PRP.backup.total(chkRefs.rejected);
