<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prism RP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app">
  <aside class="rail" id="rail" aria-label="Навигация"></aside>
  <main class="stage" id="stage"></main>
  <aside class="drawer" id="drawer" aria-label="Панель сцены"></aside>
  <div class="scrim" id="scrim" hidden></div>
  <div id="pop-root"></div>
  <div id="modal-root"></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <input type="file" id="file-card" accept=".png,.json,image/png,application/json" multiple hidden>
  <input type="file" id="file-backup" accept=".json,application/json" hidden>
  <input type="file" id="file-avatar" accept="image/*" hidden>
  <input type="file" id="file-world" accept=".json,application/json" hidden>
</div>

<!-- Порядок загрузки = порядок зависимостей (каждый модуль берёт зависимости из PRP при загрузке).
     1. ядро → 2. чистые модули предметной области и транспорт → 3. платформенные адаптеры и представления
     → 4. прикладные сервисы → 5. оболочка интерфейса и контроллеры → 6. корень приложения. -->
<script src="js/core/util.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/backup.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/perf.js"></script>
<script src="js/chat/branch.js"></script>
<!-- Карточки: модель → файл карточки (PNG, экспорт) → определение формата и адаптеры → проверка → конвейер импорта.
     Адаптеры регистрируются в PRP.cardFormats при загрузке, поэтому идут после formats/common.js и до cards/import.js. -->
<script src="js/cards/model.js"></script>
<script src="js/cards/ccard.js"></script>
<script src="js/cards/formats/common.js"></script>
<script src="js/cards/formats/detect.js"></script>
<script src="js/cards/formats/cc-v1.js"></script>
<script src="js/cards/formats/cc-v2.js"></script>
<script src="js/cards/formats/cc-v3.js"></script>
<script src="js/cards/formats/urv-v2.js"></script>
<script src="js/cards/validate.js"></script>
<script src="js/cards/import.js"></script>
<!-- Мир (чистые): модель пака → линза персонажа → проверка → разрешение. -->
<script src="js/world/model.js"></script>
<script src="js/world/lens.js"></script>
<script src="js/world/validate.js"></script>
<script src="js/world/resolve.js"></script>
<script src="js/world/overlay.js"></script>
<script src="js/world/canon.js"></script>
<script src="js/world/retrieve.js"></script>
<script src="js/prism/data.js"></script>
<script src="js/prism/scene.js"></script>
<script src="js/prism/experience.js"></script>
<script src="js/prism/scenario.js"></script>
<script src="js/messenger/time.js"></script>
<script src="js/messenger/environment.js"></script>
<script src="js/messenger/conversation.js"></script>
<script src="js/messenger/initiative.js"></script>
<script src="js/prism/card-context.js"></script>
<script src="js/prism/modes.js"></script>
<script src="js/prism/assembler.js"></script>
<script src="js/assist/assist.js"></script>
<script src="js/chat/tree.js"></script>
<script src="js/state/tracker.js"></script>
<script src="js/state/resolver.js"></script>
<script src="js/state/interpreter.js"></script>
<script src="js/images/compose.js"></script>
<script src="js/images/visual-plan.js"></script>
<script src="js/images/backends.js"></script>
<script src="js/images/compile.js"></script>
<script src="js/providers/openai.js"></script>
<script src="js/providers/perchance.js"></script>
<script src="js/providers/router.js"></script>
<script src="js/ui/render.js"></script>
<script src="js/ui/files.js"></script>
<script src="js/ui/views/kit.js"></script>
<script src="js/ui/views/home.js"></script>
<script src="js/ui/views/chat.js"></script>
<script src="js/ui/views/drawer.js"></script>
<script src="js/ui/views/settings.js"></script>
<script src="js/ui/views/card-editor.js"></script>
<script src="js/ui/views/import-review.js"></script>
<script src="js/ui/views/world.js"></script>
<script src="js/ui/views/messenger.js"></script>
<script src="js/ui/views/assist.js"></script>
<script src="js/chat/service.js"></script>
<script src="js/prism/experience-service.js"></script>
<script src="js/prism/service.js"></script>
<script src="js/images/service.js"></script>
<script src="js/state/service.js"></script>
<script src="js/generation/service.js"></script>
<script src="js/cards/service.js"></script>
<script src="js/world/service.js"></script>
<script src="js/world/overlay-service.js"></script>
<script src="js/messenger/service.js"></script>
<script src="js/assist/service.js"></script>
<script src="js/ui/shell.js"></script>
<script src="js/ui/controllers/chat.js"></script>
<script src="js/ui/controllers/drawer.js"></script>
<script src="js/ui/controllers/cards.js"></script>
<script src="js/ui/controllers/settings.js"></script>
<script src="js/ui/controllers/images.js"></script>
<script src="js/ui/controllers/assist.js"></script>
<script src="js/ui/controllers/world.js"></script>
<script src="js/ui/controllers/messenger.js"></script>
<script src="js/ui/app.js"></script>
</body>
</html>
