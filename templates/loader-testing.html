<!-- Prism RP TEST — изолированное зеркало. Рабочий генератор не изменять. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<div id="prism-boot" style="font:15px system-ui,sans-serif;padding:32px;color:#d7c7f4;background:#15131d;min-height:100vh;box-sizing:border-box">Загружаю TEST-сборку PRISM…</div>
<div id="prism-testing-badge" aria-label="Тестовая версия PRISM" style="position:fixed;right:12px;bottom:12px;z-index:2147483000;pointer-events:none;font:600 12px system-ui,sans-serif;background:#5d2569;color:#fff;padding:7px 11px;border:1px solid #e2a5e3;border-radius:8px;box-shadow:0 1px 7px #0008">PRISM TEST · загрузка…</div>
<script>
(function () {
  "use strict";
  window.__PRP_TEST_MIRROR = true;
  window.PRISM_RP_CHANNEL = "testing";
  var api = "https://api.github.com/repos/kur1ke/prism-rp/branches/testing";
  var cdn = "https://cdn.jsdelivr.net/gh/kur1ke/prism-rp@";
  var raw = "https://raw.githubusercontent.com/kur1ke/prism-rp/";
  var suffix = "/dist/web/prism-app.js";
  // Last verified testing distribution commit. Immutable CDN ref for API outages.
  // Must not point to a bundle with an older IndexedDB schema than the test
  // database: otherwise an API outage can launch an obsolete app and produce
  // IndexedDB VersionError. Keep this version aligned with js/core/store.js;
  // tests/test-mirror.js enforces the declared schema contract.
  // Published testing commit b6d7365 includes build aee4137 (IndexedDB v8).
  var safeRevision = "b6d7365496b4c2197ec757f64bf026971e8c733c";
  var safeDbVersion = 8;
  var badge = document.getElementById("prism-testing-badge");
  var boot = document.getElementById("prism-boot");
  function status(t) { if (badge) badge.textContent = "PRISM TEST · " + t; }
  function error(t) {
    if (boot) {
      boot.textContent = "Тестовая версия не загрузилась: " + t + ". Рабочая версия не затронута.";
      // The bundle removes the initial boot node before initializing modules.
      if (!boot.isConnected) {
        boot.style.cssText += ";position:fixed;inset:0;z-index:2147482999";
        document.body.appendChild(boot);
      }
    }
    status("ошибка загрузки");
  }
  var apiTimeoutMs = 5000;
  var bundleTimeoutMs = 20000;
  var executed = false;

  // The deadline covers response headers AND body decoding. Abort is best-effort:
  // the settled gate also discards late results from uncooperative requests.
  function fetchWithin(url, accept, decode, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var controller = new AbortController();
      var settled = false;
      var timer;
      function complete(ok, value) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (ok) resolve(value);
        else { controller.abort(); reject(value); }
      }
      timer = setTimeout(function () { complete(false, new Error("timeout")); }, timeoutMs);
      Promise.resolve().then(function () {
        return fetch(url, { cache: "no-store", credentials: "omit",
          headers: { "Accept": accept }, signal: controller.signal });
      }).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return decode(res);
      }).then(function (value) { complete(true, value); }, function (err) { complete(false, err); });
    });
  }

  function load(ref, warning) {
    if (!/^[a-f0-9]{40}$/.test(ref)) { error("неверный SHA"); return; }
    window.PRISM_RP_TEST_REVISION = ref;
    // Both sources use ONE immutable revision; never fall back to @testing/main.
    var urls = [cdn + encodeURIComponent(ref) + suffix, raw + encodeURIComponent(ref) + suffix];
    function execute(code, index) {
      if (executed) return;
      executed = true;
      // A downloaded script cannot execute by itself. Only this selected result
      // is inserted; removing a timed-out script[src] would not guarantee that.
      var failed = false;
      var onError = function () { failed = true; };
      window.addEventListener("error", onError);
      try {
        var script = document.createElement("script");
        script.textContent = code + "\n//# sourceURL=" + urls[index];
        document.head.appendChild(script);
      } catch (err) { failed = true; }
      finally { window.removeEventListener("error", onError); }
      // Never retry after execution began: partially initialized code must not
      // be followed by a second application instance.
      if (failed || !window.PRP || !window.PRISM_RP_VERSION) { error("приложение не инициализировалось"); return; }
      var builtFrom = window.PRISM_RP_BUILD_SHA || "";
      if (warning) {
        var marker = /^[a-f0-9]{40}$/.test(builtFrom) ? " · сборка " + builtFrom.slice(0, 7) : " · SHA сборки отсутствует";
        status("testing · закреплено " + ref.slice(0, 7) + marker + " · DB v" + safeDbVersion + " · API недоступен");
      } else status((index ? "резерв · " : "") + ref.slice(0, 7));
    }
    function attempt(index) {
      status(index ? "резервный источник · " + ref.slice(0, 7) : (warning || ref.slice(0, 7)));
      fetchWithin(urls[index], "text/javascript", function (res) { return res.text(); }, bundleTimeoutMs)
        .then(function (code) { execute(code, index); }, function () {
          if (index + 1 < urls.length) attempt(index + 1);
          else error("оба источника недоступны или не ответили вовремя (" + ref.slice(0, 7) + ")");
        });
    }
    attempt(0);
  }
  fetchWithin(api, "application/vnd.github+json", function (res) { return res.json(); }, apiTimeoutMs)
    .then(function (data) { var sha = data && data.commit && data.commit.sha; if (!/^[a-f0-9]{40}$/.test(sha || "")) throw new Error("неверный ответ GitHub"); load(sha); })
    .catch(function () { load(safeRevision, "GitHub API недоступен"); });
})();
</script>
